<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
</head>
<body>
<title>The Sundered Crown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
  :root{
    --ink:#e8ecf5; --dim:#9aa4bb; --line:#3a4260;
    --win:#1b2138; --win2:#141930;
    --edge:#4d5a86; --gold:#e8c46a; --blue:#4f79e8; --red:#e0544a; --green:#4fd06a;
    --bg:#090b12;
    /* a pixel display face used only for the game's own voice - title, phase
       banners, chapter name - over a mono body face for everything numeric */
    --display:'Press Start 2P','Courier New',monospace;
    --body:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.45 var(--body);
    overflow:hidden;overscroll-behavior:none;user-select:none}
  .btn:focus-visible,.diff-card:focus-visible,.unit-card:focus-visible,
  .shop-card:focus-visible,.promo-card:focus-visible,.chip:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
  button{font:inherit;color:inherit}

  #game{position:fixed;inset:0;display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  /* no empty battle chrome behind the title, prep or results screens */
  #game:not(.in-battle) #hud,
  #game:not(.in-battle) #tileinfo,
  #game:not(.in-battle) #toolbar{display:none}

  /* ---------- hud ---------- */
  #hud{display:flex;align-items:center;gap:10px;padding:6px 10px;
    background:linear-gradient(#1b2138,#141930);border-bottom:2px solid var(--edge);
    font-size:12px;flex-wrap:wrap}
  #hud-ch{font-family:var(--display);font-size:10px;color:var(--gold);letter-spacing:.02em}
  #hud-obj{color:var(--dim);flex:1;min-width:110px}
  #hud-turn{padding:2px 8px;border:1px solid var(--edge);border-radius:3px;white-space:nowrap}
  #hud-turn.player-phase{color:#9dc0ff;border-color:#3d5aa8;background:#17224a}
  #hud-turn.enemy-phase{color:#ffb0a8;border-color:#8a3a34;background:#3a1a18}

  /* ---------- map ---------- */
  #map-wrap{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:#05070d}
  #map{width:100%;height:100%;display:block;image-rendering:pixelated}

  #banner{position:absolute;left:0;right:0;top:38%;text-align:center;
    font-family:var(--display);font-size:clamp(13px,3.4vw,22px);
    letter-spacing:.06em;pointer-events:none;padding:0 16px;
    opacity:0;transform:scale(.9);transition:opacity .18s,transform .18s;text-shadow:0 3px 0 #000}
  #banner.show{opacity:1;transform:scale(1)}
  #banner.player{color:#9dc0ff}
  #banner.enemy{color:#ffa196}

  /* ---------- action menu ---------- */
  #actionmenu{position:absolute;display:none;flex-direction:column;gap:2px;
    background:var(--win);border:2px solid var(--edge);border-radius:4px;padding:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.6);z-index:20;min-width:106px}
  #actionmenu.open{display:flex}
  .btn.act{text-align:left;padding:6px 10px}

  /* ---------- panels ---------- */
  #tileinfo{background:var(--win2);border-top:2px solid var(--edge);padding:6px 10px;
    min-height:54px;display:flex;flex-direction:column;gap:4px}
  .ti-terr{display:flex;justify-content:space-between;font-size:12px}
  .ti-n{color:var(--gold)}
  .ti-b{color:var(--dim)}
  .ti-unit{display:flex;align-items:center;gap:8px}
  .ti-unit .spr canvas{display:block}
  .ti-info{flex:1;min-width:0}
  .ti-un{font-weight:700;font-size:12px}
  .ti-uc{color:var(--dim);font-size:11px}
  .ti-hp{font-size:11px;color:var(--dim)}
  .ti-unit.enemy .ti-un{color:#ffa196}
  .ti-unit.player .ti-un{color:#9dc0ff}
  .ti-unit.boss .ti-un{color:#e6a6ff}

  /* ---------- forecast ---------- */
  #forecast{display:none;position:absolute;left:8px;right:8px;bottom:8px;z-index:25;
    background:var(--win);border:2px solid var(--edge);border-radius:5px;padding:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.65)}
  #forecast.open{display:block}
  /* flips to the top of the pane when it would otherwise cover the unit */
  #forecast.at-top{top:8px;bottom:auto}
  .fc-double{margin-top:4px;padding:4px 6px;border-radius:3px;font-size:10px;line-height:1.35}
  .fc-double.good{color:#a9f0bb;background:#17301d;border:1px solid #2f6b3a}
  .fc-double.bad{color:#ffd0a8;background:#33210f;border:1px solid #8a5a22}
  .fc-double-t{font-weight:700}
  .fc-double-s{opacity:.8;font-size:9px;font-variant-numeric:tabular-nums}
  .fc-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
  .fc-col{min-width:0}
  .fc-name{font-weight:700;font-size:12px;margin-bottom:3px}
  .fc-col.me .fc-name{color:#9dc0ff}
  .fc-col.them .fc-name{color:#ffa196}
  .fc-hp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-bottom:4px}
  .fc-mid{text-align:center;padding:0 4px}
  .fc-w{font-size:11px;color:var(--gold)}
  .fc-lethal{font-size:12px;font-weight:700;margin-top:4px}
  .fc-wep{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:11px}
  .fc-wep-n{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fc-wep-o{color:var(--dim);font-size:10px;font-style:italic}
  .fc-tag{font-size:10px;margin-top:4px;padding:3px 5px;border-radius:3px;line-height:1.4}
  .fc-tag.good{color:#a9f0bb;background:#17301d;border:1px solid #2f6b3a}
  .fc-tag.bad{color:#ffb0a8;background:#2f1715;border:1px solid #7a3630}
  .fc-tag-b{opacity:.75;font-size:9px}
  .fc-nocounter{font-size:11px;color:var(--dim);font-style:italic}
  .fc-bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .fc-staff{padding:2px 0}
  .staff-pick{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;
    border:1px solid var(--line);border-radius:3px;margin-top:4px;background:#161b31;
    font-variant-numeric:tabular-nums}
  .staff-pick:hover{background:#1e2745;border-color:var(--edge)}
  .sp-n{font-weight:700;flex:1;min-width:0}
  .sp-hp{color:var(--dim);font-size:11px}
  .sp-a{color:var(--green);font-weight:700;min-width:34px;text-align:right}
  .sp-w{color:var(--gold);font-size:10px}

  /* ---------- arena ---------- */
  .arena-box{max-width:560px}
  .arena-purse{color:var(--gold);font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
  .arena-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  @media (max-width:480px){
    .arena-vs{grid-template-columns:1fr;gap:6px}
    .av-vs{text-align:center}
  }
  .av-side{display:flex;gap:8px;align-items:flex-start;padding:8px;
    border:1px solid var(--line);border-radius:4px;background:#161b31}
  .av-side.me{border-color:#35498f}
  .av-side.them{border-color:#8a3a34}
  .av-side canvas{image-rendering:pixelated}
  .av-info{flex:1;min-width:0;font-variant-numeric:tabular-nums}
  .av-n{font-weight:700;font-size:13px}
  .av-side.me .av-n{color:#9dc0ff}
  .av-side.them .av-n{color:#ffa196}
  .av-c{font-size:11px;color:var(--dim)}
  .av-hp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin:4px 0}
  .av-w{font-size:10px;color:var(--gold);margin-top:3px}
  .av-vs{font-family:var(--display);font-size:11px;color:var(--dim)}
  .arena-warn{font-size:11px;color:#ffb0a8;text-align:center;
    border:1px solid #8a3a34;border-radius:3px;padding:5px;background:#2a1614}

  .duel-box{max-width:620px}
  .battle-scene{cursor:pointer}
  .duel-hint{font-size:10px;color:var(--dim);text-align:right;margin-top:2px}
  .duel-canvas{width:100%;height:auto;display:block;image-rendering:pixelated;
    border:2px solid var(--edge);border-radius:4px;background:#2a2436}

  /* ---------- toolbar ---------- */
  #toolbar{display:flex;gap:6px;padding:6px 10px;background:linear-gradient(#141930,#101527);
    border-top:2px solid var(--edge);flex-wrap:wrap;
    padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  #toolbar .btn{flex:1;min-width:58px}
  #btn-end{font-family:var(--display);font-size:8px;letter-spacing:.04em}
  #btn-danger.on{background:#4a1e1a;border-color:#a3453c;color:#ffb0a8}

  /* ---------- buttons ---------- */
  .btn{background:linear-gradient(#2b3355,#1f2642);border:1px solid var(--edge);
    border-radius:3px;padding:7px 10px;cursor:pointer;font-size:12px;
    transition:background .1s,transform .06s}
  .btn:hover:not(:disabled){background:linear-gradient(#36406a,#262e52)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.primary{background:linear-gradient(#3a5bc4,#2a4192);border-color:#6f8ce0;color:#fff;font-weight:700}
  .btn.primary:hover{background:linear-gradient(#4568da,#32499f)}
  .btn.warn{background:linear-gradient(#7a3028,#5a221c);border-color:#b25146}
  .btn.cancel{background:linear-gradient(#262b40,#1b1f30);color:var(--dim)}
  .btn.tiny{padding:2px 7px;font-size:11px;flex:0 0 auto}

  /* ---------- modals ---------- */
  .modal-back{position:fixed;inset:0;z-index:60;background:rgba(4,6,12,.78);
    display:flex;align-items:center;justify-content:center;padding:14px;
    opacity:0;transition:opacity .16s;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .modal-back.in{opacity:1}
  .modal{background:var(--win);border:2px solid var(--edge);border-radius:6px;
    width:100%;max-width:420px;max-height:100%;display:flex;flex-direction:column;
    box-shadow:0 14px 44px rgba(0,0,0,.7);transform:translateY(8px);transition:transform .16s}
  .modal-back.in .modal{transform:none}
  .modal.wide{max-width:640px}
  .modal-h{padding:11px 12px;background:linear-gradient(#2b3355,#1f2642);
    border-bottom:1px solid var(--edge);color:var(--gold);
    font-family:var(--display);font-size:9px;letter-spacing:.04em;line-height:1.6}
  .modal-b{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .modal-b h4{margin:6px 0 0;color:var(--gold);font-size:12px}
  .modal-b p{margin:0;font-size:12px;color:var(--dim)}
  .note{font-size:11px;color:var(--dim)}
  .bad-note{color:#ffa196}
  .bio{font-style:italic}
  .quote{color:var(--gold);font-style:italic}

  .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:1px 0;
    font-variant-numeric:tabular-nums}
  .st-v,.st-c,.lc-v,.lc-g,.gr-v,.item-u,.ti-hp{font-variant-numeric:tabular-nums}
  .row-l{color:var(--dim)}
  .row-r{font-weight:700}

  .panel{border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .panel-h{background:#232a46;padding:6px 8px;color:var(--gold);
    font-family:var(--display);font-size:7px;letter-spacing:.05em;line-height:1.7}
  .panel-b{padding:6px 8px;display:flex;flex-direction:column;gap:3px}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:520px){ .two-col{grid-template-columns:1fr} }

  /* ---------- title ---------- */
  .title-box{max-width:520px;text-align:center}
  .title-main{font-family:var(--display);font-size:clamp(15px,4.4vw,27px);
    line-height:1.5;letter-spacing:.02em;color:var(--gold);
    text-shadow:0 4px 0 #000;margin:14px 0 10px;text-wrap:balance}
  .title-sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .title-btns{display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .title-foot{color:var(--dim);font-size:11px;margin-top:12px;line-height:1.6}

  .diff-card{border:1px solid var(--line);border-radius:4px;padding:9px 11px;cursor:pointer;
    background:#1a2039}
  .diff-card:hover{background:#242c4e;border-color:var(--edge)}
  .diff-n{font-weight:700;color:var(--gold)}
  .diff-d{font-size:11px;color:var(--dim);margin-top:2px}

  /* ---------- dialogue ---------- */
  .dialog-box{max-width:600px;cursor:pointer}
  .dlg-por{min-height:4px;display:flex;justify-content:center}
  .dlg-por canvas{image-rendering:pixelated;border:2px solid var(--edge);
    background:linear-gradient(#1a2038,#11162a);border-radius:4px;
    box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:100%;height:auto}
  .por-big{image-rendering:pixelated}
  .por-sheet{image-rendering:pixelated;border:1px solid var(--line);
    background:#11162a;border-radius:3px;flex:0 0 auto}
  .dlg-who{color:var(--gold);font-weight:700;font-size:13px;min-height:18px}
  .dlg-text{font-size:13px;line-height:1.7;min-height:64px}
  .dlg-hint{font-size:10px;color:var(--dim);text-align:right}

  /* ---------- world map ---------- */
  .world-box{max-width:760px}
  .world-wrap{position:relative;width:100%;aspect-ratio:16/9;border:2px solid var(--edge);
    border-radius:5px;overflow:hidden;background:#d6c79f}
  .world-canvas{width:100%;height:100%;display:block}
  .wnode{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    font:inherit;color:#3a2c18;line-height:1}
  .wn-dot{width:13px;height:13px;border-radius:50%;border:2px solid #3a2c18;background:#f2e6c4;
    box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .1s}
  .wn-label{font-size:10px;font-weight:700;white-space:nowrap;
    background:rgba(242,230,196,.88);border-radius:3px;padding:0 4px;
    text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .wnode:hover .wn-dot{transform:scale(1.25)}
  .wnode.on .wn-dot{transform:scale(1.35);box-shadow:0 0 0 3px rgba(232,196,106,.85)}
  .wnode.chapter.done .wn-dot{background:#7d8ea8;border-color:#2c3a4e}
  .wnode.chapter.next .wn-dot{background:var(--gold);border-color:#6b4f12;
    animation:wpulse 1.5s ease-in-out infinite}
  .wnode.chapter.locked{opacity:.45;cursor:default}
  .wnode.chapter.locked .wn-dot{background:#b9ad92}
  .wnode.skirmish .wn-dot{background:#c2513f;border-color:#5e211a;
    border-radius:2px;transform:rotate(45deg);width:11px;height:11px}
  .wnode.skirmish:hover .wn-dot{transform:rotate(45deg) scale(1.25)}
  .wnode.skirmish.on .wn-dot{transform:rotate(45deg) scale(1.35)}
  .wnode.shop .wn-dot{background:#3f8a4f;border-color:#1e4a27}
  .wnode.spire .wn-dot{background:#7a4a9a;border-color:#3a2150;height:17px;border-radius:3px}
  @keyframes wpulse{0%,100%{box-shadow:0 1px 3px rgba(0,0,0,.4)}
    50%{box-shadow:0 0 0 6px rgba(232,196,106,.35)}}
  .world-info{border:1px solid var(--line);border-radius:4px;padding:8px;background:#161b31;
    min-height:58px}
  .wi-n{color:var(--gold);font-weight:700;font-size:12px}
  .wi-t{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.55}
  @media (max-width:520px){
    .wn-label{font-size:9px;padding:0 3px}
    .world-wrap{aspect-ratio:4/3}
  }

  /* ---------- prep ---------- */
  .prep-box{max-width:680px}
  .prep-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px}
  .prep-obj{color:var(--gold)}
  .prep-gold{color:var(--dim)}
  .prep-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media (max-width:560px){ .prep-list{grid-template-columns:1fr} }
  .unit-card{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);
    border-radius:4px;background:#161b31;cursor:pointer}
  .unit-card.on{border-color:var(--blue);background:#1c2750;box-shadow:inset 0 0 0 1px #35498f}
  .unit-card.locked{border-color:var(--gold)}
  .unit-card canvas{image-rendering:pixelated}
  .uc-info{flex:1;min-width:0}
  .uc-n{font-weight:700;font-size:12px}
  .uc-c{font-size:11px;color:var(--dim)}
  .uc-bars{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .prep-bar{display:flex;gap:6px;flex-wrap:wrap}
  .prep-bar .btn{flex:1;min-width:74px}

  .hpbar{height:5px;background:#0d1122;border:1px solid #2a3252;border-radius:2px;overflow:hidden;flex:1;min-width:46px}
  .hpbar-f{height:100%;background:var(--green);transition:width .2s}
  .expbar{height:4px;background:#0d1122;border:1px solid #2a3252;border-radius:2px;overflow:hidden}
  .expbar-f{height:100%;background:var(--gold)}

  .chip-row{display:flex;gap:5px;flex-wrap:wrap}
  .chip{padding:4px 9px;border:1px solid var(--line);border-radius:12px;font-size:11px;
    cursor:pointer;background:#161b31}
  .chip.on{border-color:var(--blue);background:#1f2b56;color:#bcd0ff}
  .chip.spent{opacity:.45}

  /* ---------- items ---------- */
  .item{display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap}
  .item.dim{opacity:.5}
  .item-n{flex:1;min-width:70px}
  .item-u{color:var(--dim);font-size:11px}
  .item-t{font-size:9px;padding:1px 4px;border-radius:2px;background:#2a3252;color:#c9d3ee}
  .item-t.sword{background:#2f4a8c}.item-t.lance{background:#2f6a4a}.item-t.axe{background:#8c4a2f}
  .item-t.bow{background:#6a5a2f}.item-t.anima{background:#8c3a5a}.item-t.light{background:#8a8a3a}
  .item-t.dark{background:#5a2f8c}.item-t.staff{background:#3a7a8c}
  .item-d{flex-basis:100%;font-size:10px;color:var(--dim)}

  /* ---------- shop ---------- */
  .shop-gold{color:var(--gold);font-size:12px}
  .shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .shop-card{border:1px solid var(--line);border-radius:4px;padding:6px 8px;cursor:pointer;background:#161b31}
  .shop-card:hover{background:#212949;border-color:var(--edge)}
  .sc-n{font-weight:700;font-size:12px}
  .sc-s{font-size:10px;color:var(--dim)}
  .sc-p{font-size:11px;color:var(--gold);margin-top:2px}

  .arena-acts{display:flex;gap:6px;flex-wrap:wrap}
  .arena-acts .btn{flex:1;min-width:110px}
  .log-line{font-size:11px;color:var(--dim)}

  /* ---------- unit info ---------- */
  .info-box{max-width:560px}
  .info-head{display:flex;gap:10px;align-items:flex-start}
  .info-head canvas{image-rendering:pixelated;border:1px solid var(--line);border-radius:3px;background:#11162a}
  .ih-t{flex:1;min-width:0}
  .ih-n{font-family:var(--display);font-size:11px;line-height:1.6;color:var(--gold)}
  .ih-c{font-size:11px;color:var(--dim)}
  .ih-bars{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .ih-hp,.ih-exp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}

  .sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 12px}
  @media (max-width:420px){ .sheet{grid-template-columns:1fr} }
  .st{display:flex;align-items:center;gap:6px;font-size:12px}
  .st-n{width:30px;color:var(--dim)}
  .st-v{width:24px;text-align:right;font-weight:700}
  .st-bar{flex:1;height:5px;background:#0d1122;border:1px solid #2a3252;border-radius:2px;overflow:hidden;min-width:34px}
  .st-bar-f{height:100%;background:var(--blue)}
  .st-bar-f.maxed{background:var(--gold)}
  .st-c{width:26px;font-size:10px;color:var(--dim)}

  .derived{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}
  @media (max-width:420px){ .derived{grid-template-columns:1fr} }
  .growths{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
  .gr{display:flex;justify-content:space-between;font-size:11px;gap:4px}
  .gr-n{color:var(--dim)}

  .promo-card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);
    border-radius:4px;padding:8px;cursor:pointer;background:#161b31}
  .promo-card:hover{background:#222a4c;border-color:var(--edge)}
  .promo-card canvas{image-rendering:pixelated}
  .pc-n{font-weight:700;color:var(--gold)}
  .pc-w{font-size:11px;color:var(--dim)}
  .pc-b{font-size:11px;color:#9dc0ff;margin-top:2px}

  /* ---------- level up ---------- */
  .lvl-box{max-width:340px;text-align:center}
  .lvl-box canvas{image-rendering:pixelated;border:1px solid var(--line);border-radius:3px;background:#11162a}
  .lvl-n{font-family:var(--display);font-size:9px;line-height:1.7;color:var(--gold);margin:8px 0}
  .lvl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px 10px}
  .lvl-cell{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:1px 4px;border-radius:3px}
  .lvl-cell.up{background:#1e3a26;color:#a9f0bb}
  .lc-n{color:var(--dim)}
  .lvl-cell.up .lc-n{color:#8edfa0}
  .lc-v{font-weight:700}
  .lc-g{width:22px;text-align:right;color:var(--green)}

  /* ---------- results ---------- */
  .res-u{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:2px 0}
  .res-u.dead{opacity:.45}
  .res-u canvas{image-rendering:pixelated}
  .ru-n{font-weight:700;min-width:54px}
  .ru-c{color:var(--dim);flex:1}
  .ru-s{color:var(--dim);font-size:11px}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;left:50%;transform:translateX(-50%);
    top:calc(52px + env(safe-area-inset-top,0px));z-index:80;
    display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:92%;max-width:400px}
  .toast{background:rgba(16,21,40,.96);border:1px solid var(--edge);border-radius:4px;
    padding:6px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.6);
    transition:opacity .35s,transform .35s;text-align:center}
  .toast.good{border-color:#3f8a4f;color:#a9f0bb}
  .toast.bad{border-color:#8a3a34;color:#ffb0a8}
  .toast.out{opacity:0;transform:translateY(-6px)}

  .spr canvas,.portrait canvas{image-rendering:pixelated;display:block}

    none: function () {},

    /* an open-faced helm with a nasal bar and cheek plates */
    helm: function (b) {
      var y, x, h;
      for (y = TOP - 5; y <= 27; y++) {
        h = hairHalf(y, 2.6);
        if (h <= 0) continue;
        for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) b.set(x, y, ML);
      }
      /* dome shading */
      b.ellOver(CX - 7, TOP, 9, 6, ML, ML);
      for (y = TOP - 5; y <= 27; y++) {
        h = hairHalf(y, 2.6);
        if (h <= 0) continue;
        for (x = Math.round(CX + h) - 4; x <= Math.round(CX + h); x++) if (b.get(x, y) === ML) b.set(x, y, MM);
        b.set(Math.round(CX + h), y, MD);
      }
      b.ellOver(CX - 6, TOP - 1, 6, 4, ML, ML);
      /* brow rim */
      for (y = 24; y <= 27; y++) { h = hairHalf(y, 2.9); b.span(y, h, y === 24 ? MD : (y === 27 ? MD : MM)); }
      /* nasal bar */
      b.rect(CX - 1, 25, 3, 13, MM);
      b.rect(CX - 1, 25, 1, 13, ML);
      b.rect(CX + 1, 25, 1, 13, MD);
      /* cheek plates, hugging the outline */
      for (y = 27; y <= 38; y++) {
        h = halfAt(y, false) + 2.2;
        b.rect(Math.round(CX - h), y, 3, 1, MM);
        b.rect(Math.round(CX + h) - 2, y, 3, 1, MD);
      }
      /* rivets and crest */
      b.set(CX - 12, 26, AC); b.set(CX + 12, 26, AC); b.set(CX, 23, AC);
      b.rect(CX - 2, TOP - 9, 4, 6, AC);
      b.rect(CX - 1, TOP - 10, 2, 2, ACD);
      b.rect(CX - 2, TOP - 9, 1, 6, ACD);
    },

    /* a deep cloth hood: a ring of fabric, never painted over the face */
    hood: function (b) {
      var y, x;
      for (y = TOP - 7; y <= 70; y++) {
        var outer = y < TOP
          ? hairHalf(y, 5.5)
          : (y <= CHIN ? halfAt(y, false) : halfAt(CHIN, false)) + 5.5 + Math.max(0, (y - CHIN) * 0.55);
        if (outer <= 0) continue;
        var inner = (y >= 13 && y <= 46) ? halfAt(Math.min(y, CHIN), false) + 0.8 : -1;
        for (x = Math.round(CX - outer); x <= Math.round(CX + outer); x++) {
          if (inner > 0 && Math.abs(x - CX) <= inner) continue;
          b.set(x, y, CM);
        }
      }
      /* fold light and the shadowed inside edge */
      for (y = TOP - 7; y <= 70; y++) {
        for (x = 0; x < W; x++) {
          if (b.get(x, y) !== CM) continue;
          var d = x - CX;
          if (d < -6) b.set(x, y, CL);
          if (d > 8) b.set(x, y, CD);
        }
      }
      /* the rim that falls across the brow */
      for (y = 13; y <= 46; y++) {
        var inn = halfAt(Math.min(y, CHIN), false) + 0.8;
        b.set(Math.round(CX - inn) - 1, y, CD);
        b.set(Math.round(CX + inn) + 1, y, CD);
      }
      for (x = CX - 17; x <= CX + 17; x++) b.set(x, 14, CD);
      b.rect(CX - 17, 12, 35, 2, CM);
    },

    /* a worked band with a stone at the brow */
    circlet: function (b) {
      var y, x, h;
      for (y = 20; y <= 22; y++) {
        h = halfAt(y, false) + 1.4;
        for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) b.set(x, y, y === 21 ? AC : ACD);
      }
      h = halfAt(21, false) + 1.4;
      for (x = Math.round(CX - h); x <= Math.round(CX - h) + 5; x++) b.set(x, 21, AC);
      /* the stone */
      b.ell(CX, 22, 3, 2.6, ACD);
      b.ell(CX, 22, 2, 1.8, ML);
      b.set(CX - 1, 21, EW);
      /* small points rising from the band */
      b.set(CX - 9, 19, AC); b.set(CX + 9, 19, ACD);
      b.set(CX - 14, 20, AC); b.set(CX + 14, 20, ACD);
    },

    /* cloth tied round the brow, knotted at the side */
    headband: function (b) {
      var y, x, h;
      for (y = 20; y <= 24; y++) {
        h = halfAt(y, false) + 1.4;
        for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) {
          b.set(x, y, y === 20 || y === 24 ? ACD : AC);
        }
      }
      /* knot and trailing ends on the left */
      h = halfAt(22, false) + 1.4;
      b.ell(CX - h - 2, 22, 3, 3, AC);
      b.ell(CX - h - 2, 22, 1.6, 1.6, ACD);
      b.rect(Math.round(CX - h) - 5, 25, 4, 2, AC);
      b.rect(Math.round(CX - h) - 5, 28, 3, 2, ACD);
    },

    /* a soft hat with a wide brim */
    cowl: function (b) {
      var y, x, h;
      /* crown */
      for (y = TOP - 9; y <= 20; y++) {
        h = hairHalf(y, 2.2) * (y < TOP ? 1 : 1);
        if (y < TOP - 5) h = hairHalf(TOP - 5, 2.2) * (1 - (TOP - 5 - y) / 7);
        if (h <= 0) continue;
        for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) b.set(x, y, CM);
      }
      b.ellOver(CX - 7, TOP - 3, 8, 6, CM, CL);
      for (y = TOP - 9; y <= 20; y++) {
        for (x = CX + 6; x < W; x++) if (b.get(x, y) === CM) b.set(x, y, CD);
      }
      /* brim */
      b.ell(CX, 21, 23, 4.2, CM);
      b.ell(CX - 6, 20, 15, 2.6, CL);
      b.rect(CX - 23, 23, 47, 2, CD);
      /* hatband */
      b.rect(CX - 17, 17, 34, 3, ACD);
      b.rect(CX - 17, 17, 34, 1, AC);
    }
  };

  /* ---------------- the bust ---------------- */

  function drawBody(b, spec) {
    var y, x, h;
    /* shoulders */
    for (y = 54; y < H; y++) {
      h = Math.min(31, 17 + (y - 54) * 1.45);
      for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) b.set(x, y, CL);
    }
    /* light from the left: the right half falls off */
    for (y = 54; y < H; y++) {
      for (x = CX + 3; x < W; x++) if (b.get(x, y) === CL) b.set(x, y, CM);
      for (x = CX + 13; x < W; x++) if (b.get(x, y) === CM) b.set(x, y, CD);
    }
    /* a fold under each shoulder */
    for (y = 62; y < H; y++) {
      b.set(CX - 15 + Math.round((y - 62) * 0.35), y, CM);
      b.set(CX + 16 - Math.round((y - 62) * 0.15), y, CD);
    }

    /* collar */
    if (spec.collar !== 'plain') {
      for (y = 56; y <= 70; y++) {
        var spread = 6 + (y - 56) * 0.85;
        b.rect(Math.round(CX - spread) - 3, y, 4, 1, CD);
        b.rect(Math.round(CX + spread), y, 4, 1, CD);
        b.rect(Math.round(CX - spread) - 3, y, 1, 1, AC);
        b.rect(Math.round(CX + spread) + 3, y, 1, 1, ACD);
      }
      b.rect(CX - 12, 57, 25, 2, CD);
      b.rect(CX - 12, 57, 25, 1, AC);
    } else {
      b.rect(CX - 11, 57, 23, 2, CD);
    }

    if (spec.pauldron) {
      b.ell(11, 68, 12, 10, ML);
      b.ell(53, 68, 12, 10, ML);
      b.ellOver(8, 65, 8, 6, ML, ML);
      var px;
      for (y = 58; y < H; y++) {
        for (x = 0; x < W; x++) {
          if (b.get(x, y) !== ML) continue;
          px = x < 32 ? x - 4 : x - 48;
          if (px > 6) b.set(x, y, MM);
          if (px > 10) b.set(x, y, MD);
        }
      }
      /* banding and rivets */
      for (x = 0; x < W; x++) {
        if (b.get(x, 64) === ML || b.get(x, 64) === MM) b.set(x, 64, MD);
        if (b.get(x, 70) === ML || b.get(x, 70) === MM) b.set(x, 70, MD);
      }
      b.set(10, 61, AC); b.set(54, 61, AC);
      b.set(6, 67, ACD); b.set(58, 67, ACD);
    }
  }

  function drawHead(b, spec) {
    var y, x, h, sq = spec.jaw === 'square';

    /* neck */
    for (y = 44; y <= 60; y++) {
      var nw = 7 + Math.max(0, (y - 54) * 0.9);
      for (x = Math.round(CX - nw); x <= Math.round(CX + nw); x++) b.set(x, y, SKM);
    }
    /* the jaw throws a shadow across the throat */
    for (y = 44; y <= 49; y++) b.span(y, 7, SKD);
    for (y = 53; y <= 56; y++) {
      for (x = CX - 3; x <= CX + 8; x++) if (b.get(x, y) === SKM) b.set(x, y, SKD);
    }
    for (y = 50; y <= 60; y++) b.set(Math.round(CX - 7), y, SK);

    /* ears */
    b.ell(CX - 16, 33, 3.2, 5.4, SK);
    b.ell(CX + 16, 33, 3.2, 5.4, SKM);
    b.ell(CX - 15, 33, 1.6, 3.2, SKM);
    b.ell(CX + 15, 33, 1.6, 3.2, SKD);

    /* skull */
    for (y = TOP; y <= CHIN; y++) {
      h = halfAt(y, sq);
      for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) b.set(x, y, SK);
    }

    /* form: shadow down the right, rim light down the left */
    for (y = TOP; y <= CHIN; y++) {
      h = halfAt(y, sq);
      var xr = Math.round(CX + h), xl = Math.round(CX - h);
      for (x = xr - 5; x <= xr; x++) if (b.get(x, y) === SK) b.set(x, y, SKM);
      for (x = xr - 2; x <= xr; x++) if (b.get(x, y) === SKM) b.set(x, y, SKD);
      if (y > 14 && y < 44 && b.get(xl, y) === SK) b.set(xl, y, SKH);
    }
    /* brow ridge and forehead catch the light */
    b.ellOver(CX - 4, 19, 11, 6, SK, SKH);
    b.ellOver(CX - 3, 17, 7, 3, SKH, SKH);
    /* temples recede */
    b.ellOver(CX - 14, 24, 4, 5, SK, SKM);
    b.ellOver(CX + 13, 24, 4, 5, SKM, SKD);
    /* cheekbones */
    b.ellOver(CX - 10, 34, 5, 3.4, SK, SKH);
    b.ellOver(CX + 9, 35, 5, 3.4, SKM, SKM);
    /* the hollow under each cheekbone */
    b.ellOver(CX - 11, 40, 4, 3, SK, SKM);
    b.ellOver(CX + 10, 40, 4, 3, SKM, SKD);
    /* chin */
    b.ellOver(CX, 45, 4.5, 3, SK, SKH);
    for (y = 46; y <= CHIN; y++) {
      h = halfAt(y, sq);
      for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) if (b.get(x, y) === SK) b.set(x, y, SKM);
    }
    b.ellOver(CX - 1, 45, 3, 2, SKM, SKH);
    /* a little warmth on the cheeks */
    if (spec.blush !== false) {
      b.ellOver(CX - 11, 37, 3.4, 2.2, SKH, SKB);
      b.ellOver(CX + 10, 37, 3.4, 2.2, SKM, SKB);
    }
  }

  function drawFace(b, spec) {
    var x, y;

    /* --- brows --- */
    var browY = spec.brow === 'high' ? 24 : 25;
    var tilt = spec.brow === 'angry' ? 1 : 0;
    for (x = 0; x < 10; x++) {
      var ly = browY + (tilt ? Math.round(x * 0.30) : Math.round(Math.abs(x - 5) * 0.16));
      var ry = browY + (tilt ? Math.round((9 - x) * 0.30) : Math.round(Math.abs(x - 4) * 0.16));
      b.set(CX - 16 + x, ly, HD);
      b.set(CX - 16 + x, ly + 1, HD);
      b.set(CX - 16 + x, ly + 2, HX);
      b.set(CX + 7 + x, ry, HD);
      b.set(CX + 7 + x, ry + 1, HD);
      b.set(CX + 7 + x, ry + 2, HX);
    }

    /* --- eyes --- */
    var LX = CX - 12, RX = CX + 6;         /* left edge of each eye */
    var EYT = 29;
    function eye(x0, mirror) {
      var i;
      var EWD = 7;
      if (spec.eyes === 'closed') {
        for (i = 0; i < EWD; i++) b.set(x0 + i, EYT + 2, OL);
        b.set(x0 + (mirror ? EWD : -1), EYT + 1, OL);
        return;
      }
      /* the white, an almond three rows deep */
      for (i = 0; i < EWD; i++) {
        var lift = (i === 0 || i === EWD - 1) ? 1 : 0;
        for (y = EYT + 1 + lift; y <= EYT + 3 - lift; y++) b.set(x0 + i, y, EW);
      }
      /* iris and pupil */
      var ix = x0 + (mirror ? 1 : 2);
      b.rect(ix, EYT + 1, 4, 3, EI);
      b.rect(ix + 1, EYT + 1, 2, 2, EP);
      b.set(ix, EYT + 1, EW);             /* catchlight */
      /* lids */
      for (i = 0; i < EWD; i++) b.set(x0 + i, EYT + (i === 0 || i === EWD - 1 ? 1 : 0), OL);
      b.set(x0 - (mirror ? 0 : 1), EYT + 1, OL);
      b.set(x0 + EWD - 1 + (mirror ? 1 : 0), EYT + 1, OL);
      for (i = 1; i < EWD - 1; i++) b.set(x0 + i, EYT + 4, SKD);
      if (spec.lashes) {
        for (i = 0; i < EWD; i++) b.set(x0 + i, EYT - 1 + (i === 0 || i === EWD - 1 ? 1 : 0), OL);
        b.set(x0 + (mirror ? EWD : -1), EYT, OL);
        b.set(x0 + (mirror ? EWD + 1 : -2), EYT - 1, OL);
      }
    }
    eye(LX, false);
    eye(RX, true);

    /* --- nose --- */
    for (y = 27; y <= 37; y++) {
      b.set(CX - 2, y, SKH);
      b.set(CX + 1, y, SKM);
      b.set(CX + 2, y, y > 31 ? SKD : SKM);
    }
    b.ellOver(CX, 39, 3.4, 2.4, SK, SKH);
    b.ellOver(CX, 39, 3.4, 2.4, SKM, SKH);
    b.set(CX - 4, 40, SKD); b.set(CX - 3, 41, SKD);
    b.set(CX + 3, 40, SKD); b.set(CX + 2, 41, SKD);
    for (x = CX - 4; x <= CX + 3; x++) b.set(x, 42, SKD);
    b.set(CX + 4, 41, SKD);

    /* --- mouth --- */
    var my = 45, wide = 5;
    for (x = CX - wide; x <= CX + wide - 1; x++) {
      var dy = 0, edge = Math.abs(x - CX + 0.5) > wide - 1.5;
      if (spec.mouth === 'frown') dy = edge ? -1 : 0;
      if (spec.mouth === 'smirk') dy = x > CX + 1 ? -1 : 0;
      b.set(x, my + dy, LPD);
      if (!edge) b.set(x, my + dy + 1, LP);
    }
    /* philtrum and the shadow under the lower lip */
    b.set(CX - 1, 43, SKD); b.set(CX, 43, SKD);
    for (x = CX - 3; x <= CX + 2; x++) b.set(x, my + 2, SKD);

    /* --- facial hair --- */
    var sq = spec.jaw === 'square';
    if (spec.beard === 'full') {
      /* a U of hair: high at the sideburns, meeting under the chin */
      for (y = 32; y <= CHIN + 3; y++) {
        var h = halfAt(Math.min(y, CHIN), sq) + (y > CHIN ? -(y - CHIN) * 1.7 : 0);
        if (h <= 0) continue;
        var inner = y >= 45 ? 0 : Math.max(0, 13.5 - (y - 32) * 0.72);
        for (x = Math.round(CX - h); x <= Math.round(CX + h); x++) {
          if (Math.abs(x - CX) < inner) continue;
          var v = b.get(x, y);
          if (v === SK || v === SKH || v === SKM || v === SKD || v === SKB) b.set(x, y, HM);
        }
      }
      /* moustache: highest under the nose, falling away at the corners */
      for (x = CX - 7; x <= CX + 6; x++) {
        var d = Math.abs(x - CX + 0.5);
        var top = d <= 3 ? 41 : (d <= 5 ? 42 : 43);
        for (y = top; y <= 44; y++) {
          var m = b.get(x, y);
          if (m === SK || m === SKH || m === SKM || m === SKD || m === SKB) b.set(x, y, HM);
        }
      }
      /* the mouth, cut back into the hair */
      for (x = CX - 3; x <= CX + 2; x++) b.set(x, 45, LPD);
      for (x = CX - 2; x <= CX + 1; x++) b.set(x, 46, HX);
      /* volume */
      b.ellOver(CX - 8, 47, 6, 4, HM, HL);
      for (y = 32; y <= CHIN + 3; y++) for (x = CX + 5; x < W; x++) if (b.get(x, y) === HM) b.set(x, y, HD);
      for (y = CHIN; y <= CHIN + 3; y++) for (x = 0; x < W; x++) if (b.get(x, y) === HD) b.set(x, y, HX);
    } else if (spec.beard === 'stubble') {
      for (y = 38; y <= CHIN; y++) {
        for (x = CX - 16; x <= CX + 15; x++) {
          var g = b.get(x, y);
          if ((x * 7 + y * 13) % 3 !== 0) continue;
          if (g === SK || g === SKH) b.set(x, y, SKM);
          else if (g === SKM) b.set(x, y, SKD);
        }
      }
      for (y = 42; y <= 44; y++) for (x = CX - 7; x <= CX + 6; x++) {
        if ((x + y) % 2 === 0 && b.get(x, y) !== T && b.get(x, y) !== LP && b.get(x, y) !== LPD) b.set(x, y, SKD);
      }
    } else if (spec.beard === 'goatee') {
      for (y = 46; y <= CHIN + 2; y++) {
        var gw = 5 - Math.max(0, (y - CHIN) * 1.2);
        for (x = Math.round(CX - gw); x <= Math.round(CX + gw); x++) b.set(x, y, HM);
      }
      for (x = CX + 1; x <= CX + 5; x++) for (y = 46; y <= CHIN + 2; y++) if (b.get(x, y) === HM) b.set(x, y, HD);
      for (y = 42; y <= 44; y++) for (x = CX - 7; x <= CX + 6; x++) if (b.get(x, y) !== T && b.get(x, y) !== LP && b.get(x, y) !== LPD) b.set(x, y, HM);
    }

    /* --- distinguishing marks --- */
    if (spec.scar) {
      for (y = 22; y <= 38; y++) b.set(CX + 10 + Math.round((y - 22) * 0.12), y, SKD);
      b.set(CX + 12, 26, SKD); b.set(CX + 9, 32, SKD);
      b.set(CX + 11, 23, SKB); b.set(CX + 12, 35, SKB);
    }
    if (spec.freckles) {
      var fx = [-12, -9, -11, -7, 10, 12, 9, 13];
      var fy = [35, 36, 38, 34, 35, 37, 38, 34];
      for (var f = 0; f < fx.length; f++) b.set(CX + fx[f], fy[f], SKD);
    }
    if (spec.eyepatch) {
      for (y = 27; y <= 37; y++) for (x = CX + 3; x <= CX + 16; x++) b.set(x, y, MD);
      for (y = 28; y <= 30; y++) for (x = CX + 4; x <= CX + 15; x++) b.set(x, y, MM);
      for (x = CX - 16; x <= CX + 17; x++) b.set(x, 28, MD);
      b.ell(CX + 9, 32, 2.4, 2.2, ACD);
    }
  }

  function draw(spec) {
    var b = new Buf();
    var hair = HAIR[spec.hair] || HAIR.short;

    TIGHT = spec.gear === 'helm' || spec.gear === 'hood' || spec.gear === 'cowl';
    hair.back(b);
    drawBody(b, spec);
    drawHead(b, spec);
    hair.front(b);
    TIGHT = false;
    drawFace(b, spec);
    (GEAR[spec.gear] || GEAR.none)(b);

    /* outline: every transparent pixel touching the figure */
    var copy = new Uint8Array(b.d);
    function filled(x, y) {
      if (x < 0 || y < 0 || x >= W || y >= H) return false;
      return copy[y * W + x] !== T;
    }
    for (var oy = 0; oy < H; oy++) {
      for (var ox = 0; ox < W; ox++) {
        if (copy[oy * W + ox] !== T) continue;
        if (filled(ox - 1, oy) || filled(ox + 1, oy) || filled(ox, oy - 1) || filled(ox, oy + 1)) {
          b.set(ox, oy, OL);
        }
      }
    }
    return b;
  }

  /* ---------------- palettes ---------------- */

  var SKINS = {
    fair:   ['#ffe6c6', '#f6d2ac', '#dcab82', '#b07f5c', '#c9866f'],
    warm:   ['#fbd6ab', '#eebd93', '#cc9163', '#9e6a44', '#bf7a63'],
    tan:    ['#eeb98a', '#d8a172', '#b17a4d', '#835432', '#a76646'],
    deep:   ['#c4874f', '#a9703f', '#89562f', '#61391e', '#8a4e35'],
    pale:   ['#fff0dd', '#f6e0c6', '#dcbb9c', '#ad8a6c', '#c88f84']
  };
  var HAIRS = {
    auburn:  ['#d97f46', '#a9512a', '#71311a', '#48200f'],
    black:   ['#57506a', '#39334a', '#231f30', '#14111c'],
    brown:   ['#ae7a48', '#82562f', '#57371e', '#331f10'],
    blonde:  ['#ffe9a4', '#dcbc66', '#a5853c', '#6d5622'],
    grey:    ['#e2e5ee', '#b4b8c6', '#83889b', '#565a6c'],
    red:     ['#ee8a48', '#bd5726', '#843716', '#52200c'],
    silver:  ['#f4f8ff', '#c9d0e0', '#969eb2', '#666d80'],
    sandy:   ['#eecb8b', '#c39c56', '#93723a', '#614a22']
  };
  var IRIS = {
    green: ['#6cc072', '#2f6a41'], blue: ['#6d9be0', '#31548f'],
    brown: ['#a06a38', '#4f3016'], grey: ['#aab3c6', '#5b6375'],
    amber: ['#e0a94a', '#8a5f1c'], violet: ['#b07de0', '#5b3382']
  };

  function palette(spec) {
    var sk = SKINS[spec.skin] || SKINS.fair;
    var hr = HAIRS[spec.hairColour] || HAIRS.brown;
    var ir = IRIS[spec.eyeColour] || IRIS.brown;
    var p = [];
    p[T] = null;
    p[OL] = '#171326';
    p[SKH] = sk[0]; p[SK] = sk[1]; p[SKM] = sk[2]; p[SKD] = sk[3]; p[SKB] = sk[4];
    p[HL] = hr[0]; p[HM] = hr[1]; p[HD] = hr[2]; p[HX] = hr[3];

    function say(title, text) {
      clear(info);
      info.appendChild(el('div', 'wi-n', title));
      info.appendChild(el('div', 'wi-t', text));
      var bar = el('div', 'fc-bar');
      info.appendChild(bar);
      return bar;
    }
    say('The march east', 'Pick where to go. Chapters move the campaign; everything else is optional.');

    nodes.forEach(function (entry) {
      var n = entry.node;
      var btn = el('button', 'wnode ' + n.kind + ' ' + entry.state);
      btn.style.left = (n.x * 100) + '%';
      btn.style.top = (n.y * 100) + '%';
      btn.appendChild(el('span', 'wn-dot'));
      btn.appendChild(el('span', 'wn-label', n.name));
      btn.addEventListener('click', function () {
        FE.Sfx.select();
        [].forEach.call(wrap.querySelectorAll('.wnode'), function (o) { o.classList.remove('on'); });
        btn.classList.add('on');
        pickWorldNode(m, entry, say);
      });
      wrap.appendChild(btn);
    });
    b.appendChild(wrap);
    b.appendChild(info);

    var bar = el('div', 'prep-bar');
    bar.appendChild(UI.button('Supply', '', function () { closeModal(m); showConvoy(function () { showWorldMap(); }); }));
    bar.appendChild(UI.button('Save', '', function () { doSave(false); }));
    if (!nextCh) {
      bar.appendChild(UI.button('The campaign so far', '', function () { closeModal(m); showCampaignComplete(); }));
    }
    bar.appendChild(UI.button('Title', 'cancel', function () { closeModal(m); showTitle(); }));
    b.appendChild(bar);

    openModal(m);
  }

  function pickWorldNode(m, entry, say) {
    var n = entry.node, bar;

    if (n.kind === 'chapter') {
      var ch = FE.CHAPTERS[n.index];
      if (entry.state === 'locked') {
        say(n.name, 'Not yet. The road there runs through whatever is still in front of you.');
        return;
      }
      if (entry.state === 'done') {
        say(n.name, 'Chapter ' + ch.number + ', already behind you. ' + ch.objectiveText + '.');
        return;
      }
      bar = say(n.name, ch.objectiveText + '. This one moves the campaign forward.');
      bar.appendChild(UI.button('March on ' + n.name, 'primary', function () {
        closeModal(m);
        startChapterFlow();
      }));
      return;
    }

    if (n.kind === 'shop') {
      bar = say(n.name, n.blurb || '');
      bar.appendChild(UI.button('Visit the fair', 'primary', function () {
        closeModal(m);
        showShop(function () { showWorldMap(); });
      }));
      return;
    }

    if (n.kind === 'spire') {
      var best = G.campaign.spireBest || 0;
      var top = Math.min(FE.SPIRE_FLOORS, best + 1);
      bar = say(n.name, (n.blurb || '') + ' Cleared to floor ' + best + ' of ' + FE.SPIRE_FLOORS + '.');
      for (var f = 1; f <= top; f++) {
        (function (floor) {
          bar.appendChild(UI.button('Floor ' + floor, floor === top ? 'primary' : '', function () {
            closeModal(m);
            startSkirmish(FE.spireFloor(G.campaign, floor, G.campaign.seed + floor * 97));
          }));
        })(f);
      }
      return;
    }

    /* a skirmish site */
    var site = n.site;
    var battle = FE.skirmishFor(G.campaign, site, G.campaign.seed + worldCleared() * 31 + site.id.length);
    var avg = Math.round(battle.enemies.reduce(function (a, e) { return a + e.level; }, 0) / battle.enemies.length);
    bar = say(n.name, battle.enemies.length + ' of them, around level ' + avg
      + '. No treasure here — a purse, and whatever your units learn on the way.');
    bar.appendChild(UI.button('Ride out', 'primary', function () {
      closeModal(m);
      startSkirmish(battle);
    }));
  }

  function startSkirmish(battle) {
    G.chapter = battle;
    G.campaign.arenaRounds = {};
    showPrep();
  }

  /* ================= preparations ================= */

  function showPrep() {
    G.scene = 'prep';
    FE.Music.play('prep');
    var ch = curChapter();

    /* default deployment: forced units first, then the rest by level */
    var avail = ch.available.filter(function (id) { return G.campaign.roster[id]; });
    var forced = ch.forced.filter(function (id) { return G.campaign.roster[id]; });
    forced.forEach(function (id) { if (!G.campaign.roster[id]) G.campaign.roster[id] = FE.makeRosterUnit(id); });
    G.deploy = forced.slice();
    avail.forEach(function (id) {
      if (G.deploy.length >= ch.slots) return;
      if (G.deploy.indexOf(id) === -1) G.deploy.push(id);
    });

    renderPrep();
  }

  function renderPrep() {
    var ch = curChapter();
    var m = UI.modal(ch.skirmish ? ch.name : ('Chapter ' + ch.number + ' — ' + ch.name), true);
    m._box.classList.add('prep-box');
    var b = m._body;

    var head = el('div', 'prep-head');
    head.appendChild(el('div', 'prep-obj', 'Objective: ' + ch.objectiveText));
    head.appendChild(el('div', 'prep-gold', 'Gold ' + G.campaign.gold + '   ·   Deploy ' + G.deploy.length + '/' + ch.slots));
    b.appendChild(head);

    var list = el('div', 'prep-list');
    var avail = ch.available.filter(function (id) { return G.campaign.roster[id]; });
    avail.forEach(function (id) {
      var u = G.campaign.roster[id];
      var on = G.deploy.indexOf(id) !== -1;
      var locked = ch.forced.indexOf(id) !== -1;
      var card = el('div', 'unit-card' + (on ? ' on' : '') + (locked ? ' locked' : ''));
      card.appendChild(UI.sprite(u.cls, 'player', 36));
      var info = el('div', 'uc-info');
      info.appendChild(el('div', 'uc-n', u.name + (locked ? '  ★' : '')));
      info.appendChild(el('div', 'uc-c', FE.CLASSES[u.cls].name + '  Lv' + u.level));
      var bars = el('div', 'uc-bars');
      bars.appendChild(UI.hpBar(u.hp, u.maxhp));
      bars.appendChild(UI.expBar(u.exp));
      info.appendChild(bars);
      card.appendChild(info);

      var acts = el('div', 'uc-acts');
      acts.appendChild(UI.button('Info', 'tiny', function (ev) { ev.stopPropagation(); showUnitInfo(u, 'player'); }));
      card.appendChild(acts);

      card.addEventListener('click', function () {
        if (locked) { UI.toast(u.name + ' must deploy this chapter.'); return; }
        FE.Sfx.select();
        var i = G.deploy.indexOf(id);
        if (i !== -1) G.deploy.splice(i, 1);
        else {
          if (G.deploy.length >= ch.slots) { UI.toast('No deployment slots left.'); return; }
          G.deploy.push(id);
        }
        closeModal(m);
        renderPrep();
      });
      list.appendChild(card);
    });
    b.appendChild(list);

    var bar = el('div', 'prep-bar');
    bar.appendChild(UI.button('Supply', '', function () { closeModal(m); showConvoy(function () { renderPrep(); }); }));
    bar.appendChild(UI.button('Shop', '', function () { closeModal(m); showShop(function () { renderPrep(); }); }));
    bar.appendChild(UI.button('Save', '', function () { doSave(false); }));
    bar.appendChild(UI.button('Begin Chapter', 'primary', function () {
      if (!G.deploy.length) { UI.toast('Deploy at least one unit.'); return; }
      closeModal(m);
      beginBattle();
    }));
    b.appendChild(bar);

    openModal(m);
  }

  /* ---------------- convoy / trading ---------------- */

  function showConvoy(back) {
    var m = UI.modal('Supply', true);
    var b = m._body;
    var chosenId = G.deploy[0];

    function render() {
      clear(b);
      var pick = el('div', 'chip-row');
      G.deploy.forEach(function (id) {
        var u = G.campaign.roster[id];
        var c = el('div', 'chip' + (id === chosenId ? ' on' : ''), u.name);
        c.addEventListener('click', function () { FE.Sfx.select(); chosenId = id; render(); });
        pick.appendChild(c);
      });
      b.appendChild(pick);

      var u = G.campaign.roster[chosenId];
      var cols = el('div', 'two-col');

      var left = UI.panel(u.name + '  (' + u.items.length + '/5)');
      u.items.forEach(function (it, idx) {
        var line = UI.itemLine(it);
        line.appendChild(UI.button('→', 'tiny', function () {
          G.campaign.convoy.push(u.items.splice(idx, 1)[0]);
          render();
        }));
        left._body.appendChild(line);
      });
      cols.appendChild(left);

      var right = UI.panel('Convoy (' + G.campaign.convoy.length + ')');
      G.campaign.convoy.forEach(function (it, idx) {
        var line = UI.itemLine(it);
        line.appendChild(UI.button('←', 'tiny', function () {
          if (u.items.length >= 5) { UI.toast(u.name + ' is carrying five items already.'); return; }
          u.items.push(G.campaign.convoy.splice(idx, 1)[0]);
          render();
        }));
        right._body.appendChild(line);
      });
      cols.appendChild(right);
      b.appendChild(cols);

      b.appendChild(UI.button('Done', 'primary', function () { closeModal(m); back(); }));
    }
    render();
    openModal(m);
  }

  /* ---------------- shop ---------------- */

  var SHOP_STOCK = [
    ['ironsword', 'ironlance', 'ironaxe', 'ironbow', 'javelin', 'handaxe', 'vulnerary', 'heal', 'fire', 'lightning'],
    ['steelsword', 'steellance', 'steelaxe', 'steelbow', 'slimsword', 'armorslayer', 'vulnerary', 'heal', 'mend', 'thunder', 'chestkey', 'doorkey'],
    ['steelsword', 'steellance', 'steelaxe', 'steelbow', 'killingedge', 'killeraxe', 'horseslayer', 'elixir', 'mend', 'purewater', 'shine', 'elfire']
  ];

  function showShop(back) {
    FE.Music.play('shop');
    var m = UI.modal('Armory & Vendor', true);
    var b = m._body;
    var stock = SHOP_STOCK[Math.min(G.campaign.chapterIndex, SHOP_STOCK.length - 1)];
    var sellFrom = null;          /* null = convoy, otherwise a unit id */

    function render() {
      clear(b);
      b.appendChild(el('div', 'shop-gold', 'Gold: ' + G.campaign.gold));
      var grid = el('div', 'shop-grid');
      stock.forEach(function (k) {
        var d = FE.WEAPONS[k];
        var card = el('div', 'shop-card');
        card.appendChild(el('div', 'sc-n', d.name));
        var stats = el('div', 'sc-s');
        if (d.type === 'staff') stats.textContent = 'Staff  Wt ' + d.wt;
        else if (d.type === 'item') stats.textContent = 'Item';
        else stats.textContent = FE.typeName(d.type) + '  Mt ' + d.mt + '  Hit ' + d.hit + '  Wt ' + d.wt + (d.crit ? '  Crit ' + d.crit : '');
        card.appendChild(stats);
        card.appendChild(el('div', 'sc-p', d.price + 'g'));
        card.addEventListener('click', function () {
          if (G.campaign.gold < d.price) { UI.toast('Not enough gold.'); return; }
          FE.Sfx.select();
          G.campaign.gold -= d.price;
          G.campaign.convoy.push(FE.mkItem(k));
          UI.toast(d.name + ' → convoy');
          render();
        });
        grid.appendChild(card);
      });
      b.appendChild(grid);

      /* Selling: from the convoy AND from what your units are carrying, which
         is where the weapon you actually want rid of usually is. */
      var sell = UI.panel('Sell');
      var srcChips = el('div', 'chip-row');
      var sources = [{ id: null, name: 'Convoy' }].concat(
        G.deploy.map(function (id) { return { id: id, name: G.campaign.roster[id].name }; })
      );
      sources.forEach(function (src) {
        var chip = el('div', 'chip' + (sellFrom === src.id ? ' on' : ''), src.name);
        chip.addEventListener('click', function () { FE.Sfx.select(); sellFrom = src.id; render(); });
        srcChips.appendChild(chip);
      });
      sell._body.appendChild(srcChips);

      var bag = sellFrom === null ? G.campaign.convoy : G.campaign.roster[sellFrom].items;
      var sellable = 0;
      bag.forEach(function (it, idx) {
        var d = FE.itemData(it);
        if (!d) return;
        var line = UI.itemLine(it);
        if (d.story || d.personal) {
          line.appendChild(el('span', 'note', 'cannot be sold'));
          sell._body.appendChild(line);
          return;
        }
        sellable++;
        /* a part-used weapon is worth less than a fresh one */
        var full = d.price || 0;
        var frac = (it.uses === null || !d.uses) ? 1 : Math.max(0.25, it.uses / d.uses);
        var price = Math.max(1, Math.floor(full / 2 * frac));
        line.appendChild(UI.button('Sell ' + price + 'g', 'tiny', function () {
          G.campaign.gold += price;
          bag.splice(idx, 1);
          UI.toast('Sold ' + d.name + ' for ' + price + 'g');
          render();
        }));
        sell._body.appendChild(line);
      });
      if (!bag.length) sell._body.appendChild(el('div', 'note', 'Nothing here to sell.'));
      else if (!sellable) sell._body.appendChild(el('div', 'note', 'Nothing here can be sold.'));
      b.appendChild(sell);
      b.appendChild(UI.button('Done', 'primary', function () { closeModal(m); FE.Music.play('prep'); back(); }));
    }
    render();
    openModal(m);
  }

  /* ---------------- arena ---------------- */

  /* The arena used to live here, on the preparations screen. It now stands on
     the map as a building you walk a unit into mid-battle — see doArena below. */

  /* ================= battle ================= */

  function beginBattle() {
    G.state = FE.startChapter(G.campaign, G.deploy);
    G.scene = 'battle';
    G.mode = 'idle';
    G.selected = null; G.selectedUnit = null;
    G.overlay = null; G.path = null;
    FE.Undo.reset(G.state);
    FE.Undo.push(G.state, 'turn start');
    var first = G.state.units.filter(function (u) { return u.faction === 'player'; })[0];
    if (first) { G.cursor = { x: first.x, y: first.y }; }
    /* show the battle chrome FIRST so the canvas is measured at its real size */
    $('game').classList.add('in-battle');
    FE.resizeCanvas();
    fitZoom();
    FE.centerOn(G.state, G.cursor.x, G.cursor.y);
    updateHud();
    updateTileInfo();
    FE.Music.play('player');
    if (curChapter().tutorial) {
      setTimeout(function () { UI.toast('Tap a unit to move. The red button shows where the enemy can reach.'); }, 700);
    }
  }

  /* Fill the viewport rather than shrinking the whole map into it. A phone is
     narrow and tall, and a 20-tile map scaled to fit its width leaves the board
     as an unreadable strip with black bands above and below. Cover, then pan. */
  function fitZoom() {
    var s = G.state;
    var R = FE.R;
    var fitW = R.viewW / (s.map.w * R.tile);
    var fitH = R.viewH / (s.map.h * R.tile);
    var want = Math.max(fitW, fitH);
    R.zoom = Math.max(0.7, Math.min(1.5, want));
  }

  function updateHud() {
    var s = G.state;
    if (!s) return;
    var ch = curChapter();
    $('hud-ch').textContent = ch.skirmish ? ch.name : ('Ch ' + ch.number + ' · ' + ch.name);
    var obj = ch.objectiveText;
    if (s.objective === 'survive') obj = 'Survive ' + Math.max(0, s.survive - s.turn + 1) + ' more turn(s)';
    $('hud-obj').textContent = obj;
    $('hud-turn').textContent = 'Turn ' + s.turn + ' · ' + (s.phase === 'player' ? 'Your phase' : 'Enemy phase');
    $('hud-turn').className = s.phase === 'player' ? 'player-phase' : 'enemy-phase';
    var undoBtn = $('btn-undo');
    undoBtn.disabled = !FE.Undo.canUndo(G.state) || G.busy;
    undoBtn.textContent = 'Undo' + (FE.Undo.depth(G.state) > 1 ? ' (' + (FE.Undo.depth(G.state) - 1) + ')' : '');
    $('btn-end').disabled = s.phase !== 'player' || G.busy;
  }

  /* ---------------- tile info panel ---------------- */

  function updateTileInfo() {
    var s = G.state, p = $('tileinfo');
    if (!s) return;
    clear(p);
    var t = FE.tileAt(s, G.cursor.x, G.cursor.y);
    if (!t) return;
    var td = FE.TERRAIN[t];
    var row = el('div', 'ti-terr');
    row.appendChild(el('span', 'ti-n', td.name));
    var bits = [];
    if (td.avo) bits.push('Avo +' + td.avo);
    if (td.def) bits.push('Def +' + td.def);
    if (td.heal) bits.push('Heal');
    row.appendChild(el('span', 'ti-b', bits.join('  ')));
    p.appendChild(row);

    var u = FE.unitAt(s, G.cursor.x, G.cursor.y);
    if (u && u.alive && FE.unitVisible(s, u)) {
      var card = el('div', 'ti-unit ' + u.faction + (u.boss ? ' boss' : ''));
      card.appendChild(UI.sprite(u.cls, u.boss ? 'boss' : (u.recruitable && u.faction === 'enemy' ? 'npc' : u.faction), 32));
      var info = el('div', 'ti-info');
      info.appendChild(el('div', 'ti-un', u.name + '  Lv' + u.level));
      info.appendChild(el('div', 'ti-uc', FE.CLASSES[u.cls].name));
      info.appendChild(UI.hpBar(u.hp, u.maxhp));
      info.appendChild(el('div', 'ti-hp', u.hp + ' / ' + u.maxhp));
      card.appendChild(info);
      var btn = UI.button('Stats', 'tiny', function () { showUnitInfo(u, u.faction); });
      card.appendChild(btn);
      p.appendChild(card);
    }
  }

  /* ---------------- selection & movement ---------------- */

  function tapTile(x, y) {
    var s = G.state;
    if (!s || G.busy || s.phase !== 'player') return;
    if (!FE.inBounds(s, x, y)) return;
    G.cursor = { x: x, y: y };
    updateTileInfo();

    if (G.mode === 'idle') {
      var u = FE.unitAt(s, x, y);
      if (u && u.alive && u.faction === 'player' && !u.acted) {
        selectUnit(u);
      } else if (u && u.alive) {
        showRangePreview(u);
      } else {
        clearSelection();
      }
      return;
    }

    if (G.mode === 'move') {
      var k = FE.posKey(x, y);
      if (G.stand[k] !== undefined) {
        commitMove(G.selectedUnit, x, y);
      } else {
        var other = FE.unitAt(s, x, y);
        if (other && other.alive && other.faction === 'player' && !other.acted) selectUnit(other);
        else clearSelection();
      }
      return;
    }

    if (G.mode === 'target') {
      if (!G.pendingTarget) return;
      var t = FE.unitAt(s, x, y);
      if (t && G.pendingTarget.valid(t)) G.pendingTarget.pick(t);
      /* a tap on empty ground just moves the cursor - backing out is the
         Back button, so a near-miss never throws away the action */
    }
  }

  function selectUnit(u) {
    FE.Sfx.select();
    G.selected = u.uid;
    G.selectedUnit = u;
    G.mode = 'move';
    G.reach = FE.reachable(G.state, u);
    G.stand = FE.standable(G.state, u, G.reach);
    G.stand[FE.posKey(u.x, u.y)] = 0;
    buildMoveOverlay(u);
    G.path = null;
    updateTileInfo();
  }

  function buildMoveOverlay(u) {
    var ov = {};
    /* danger sits underneath, so you can check what reaches you while you are
       still deciding where to go rather than having to deselect first */
    if (G.danger) {
      var dz = FE.dangerZone(G.state);
      Object.keys(dz).forEach(function (k) { ov[k] = 'danger'; });
    }
    Object.keys(G.stand).forEach(function (k) { ov[k] = 'move'; });
    var ranges = FE.attackRanges(u);
    if (ranges.length) {
      Object.keys(G.stand).forEach(function (k) {
        var p = k.split(','), x = +p[0], y = +p[1];
        var tiles = FE.rangeTiles(G.state, x, y, ranges);
        Object.keys(tiles).forEach(function (t) { if (!ov[t] || ov[t] === 'danger') ov[t] = 'attack'; });
      });
    }
    var sranges = FE.staffRanges(u);
    if (sranges.length) {
      Object.keys(G.stand).forEach(function (k) {
        var p = k.split(','), x = +p[0], y = +p[1];
        var tiles = FE.rangeTiles(G.state, x, y, sranges);
        Object.keys(tiles).forEach(function (t) { if (!ov[t] || ov[t] === 'danger') ov[t] = 'staff'; });
      });
    }
    G.overlay = ov;
  }

  function showRangePreview(u) {
    G.selected = u.uid;
    G.selectedUnit = null;
    G.mode = 'idle';
    var t = FE.threatTiles(G.state, u, true);
    var ov = {};
    Object.keys(t).forEach(function (k) { ov[k] = 'danger'; });
    G.overlay = ov;
    G.path = null;
  }

  function clearSelection() {
    G.selected = null;
    G.selectedUnit = null;
    G.mode = 'idle';
    G.overlay = G.danger ? dangerOverlay() : null;
    G.path = null;
    closeActionMenu();
  }

  function dangerOverlay() {
    var d = FE.dangerZone(G.state);
    var ov = {};
    Object.keys(d).forEach(function (k) { ov[k] = 'danger'; });
    return ov;
  }

  function commitMove(u, x, y) {
    FE.Undo.push(G.state, 'move ' + u.name);
    var path = FE.pathTo(G.state, u, G.reach, x, y) || [{ x: x, y: y }];
    G.busy = true;
    G.overlay = null;
    G.path = null;
    animatePath(u, path, function () {
      u.x = x; u.y = y;
      u.moved = true;
      FE.R.moveAnim = null;
      FE.recomputeSupports(G.state);
      FE.updateFog(G.state);
      G.busy = false;
      G.cursor = { x: x, y: y };
      openActionMenu(u);
      updateHud();
      updateTileInfo();
    });
  }

  function animatePath(u, path, done) {
    var i = 0;
    FE.R.moveAnim = { unit: u.uid, x: u.x, y: u.y };
    function stepOne() {
      if (i >= path.length) { done(); return; }
      FE.R.moveAnim.x = path[i].x;
      FE.R.moveAnim.y = path[i].y;
      FE.ensureVisible(G.state, path[i].x, path[i].y);
      if (i > 0) FE.Sfx.move();
      i++;
      setTimeout(stepOne, 70);
    }
    stepOne();
  }

  /* ---------------- action menu ---------------- */

  function openActionMenu(u) {
    var s = G.state;
    G.mode = 'menu';
    var menu = $('actionmenu');
    clear(menu);
    menu.classList.add('open');

    var acts = [];

    /* attack */
    var atkTargets = findAttackTargets(u);
    if (atkTargets.length) acts.push(['Attack', function () { beginAttack(u, atkTargets); }]);

    /* staff */
    var staff = FE.equippedStaff(u);
    if (staff) {
      var healTargets = findStaffTargets(u);
      if (healTargets.length) acts.push(['Staff', function () { beginStaff(u, healTargets); }]);
    }

    /* talk */
    var talkTargets = findTalkTargets(u);
    if (talkTargets.length) acts.push(['Talk', function () { doTalk(u, talkTargets[0]); }]);

    /* village */
    var v = FE.villageAt(s, u.x, u.y);
    if (v && !v.done) acts.push(['Visit', function () { doVisit(u, v); }]);

    /* chest */
    var c = adjacentChest(s, u);
    if (c) acts.push(['Chest', function () { doChest(u, c); }]);

    /* door */
    var d = adjacentDoor(s, u);
    if (d) acts.push(['Door', function () { doDoor(u, d); }]);

    /* arena — a building on the map, entered by standing on it */
    var here = FE.tileAt(s, u.x, u.y);
    if (here && FE.TERRAIN[here].arena) {
      var left = FE.arenaRoundsLeft(G.state, u);
      if (left > 0 && FE.equipped(u)) {
        acts.push(['Arena (' + left + ')', function () { doArena(u); }]);
      }
    }

    /* seize */
    if (s.objective === 'seize' && u.lord) {
      var t = FE.tileAt(s, u.x, u.y);
      if (t && FE.TERRAIN[t].seize) acts.push(['Seize', function () { doSeize(u); }]);
    }

    /* supply — the lord carries the convoy, and anyone standing next to her
       can reach into it, the way Sacred Stones handles it */
    var quarter = supplyAccess(s, u);
    if (quarter) acts.push(['Supply', function () { beginSupply(u, quarter); }]);

    /* trade */
    var tradeTargets = adjacentAllies(s, u);
    if (tradeTargets.length) acts.push(['Trade', function () { beginTrade(u, tradeTargets); }]);

    acts.push(['Item', function () { showInventory(u, true); }]);
    acts.push(['Wait', function () { finishUnit(u); }]);

    acts.forEach(function (a) {
      menu.appendChild(UI.button(a[0], 'act', a[1]));
    });
    var back = UI.button('Back', 'act cancel', function () {
      FE.Undo.pop(G.state);
      closeActionMenu();
      clearSelection();
      updateHud();
      updateTileInfo();
    });
    menu.appendChild(back);

    positionMenu(menu, u);
  }

  /* Place the action menu against the selected unit without clipping it on the
     panel below or burying the unit underneath it. The old version guessed the
     menu's height from the button count, so a taller menu ran off the bottom of
     the map pane and was cut off by overflow:hidden. Measure it instead, then
     try each side and keep whichever fits. */
  function positionMenu(menu, u) {
    var ts = FE.tileSize();
    var R = FE.R;
    var rect = $('map-wrap').getBoundingClientRect();
    var pad = 6;

    menu.style.left = '-9999px';
    menu.style.top = '0px';
    var mw = menu.offsetWidth || 116;
    var mh = menu.offsetHeight || 120;

    var ux = u.x * ts - R.camX;
    var uy = u.y * ts - R.camY;

    var spots = [
      { x: ux + ts + pad, y: uy - (mh - ts) / 2 },
      { x: ux - mw - pad, y: uy - (mh - ts) / 2 },
      { x: ux - (mw - ts) / 2, y: uy + ts + pad },
      { x: ux - (mw - ts) / 2, y: uy - mh - pad }
    ];

    var chosen = null;
    for (var i = 0; i < spots.length; i++) {
      var sp = spots[i];
      var x = Math.max(pad, Math.min(rect.width - mw - pad, sp.x));
      var y = Math.max(pad, Math.min(rect.height - mh - pad, sp.y));
      var covers = x < ux + ts && x + mw > ux && y < uy + ts && y + mh > uy;
      if (!covers) { chosen = { x: x, y: y }; break; }
    }
    if (!chosen) {
      chosen = {
        x: Math.max(pad, Math.min(rect.width - mw - pad, ux + ts + pad)),
        y: Math.max(pad, Math.min(rect.height - mh - pad, uy))
      };
    }

    if (mh > rect.height - pad * 2) {
      menu.style.maxHeight = (rect.height - pad * 2) + 'px';
      menu.style.overflowY = 'auto';
      chosen.y = pad;
    } else {
      menu.style.maxHeight = '';
      menu.style.overflowY = '';
    }

    menu.style.left = Math.round(chosen.x) + 'px';
    menu.style.top = Math.round(chosen.y) + 'px';
  }

  function closeActionMenu() {
    var menu = $('actionmenu');
    menu.classList.remove('open');
    clear(menu);
  }

  function finishUnit(u) {
    u.acted = true;
    u.moved = true;
    closeActionMenu();
    clearSelection();
    FE.recomputeSupports(G.state);
    FE.updateFog(G.state);
    updateHud();
    updateTileInfo();
    afterAction();
  }

  /* ---------------- targets ---------------- */

  function findAttackTargets(u) {
    var s = G.state;
    var weapons = FE.usableWeapons(u);
    var out = [];
    s.units.forEach(function (o) {
      if (!o.alive || !FE.hostile(u, o)) return;
      if (!FE.unitVisible(s, o)) return;
      var dist = FE.dist(u, o);
      var ok = weapons.some(function (it) {
        var d = FE.itemData(it);
        return dist >= d.rng[0] && dist <= d.rng[1];
      });
      if (ok) out.push(o);
    });
    return out;
  }

  /* Which allies this unit could actually do something for. A heal staff on a
     unit at full HP is a wasted use, so those are not targets and the Staff
     action does not appear at all when nobody needs it. */
  function findStaffTargets(u) {
    var s = G.state;
    var out = [];
    var staves = (u.items || []).filter(function (it) {
      var d = FE.itemData(it);
      return d && d.type === 'staff';
    });
    if (!staves.length) return out;
    if (FE.CLASSES[u.cls].weapons.indexOf('staff') === -1) return out;

    s.units.forEach(function (o) {
      if (!o.alive || o.faction !== u.faction) return;
      var dist = FE.dist(u, o);
      var usable = staves.some(function (it) {
        var d = FE.itemData(it);
        if (dist < d.rng[0] || dist > d.rng[1]) return false;
        if (d.staff === 'heal') return o.hp < o.maxhp;
        if (d.staff === 'barrier') return true;
        if (d.staff === 'restore') return !!o.status;
        return false;
      });
      if (usable) out.push(o);
    });
    return out;
  }

  /* the best staff this unit can use on that target right now */
  function bestStaffFor(u, target) {
    var dist = FE.dist(u, target);
    var best = null, bestVal = -1;
    (u.items || []).forEach(function (it) {
      var d = FE.itemData(it);
      if (!d || d.type !== 'staff') return;
      if (dist < d.rng[0] || dist > d.rng[1]) return;
      if (d.staff === 'heal') {
        if (target.hp >= target.maxhp) return;
        /* prefer the staff that heals closest to what is actually missing,
           so a Mend is not burned on a scratch when a Heal would do */
        var missing = target.maxhp - target.hp;
        var amount = Math.min(FE.healAmount(u, it), missing);
        var waste = FE.healAmount(u, it) - amount;
        var val = amount * 10 - waste;
        if (val > bestVal) { bestVal = val; best = it; }
      } else if (d.staff === 'restore') {
        if (!target.status) return;
        if (bestVal < 1) { bestVal = 1; best = it; }
      } else if (d.staff === 'barrier') {
        if (bestVal < 0) { bestVal = 0; best = it; }
      }
    });
    return best;
  }

  function findTalkTargets(u) {
    var s = G.state;
    var out = [];
    s.units.forEach(function (o) {
      if (!o.alive || !o.recruitable) return;
      if (FE.dist(u, o) !== 1) return;
      if ((o.talkWith || []).indexOf(u.id) === -1) return;
      out.push(o);
    });
    return out;
  }

  function adjacentAllies(s, u) {
    var out = [];
    s.units.forEach(function (o) {
      if (!o.alive || o === u || o.faction !== 'player') return;
      if (FE.dist(u, o) === 1) out.push(o);
    });
    return out;
  }

  /* Who is holding the convoy for this unit. The lord carries it herself;
     anyone else has to be standing next to her. Returns the unit granting the
     access, or null. */
  function supplyAccess(s, u) {
    if (!u.alive) return null;
    if (u.lord) return u;
    var found = null;
    s.units.forEach(function (o) {
      if (found || !o.alive || o.faction !== 'player' || !o.lord) return;
      if (FE.dist(u, o) === 1) found = o;
    });
    return found;
  }
  FE.supplyAccess = supplyAccess;

  function adjacentChest(s, u) {
    var found = null;
    (s.chests || []).forEach(function (c) {
      if (c.done) return;
      if (FE.dist(u, c) > 1 && !(u.x === c.x && u.y === c.y)) return;
      if (!canOpen(u, 'chest')) return;
      found = c;
    });
    return found;
  }

  function adjacentDoor(s, u) {
    var found = null;
    for (var i = 0; i < FE.DIRS.length; i++) {
      var x = u.x + FE.DIRS[i][0], y = u.y + FE.DIRS[i][1];
      var t = FE.tileAt(s, x, y);
      if (t !== 'door') continue;
      if (s.openedDoors[FE.posKey(x, y)]) continue;
      if (!canOpen(u, 'door')) continue;
      found = { x: x, y: y };
      break;
    }
    return found;
  }

  function canOpen(u, kind) {
    var cl = FE.CLASSES[u.cls];
    if (cl.lockpick) {
      if (cl.keyless) return true;
      return u.items.some(function (it) { return it.key === 'lockpick'; }) || cl.keyless;
    }
    return u.items.some(function (it) { return it.key === (kind === 'door' ? 'doorkey' : 'chestkey'); });
  }

  function consumeOpener(u, kind) {
    var cl = FE.CLASSES[u.cls];
    if (cl.keyless) return;
    var wantKey = kind === 'door' ? 'doorkey' : 'chestkey';
    var idx = -1;
    if (cl.lockpick) {
      idx = u.items.findIndex(function (it) { return it.key === 'lockpick'; });
    }
    if (idx === -1) idx = u.items.findIndex(function (it) { return it.key === wantKey; });
    if (idx === -1) return;
    var it = u.items[idx];
    if (it.uses !== null) {
      it.uses--;
      if (it.uses <= 0) u.items.splice(idx, 1);
    }
  }

  /* ---------------- attack flow ---------------- */

  function beginAttack(u, targets) {
    closeActionMenu();
    G.mode = 'target';
    var weapons = FE.usableWeapons(u);
    var wIndex = 0;

    function usableFor(target) {
      var dist = FE.dist(u, target);
      return weapons.filter(function (it) {
        var d = FE.itemData(it);
        return dist >= d.rng[0] && dist <= d.rng[1];
      });
    }

    var idx = 0;
    G.pendingTarget = {
      valid: function (t) { return targets.indexOf(t) !== -1; },
      pick: function (t) { idx = targets.indexOf(t); wIndex = 0; show(); }
    };
    function show() {
      var target = targets[idx];
      var ws = usableFor(target);
      if (wIndex >= ws.length) wIndex = 0;
      var item = ws[wIndex];
      G.cursor = { x: target.x, y: target.y };
      FE.ensureVisible(G.state, target.x, target.y);
      var ov = {};
      ov[FE.posKey(target.x, target.y)] = 'attack';
      ov[FE.posKey(u.x, u.y)] = 'move';
      G.overlay = ov;
      showForecast(u, target, item, ws, targets.length > 1, function (dir) {
        if (dir === 'target') { idx = (idx + 1) % targets.length; wIndex = 0; show(); }
        else if (dir === 'weapon') { wIndex = (wIndex + 1) % ws.length; show(); }
        else if (dir === 'confirm') { hideForecast(); executeAttack(u, target, item); }
        else { hideForecast(); cancelTargeting(); openActionMenu(u); }
      });
    }
    show();
  }

  function showForecast(u, target, item, weapons, multi, cb) {
    var fc = FE.forecast(G.state, u, target, item);
    var p = $('forecast');
    clear(p);
    p.classList.add('open');
    placePanel(u.x, Math.max(u.y, target.y));
    if (!fc) return;

    var grid = el('div', 'fc-grid');

    function col(unit, sideData, faction) {
      var c = el('div', 'fc-col ' + faction);
      c.appendChild(el('div', 'fc-name', unit.name));
      /* what they are actually holding - you should never have to guess */
      var held = faction === 'me' ? item : FE.counterWeapon(unit, fc.distance);
      var anyHeld = held || FE.equipped(unit);
      if (anyHeld) {
        var hd = FE.itemData(anyHeld);
        var wrow = el('div', 'fc-wep');
        wrow.appendChild(el('span', 'item-t ' + hd.type, FE.typeGlyph(hd.type)));
        wrow.appendChild(el('span', 'fc-wep-n', hd.name));
        if (!held) wrow.appendChild(el('span', 'fc-wep-o', 'out of reach'));
        c.appendChild(wrow);
      } else {
        c.appendChild(el('div', 'fc-wep-o', 'unarmed'));
      }
      var hpRow = el('div', 'fc-hp');
      hpRow.appendChild(UI.hpBar(unit.hp, unit.maxhp));
      hpRow.appendChild(el('span', null, unit.hp + '/' + unit.maxhp));
      c.appendChild(hpRow);
      if (sideData) {
        var hits = sideData.doubles ? 2 : 1;
        c.appendChild(UI.row('Dmg', String(sideData.dmg) + (sideData.doubles ? ' \u00d7 2' : '')));
        if (sideData.doubles) {
          var dt = el('div', 'fc-double ' + (faction === 'me' ? 'good' : 'bad'));
          dt.appendChild(el('div', 'fc-double-t', faction === 'me' ? 'You strike twice' : 'Strikes back twice'));
          dt.appendChild(el('div', 'fc-double-s', (sideData.dmg * 2) + ' damage over the exchange'));
          c.appendChild(dt);
        }
        c.appendChild(UI.row('Hit', sideData.hit + '%'));
        c.appendChild(UI.row('Crit', sideData.crit + '%'));
        /* spell the triangle out rather than showing a bare + or - */
        if (sideData.triangle !== 0) {
          var mineT = FE.itemData(sideData.item).type;
          var otherW = (faction === 'me')
            ? FE.counterWeapon(target, fc.distance)
            : item;
          var otherT = otherW ? FE.itemData(otherW).type : null;
          var verb = sideData.triangle > 0 ? ' beats ' : ' loses to ';
          var bonus = sideData.triangle > 0
            ? '+' + FE.TRIANGLE_MT + ' dmg, +' + FE.TRIANGLE_HIT + ' hit'
            : '−' + FE.TRIANGLE_MT + ' dmg, −' + FE.TRIANGLE_HIT + ' hit';
          var line = FE.typeName(mineT) + (otherT
            ? verb + FE.typeName(otherT)
            : (sideData.triangle > 0 ? ' has the advantage' : ' is at a disadvantage'));
          var tag = el('div', 'fc-tag ' + (sideData.triangle > 0 ? 'good' : 'bad'));
          tag.appendChild(el('div', null, line));
          tag.appendChild(el('div', 'fc-tag-b', bonus));
          c.appendChild(tag);
        }
        if (sideData.effective) {
          var et = el('div', 'fc-tag good');
          et.appendChild(el('div', null, 'Effective weapon'));
          et.appendChild(el('div', 'fc-tag-b', 'triple weapon might'));
          c.appendChild(et);
        }
      } else {
        c.appendChild(el('div', 'fc-nocounter', 'cannot counter'));
      }
      return c;
    }

    grid.appendChild(col(u, fc.atk, 'me'));
    var mid = el('div', 'fc-mid');
    mid.appendChild(el('div', 'fc-w', FE.itemData(item).name));
    var total = fc.atk.dmg * (fc.atk.doubles ? 2 : 1);
    mid.appendChild(el('div', 'fc-lethal', total >= target.hp ? 'LETHAL' : total + ' of ' + target.hp));
    grid.appendChild(mid);
    grid.appendChild(col(target, fc.def, 'them'));
    p.appendChild(grid);

    var bar = el('div', 'fc-bar');
    bar.appendChild(UI.button('Attack', 'primary', function () { cb('confirm'); }));
    if (weapons.length > 1) bar.appendChild(UI.button('Weapon', '', function () { cb('weapon'); }));
    if (multi) bar.appendChild(UI.button('Next target', '', function () { cb('target'); }));
    bar.appendChild(UI.button('Back', 'cancel', function () { cb('cancel'); }));
    p.appendChild(bar);
  }

  /* Put the panel wherever it is not sitting on top of the unit you are acting
     with. It is pinned to the bottom of the map pane by default, which covers
     your own healer whenever she is standing in the lower half of the map. */
  function placePanel(anchorX, anchorY) {
    var p = $('forecast');
    var ts = FE.tileSize();
    var rect = $('map-wrap').getBoundingClientRect();
    var sy = anchorY * ts - FE.R.camY;
    p.classList.toggle('at-top', sy > rect.height * 0.45);
  }

  function hideForecast() {
    var p = $('forecast');
    p.classList.remove('open');
    clear(p);
    G.pendingTarget = null;
  }

  function executeAttack(u, target, item) {
    G.busy = true;
    G.mode = 'busy';
    G.overlay = null;

    var startYou = u.hp, startFoe = target.hp;
    var distance = FE.dist(u, target);
    var terrain = FE.tileAt(G.state, target.x, target.y);
    var log = FE.resolveCombat(G.state, u, target, item);

    function settle() {
      G.busy = false;
      finishUnit(u);
    }

    if (animMode() === 'off') {
      playCombatLog(log, settle);
      return;
    }
    showBattleScene({
      you: u, foe: target, log: log,
      youHp: startYou, foeHp: startFoe,
      distance: distance, terrain: terrain
    }, function () {
      /* the scene showed the blows; run the log for deaths, drops and levels */
      playCombatLog(log, settle, { silent: true });
    });
  }

  /* the full-screen battle scene for an attack on the map */
  function showBattleScene(o, done) {
    var m = UI.modal(null, true);
    m._box.classList.add('duel-box');
    m._box.classList.add('battle-scene');
    var b = m._body;
    var cv = el('canvas', 'duel-canvas');
    cv.width = FE.DUEL_W * 2;
    cv.height = FE.DUEL_H * 2;
    b.appendChild(cv);
    b.appendChild(el('div', 'duel-hint', 'tap to skip'));

    /* tapping anywhere cuts to the result */
    m.addEventListener('click', function () { if (FE.duelSkip) FE.duelSkip(); });
    openModal(m);

    FE.playDuel(cv, {
      you: { cls: o.you.cls, faction: 'player', name: o.you.name, hp: o.youHp, maxhp: o.you.maxhp },
      foe: {
        cls: o.foe.cls,
        faction: o.foe.boss ? 'boss' : (o.foe.recruitable ? 'npc' : 'enemy'),
        name: o.foe.name, hp: o.foeHp, maxhp: o.foe.maxhp
      },
      log: o.log,
      uidYou: o.you.uid,
      uidFoe: o.foe.uid,
      distance: o.distance,
      scene: FE.sceneForTerrain(o.terrain),
      speed: animSpeed(),
      onDone: function () { closeModal(m); done(); }
    });
  }

  function playCombatLog(log, done, opts) {
    var silent = !!(opts && opts.silent);
    var i = 0;
    function next() {
      if (i >= log.length) {
        showQueuedLevelUps(log, done);
        return;
      }
      var ev = log[i++];
      /* the battle scene already showed the blows; skip straight past them */
      if (silent && ev.type === 'strike') { next(); return; }
      var u = unitByUid(ev.unit !== undefined ? ev.unit : ev.attacker);
      if (ev.type === 'strike') {
        var att = unitByUid(ev.attacker), def = unitByUid(ev.defender);
        if (ev.miss) {
          FE.Sfx.miss();
          if (def) FE.addPopup(def.x, def.y, 'MISS', '#dddddd');
        } else {
          if (ev.crit) { FE.Sfx.crit(); FE.R.shake = 7; }
          else FE.Sfx.hit();
          if (def) FE.addPopup(def.x, def.y, String(ev.damage), ev.crit ? '#ffd24d' : '#ffffff');
          if (ev.drain && att) FE.addPopup(att.x, att.y, '+' + ev.drain, '#9de89d');
        }
        setTimeout(next, 420);
        return;
      }
      if (ev.type === 'death') {
        FE.Sfx.death();
        var d = unitByUid(ev.unit);
        UI.toast((ev.faction === 'player' ? ev.name + ' is out for this chapter.' : ev.name + ' falls.'), ev.faction === 'player' ? 'bad' : '');
        setTimeout(next, 340);
        return;
      }
      if (ev.type === 'heal') {
        FE.Sfx.heal();
        var t = unitByUid(ev.target);
        if (t) FE.addPopup(t.x, t.y, '+' + ev.amount, '#8ef0a0');
        setTimeout(next, 380);
        return;
      }
      if (ev.type === 'break') {
        UI.toast(FE.WEAPONS[ev.weapon].name + ' broke.');
        setTimeout(next, 200);
        return;
      }
      if (ev.type === 'drop') {
        var name = (FE.WEAPONS[ev.item] || FE.EXTRA_ITEMS[ev.item]).name;
        FE.addPopup(ev.x, ev.y, name, '#ffd24d');
        UI.toast(ev.toConvoy ? name + ' dropped — sent to the convoy' : name + ' dropped!', 'good');
        FE.Sfx.levelup();
        setTimeout(next, 420);
        return;
      }
      if (ev.type === 'goldfound') {
        FE.addPopup(ev.x, ev.y, ev.amount + 'g', '#ffd24d');
        UI.toast('Found ' + ev.amount + ' gold', 'good');
        FE.Sfx.select();
        setTimeout(next, 380);
        return;
      }
