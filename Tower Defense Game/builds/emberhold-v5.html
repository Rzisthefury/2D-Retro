  drawBtn(bt, tp>0? ('TALENTS  '+tp) : 'TALENTS', null, true, P.purple, tp>0 || inRect(bt,input.x,input.y));
  drawBtn(back,'BACK',null,true,'#8b8781',inRect(back,input.x,input.y));
  if(tapped(bs)){ G.state='startree'; input.tapped=false; return; }
  if(tapped(bt)){ G.state='talents'; input.tapped=false; return; }
  if(tapped(back)){ G.state='title'; screen.endless=false; input.tapped=false; }
}
function drawHeroSelect(){
  px(0,0,GW,GH,'#0e0f18');
  textMid('CHOOSE YOUR HERO', GW/2, 16, P.embers,1);
  for(let i=0;i<3;i++){
    const k=HERO_ORDER[i], d=HEROES[k];
    const r={x:26+i*146,y:34,w:132,h:186};
    const hov=inRect(r,input.x,input.y);
    px(r.x,r.y,r.w,r.h,P.ink);
    px(r.x+1,r.y+1,r.w-2,r.h-2, hov?'#22253a':'#181a26');
    px(r.x+1,r.y+1,r.w-2,2,d.col);
    ctx.save(); ctx.translate(r.x+r.w/2-15,r.y+14); ctx.scale(3,3); blit(SP[d.sp],0,0,false); ctx.restore();
    textMid(d.name, r.x+r.w/2, r.y+56, d.col,1);
    textMid(d.title, r.x+r.w/2, r.y+66, '#6b7088',1);
    const tpFree = talentPointsFor(k)-talentSpent(k);
    if(tpFree>0){
      px(r.x+r.w-30, r.y+6, 26, 11, P.ink);
      textMid(tpFree+' pt', r.x+r.w-17, r.y+8, P.purple,1);
    }
    const xp=save.data.heroXP[k]||0;
    let lv=1; while(lv<10 && xp>=Math.round(40*Math.pow(lv,1.55))) lv++;
    textMid('LEVEL '+lv, r.x+r.w/2, r.y+80, P.gold,1);
    textAt('HP  '+(d.hp+d.hpPerLvl*(lv-1)), r.x+10, r.y+96, P.bone,1);
    textAt('DMG '+Math.round(d.dmgMin+d.dmgPerLvl*(lv-1))+'-'+Math.round(d.dmgMax+d.dmgPerLvl*(lv-1)), r.x+10, r.y+106, P.bone,1);
    textAt('RNG '+(d.range>20?'ranged':'melee'), r.x+10, r.y+116, P.bone,1);
    // wrap blurb
    const words=d.blurb.split(' '); let line='',ly=r.y+130;
    for(const w of words){ const test=line?line+' '+w:w; if(textW(test,1)>r.w-18){ textAt(line,r.x+10,ly,'#8b8ba0',1); ly+=9; line=w; } else line=test; }
    if(line) textAt(line,r.x+10,ly,'#8b8ba0',1);
    let ay=r.y+150;
    for(let a2=0;a2<3;a2++){
      const ab=d.abilities[a2];
      px(r.x+10,ay+1,3,3, ab.unique? d.col : '#4a4f66');
      textAt(ab.name, r.x+16, ay, ab.unique? d.col : '#7a809a', 1);
      ay+=10;
    }
    if(tapped(r)){
      screen.hero=k; G.state='diffselect';
      input.tapped=false; return;
    }
  }
  const back={x:GW/2-40,y:228,w:80,h:20};
  drawBtn(back,'BACK',null,true,'#8b8781',inRect(back,input.x,input.y));
  if(tapped(back)){ G.state='levelselect'; input.tapped=false; }
}
function drawDiffSelect(){
  px(0,0,GW,GH,'#0e0f18');
  textMid('CHOOSE YOUR DIFFICULTY', GW/2, 20, P.embers,1);
  const mm=MAPS[screen.mapIdx||0];
  textMid(mm.name+'  ·  '+mm.waves.length+' waves', GW/2, 34, '#6b7088',1);
  for(let i=0;i<3;i++){
    const d=DIFFS[DIFF_ORDER[i]];
    const r={x:26+i*146,y:54,w:132,h:156};
    const hov=inRect(r,input.x,input.y);
    px(r.x,r.y,r.w,r.h,P.ink);
    px(r.x+1,r.y+1,r.w-2,r.h-2, hov?'#22253a':'#181a26');
    px(r.x+1,r.y+1,r.w-2,2,d.col);
    textMid(d.name, r.x+r.w/2, r.y+12, d.col,1);
    const best=(save.data.stars && save.data.stars[mm.id+'_'+d.key])||0;
    textAt('Lives', r.x+12, r.y+34, '#7a809a',1);
    textAt(d.lives+'', r.x+r.w-32, r.y+34, P.white,1);
    textAt('Enemy health', r.x+12, r.y+46, '#7a809a',1);
    textAt(Math.round(d.hp*100)+'%', r.x+r.w-38, r.y+46, P.white,1);
    textAt('Gold', r.x+12, r.y+58, '#7a809a',1);
    textAt(Math.round(d.gold*100)+'%', r.x+r.w-38, r.y+58, P.white,1);
    if(d.spd>1){ textAt('Enemy speed', r.x+12, r.y+70, '#7a809a',1); textAt('+'+Math.round((d.spd-1)*100)+'%', r.x+r.w-38, r.y+70, P.red,1); }
    const words=d.blurb.split(' '); let line='',ly=r.y+88;
    for(const w of words){ const t2=line?line+' '+w:w;
      if(textW(t2,1)>r.w-20){ textAt(line,r.x+12,ly,'#8b8ba0',1); ly+=10; line=w; } else line=t2; }
    if(line) textAt(line,r.x+12,ly,'#8b8ba0',1);
    if(best>0) textMid('best '+best+'★', r.x+r.w/2, r.y+r.h-14, P.gold,1);
    if(tapped(r)){
      G.diff=d;
      initLevel(screen.mapIdx||0, screen.hero||'brannoc', !!screen.endless);
      screen.endless=false; input.tapped=false; return;
    }
  }
  const back={x:GW/2-40,y:224,w:80,h:20};
  drawBtn(back,'BACK',null,true,'#8b8781',inRect(back,input.x,input.y));
  if(tapped(back)){ G.state='heroselect'; input.tapped=false; }
}

function drawResult(win){
  drawWorld(); drawHUD();
  ctx.globalAlpha=0.72; px(0,0,GW,GH,'#08090f'); ctx.globalAlpha=1;
  const t = win? (G.endless?'SURVIVED':'ROAD HELD') : 'THE ROAD IS LOST';
  bigText(t,GW/2,42,win?P.embers:P.red,22);
  if(win && !G.endless){
    for(let i=0;i<3;i++){
      const filled=i<G.stars;
      const x=GW/2-34+i*34, y=86;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle=filled?P.gold:'#2e3142';
      ctx.beginPath();
      for(let k2=0;k2<10;k2++){ const a=-Math.PI/2+k2*Math.PI/5, rr=k2%2?5:12;
        ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    textMid(G.leaks===0?'Not one of them got through.':(G.leaks+' leaked past'), GW/2, 118, P.bone,1);
  }
  if(G.endless) textMid('Waves survived: '+Math.max(0,G.endlessWave-1), GW/2, 100, P.bone,1);
  textMid('Hero: '+G.hero.def.name+'  ·  Level '+G.hero.level, GW/2, 142, G.hero.def.col,1);
  textMid(G.diff.name, GW/2, 154, G.diff.col,1);
  const hasNext = win && !G.endless && G.mapIdx+1 < MAPS.length;
  const r1={x:GW/2-150,y:170,w:94,h:24}, r2={x:GW/2-47,y:170,w:94,h:24}, rn={x:GW/2+56,y:170,w:94,h:24};
  drawBtn(r1,'RETRY',null,true,P.gold,inRect(r1,input.x,input.y));
  drawBtn(r2,'MAPS',null,true,'#8b8781',inRect(r2,input.x,input.y));
  if(hasNext) drawBtn(rn,'NEXT MAP',null,true,'#7fb0d8',inRect(rn,input.x,input.y));
  if(tapped(r1)){ initLevel(G.mapIdx, G.heroKey, G.endless); input.tapped=false; }
  if(tapped(r2)){ G.state='levelselect'; screen.endless=false; input.tapped=false; }
  if(hasNext && tapped(rn)){ screen.mapIdx=G.mapIdx+1; initLevel(G.mapIdx+1, G.heroKey, false); input.tapped=false; }
  const r3={x:GW/2-46,y:200,w:92,h:18};
  drawBtn(r3,'DIFFICULTY',null,true,P.purple,inRect(r3,input.x,input.y));
  if(tapped(r3)){ G.state='diffselect'; input.tapped=false; }
}
function drawPausedMenu(){
  drawWorld(); drawHUD();
  ctx.globalAlpha=0.7; px(0,0,GW,GH,'#08090f'); ctx.globalAlpha=1;
  textMid('PAUSED', GW/2, 60, P.embers,2);
  const r1={x:GW/2-60,y:110,w:120,h:24}, r2={x:GW/2-60,y:142,w:120,h:24}, r3={x:GW/2-60,y:174,w:120,h:24};
  drawBtn(r1,'RESUME',null,true,P.gold,inRect(r1,input.x,input.y));
  drawBtn(r2,'RESTART',null,true,P.blue,inRect(r2,input.x,input.y));
  drawBtn(r3,'QUIT TO TITLE',null,true,'#8b8781',inRect(r3,input.x,input.y));
  if(tapped(r1)){ G.state='play'; G.paused=false; input.tapped=false; }
  if(tapped(r2)){ initLevel(G.mapIdx,G.heroKey,G.endless); input.tapped=false; }
  if(tapped(r3)){ G.state='levelselect'; G.paused=false; input.tapped=false; }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const STEP=1/60;
let acc=0, last=performance.now();
function frame(now){
  const rt=Math.min(0.25,(now-last)/1000); last=now;
  ctx.setTransform(RES,0,0,RES,0,0);
  ctx.imageSmoothingEnabled=false;
  px(0,0,GW,GH,'#0e0f18');
  if(cheatOpen) handleCheatInput();
  if(G.state==='title'){ G.time+=rt; drawTitle(); }
  else if(G.state==='levelselect'){ G.time+=rt; drawLevelSelect(); }
  else if(G.state==='startree'){ G.time+=rt; drawStarTree(); }
  else if(G.state==='talents'){ G.time+=rt; drawTalents(); }
  else if(G.state==='heroselect'){ G.time+=rt; drawHeroSelect(); }
  else if(G.state==='diffselect'){ G.time+=rt; drawDiffSelect(); }
  else if(G.state==='play'){
    if(!G.paused){
      acc += rt*G.speed;
      let steps=0;
      while(acc>=STEP && steps<8){ updateGame(STEP); acc-=STEP; steps++; }
      if(acc>STEP*8) acc=0;
    } else { G.time+=rt; }
    handlePlayInput();
    drawWorld(); drawBuildMenu(); drawTowerPanel(); drawHUD();
    if(G.paused){ ctx.globalAlpha=0.45; px(0,0,GW,PLAY_H,'#08090f'); ctx.globalAlpha=1; textMid('PAUSED',GW/2,PLAY_H/2-6,P.embers,2); }
  }
  else if(G.state==='paused_menu'){ G.time+=rt; drawPausedMenu(); }
  else if(G.state==='win'){ G.time+=rt; drawResult(true); }
  else if(G.state==='lose'){ G.time+=rt; drawResult(false); }
  if(cheatOpen) drawCheat();
  if(window.innerHeight > window.innerWidth*1.08){
    ctx.globalAlpha=0.82; px(0,GH/2-22,GW,44,'#08090f'); ctx.globalAlpha=1;
    textMid('ROTATE YOUR DEVICE', GW/2, GH/2-10, P.embers,2);
    textMid('EMBERHOLD plays in landscape', GW/2, GH/2+8, P.bone,1);
  }
  input.tapped=false;
  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
   ============================================================ */
buildSprites();
save.load();
computeMods();
SND.init();
if(save.data.settings && save.data.settings.sound===false) SND.enabled=false;
resize();
G.state='title';
requestAnimationFrame(frame);
</script>
