   EMBERHOLD  -  tower defense

const GW = 480, GH = 270;      // logical simulation units
const RES = 2;                 // device pixels per logical unit (art detail)
const SCALE_MAX = 4;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

let VIEW = { scale:2, w:GW, h:GH, ox:0, oy:0 };

function resize(){
  const availW = window.innerWidth, availH = window.innerHeight;
  let s = Math.min(availW/GW, availH/GH);
  s = Math.max(1, Math.min(SCALE_MAX, s));
  // allow fractional scaling on small phones so we fill the screen
  const cw = Math.floor(GW*s), ch = Math.floor(GH*s);
  canvas.width = GW*RES; canvas.height = GH*RES;
  canvas.style.width = cw+'px'; canvas.style.height = ch+'px';
  const r = canvas.getBoundingClientRect();
  VIEW = { scale: cw/GW, w:cw, h:ch, ox:r.left, oy:r.top };
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,100));

/* ---------- math utils ---------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
let _seed = 1337;
function rnd(){ _seed = (_seed*1664525+1013904223)|0; return ((_seed>>>8)&0xffffff)/0xffffff; }
function rndRange(a,b){ return a + rnd()*(b-a); }
function rndInt(a,b){ return Math.floor(a + rnd()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }

/* ---------- pixel draw helpers ---------- */
function px(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x|0,y|0,w|0,h|0); }
function pxc(x,y,r,col){ ctx.fillStyle=col; ctx.beginPath(); ctx.arc((x|0)+0.5,(y|0)+0.5,r,0,6.283); ctx.fill(); }
const FONT='ui-monospace, "SF Mono", Menlo, Consolas, monospace';
function _devText(str,x,y,col,sizeLogical,align){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=col||P.white;
  ctx.font=Math.round(sizeLogical*RES)+'px '+FONT;
  ctx.textBaseline='top'; ctx.textAlign=align||'left';
  ctx.fillText(str, Math.round(x*RES), Math.round(y*RES));
  ctx.restore();
}
function textAt(str,x,y,col,scale){ _devText(str,x,y,col,7*(scale||1),'left'); }
function textMid(str,cx,y,col,scale){ _devText(str,cx,y,col,7*(scale||1),'center'); }
function textW(str,scale){
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.font=Math.round(7*(scale||1)*RES)+'px '+FONT;
  const w=ctx.measureText(str).width; ctx.restore(); return w/RES;
}
function bigText(str,cx,y,col,sizeLogical){ _devText(str,cx,y,col,sizeLogical,'center'); }
/* sprite from string rows + palette map */
function sprite(rows, map){
  const h=rows.length;
  let w=0; for(const r of rows) if(r.length>w) w=r.length;
  rows=rows.map(r=> r.length<w ? r+' '.repeat(w-r.length) : r);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const c2=cv.getContext('2d');
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch=rows[y][x]; if(ch===' '||ch==='.') continue;
    const col=map[ch]; if(!col) continue;
    c2.fillStyle=col; c2.fillRect(x,y,1,1);
  }
  return cv;
}
function blit(sp,x,y,flip){
  if(!sp) return;
  const w=sp.width/RES, h=sp.height/RES;
  const px2=Math.round(x*RES)/RES, py2=Math.round(y*RES)/RES;
  if(flip){ ctx.save(); ctx.translate(px2+w,py2); ctx.scale(-1,1); ctx.drawImage(sp,0,0,w,h); ctx.restore(); }
  else ctx.drawImage(sp,px2,py2,w,h);
}
function blitTint(sp,x,y,flip,tint,alpha){
  if(!sp) return;
  ctx.save(); ctx.globalAlpha = alpha===undefined?1:alpha;
  blit(sp,x,y,flip);
  if(tint){ ctx.globalCompositeOperation='source-atop'; }
  ctx.restore();
}
function roundRect(x,y,w,h,r,col){
  ctx.fillStyle=col; ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h);
  ctx.fill();
}

/* ============================================================
   PATH  (multi-lane capable from day one)
   ============================================================ */
class Path {
  constructor(points){
    this.pts = points;
    this.seg = []; this.len = 0;
    for(let i=0;i<points.length-1;i++){
      const a=points[i], b=points[i+1];
      const d=dist(a.x,a.y,b.x,b.y);
      this.seg.push({a,b,d,start:this.len});
      this.len += d;
    }
  }
  at(d){
    d = clamp(d,0,this.len);
    for(let i=0;i<this.seg.length;i++){
      const s=this.seg[i];
      if(d<=s.start+s.d || i===this.seg.length-1){
        const t=s.d===0?0:(d-s.start)/s.d;
        return { x: lerp(s.a.x,s.b.x,t), y: lerp(s.a.y,s.b.y,t),
                 ang: Math.atan2(s.b.y-s.a.y, s.b.x-s.a.x) };
      }
    }
    const last=this.pts[this.pts.length-1];
    return {x:last.x,y:last.y,ang:0};
  }
}

/* ============================================================
   INPUT  (unified mouse + touch)
   ============================================================ */
const input = { x:0, y:0, down:false, tapped:false, tapX:0, tapY:0, downTime:0 };
function toGame(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x:(clientX-r.left)/ (r.width/GW), y:(clientY-r.top)/(r.height/GH) };
}
function onDown(cx,cy){ const p=toGame(cx,cy); input.x=p.x; input.y=p.y; input.down=true; input.downTime=performance.now(); }
function onMove(cx,cy){ const p=toGame(cx,cy); input.x=p.x; input.y=p.y; }
function onUp(cx,cy){
  const p=toGame(cx,cy); input.x=p.x; input.y=p.y;
  if(input.down){ input.tapped=true; input.tapX=p.x; input.tapY=p.y; }
  input.down=false;
}
canvas.addEventListener('mousedown',e=>{ onDown(e.clientX,e.clientY); });
window.addEventListener('mousemove',e=>{ onMove(e.clientX,e.clientY); });
window.addEventListener('mouseup',e=>{ onUp(e.clientX,e.clientY); });
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onDown(t.clientX,t.clientY); },{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onMove(t.clientX,t.clientY); },{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); const t=e.changedTouches[0]; onUp(t.clientX,t.clientY); },{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function consumeTap(){ const t=input.tapped; input.tapped=false; return t; }
function tapIn(x,y,w,h){
  return input.tapped && input.tapX>=x && input.tapX<=x+w && input.tapY>=y && input.tapY<=y+h;
}

/* ============================================================
   ENEMY
   ============================================================ */
class Enemy {
  constructor(typeKey, startDist){
    const d = ENEMIES[typeKey];
    this.key=typeKey; this.def=d;
    const dm=(G.diff||DIFFS.normal);
    this.maxHp=Math.round(d.hp * (this.key==='camp'?1:dm.hp)); this.hp=this.maxHp;
    this.armor=d.armor; this.resist=d.resist;
    this.flying=!!d.flying; this.boss=!!d.boss;
    this.shieldHits=d.shieldHits||0;
    this.dist=startDist||0;
    this.slowT=0; this.slowAmt=0; this.freezeT=0; this.stunT=0;
    this.acidT=0; this.acidDps=0;
    this.blocker=null; this.atkT=0;
    this.dead=false; this.leaked=false;
    this.healT=0;
    this.pullX=null; this.pullY=null; this.pullT=0;
    this.hitFlash=0;
    this.static=false;
    this.bob=rnd()*6.283;
    const p=G.path.at(this.dist);
    this.x=p.x; this.y=p.y; this.faceLeft=false;
  }
  get speedNow(){
    if(this.freezeT>0||this.stunT>0) return 0;
    let s=this.def.speed*(G.diff?G.diff.spd:1);
    if(this.slowT>0) s*=(1-this.slowAmt);
    return s;
  }
  update(dt){
    if(this.hitFlash>0) this.hitFlash-=dt;
    if(this.slowT>0) this.slowT-=dt;
    if(this.freezeT>0) this.freezeT-=dt;
    if(this.stunT>0) this.stunT-=dt;
    if(this.acidT>0){ this.acidT-=dt; this.damage(this.acidDps*dt,'true',null,true); }
    // zone effects (acid pools, snare traps)
    for(const z of G.zones){
      if(this.flying && !z.air) continue;
      if(dist2(this.x,this.y,z.x,z.y) < z.r*z.r){
        if(z.dps) this.damage(z.dps*dt,'true',null,true);
        if(z.slow){ this.slowT=Math.max(this.slowT,0.25); this.slowAmt=Math.max(this.slowAmt,z.slow); }
      }
    }
    if(this.dead) return;
    // mender healing aura
    if(this.def.heal){
      this.healT-=dt;
      if(this.healT<=0){
        this.healT=1;
        for(const e of G.enemies){
          if(e===this||e.dead) continue;
          if(dist2(e.x,e.y,this.x,this.y)<this.def.healRange*this.def.healRange){
            e.hp=Math.min(e.maxHp, e.hp+this.def.heal);
            burst(e.x,e.y-4,'#7ad17a',2,14);
          }
        }
      }
    }
    if(this.static) return;
    // taunt pull
    if(this.pullT>0){
      this.pullT-=dt;
      const dx=this.pullX-this.x, dy=this.pullY-this.y, d=Math.hypot(dx,dy);
      if(d>2){ const s=70*dt; this.x+=dx/d*s; this.y+=dy/d*s; }
      return;
    }
    // blocking / combat
    if(this.blocker && (this.blocker.dead || this.blocker.removed)) this.blocker=null;
    if(!this.flying){
      const rng=this.def.atkRange||11;
      if(!this.blocker){
        let best=null,bd=rng*rng;
        for(const s of G.soldiers){ if(s.dead) continue; const d2=dist2(this.x,this.y,s.x,s.y); if(d2<bd && s.attackers<3){ bd=d2; best=s; } }
        const h=G.hero;
        if(h && !h.dead){ const d2=dist2(this.x,this.y,h.x,h.y); if(d2<bd){ bd=d2; best=h; } }
        if(best){ this.blocker=best; best.attackers++; }
      }
      if(this.blocker){
        const d=dist(this.x,this.y,this.blocker.x,this.blocker.y);
        if(d>rng+6){ this.blocker.attackers--; this.blocker=null; }
        else {
          this.atkT-=dt;
          if(this.atkT<=0 && this.speedNow>0){
            this.atkT=this.def.atkRate||1.1;
            const b=this.blocker;
            if(this.def.atkRange>20) G.shots.push(new Shot(this.x,this.y-4,b,0,'phys',{visualOnly:true,col:'#cfc6a8'}));
            b.takeDamage(this.def.atkDmg||10);
          }
          // the blocker may have died to that hit and cleared itself
          if(!this.blocker) return;
          this.faceLeft = this.blocker.x < this.x;
          return;   // held in place
        }
      }
    }
    // advance
    const sp=this.speedNow;
    if(sp>0){
      this.dist += sp*dt;
      const path=G.path;
      if(this.dist>=path.len){ this.leaked=true; this.dead=true; return; }
      const p=path.at(this.dist);
      this.faceLeft = p.x<this.x;
      this.x=p.x; this.y=p.y;
    }
  }
  damage(amount, type, src, silent){
    if(this.dead) return 0;
    if(this.shieldHits>0 && !silent){ this.shieldHits--; burst(this.x,this.y-4,'#e8c15c',4,24); floater(this.x,this.y-10,'BLOCK','#e8c15c'); return 0; }
    let dmg=amount;
    if(type==='phys') dmg=Math.max(1, amount-this.armor);
    else if(type==='magic') dmg=amount*(1-this.resist);
    this.hp-=dmg;
    if(!silent) this.hitFlash=0.08;
    if(this.hp<=0){ this.kill(); }
    return dmg;
  }
  kill(){
    if(this.dead) return;
    this.dead=true;
    if(this.blocker) this.blocker.attackers--;
    G.gold += this.def.bounty;
    floater(this.x,this.y-8,'+'+this.def.bounty,P.gold);
    burst(this.x,this.y-4,this.static?'#8a6b45':P.red, this.boss?40:8, this.boss?70:36);
    if(G.hero) G.hero.gainXP(this.def.xp);
    if(this.def.splitInto){
      for(let i=0;i<this.def.splitCount;i++){
        const e=new Enemy(this.def.splitInto, this.dist - i*4);
        e.x=this.x+rndRange(-5,5); e.y=this.y+rndRange(-4,4);
        G.enemies.push(e);
      }
    }
    if(this.static){ flash('Bandit camp destroyed \u2014 no more raids'); G.camp=null; }
  }
  draw(){
    const sp=SP[this.def.sp];
    const w=this.def.w, h=this.def.h;
    const hover = this.flying ? (-11 + Math.sin(G.time*4+this.bob)*1.6) : 2;
    const x=this.x-w/2, y=this.y-h+hover;
    // shadow
    ctx.globalAlpha=0.25; pxc(this.x, this.y+1, Math.max(2,w/3), '#000'); ctx.globalAlpha=1;
    if(this.freezeT>0){ ctx.globalAlpha=0.9; }
    blit(sp,x,y,this.faceLeft);
    ctx.globalAlpha=1;
    if(this.hitFlash>0){ ctx.save(); ctx.globalAlpha=0.55; ctx.globalCompositeOperation='lighter'; blit(sp,x,y,this.faceLeft); ctx.restore(); }
    if(this.freezeT>0){ ctx.save(); ctx.globalAlpha=0.45; px(x-1,y-1,w+2,h+2,P.ice); ctx.restore(); }
    if(this.slowT>0 && this.freezeT<=0){ ctx.save(); ctx.globalAlpha=0.20; px(x-1,y-1,w+2,h+2,'#6ab4d8'); ctx.restore(); }
    if(this.acidT>0){ ctx.save(); ctx.globalAlpha=0.22; px(x-1,y-1,w+2,h+2,'#7ad13a'); ctx.restore(); }
    // hp bar
    if(this.hp<this.maxHp){
      const bw=Math.max(8,w), bx=this.x-bw/2, by=y-4;
      px(bx-1,by-1,bw+2,4,P.ink);
      px(bx,by,bw,2,P.hpbg);
      px(bx,by,Math.max(0,bw*(this.hp/this.maxHp)),2, this.boss?P.red:P.hp);
    }
    if(this.shieldHits>0){
      for(let i=0;i<this.shieldHits;i++) px(this.x-w/2+i*2, y-7, 1,2, P.gold);
    }
  }
}

/* ============================================================
   SOLDIER
   ============================================================ */
class Soldier {
  constructor(tower, idx){
    this.tower=tower; this.idx=idx;
    const st=tower.stats;
    this.maxHp=st.shp; this.hp=st.shp;
    this.dmgMin=st.sdmgMin; this.dmgMax=st.sdmgMax; this.armor=st.sarmor;
    this.range=st.srange||10;
    this.ranged=!!st.srange;
    this.dead=false; this.removed=false; this.respawnT=0;
    this.attackers=0; this.atkT=0; this.buffT=0;
    const r=tower.rally;
    this.x=r.x+((idx-1)*8); this.y=r.y+((idx%2)*5);
    this.tx=this.x; this.ty=this.y;
    this.faceLeft=false;
    this.temp=false; this.life=0;
  }
  refresh(){
    const st=this.tower.stats;
    this.maxHp=st.shp; this.dmgMin=st.sdmgMin; this.dmgMax=st.sdmgMax;
    this.armor=st.sarmor; this.range=st.srange||10; this.ranged=!!st.srange;
    this.hp=Math.min(this.hp,this.maxHp);
  }
  takeDamage(a){
    if(this.dead) return;
    this.hp -= Math.max(1, a-this.armor);
    if(this.hp<=0){ this.die(); }
  }
  die(){
    this.dead=true; this.attackers=0;
    burst(this.x,this.y-4,'#c8443c',6,26);
    for(const e of G.enemies) if(e.blocker===this){ e.blocker=null; }
    if(this.temp){ this.removed=true; return; }
    this.respawnT = this.tower.stats.respawn;
  }
  update(dt){
    if(this.buffT>0) this.buffT-=dt;
    if(this.temp){ this.life-=dt; if(this.life<=0 && !this.dead){ this.removed=true; this.dead=true; for(const e of G.enemies) if(e.blocker===this) e.blocker=null; } }
    if(this.dead){
      if(this.temp) return;
      this.respawnT-=dt;
      if(this.respawnT<=0){
        this.dead=false; this.hp=this.maxHp; this.attackers=0;
        const r=this.tower.rally;
        this.x=r.x+((this.idx-1)*8); this.y=r.y+((this.idx%2)*5);
      }
      return;
    }
    // target
    if(this.target && (this.target.dead)) this.target=null;
    if(!this.target){
      let best=null,bd=(this.range+14)*(this.range+14);
      for(const e of G.enemies){
        if(e.dead||e.flying||e.static) continue;
        const d2=dist2(this.x,this.y,e.x,e.y);
        if(d2<bd){ bd=d2; best=e; }
      }
      this.target=best;
    }
    const r=this.tower?this.tower.rally:{x:this.x,y:this.y};
    let gx=r.x+((this.idx-1)*8), gy=r.y+((this.idx%2)*5);
    if(this.target){
      const d=dist(this.x,this.y,this.target.x,this.target.y);
      if(d<=this.range){
        this.atkT-=dt;
        this.faceLeft=this.target.x<this.x;
        if(this.atkT<=0){
          this.atkT = this.ranged?1.0:1.15;
          let dmg=rndRange(this.dmgMin,this.dmgMax);
          if(this.buffT>0) dmg*=1.5;
          if(this.ranged) G.shots.push(new Shot(this.x,this.y-5,this.target,dmg,'phys',{col:'#cfc6a8',speed:200}));
          else this.target.damage(dmg,'phys');
        }
        return;
      } else if(d < this.range+16){
        gx=this.target.x; gy=this.target.y;
      }
    }
    const dx=gx-this.x, dy=gy-this.y, d=Math.hypot(dx,dy);
    if(d>1.5){ const s=40*dt; this.x+=dx/d*Math.min(s,d); this.y+=dy/d*Math.min(s,d); this.faceLeft=dx<0; }
  }
  draw(){
    if(this.dead) return;
    const sp = this.ranged?SP.ranger:SP.soldier;
    ctx.globalAlpha=0.25; pxc(this.x,this.y+1,2.5,'#000'); ctx.globalAlpha=1;
    blit(sp, this.x-4, this.y-10, this.faceLeft);
    if(this.buffT>0){ ctx.save(); ctx.globalAlpha=0.3; px(this.x-5,this.y-11,10,12,P.gold); ctx.restore(); }
    if(this.hp<this.maxHp){
      px(this.x-5,this.y-13,10,3,P.ink);
      px(this.x-4,this.y-12,8*(this.hp/this.maxHp),1,P.hp);
    }
  }
}

/* ============================================================
   HERO
   ============================================================ */
class Hero {
  constructor(key){
    const d=HEROES[key];
    this.def=d; this.key=key;
    this.xp = save.data.heroXP[key]||0;
    this.level = this.levelFromXP(this.xp);
    this.maxHp = d.hp + d.hpPerLvl*(this.level-1);
    this.hp=this.maxHp;
    this.x=G.map.plots[0].x; this.y=G.map.plots[0].y+16;
    this.tx=this.x; this.ty=this.y;
    this.dead=false; this.respawnT=0; this.attackers=0; this.atkT=0;
    this.cds=[0,0,0]; this.shieldHp=0; this.shieldT=0; this.buffT=0;
    this.faceLeft=false; this.target=null;
  }
  levelFromXP(xp){ let l=1; while(l<10 && xp >= this.xpFor(l+1)) l++; return l; }
  xpFor(lvl){ return Math.round(40*Math.pow(lvl-1,1.55)); }
  get dmgMin(){ return this.def.dmgMin + this.def.dmgPerLvl*(this.level-1); }
  get dmgMax(){ return this.def.dmgMax + this.def.dmgPerLvl*(this.level-1); }
  gainXP(n){
    this.xp+=n;
    const nl=this.levelFromXP(this.xp);
    if(nl>this.level){
      const gain=(nl-this.level)*this.def.hpPerLvl;
      this.level=nl; this.maxHp+=gain; this.hp=Math.min(this.maxHp,this.hp+gain);
      floater(this.x,this.y-16,'LEVEL '+nl,P.gold); burst(this.x,this.y-6,P.gold,14,40);
    }
    save.data.heroXP[this.key]=this.xp;
  }
  takeDamage(a){
    if(this.dead) return;
    let dmg=a;
    if(this.shieldT>0){ const abs=Math.min(this.shieldHp,dmg); this.shieldHp-=abs; dmg-=abs; if(this.shieldHp<=0) this.shieldT=0; }
    this.hp-=dmg;
    if(this.hp<=0){
      this.dead=true; this.hp=0; this.attackers=0; this.respawnT=15;
      burst(this.x,this.y-6,P.red,18,50); flash(this.def.name+' has fallen');
      for(const e of G.enemies) if(e.blocker===this) e.blocker=null;
    }
  }
  moveTo(x,y){ this.tx=clamp(x,4,GW-4); this.ty=clamp(y,4,PLAY_H-4); }
  update(dt){
    for(let i=0;i<3;i++) if(this.cds[i]>0) this.cds[i]-=dt;
    if(this.shieldT>0) this.shieldT-=dt;
    if(this.buffT>0) this.buffT-=dt;
    if(this.dead){
      this.respawnT-=dt;
      if(this.respawnT<=0){ this.dead=false; this.hp=this.maxHp; this.x=this.tx=G.map.plots[0].x; this.y=this.ty=G.map.plots[0].y+16; burst(this.x,this.y-6,P.gold,14,40); }
      return;
    }
    // acquire target
    if(this.target && this.target.dead) this.target=null;
    if(!this.target){
      let best=null,bd=(this.def.range+10)*(this.def.range+10);
      for(const e of G.enemies){ if(e.dead) continue; if(e.flying && this.def.range<20) continue;
        const d2=dist2(this.x,this.y,e.x,e.y); if(d2<bd){bd=d2;best=e;} }
      this.target=best;
    }
    const dx=this.tx-this.x, dy=this.ty-this.y, d=Math.hypot(dx,dy);
    if(d>1.5){
      const s=this.def.speed*dt; this.x+=dx/d*Math.min(s,d); this.y+=dy/d*Math.min(s,d); this.faceLeft=dx<0;
    } else if(this.target){
      const td=dist(this.x,this.y,this.target.x,this.target.y);
      this.faceLeft=this.target.x<this.x;
      if(td<=this.def.range){
        this.atkT-=dt;
        if(this.atkT<=0){
          this.atkT=this.def.rate;
          let dmg=rndRange(this.dmgMin,this.dmgMax);
          if(this.buffT>0) dmg*=1.5;
          if(this.def.range>20) G.shots.push(new Shot(this.x,this.y-7,this.target,dmg,this.def.dmgType,{col:this.def.col,speed:190}));
          else { this.target.damage(dmg,this.def.dmgType); burst(this.target.x,this.target.y-4,this.def.col,3,20); }
        }
      }
    }
  }
  draw(){
    if(this.dead){
      textMid(Math.ceil(this.respawnT)+'s', G.map.plots[0].x, G.map.plots[0].y+8, P.bone,1);
      return;
    }
    ctx.globalAlpha=0.25; pxc(this.x,this.y+1,3,'#000'); ctx.globalAlpha=1;
    // hero footprint ring
    ctx.save();
    ctx.globalAlpha=0.55+Math.sin(G.time*3)*0.15;
    ctx.strokeStyle=this.def.col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(this.x,this.y+1,7,3.2,0,0,6.283); ctx.stroke();
    ctx.restore();
    blit(SP[this.def.sp], this.x-5, this.y-12, this.faceLeft);
    if(this.shieldT>0){ ctx.save(); ctx.globalAlpha=0.35; pxc(this.x,this.y-6,9,P.ice); ctx.restore(); }
    if(this.buffT>0){ ctx.save(); ctx.globalAlpha=0.3; px(this.x-6,this.y-13,12,14,P.gold); ctx.restore(); }
    // hp bar
    px(this.x-7,this.y-16,14,4,P.ink);
    px(this.x-6,this.y-15,12*(this.hp/this.maxHp),2,'#5ad1a0');
    // move marker
    if(dist2(this.x,this.y,this.tx,this.ty)>16){ ctx.globalAlpha=0.5; pxc(this.tx,this.ty,2,this.def.col); ctx.globalAlpha=1; }
  }
}

/* ============================================================
   SHOT (projectile)
   ============================================================ */
class Shot {
  constructor(x,y,target,dmg,type,opt){
    opt=opt||{};
    this.x=x; this.y=y; this.target=target; this.dmg=dmg; this.type=type;
    this.speed=opt.speed||150; this.col=opt.col||P.white;
    this.splash=opt.splash||0; this.slow=opt.slow||0; this.slowDur=opt.slowDur||0;
    this.freeze=opt.freeze||0; this.execute=opt.execute||0;
    this.acid=opt.acid||0; this.acidDur=opt.acidDur||0;
    this.crit=opt.crit||false; this.visualOnly=!!opt.visualOnly;
    this.arc=!!opt.arc; this.t=0; this.dead=false;
    this.sx=x; this.sy=y;
    this.total = target? dist(x,y,target.x,target.y)/this.speed : 0.2;
    this.r = opt.r || 1.4;
  }
  update(dt){
    if(!this.target || this.target.dead && !this.splash){ 
      if(!this.target){ this.dead=true; return; }
    }
    this.t+=dt;
    const tx=this.target.x, ty=this.target.y-4;
    const p=clamp(this.t/Math.max(0.02,this.total),0,1);
    this.x=lerp(this.sx,tx,p); this.y=lerp(this.sy,ty,p);
    if(this.arc) this.y -= Math.sin(p*Math.PI)*16;
    if(p>=1){ this.hit(); this.dead=true; }
  }
  hit(){
    if(this.visualOnly) return;
    const tgt=this.target;
    if(this.splash){
      burst(this.x,this.y,P.ember,10,50);
      for(const e of G.enemies){
        if(e.dead) continue;
        if(e.flying) continue;
        if(dist2(e.x,e.y,this.x,this.y) < this.splash*this.splash){
          e.damage(this.dmg,this.type);
          if(this.acid){ e.acidT=this.acidDur; e.acidDps=this.acid; }
        }
      }
      if(this.acid) G.zones.push({x:this.x,y:this.y,r:this.splash,dps:this.acid,life:this.acidDur,t:0,col:'#7ad13a'});
      return;
    }
    if(!tgt||tgt.dead) return;
    let dmg=this.dmg;
    if(this.crit) { floater(tgt.x,tgt.y-12,'CRIT',P.gold); }
    if(this.execute && tgt.hp/tgt.maxHp < this.execute && !tgt.boss){ tgt.kill(); floater(tgt.x,tgt.y-12,'EXECUTE',P.purple); return; }
    tgt.damage(dmg,this.type);
    if(this.slow){ tgt.slowT=this.slowDur; tgt.slowAmt=Math.max(tgt.slowAmt,this.slow); }
    if(this.freeze && rnd()<this.freeze && !tgt.boss){ tgt.freezeT=1.1; floater(tgt.x,tgt.y-12,'FROZEN',P.ice); }
    burst(this.x,this.y,this.col,3,22);
  }
  draw(){
    pxc(this.x,this.y,this.r,this.col);
    if(this.r>1.5){ ctx.globalAlpha=0.4; pxc(this.x,this.y,this.r+1,this.col); ctx.globalAlpha=1; }
  }
}

const PLAY_H = 238;          // play area height; HUD occupies the rest

/* ============================================================
   TOWER
   ============================================================ */
class Tower {
  constructor(plotIdx, key){
    this.plot=plotIdx; this.key=key; this.def=TOWERS[key];
    this.level=1; this.branch=null;
    this.cd=0; this.spent=this.def.tiers[0].cost;
    const p=G.map.plots[plotIdx];
    this.x=p.x; this.y=p.y;
    this.rally={x:p.x, y:p.y+18};
    this.soldiers=[];
    this.ang=0; this.recoil=0;
    if(this.def.isBarracks) this.spawnSoldiers();
  }
  get stats(){ return this.branch!==null ? this.def.branches[this.branch] : this.def.tiers[this.level-1]; }
  get displayName(){ return this.branch!==null ? this.def.branches[this.branch].name : this.def.name + (this.level>1?(' '+'I'.repeat(this.level)):''); }
  get shortName(){ return this.branch!==null ? this.def.branches[this.branch].short : this.def.short; }
  get maxed(){ return this.branch!==null; }
  get nextCost(){
    if(this.branch!==null) return null;
    if(this.level<3) return this.def.tiers[this.level].cost;
    return null;
  }
  spawnSoldiers(){
    const n=this.stats.count||3;
    this.soldiers=[];
    for(let i=0;i<n;i++){ const s=new Soldier(this,i); this.soldiers.push(s); G.soldiers.push(s); }
  }
  upgrade(){
    const c=this.nextCost;
    if(c===null || G.gold<c) return false;
    G.gold-=c; this.spent+=c; this.level++;
    if(this.def.isBarracks) for(const s of this.soldiers) s.refresh();
    burst(this.x,this.y-8,P.gold,12,40);
    return true;
  }
  takeBranch(i){
    if(this.level<3 || this.branch!==null) return false;
    const c=this.def.branches[i].cost;
    if(G.gold<c) return false;
    G.gold-=c; this.spent+=c; this.branch=i;
    if(this.def.isBarracks){
      for(const s of this.soldiers){ s.removed=true; s.dead=true; }
      G.soldiers=G.soldiers.filter(s=>!s.removed);
      this.spawnSoldiers();
    }
    burst(this.x,this.y-8,P.purple,20,60);
    return true;
  }
  sell(){
    G.gold += this.spent;   // full refund
    floater(this.x,this.y-10,'+'+this.spent,P.gold);
    for(const s of this.soldiers){ s.removed=true; s.dead=true; for(const e of G.enemies) if(e.blocker===s) e.blocker=null; }
    G.soldiers=G.soldiers.filter(s=>!s.removed);
    G.towers=G.towers.filter(t=>t!==this);
    burst(this.x,this.y-6,'#b8b0a0',10,40);
  }
  setRally(x,y){
    if(!this.def.isBarracks) return;
    const d=dist(x,y,this.x,this.y);
    const maxR=70;
    if(d>maxR){ x=this.x+(x-this.x)/d*maxR; y=this.y+(y-this.y)/d*maxR; }
    this.rally={x:clamp(x,4,GW-4), y:clamp(y,4,PLAY_H-4)};
  }
  update(dt){
    if(this.recoil>0) this.recoil-=dt*6;
    if(this.def.isBarracks) return;
    this.cd-=dt;
    if(this.cd>0) return;
    const st=this.stats;
    const targets=this.findTargets(st);
    if(!targets.length) return;
    this.cd=st.rate;
    this.recoil=1;
    this.ang=Math.atan2(targets[0].y-this.y, targets[0].x-this.x);
    for(const t of targets) this.fire(t, st);
  }
  findTargets(st){
    const n = st.multi||1;
    const r2=st.range*st.range;
    const list=[];
    for(const e of G.enemies){
      if(e.dead) continue;
      if(e.flying && !this.def.air) continue;
      if(dist2(e.x,e.y,this.x,this.y)<=r2) list.push(e);
    }
    if(G.camp && this.def.air!==false){ /* camp is in enemies list already */ }
    // smart targeting: furthest along the path first
    list.sort((a,b)=> (b.dist - a.dist));
    return list.slice(0,n);
  }
  fire(target, st){
    let dmg=rndRange(st.dmgMin, st.dmgMax);
    let crit=false;
    if(st.crit && rnd()<st.crit){ dmg*=st.critMul; crit=true; }
    const opt={ col:this.def.accent, speed:this.key==='bombard'?120:210, crit,
      splash:st.splash||0, slow:st.slow||0, slowDur:st.slowDur||0, freeze:st.freeze||0,
      execute:st.execute||0, acid:st.acid||0, acidDur:st.acidDur||0,
      arc:this.key==='bombard', r:this.key==='bombard'?2.2:1.4 };
    G.shots.push(new Shot(this.x, this.y-10, target, dmg, this.def.dmgType, opt));
  }
  draw(){
    const x=this.x, y=this.y;
    ctx.globalAlpha=0.26; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(x,y+2,11,5,0,0,6.283); ctx.fill(); ctx.globalAlpha=1;
    const sp=towerSprite(this.key,this.level,this.branch);
    blit(sp, x-11, y-29, false);
    if(this.key==='bombard'){
      const a=this.ang, rec=this.recoil>0?2:0;
      const len=9+this.level+(this.branch!==null?3:0)-rec;
      const px0=x, py0=y-11;
      ctx.save();
      ctx.lineCap='round';
      ctx.strokeStyle='#15161c'; ctx.lineWidth=5.5;
      ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px0+Math.cos(a)*len,py0+Math.sin(a)*len); ctx.stroke();
      ctx.strokeStyle=this.branch===1?'#4e8f2e':'#5a5650'; ctx.lineWidth=3.6;
      ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px0+Math.cos(a)*len,py0+Math.sin(a)*len); ctx.stroke();
      ctx.strokeStyle=this.branch===0?'#e8c15c':(this.branch===1?'#7ad13a':'#8d887f'); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(px0,py0); ctx.lineTo(px0+Math.cos(a)*(len-1),py0+Math.sin(a)*(len-1)); ctx.stroke();
      ctx.restore();
    }
    if(this.key==='mage'){
      const pulse=1+Math.sin(G.time*3)*0.22;
      const oy=y-27-(this.level)*1.2;
      const col=this.branch===1?P.ice:(this.branch===0?'#c89ae8':this.def.accent);
      ctx.globalAlpha=0.30; pxc(x,oy,4.6*pulse,col); ctx.globalAlpha=1;
      pxc(x,oy,2.4*pulse,col);
      pxc(x-0.6,oy-0.6,1.1*pulse,'#f0e6ff');
    }
    if(this.def.isBarracks){
      const r=this.rally;
      ctx.globalAlpha=0.30; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(r.x,r.y+1,4,2,0,0,6.283); ctx.fill(); ctx.globalAlpha=1;
      px(r.x-0.5,r.y-11,1,11,'#3a2a18');
      const wav=Math.sin(G.time*4)*0.8;
      ctx.fillStyle= this.branch===1?'#5a8f42':P.red;
      ctx.beginPath();
      ctx.moveTo(r.x+0.5,r.y-11); ctx.lineTo(r.x+7,r.y-9.5+wav); ctx.lineTo(r.x+0.5,r.y-6.5);
      ctx.closePath(); ctx.fill();
    }
  }
}

/* ---- tower art, drawn once per configuration at device resolution ---- */
const towerCache={};
function towerSprite(key,level,branch){
  const id=key+'|'+level+'|'+branch;
  if(towerCache[id]) return towerCache[id];
  const W=22*RES, H=32*RES;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  const q=(x,y,w,h,col)=>{ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); };
  const cx=W/2, base=H-6;     // foot of the tower in device px
  const K='#14151c';
  // stone plinth, common to all four
  q(cx-17,base-11,34,13,K);
  q(cx-16,base-10,32,11,'#55524c');
  q(cx-16,base-10,32,3,'#7c776f');
  q(cx-16,base-2,32,2,'#38352f');
  for(let i=0;i<4;i++) q(cx-15+i*8,base-7,7,1,'#403d38');

  if(key==='archer'){
    const hgt=18+level*4+(branch!==null?6:0);
    const top=base-11-hgt;
    // legs
    q(cx-10,top+6,4,hgt-4,K); q(cx+6,top+6,4,hgt-4,K);
    q(cx-9,top+6,2,hgt-5,'#5d4224'); q(cx+7,top+6,2,hgt-5,'#5d4224');
    // cross braces
    for(let i=0;i<3;i++){ const yy=top+10+i*((hgt-8)/3); q(cx-8,yy,16,2,'#4a331e'); q(cx-8,yy,16,1,'#6d4526'); }
    // platform
    q(cx-13,top,26,7,K);
    q(cx-12,top+1,24,5,'#7a5637');
    q(cx-12,top+1,24,2,'#9c7448');
    // railing
    q(cx-12,top-5,2,5,'#5d4224'); q(cx+10,top-5,2,5,'#5d4224');
    q(cx-12,top-6,24,2,'#6d4526');
    // archer figure
    q(cx-3,top-13,6,8,K);
    q(cx-2,top-12,4,6,'#4a5f3a');
    q(cx-2,top-14,4,3,'#d8a878');
    if(branch===0){       // longbow bastion: tall stone crown
      q(cx-14,top-22,28,9,K);
      q(cx-13,top-21,26,7,'#6b675f');
      q(cx-13,top-21,26,2,'#8d887f');
      for(let i=0;i<4;i++) q(cx-12+i*7,top-26,5,5,'#6b675f');
      q(cx-2,top-31,4,5,'#e8c15c');
    } else if(branch===1){ // crossbow nest: three mounted bows
      q(cx-14,top-16,28,4,K);
      q(cx-13,top-15,26,2,'#9c7448');
      for(let i=0;i<3;i++){ q(cx-11+i*8,top-20,2,5,'#a8a39a'); q(cx-13+i*8,top-21,6,2,'#6e6a63'); }
    } else {
      for(let i=0;i<level;i++) q(cx-9+i*7,top-9,4,4,'#c8b06a');

  G.gold=Math.round(m.startGold*G.diff.gold); G.lives=G.diff.lives; G.leaks=0;
  G.waveIndex=0; G.waveTimer=22; G.spawnQueue=[]; G.spawnT=0; G.waveRunning=false;
  G.enemies=[]; G.towers=[]; G.soldiers=[]; G.shots=[]; G.parts=[]; G.texts=[]; G.zones=[];
  G.selPlot=-1; G.selTower=null; G.aim=null;
  G.speed=1; G.paused=false; G.time=0;
  G.abil[0].t=0; G.abil[1].t=0;
  G.endless=!!endless; G.endlessWave=0;
  G.heroKey=heroKey;
  G.hero=new Hero(heroKey);
  G.camp=null; G.campT=0;
  G.campWarned=false;

/* ============================================================
   WAVES
   ============================================================ */
function totalWaves(){ return G.endless? 999 : G.map.waves.length; }

function buildWave(){
  if(G.endless) return endlessWave(G.endlessWave++);
  return G.map.waves[G.waveIndex];
}
function endlessWave(n){
  const pool=['bandit','wolf','brigand','crow','sapper','warlock','shield','mender','xbow'];
  const groups=[];
  const kinds=2+Math.min(3,Math.floor(n/4));
  for(let i=0;i<kinds;i++){
    const t=pool[Math.min(pool.length-1, rndInt(0, Math.min(pool.length-1, 2+Math.floor(n/2))))];
    groups.push({t, n:3+Math.floor(n*0.6)+rndInt(0,3), gap:Math.max(0.35,0.9-n*0.02), delay:i*2});
  }
  return {groups};
}
function startWave(){
  const w = buildWave();
  const q=[];
  let maxT=0;
  for(const g of w.groups){
    for(let i=0;i<g.n;i++){
      const t=(g.delay||0)+i*g.gap;
      q.push({t, type:g.t});
      if(t>maxT) maxT=t;
    }
  }
  q.sort((a,b)=>a.t-b.t);
  G.spawnQueue=q; G.spawnT=0; G.waveRunning=true;
  if(!G.endless) G.waveIndex++;
  G.waveTimer = maxT + 17;
  const num = G.endless? G.endlessWave : G.waveIndex;
  const bonus = 26 + num*7;
  G.gold += bonus;
  floater(GW/2, 46, '+'+bonus+' WAVE', P.gold);
  flash('Wave '+num+' incoming');
  // endless scaling
  if(G.endless){
    G.hpScale = 1 + G.endlessWave*0.22;
  }
}
function callWaveEarly(){
  if(G.state!=='play') return;
  if(!G.endless && G.waveIndex>=G.map.waves.length) return;
  const bonus=Math.max(0, Math.floor(G.waveTimer*2));
  G.gold+=bonus;
  if(bonus>0) floater(GW/2, 40, '+'+bonus+' EARLY', P.gold);
  G.waveTimer=0;
  startWave();
}
function updateWaves(dt){
  // spawn queue
  if(G.spawnQueue.length){
    G.spawnT+=dt;
    while(G.spawnQueue.length && G.spawnQueue[0].t<=G.spawnT){
      const s=G.spawnQueue.shift();
      const e=new Enemy(s.type,0);
      if(G.endless && G.hpScale){ e.maxHp=Math.round(e.maxHp*G.hpScale); e.hp=e.maxHp; }
      G.enemies.push(e);
    }
  }
  // the bandit camp: quiet at first, then it escalates the longer it stands
  if(G.camp && !G.camp.dead){
    const w = G.endless? G.endlessWave : G.waveIndex;
    if(w>=3){
      if(!G.campWarned){ G.campWarned=true; flash('The bandit camp is raiding \u2014 burn it down'); }
      G.campT-=dt;
      if(G.campT<=0){
        let type='bandit', gap=12;
        if(w>=9){ type=pick(['xbow','warlock','brigand']); gap=7.5; }
        else if(w>=6){ type=pick(['brigand','wolf','wolf']); gap=9.5; }
        G.campT=gap;
        G.enemies.push(new Enemy(type,0));
        floater(G.camp.x,G.camp.y-18,'RAID!',P.red);
      }
    }
  }
  // next-wave timer
  const more = G.endless || G.waveIndex < G.map.waves.length;
  if(more){
    G.waveTimer-=dt;
    if(G.waveTimer<=0) startWave();
  } else {
    const alive=G.enemies.some(e=>!e.dead && !e.static);
    if(!alive && !G.spawnQueue.length) victory();
  }
}

function enemiesIn(x,y,r,includeAir){
  const out=[];

    }
  } else if(k==='sylwen'){
    if(i===0){
      burst(x,y,P.ember,18,60);
      for(const e of enemiesIn(x,y,24,true)) e.damage(70,'magic');
      G.parts.push({x,y,vx:0,vy:0,t:0,life:0.35,col:P.embers,r:9,ring:true});
    } else if(i===1){

    } else {

      burst(h.x,h.y-6,P.ice,26,60);
      G.parts.push({x:h.x,y:h.y-4,vx:0,vy:0,t:0,life:0.4,col:P.ice,r:14,ring:true});
    }
  } else {
    if(i===0){
      const list=enemiesIn(h.x,h.y,72,true).sort((a,b)=>b.dist-a.dist).slice(0,5);
      if(!list.length) return false;
      for(const e of list){ G.shots.push(new Shot(h.x,h.y-7,e,22,'phys',{col:'#cfc6a8',speed:230})); }
      floater(h.x,h.y-18,'VOLLEY',h.def.col);
    } else if(i===1){
      burst(h.x,h.y-6,'#7aa85a',10,40);
      h.x=h.tx=clamp(x,4,GW-4); h.y=h.ty=clamp(y,4,PLAY_H-4);
      for(const e of enemiesIn(h.x,h.y,22,true)) e.damage(30,'phys');
      burst(h.x,h.y-6,'#7aa85a',14,50);
    } else {
      G.zones.push({x,y,r:30,slow:0.6,life:8,t:0,col:'#7aa85a',air:false});
      floater(x,y-8,'SNARE',h.def.col);
    }
  }
  h.cds[i]=h.def.abilities[i].cd;
  return true;
}
function castGlobal(i,x,y){
  const a=G.abil[i];
  if(a.t>0) return false;
  if(i===0){
    for(const e of enemiesIn(x,y,42,true)) e.damage(75,'true');
    burst(x,y,P.ember,30,80);

let terrainCv=null;
function buildTerrain(){
  const m=G.map;
  const W=GW*RES, H=PLAY_H*RES, R=RES;
  terrainCv=document.createElement('canvas'); terrainCv.width=W; terrainCv.height=H;
  const c=terrainCv.getContext('2d');
  _seed=m.id*7919+13;
  // grass: broad tonal patches, then fine blade texture
  c.fillStyle='#3a6637'; c.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){
    const cx=rnd()*W, cy=rnd()*H, rr=20+rnd()*90;
    c.globalAlpha=0.10+rnd()*0.10;
    c.fillStyle= rnd()<0.5? '#2f5730' : '#4a7c42';
    c.beginPath(); c.ellipse(cx,cy,rr,rr*0.62,0,0,6.283); c.fill();
  }
  c.globalAlpha=1;
  for(let y=0;y<H;y+=2) for(let x=0;x<W;x+=2){
    const r=rnd();
    if(r<0.22){ c.fillStyle='#345d32'; c.fillRect(x,y,2,2); }
    else if(r<0.40){ c.fillStyle='#457a3e'; c.fillRect(x,y,2,2); }
  }
  for(let i=0;i<2400;i++){
    const x=Math.floor(rnd()*W), y=Math.floor(rnd()*H);
    c.fillStyle= rnd()<0.5? '#56954b':'#2b5029';
    c.fillRect(x,y,1, rnd()<0.4?3:2);
  }
  // road
  const pts=m.path.map(p=>({x:p.x*R,y:p.y*R}));
  const stroke=(lw,col)=>{
    c.lineJoin='round'; c.lineCap='round'; c.strokeStyle=col; c.lineWidth=lw;
    c.beginPath(); c.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) c.lineTo(pts[i].x,pts[i].y);
    c.stroke();
  };
  stroke(48,'#2f4a26'); stroke(44,'#5d4629'); stroke(38,'#7a5c39');
  stroke(30,'#8f6f45'); stroke(16,'#9c7c50');
  // ruts, verge crumbs and gravel
  const path=new Path(m.path);
  for(let d=0; d<path.len; d+=1.2){
    const p=path.at(d);
    const nx=-Math.sin(p.ang), ny=Math.cos(p.ang);
    const x=p.x*R, y=p.y*R;
    if(rnd()<0.55){ c.fillStyle='#6b5330'; c.fillRect(x+nx*rndRange(-13,-6), y+ny*rndRange(-13,-6),2,2); }
    if(rnd()<0.55){ c.fillStyle='#6b5330'; c.fillRect(x+nx*rndRange(6,13), y+ny*rndRange(6,13),2,2); }
    if(rnd()<0.30){ c.fillStyle='#a98c60'; c.fillRect(x+nx*rndRange(-15,15), y+ny*rndRange(-15,15),1,1); }
    if(rnd()<0.10){ c.fillStyle='#5a4326'; c.fillRect(x+nx*rndRange(-16,16), y+ny*rndRange(-16,16),3,2); }
  }
  // decor
  const fr=(cx,cy,w2,h2,col)=>{ c.fillStyle=col; c.fillRect(Math.round(cx),Math.round(cy),w2,h2); };
  for(const d of m.decor){
    const X=d.x*R, Y=d.y*R;
    c.globalAlpha=0.24; c.fillStyle='#000';
    c.beginPath(); c.ellipse(X,Y+2,d.t==='tree'?15:13,d.t==='tree'?6:5,0,0,6.283); c.fill();
    c.globalAlpha=1;
    if(d.t==='tree'){
      fr(X-4,Y-20,8,21,'#2a1a0e');
      fr(X-3,Y-20,5,21,'#54341c');
      fr(X-1,Y-18,2,17,'#6d4526');
      fr(X-3,Y-14,2,2,'#2a1a0e'); fr(X+1,Y-9,2,2,'#2a1a0e');
      const CY=Y-22;
      c.fillStyle='#16301a';
      c.beginPath(); c.ellipse(X,CY-10,19,15,0,0,6.283); c.fill();
      c.beginPath(); c.ellipse(X-12,CY-2,11,9,0,0,6.283); c.fill();
      c.beginPath(); c.ellipse(X+12,CY-3,11,9,0,0,6.283); c.fill();
      c.fillStyle='#2b6029';
      c.beginPath(); c.ellipse(X,CY-11,16,12,0,0,6.283); c.fill();
      c.beginPath(); c.ellipse(X-10,CY-3,9,7,0,0,6.283); c.fill();
      c.beginPath(); c.ellipse(X+10,CY-4,9,7,0,0,6.283); c.fill();
      c.fillStyle='#3d8436';
      c.beginPath(); c.ellipse(X-2,CY-14,12,8,0,0,6.283); c.fill();
      c.beginPath(); c.ellipse(X+8,CY-7,7,5,0,0,6.283); c.fill();
      c.fillStyle='#57a949';
      c.beginPath(); c.ellipse(X-4,CY-17,7,4,0,0,6.283); c.fill();
      c.fillStyle='#6fc45c';
      c.beginPath(); c.ellipse(X-6,CY-19,3.5,2,0,0,6.283); c.fill();
      for(let i=0;i<10;i++){
        const a=rnd()*6.283, rr=rnd()*17;
        c.fillStyle= rnd()<0.5?'#2b6029':'#3d8436';
        c.fillRect(X+Math.cos(a)*rr, CY-11+Math.sin(a)*rr*0.7, 2,2);
      }
    } else {
      fr(X-13,Y-10,26,12,'#1e2026');
      fr(X-12,Y-13,23,14,'#4e4b46');
      fr(X-10,Y-15,17,11,'#6b675f');
      fr(X-8,Y-15,10,5,'#8d887f');
      fr(X-7,Y-16,5,2,'#a5a097');
      fr(X+2,Y-6,6,4,'#3a3833');
      fr(X-11,Y-3,5,3,'#3a3833');
    }
  }
  // gate at the end of the road
  const end=m.path[m.path.length-1];
  const gx=Math.min(GW*R-26, end.x*R-30), gy=end.y*R;
  fr(gx-8,gy-54,16,60,'#14151c');
  fr(gx-6,gy-52,12,56,'#5a5650');

/* ============================================================
   UPDATE
   ============================================================ */
function updateGame(dt){
  if(G.state!=='play') return;
  G.time+=dt;
  if(G.msgT>0) G.msgT-=dt;
  updateWaves(dt);
  for(const t of G.towers) t.update(dt);
  for(const s of G.soldiers) s.update(dt);
  for(const e of G.enemies) e.update(dt);
  for(const s of G.shots) s.update(dt);
  if(G.hero) G.hero.update(dt);
  for(let i=0;i<G.abil.length;i++) if(G.abil[i].t>0) G.abil[i].t-=dt;
  // zones
  for(const z of G.zones){ z.t+=dt; }
  G.zones=G.zones.filter(z=>z.t<z.life);
  // particles
  for(const p of G.parts){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt; }
  G.parts=G.parts.filter(p=>p.t<p.life);
  for(const t of G.texts){ t.t+=dt; t.y+=t.vy*dt; t.vy*=0.92; }
  G.texts=G.texts.filter(t=>t.t<t.life);
  G.shots=G.shots.filter(s=>!s.dead);
  G.soldiers=G.soldiers.filter(s=>!s.removed);
  // leaks
  for(const e of G.enemies){
    if(e.leaked){
      G.lives-=e.def.lives; G.leaks+=e.def.lives;
      floater(GW-30, 30, '-'+e.def.lives, P.red);
      e.leaked=false;
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.camp && G.camp.dead) G.camp=null;
  if(G.lives<=0){ G.lives=0; defeat(); }
}

function starsEarned(){
  if(G.leaks===0) return 3;
  if(G.leaks<=4) return 2;
  return 1;
}
function victory(){
  if(G.state!=='play') return;
  G.state='win';
  G.stars=starsEarned();
  const id=G.map.id;
  save.data.cleared[id]=true;
  save.data.stars[id]=Math.max(save.data.stars[id]||0, G.stars);
  const dk=id+'_'+G.diff.key;
  save.data.stars[dk]=Math.max(save.data.stars[dk]||0, G.stars);
  save.data.heroXP[G.heroKey]=G.hero.xp;
  save.write();
}
function defeat(){
  if(G.state!=='play') return;
  G.state='lose';
  save.data.heroXP[G.heroKey]=G.hero.xp;
  save.write();
}

/* ============================================================
   DRAW WORLD
   ============================================================ */
function drawWorld(){
  if(terrainCv) ctx.drawImage(terrainCv,0,0,GW,PLAY_H); else px(0,0,GW,PLAY_H,P.grass1);
  // zones
  for(const z of G.zones){
    const a=0.30*(1-z.t/z.life);
    ctx.globalAlpha=a; pxc(z.x,z.y,z.r,z.col); ctx.globalAlpha=1;
    ctx.globalAlpha=a*1.6; ctx.strokeStyle=z.col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  }
  // build plots
  for(let i=0;i<G.map.plots.length;i++){
    const p=G.map.plots[i];
    if(G.towers.some(t=>t.plot===i)) continue;
    const sel = G.selPlot===i;
    // shadow
    ctx.globalAlpha=0.28; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(p.x,p.y+2,10,5,0,0,6.283); ctx.fill(); ctx.globalAlpha=1;
    // stone rim
    ctx.fillStyle=sel?'#a09468':'#7d7566';
    ctx.beginPath(); ctx.ellipse(p.x,p.y,10,5.5,0,0,6.283); ctx.fill();
    // inner dirt
    ctx.fillStyle=sel?'#5f5843':'#4a4438';
    ctx.beginPath(); ctx.ellipse(p.x,p.y,7.5,3.8,0,0,6.283); ctx.fill();
    // brick notches on the rim
    ctx.fillStyle=sel?'#c0b184':'#948b79';
    for(let a2=0;a2<8;a2++){
      const an=a2*0.785;
      ctx.fillRect(Math.round(p.x+Math.cos(an)*8.8)-1, Math.round(p.y+Math.sin(an)*4.7), 2,1);
    }
    const pulse=0.72+Math.sin(G.time*2.6+i*0.9)*0.28;
    ctx.globalAlpha=sel?1:pulse;
    px(p.x-3,p.y-1,7,2, sel?P.gold:'#d8cfa8');
    px(p.x-1,p.y-3,2,6, sel?P.gold:'#d8cfa8');
    ctx.globalAlpha=1;
  }
  // range preview
  if(G.selTower && !G.selTower.def.isBarracks){
    const st=G.selTower.stats;
    ctx.globalAlpha=0.10; pxc(G.selTower.x,G.selTower.y,st.range,P.white); ctx.globalAlpha=1;
    ctx.globalAlpha=0.5; ctx.strokeStyle=P.white; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(G.selTower.x,G.selTower.y,st.range,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  }
  if(G.selTower && G.selTower.def.isBarracks){
    ctx.globalAlpha=0.35; ctx.strokeStyle=P.bone; ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.arc(G.selTower.x,G.selTower.y,70,0,6.283); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
  }
  // bandit camp
  if(G.camp){
    const c=G.camp;
    ctx.globalAlpha=0.26; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(c.x,c.y+2,15,6,0,0,6.283); ctx.fill(); ctx.globalAlpha=1;
    blit(campSprite(), c.x-15, c.y-24, false);
    // campfire
    const fl=0.55+Math.sin(G.time*9)*0.45;
    ctx.globalAlpha=fl; pxc(c.x+15,c.y-3,2.6,P.ember); ctx.globalAlpha=fl*0.5;
    pxc(c.x+15,c.y-5,4,P.embers); ctx.globalAlpha=1;
    if(rnd()<0.10) G.parts.push({x:c.x+15,y:c.y-6,vx:rndRange(-4,4),vy:-rndRange(10,22),t:0,life:0.6,col:P.embers,r:0.9});
    // health + label, flipped below the tent when it would run off the top
    const bw=30, low = c.y < 54;
    const barY = low ? c.y+6  : c.y-30;
    const labY = low ? c.y+13 : c.y-39;
    px(c.x-bw/2-1,barY,bw+2,5,P.ink);
    px(c.x-bw/2,barY+1,bw*(c.hp/c.maxHp),3,'#c8443c');
    const active = (G.endless?G.endlessWave:G.waveIndex)>=3;
    textMid(active?'BANDIT CAMP - RAIDING':'BANDIT CAMP', c.x, labY, active?P.red:P.bone,1);
  }
  // towers sorted back to front
  const ts=G.towers.slice().sort((a,b)=>a.y-b.y);
  for(const t of ts) t.draw();
  for(const s of G.soldiers) s.draw();
  const es=G.enemies.slice().sort((a,b)=>a.y-b.y);
  for(const e of es){ if(!e.static) e.draw(); }
  if(G.hero) G.hero.draw();
  for(const s of G.shots) s.draw();
  for(const p of G.parts){
    const a=1-p.t/p.life;
    ctx.globalAlpha=a;
    if(p.ring){ ctx.strokeStyle=p.col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+p.t/p.life*1.6),0,6.283); ctx.stroke(); }
    else pxc(p.x,p.y,p.r,p.col);
    ctx.globalAlpha=1;
  }
  for(const t of G.texts){
    const a=1-t.t/t.life;
    ctx.globalAlpha=a; textMid(t.str,t.x,t.y,t.col,1); ctx.globalAlpha=1;
  }
  // aim overlay
  if(G.aim){
    const r = G.aim.kind==='global' ? (G.aim.idx===0?42:12) : (G.hero.key==='sylwen'?24:(G.hero.key==='kestrel'&&G.aim.idx===2?30:22));
    ctx.globalAlpha=0.2; pxc(input.x,input.y,r,P.ember); ctx.globalAlpha=1;
    ctx.globalAlpha=0.8; ctx.strokeStyle=P.ember; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(input.x,input.y,r,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
    px(0,0,GW,10,P.ink);
    textMid('TAP A TARGET  -  tap here to cancel', GW/2, 2, P.embers,1);
  }
}

/* ============================================================
   INPUT HANDLING
   ============================================================ */
function tapped(r){ return input.tapped && inRect(r,input.tapX,input.tapY); }

function handlePlayInput(){
  // HUD
  if(tapped(UI.pause)){ G.paused=!G.paused; input.tapped=false; return; }
  if(tapped(UI.speed)){ G.speed = G.speed===1?2:(G.speed===2?3:1); input.tapped=false; return; }
  if(tapped(UI.menu)){ G.state='paused_menu'; G.paused=true; input.tapped=false; return; }
  if(tapped(UI.call)){ callWaveEarly(); input.tapped=false; return; }
  for(let i=0;i<3;i++) if(tapped(UI.heroAb[i])){
    const needsAim = (G.hero.key==='sylwen'&&i===0)||(G.hero.key==='kestrel'&&(i===1||i===2));
    if(needsAim) G.aim={kind:'hero',idx:i};
    else castHero(i,G.hero.x,G.hero.y);
    input.tapped=false; return;
  }
  for(let i=0;i<2;i++) if(tapped(UI.globAb[i])){ G.aim={kind:'global',idx:i}; input.tapped=false; return; }

  if(!input.tapped) return;
  const x=input.tapX, y=input.tapY;

  // aiming
  if(G.aim){
    if(y<12){ G.aim=null; input.tapped=false; return; }
    if(y<PLAY_H){
      if(G.aim.kind==='hero') castHero(G.aim.idx,x,y); else castGlobal(G.aim.idx,x,y);
      G.aim=null;
    }
    input.tapped=false; return;
  }
  // tower panel buttons
  if(G.selTower){
    const t=G.selTower, r=panelRect(t);
    const sellR={x:r.x+r.w-38,y:r.y+r.h-16,w:34,h:13};
    if(inRect(sellR,x,y)){ t.sell(); G.selTower=null; input.tapped=false; return; }
    if(t.level<3){
      if(inRect({x:r.x+4,y:r.y+r.h-16,w:52,h:13},x,y)){ if(!t.upgrade()) flash('Not enough gold'); input.tapped=false; return; }
    } else if(t.branch===null){
      for(let i=0;i<2;i++){
        if(inRect({x:r.x+4,y:r.y+22+i*15,w:r.w-8,h:13},x,y)){ if(!t.takeBranch(i)) flash('Not enough gold'); input.tapped=false; return; }
      }
    }
    if(inRect(r,x,y)){ input.tapped=false; return; }
    // barracks rally
    if(t.def.isBarracks && y<PLAY_H){
      const onTower=G.towers.find(tt=>dist2(x,y,tt.x,tt.y)<130);
      const onPlot=G.map.plots.findIndex(p=>dist2(x,y,p.x,p.y)<130);
      if(!onTower && onPlot<0){ t.setRally(x,y); input.tapped=false; return; }
    }
  }
  // build menu buttons
  if(G.selPlot>=0){
    const p=G.map.plots[G.selPlot];
    for(let i=0;i<4;i++){
      if(inRect(buildBtnRect(p,i),x,y)){
        const key=TOWER_ORDER[i], cost=TOWERS[key].tiers[0].cost;
        if(G.gold>=cost){ G.gold-=cost; const t=new Tower(G.selPlot,key); G.towers.push(t); G.selPlot=-1; G.selTower=t; burst(t.x,t.y-6,P.gold,12,40); }
        else flash('Not enough gold');
        input.tapped=false; return;
      }
    }
  }
  if(y>=PLAY_H){ input.tapped=false; return; }
  // select tower
  let hitT=null;
  for(const t of G.towers){ if(dist2(x,y,t.x,t.y-6)<150){ hitT=t; break; } }
  if(hitT){ G.selTower=hitT; G.selPlot=-1; input.tapped=false; return; }
  // select plot
  let hitP=-1;
  for(let i=0;i<G.map.plots.length;i++){
    const p=G.map.plots[i];
    if(G.towers.some(t=>t.plot===i)) continue;
    if(dist2(x,y,p.x,p.y)<170){ hitP=i; break; }
  }
  if(hitP>=0){ G.selPlot=hitP; G.selTower=null; input.tapped=false; return; }
  // empty ground: move hero / deselect
  if(G.selTower||G.selPlot>=0){ G.selTower=null; G.selPlot=-1; }
  else if(G.hero && !G.hero.dead) G.hero.moveTo(x,y);
  input.tapped=false;
}

/* ---------- keyboard ---------- */
let cheatOpen=false;
window.addEventListener('keydown',e=>{
  if(e.key==='`'){ cheatOpen=!cheatOpen; e.preventDefault(); return; }
  if(G.state!=='play') return;
  if(e.key===' '){ G.paused=!G.paused; e.preventDefault(); }
  if(e.key==='1'||e.key==='2'||e.key==='3'){
    const i=+e.key-1;
    const needsAim=(G.hero.key==='sylwen'&&i===0)||(G.hero.key==='kestrel'&&(i===1||i===2));
    if(needsAim) G.aim={kind:'hero',idx:i}; else castHero(i,G.hero.x,G.hero.y);
  }
  if(e.key==='q'||e.key==='Q') G.aim={kind:'global',idx:0};
  if(e.key==='w'||e.key==='W') G.aim={kind:'global',idx:1};
  if(e.key==='Escape'){ G.aim=null; G.selTower=null; G.selPlot=-1; }
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
const STEP=1/60;
let acc=0, last=performance.now();
function frame(now){
  const rt=Math.min(0.25,(now-last)/1000); last=now;
  ctx.setTransform(RES,0,0,RES,0,0);
  ctx.imageSmoothingEnabled=false;
  px(0,0,GW,GH,'#0e0f18');
  if(cheatOpen) handleCheatInput();
  if(G.state==='title'){ G.time+=rt; drawTitle(); }
  else if(G.state==='heroselect'){ G.time+=rt; drawHeroSelect(); }
  else if(G.state==='diffselect'){ G.time+=rt; drawDiffSelect(); }
  else if(G.state==='play'){
    if(!G.paused){
      acc += rt*G.speed;
      let steps=0;
      while(acc>=STEP && steps<8){ updateGame(STEP); acc-=STEP; steps++; }
      if(acc>STEP*8) acc=0;
    } else { G.time+=rt; }
    handlePlayInput();
    drawWorld(); drawBuildMenu(); drawTowerPanel(); drawHUD();
    if(G.paused){ ctx.globalAlpha=0.45; px(0,0,GW,PLAY_H,'#08090f'); ctx.globalAlpha=1; textMid('PAUSED',GW/2,PLAY_H/2-6,P.embers,2); }
  }
  else if(G.state==='paused_menu'){ G.time+=rt; drawPausedMenu(); }
  else if(G.state==='win'){ G.time+=rt; drawResult(true); }
  else if(G.state==='lose'){ G.time+=rt; drawResult(false); }
  if(cheatOpen) drawCheat();
  if(window.innerHeight > window.innerWidth*1.08){
    ctx.globalAlpha=0.82; px(0,GH/2-22,GW,44,'#08090f'); ctx.globalAlpha=1;
    textMid('ROTATE YOUR DEVICE', GW/2, GH/2-10, P.embers,2);
    textMid('EMBERHOLD plays in landscape', GW/2, GH/2+8, P.bone,1);
  }
  input.tapped=false;
  requestAnimationFrame(frame);
}

/* ============================================================
   BOOT
   ============================================================ */
buildSprites();
save.load();
resize();
G.state='title';
requestAnimationFrame(frame);
</script>
