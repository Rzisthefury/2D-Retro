<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arcanum Pact</title>
<style>
  :root{
    --ink:#e8e2d5; --panel:#1b1726; --panel2:#272038; --edge:#5a4b7c;
    --gold:#e8c56a; --dim:#9a8fb5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0810;overflow:hidden;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  body.has-pad #wrap{inset:0 0 176px 0;align-items:center}
  #screen{image-rendering:pixelated;background:#000;box-shadow:0 0 0 2px #2a2338,0 0 40px #000;}

  /* on-screen controls, shown only on touch devices */
  #pad[hidden]{display:none !important}
  #pad{position:fixed;left:0;right:0;bottom:0;height:168px;display:flex;
    align-items:flex-end;justify-content:space-between;padding:0 18px 18px;
    touch-action:none;pointer-events:none;z-index:5}
  #pad button{pointer-events:auto;position:absolute;margin:0;padding:0;
    background:rgba(39,32,56,.82);color:#e8e2d5;border:2px solid #6a5a93;
    border-radius:12px;font:600 20px/1 "Trebuchet MS",system-ui,sans-serif;
    touch-action:none;-webkit-user-select:none;user-select:none}
  #pad button.on{background:rgba(232,197,106,.30);border-color:#e8c56a;color:#fff0c0}
  /* MENU fills gold over the hold that opens the cheat console */
  #pad button[data-k="m"][data-hold]{
    background:linear-gradient(to right,rgba(124,232,192,.55) 0%,rgba(124,232,192,.55) 100%);
    background-size:0% 100%;background-repeat:no-repeat;
    background-color:rgba(39,32,56,.82);
    animation:padhold .6s linear forwards}
  #pad button.armed{border-color:#7ce8c0;color:#d8fff0}
  @keyframes padhold{from{background-size:0% 100%}to{background-size:100% 100%}}
  .dpad,.acts{position:relative;width:174px;height:150px}
  .dpad button{width:56px;height:56px}
  .dpad .up{left:58px;top:0}
  .dpad .lf{left:0;top:58px}
  .dpad .rt{left:116px;top:58px}
  .dpad .dn{left:58px;top:92px}
  .acts button{width:64px;height:64px;border-radius:50%;font-size:17px}
  .acts .a{right:0;top:34px;border-color:#e8c56a}
  .acts .b{right:74px;top:66px}
  .acts .m{right:8px;top:-16px;width:60px;height:32px;border-radius:10px;font-size:12px}

  /* landscape: the 4:3 canvas leaves side gutters, so put the controls in them
     instead of stealing height from the game */
  @media (max-height: 520px){
    body.has-pad #wrap{inset:0}
    #pad{height:100%;align-items:center;padding:0 10px 6px;background:none}
    .dpad,.acts{height:150px;width:150px}
    .dpad button{width:48px;height:48px}
    .dpad .up{left:50px;top:6px}
    .dpad .lf{left:0;top:56px}
    .dpad .rt{left:100px;top:56px}
    .dpad .dn{left:50px;top:90px}
    .acts button{width:56px;height:56px}
    .acts .a{right:0;top:40px}
    .acts .b{right:64px;top:70px}
    .acts .m{right:8px;top:0}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="640" height="480"></canvas></div>
<div id="pad" hidden>
  <div class="dpad">
    <button class="up" data-k="ArrowUp">▲</button>
    <button class="lf" data-k="ArrowLeft">◀</button>
    <button class="rt" data-k="ArrowRight">▶</button>
    <button class="dn" data-k="ArrowDown">▼</button>
  </div>
  <div class="acts">
    <button class="m" data-k="m">MENU</button>
    <button class="a" data-k="z">Z</button>
    <button class="b" data-k="x">X</button>
  </div>
</div>

  lumen:   { name:"Lumen",   color:"#f0e2a8", dark:"#6b6035", glyph:"☀" },
};
const SCHOOL_KEYS = Object.keys(SCHOOLS);

/* strong[A] = list of schools A hits for 2x.  Fully reciprocal. */
const STRONG = {
  ember:   ["verdant","storm"],
  tide:    ["ember","stone"],
  verdant: ["tide","stone"],
  storm:   ["tide","verdant"],
  stone:   ["ember","storm"],
  umbra:   ["lumen"],
  lumen:   ["umbra"],
};
const WEAK = {};
for (const a of SCHOOL_KEYS) WEAK[a] = SCHOOL_KEYS.filter(b => STRONG[b].includes(a));

/* On Oathfall the old vows blunted the wheel: 2x becomes 1.5x and 0.5x becomes
   0.75x. Type advantage still matters, but it can no longer carry a fight, so
   a party built entirely on counter-picks has to fight on its own merits.
   Everything that shows or applies a matchup goes through battleTypeMult so
   the spell menu, the swap list and the damage formula never disagree. */
const OATH_STRONG = 1.5, OATH_WEAK = 0.75;
function compressMult(tm){
  if (tm >= 2) return OATH_STRONG;
  if (tm <= 0.5) return OATH_WEAK;
  return tm;
}
function typeMult(atkSchool, defSchool){
  if (!atkSchool || atkSchool === "none") return 1;
  if (STRONG[atkSchool].includes(defSchool)) return 2;
  if (STRONG[defSchool] && STRONG[defSchool].includes(atkSchool)) return 0.5;
  return 1;
}

/* build a per-school tree by folding the school's own nodes into the spine */
const TREES = {};
for (const sch in SCHOOL_TALENTS){
  const t = { a:[], b:[], c:[] };
  for (const br of ["a","b","c"]){
    t[br] = TREE_BASE[br].map(n => {
      const own = SCHOOL_TALENTS[sch][n.id];
      return own ? Object.assign({}, n, own, { id:n.id }) : Object.assign({}, n);
    });
  }
  TREES[sch] = t;
}
const BRANCH_KEYS = ["a","b","c"];
const NODE_IDS = [];
for (const br of BRANCH_KEYS) for (const n of TREE_BASE[br]) NODE_IDS.push(n.id);
function treeOf(school){ return TREES[school] || TREES.ember; }

/* ============================================================
   AUDIO  —  synth band engine + soundtrack

   Five voices through persistent effect chains rather than bare oscillators:
     rhythm guitar  detuned saws -> waveshaper -> cab filters
     lead guitar    saw+square with vibrato -> lighter drive -> delay
     keys           three-saw supersaw -> filter envelope -> reverb
     bass           saw+sub triangle -> mild drive -> lowpass
     clean          triangle+saw pluck, no drive -> reverb   (town and chapels)
     drums          kick / snare / hats / toms / crash from noise + tone

   Accompaniment is generated from a chord progression; only the LEAD lines
   are hand-written, which is where the melody lives.
   ============================================================ */

const SEMITONE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function noteHz(tok){
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(tok);
  if (!m) return 0;
  let s = SEMITONE[m[1]];
  if (m[2] === "#") s++; else if (m[2] === "b") s--;
  return midiHz((parseInt(m[3],10) + 1) * 12 + s);
}
function midiHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }

/* ---------------- chords ---------------- */
const CHORD_QUALITY = {
  "":    [0,4,7],      m:     [0,3,7],     "5":  [0,7],
  dim:   [0,3,6],      sus4:  [0,5,7],     aug:  [0,4,8],
  m7:    [0,3,7,10],   "7":   [0,4,7,10],  maj7: [0,4,7,11],
};
function parseChord(sym){
  const m = /^([A-G])(#|b)?(.*)$/.exec(sym);
  if (!m) return { root:0, ints:[0,7] };
  let r = SEMITONE[m[1]];
  if (m[2] === "#") r++; else if (m[2] === "b") r--;
  const ints = CHORD_QUALITY[m[3]] || CHORD_QUALITY[""];
  return { root:((r % 12) + 12) % 12, ints };
}

/* ---------------- the encounter sting ----------------
   The old encounter cue was a two-tone alarm and a noise sweep \u2014 a sound
   effect, unrelated to anything. This is the band instead, playing a B minor
   hit in the wild battle track's own key, on the same buses, timed so the
   final held B is still ringing when the track's first bar lands. The
   overworld track is silenced for the duration, or the two keys fight. */
/* Three stings, one per battle tier, each in the key of the track it hands off
   to: the wild theme is B minor, the trainer theme D minor, and the boss theme
   D harmonic minor. They play on the music buses rather than the sfx bus, so
   the last note is still ringing when the track's first bar lands. */
function stingTierFor(kind){
  if (kind === "boss" || kind === "leader" || kind === "subboss") return "boss";
  if (kind === "trainer") return "trainer";
  return "wild";
}
const STING_SECONDS = { wild: 0.80, trainer: 0.80, boss: 1.30 };
function battleIntroDur(kind){ return STING_SECONDS[stingTierFor(kind)]; }

function battleSting(kind){
  if (!audio.ctx || !audio.on) return;
  const c = audio.ctx, t = c.currentTime + 0.02, hz = noteHz;
  const tier = stingTierFor(kind);

  /* hold the music engine quiet; the transition callback releases it */
  audio.lock = true;
  playTrack("__sting");

  const stab = (n, at, vol, hit) => {
    guitarNote(hz(n), t+at, 0.13, vol, false);
    if (hit) drum(hit, t+at);
  };

  if (tier === "boss"){
    /* D harmonic minor, and it takes its time. The tritone in the opening hit
       and the raised seventh in the run are what make it read as menace rather
       than just loud. */
    drum("c", t); drum("k", t); drum("t", t);
    guitarNote(hz("D1"),  t, 0.50, 0.36, false);
    guitarNote(hz("A1"),  t, 0.50, 0.30, false);
    guitarNote(hz("G#1"), t, 0.30, 0.22, false);     /* tritone */
    bassNote(hz("D0"), t, 0.54, 0.46);

    drum("d", t+0.20); guitarNote(hz("D1"), t+0.20, 0.10, 0.32, true);

    /* three falling steps off the raised seventh */
    stab("C#2", 0.30, 0.30, "s");
    stab("Bb1", 0.40, 0.30, null);
    stab("A1",  0.50, 0.32, "s");

    keysNote(hz("D4"), t+0.50, 0.70, 0.16);
    keysNote(hz("F4"), t+0.50, 0.70, 0.14);
    keysNote(hz("A4"), t+0.50, 0.70, 0.13);

    /* the run: D harmonic minor, sixteenths, straight up */
    const run = ["D4","E4","F4","G4","A4","Bb4","C#5"];
    for (let i=0;i<run.length;i++){
      leadNote(hz(run[i]), t + 0.62 + i*0.052, 0.09, 0.22);
      guitarNote(hz("D1"), t + 0.62 + i*0.052, 0.05, 0.26, true);
      if (i % 2 === 0) drum("d", t + 0.62 + i*0.052);
    }

    /* the landing */
    drum("c", t+1.00); drum("k", t+1.00); drum("t", t+1.04);
    leadNote(hz("D5"),  t+1.00, 0.70, 0.28);
    guitarNote(hz("D1"), t+1.00, 0.60, 0.34, false);
    guitarNote(hz("A1"), t+1.00, 0.60, 0.28, false);
    bassNote(hz("D0"),  t+1.00, 0.62, 0.46);
    return;
  }

  const root = tier === "trainer" ? "D" : "B";
  const fifth = tier === "trainer" ? "A" : "F#";
  const third = tier === "trainer" ? "F" : "D";

  drum("c", t); drum("k", t);
  guitarNote(hz(root + "1"),  t, 0.26, 0.34, false);
  guitarNote(hz(fifth + "2"), t, 0.26, 0.28, false);
  bassNote(hz(root + "1"), t, 0.30, 0.42);

  drum("d", t+0.13);
  guitarNote(hz(root + "1"), t+0.13, 0.09, 0.32, true);

  /* the chord spelled out on the way up */
  stab(root + "3",  0.24, 0.30, "s");
  stab(third + "4", 0.36, 0.31, "s");
  stab(fifth + "4", 0.48, 0.34, "t");

  /* the handoff */
  drum("c", t+0.60); drum("k", t+0.60);
  leadNote(hz(root + "5"),  t+0.60, 0.58, 0.26);
  guitarNote(hz(root + "2"), t+0.60, 0.42, 0.31, false);
  bassNote(hz(root + "0"),  t+0.60, 0.48, 0.44);
}
/* the wild encounter keeps its old name */
function encounterSting(){ battleSting("wild"); }

/* ============================================================
   ENGINE
   ============================================================ */
const audio = {
  ctx:null, master:null, musicGain:null, sfxGain:null, verb:null, delay:null,
  bus:{}, noise:null,
  on:true, trackId:null, track:null, step:0, nextTime:0, timer:null,
  musicVol:0.5, sfxVol:0.55, started:false,
  lock:false,   /* pin the current track — used by tests and any future jukebox */
};

function driveCurve(amount){
  const n = 2048, c = new Float32Array(n);
  for (let i=0;i<n;i++){
    const x = (i*2)/n - 1;
    c[i] = ((1 + amount) * x) / (1 + amount * Math.abs(x));
  }
  return c;
}
function makeIR(ctx, secs, decay){
  const rate = ctx.sampleRate, len = Math.floor(rate*secs);
  const buf = ctx.createBuffer(2, len, rate);
  for (let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
  }
  return buf;
}

/* a voice is a persistent chain; notes only add an oscillator and an envelope */
function makeBus(ctx, cfg){
  const input = ctx.createGain(); input.gain.value = 1;
  let node = input;
  if (cfg.drive){
    const ws = ctx.createWaveShaper();
    ws.curve = driveCurve(cfg.drive);
    ws.oversample = "2x";
    const pre = ctx.createGain(); pre.gain.value = cfg.pre || 1;
    node.connect(pre); pre.connect(ws);
    node = ws;
  }
  if (cfg.lp){
    const f = ctx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = cfg.lp; f.Q.value = cfg.q || 0.8;
    node.connect(f); node = f;
  }
  if (cfg.hp){
    const f = ctx.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = cfg.hp;
    node.connect(f); node = f;
  }
  const out = ctx.createGain(); out.gain.value = cfg.vol == null ? 0.5 : cfg.vol;
  node.connect(out);
  out.connect(audio.musicGain);
  if (cfg.verb){
    const s = ctx.createGain(); s.gain.value = cfg.verb;
    out.connect(s); s.connect(audio.verb);
  }
  if (cfg.echo){
    const s = ctx.createGain(); s.gain.value = cfg.echo;
    out.connect(s); s.connect(audio.delay);
  }
  return { input, out };
}

function audioStart(){
  if (audio.ctx){
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { audio.ctx = new AC(); } catch(e){ return; }
  const c = audio.ctx;

  audio.master = c.createGain(); audio.master.gain.value = 0.9;
  const comp = c.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 4;
  comp.attack.value = 0.004; comp.release.value = 0.22;
  audio.master.connect(comp); comp.connect(c.destination);

  audio.musicGain = c.createGain(); audio.musicGain.gain.value = audio.on ? audio.musicVol : 0;
  audio.sfxGain   = c.createGain(); audio.sfxGain.gain.value   = audio.on ? audio.sfxVol : 0;
  audio.musicGain.connect(audio.master);
  audio.sfxGain.connect(audio.master);

  /* reverb */
  const verb = c.createConvolver();
  verb.buffer = makeIR(c, 2.1, 2.6);
  const verbGain = c.createGain(); verbGain.gain.value = 0.9;
  verb.connect(verbGain); verbGain.connect(audio.musicGain);
  audio.verb = verb;

  /* delay for leads */
  const dl = c.createDelay(1.0); dl.delayTime.value = 0.26;
  const fb = c.createGain(); fb.gain.value = 0.28;
  const dlp = c.createBiquadFilter(); dlp.type = "lowpass"; dlp.frequency.value = 2600;
  const dOut = c.createGain(); dOut.gain.value = 0.5;
  dl.connect(dlp); dlp.connect(fb); fb.connect(dl);
  dlp.connect(dOut); dOut.connect(audio.musicGain);
  audio.delay = dl;

  audio.bus.gtr   = makeBus(c, { drive:34, pre:0.75, lp:3400, hp:110, vol:0.26, verb:0.10 });
  audio.bus.chug  = makeBus(c, { drive:52, pre:0.85, lp:2100, hp:130, vol:0.30, verb:0.05 });
  audio.bus.lead  = makeBus(c, { drive:14, pre:0.6,  lp:4200, hp:180, vol:0.30, verb:0.16, echo:0.22 });
  audio.bus.keys  = makeBus(c, { lp:5200, vol:0.16, verb:0.30 });
  audio.bus.bass  = makeBus(c, { drive:7, pre:0.8, lp:900, hp:35, vol:0.44 });
  audio.bus.clean = makeBus(c, { lp:5000, hp:90, vol:0.26, verb:0.34 });
  audio.bus.drum  = makeBus(c, { vol:0.55, verb:0.12 });

  const buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
  audio.noise = buf;

  audio.started = true;
  audio.timer = setInterval(tickAudio, 25);
  if (audio.trackId) restartTrack();
}

function setAudioOn(on){
  audio.on = on;
  if (audio.musicGain) audio.musicGain.gain.value = on ? audio.musicVol : 0;
  if (audio.sfxGain)   audio.sfxGain.gain.value   = on ? audio.sfxVol : 0;
}

/* ---------------- note players ---------------- */
function voice(busName, type, freq, t, dur, vol, detune){
  const c = audio.ctx;
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  const atk = 0.006, rel = Math.max(0.04, dur*0.35);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + atk);
  g.gain.setValueAtTime(vol, t + Math.max(atk, dur - rel));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.bus[busName].input);
  o.start(t); o.stop(t + dur + 0.03);
  return o;
}
function guitarNote(freq, t, dur, vol, muted){
  const bus = muted ? "chug" : "gtr";
  const d = muted ? Math.min(dur, 0.09) : dur;
  voice(bus, "sawtooth", freq, t, d, vol, -6);
  voice(bus, "sawtooth", freq, t, d, vol*0.9, +7);
  if (!muted) voice(bus, "square", freq*2, t, d, vol*0.22, 0);
}
function leadNote(freq, t, dur, vol){
  const c = audio.ctx;
  const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
  o.type = "sawtooth"; o2.type = "square";
  o.frequency.setValueAtTime(freq, t);
  o2.frequency.setValueAtTime(freq, t);
  o2.detune.setValueAtTime(9, t);
  /* a little vibrato once the note has settled */
  if (dur > 0.18){
    const lfo = c.createOscillator(), la = c.createGain();
    lfo.frequency.value = 5.4; la.gain.value = 0;
    la.gain.setValueAtTime(0, t);
    la.gain.linearRampToValueAtTime(freq * 0.011, t + Math.min(0.22, dur*0.5));
    lfo.connect(la); la.connect(o.frequency); la.connect(o2.frequency);
    lfo.start(t); lfo.stop(t + dur + 0.05);
  }
  const atk = 0.008;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + atk);
  g.gain.setValueAtTime(vol*0.92, t + dur*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
  o.connect(g); o2.connect(g); g.connect(audio.bus.lead.input);
  o.start(t); o.stop(t + dur + 0.08);
  o2.start(t); o2.stop(t + dur + 0.08);
}
function keysNote(freq, t, dur, vol){
  const c = audio.ctx;
  const g = c.createGain();
  const f = c.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.setValueAtTime(700, t);
  f.frequency.linearRampToValueAtTime(4200, t + Math.min(0.25, dur*0.4));
  f.frequency.linearRampToValueAtTime(1400, t + dur);
  f.Q.value = 3;
  for (const det of [-9, 0, 11]){
    const o = c.createOscillator();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(freq, t);
    o.detune.setValueAtTime(det, t);
    o.connect(f);
    o.start(t); o.stop(t + dur + 0.05);
  }
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol*0.85, t + dur*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
  f.connect(g); g.connect(audio.bus.keys.input);
}
function bassNote(freq, t, dur, vol){
  voice("bass", "sawtooth", freq, t, dur, vol*0.75, 0);
  voice("bass", "triangle", freq/2, t, dur, vol, 0);
}
function cleanNote(freq, t, dur, vol){
  voice("clean", "triangle", freq, t, dur, vol, -4);
  voice("clean", "sawtooth", freq, t, dur, vol*0.30, +5);
  voice("clean", "sine", freq*2, t, dur*0.6, vol*0.16, 0);
}
function drum(kind, t){
  const c = audio.ctx, D = audio.bus.drum.input;
  const noiseHit = (hp, peak, len, type) => {
    const s = c.createBufferSource(); s.buffer = audio.noise;
    const f = c.createBiquadFilter(); f.type = type || "highpass"; f.frequency.value = hp;
    const g = c.createGain();
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f); f.connect(g); g.connect(D);
    s.start(t); s.stop(t + len + 0.05);
  };
  const boom = (f0, f1, len, peak, type) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + len);
    g.gain.setValueAtTime(peak, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(D);
    o.start(t); o.stop(t + len + 0.03);
  };
  switch(kind){
    case "k": boom(165, 44, 0.17, 0.90); noiseHit(3500, 0.14, 0.018); break;
    case "d": boom(155, 48, 0.09, 0.78); noiseHit(3800, 0.10, 0.014); break;
    case "s": boom(210, 130, 0.09, 0.32); noiseHit(1700, 0.50, 0.13); break;
    case "h": noiseHit(8200, 0.13, 0.028); break;
    case "o": noiseHit(7200, 0.15, 0.16); break;
    case "r": noiseHit(6000, 0.07, 0.09); break;
    case "c": noiseHit(4200, 0.30, 0.85, "highpass"); break;
    case "t": boom(260, 110, 0.20, 0.45); noiseHit(900, 0.16, 0.09); break;
  }
}

/* ---------------- compiling a track into steps ---------------- */
function splitPat(str){ return (str || ".  .  .  .  .  .  .  .  .  .  .  .  .  .  .  . ").trim().split(/\s+/); }
function compileTrack(tr){
  if (tr._steps) return;
  const steps = [];
  const bassOct = tr.bassOct == null ? 1 : tr.bassOct;
  const gtrOct  = tr.gtrOct  == null ? 2 : tr.gtrOct;
  const keyOct  = tr.keyOct  == null ? 4 : tr.keyOct;
  for (const [name, reps] of tr.form){
    const sec = tr.sect[name];
    if (!sec) continue;
    const bars = sec.chords.length;
    const bassPat  = splitPat(BASS_LIB[sec.bass || "none"]);
    const gtrPat   = splitPat(GTR_LIB[sec.gtr || "none"]);
    const keyStyle = KEY_LIB[sec.keys || "none"];
    const clStyle  = CLEAN_LIB[sec.clean || "none"];
    for (let rep=0; rep<reps; rep++){
      for (let b=0; b<bars; b++){
        const ch = parseChord(sec.chords[b]);
        const leadToks = sec.lead ? splitPat(sec.lead[b % sec.lead.length]) : null;
        const drumToks = splitPat(DRUM_LIB[(sec.drum && sec.drum[b % sec.drum.length]) || "silence"]);
        for (let i=0;i<16;i++){
          const st = { lead:leadToks ? leadToks[i] : ".", drum:drumToks[i] || ".",
                       bass:null, bassHold:false, gtr:null, gtrMute:false, gtrHold:false,
                       keys:null, clean:null };
          /* bass */
          const bt = bassPat[i];
          if (bt === "-") st.bassHold = true;
          else if (bt !== "."){
            const add = bt === "5" ? 7 : (bt === "8" ? 12 : 0);
            st.bass = midiHz((bassOct+1)*12 + ch.root + add);
          }
          /* rhythm guitar: power chord */
          const gt = gtrPat[i];
          if (gt === "-") st.gtrHold = true;
          else if (gt !== "."){
            st.gtrMute = (gt === "m");
            const base = (gtrOct+1)*12 + ch.root;
            st.gtr = st.gtrMute ? [midiHz(base)] : [midiHz(base), midiHz(base+7), midiHz(base+12)];
          }
          /* keys */
          if (keyStyle){
            const base = (keyOct+1)*12 + ch.root;
            if (keyStyle.kind === "pad" && i === 0)
              st.keys = { notes: ch.ints.map(x => midiHz(base+x)), bars:1, soft:!!keyStyle.soft };
            else if (keyStyle.kind === "stab" && (i === 0 || i === 8))
              st.keys = { notes: ch.ints.map(x => midiHz(base+x)), beats:2 };
            else if (keyStyle.kind === "arp" && i % keyStyle.rate === 0){
              const seq = ch.ints.concat(ch.ints.map(x => x+12));
              st.keys = { notes:[ midiHz(base + seq[(i/keyStyle.rate) % seq.length]) ], arp:true };
            }
          }
          /* clean guitar */
          if (clStyle){
            const base = (gtrOct+2)*12 + ch.root;
            if (clStyle.kind === "strum" && (i === 0 || i === 6 || i === 8 || i === 14))
              st.clean = ch.ints.map(x => midiHz(base+x));
            else if (clStyle.kind === "pick" && (i === 0 || i === 8))
              st.clean = [midiHz(base), midiHz(base + ch.ints[ch.ints.length-1] + 12)];
            else if (clStyle.kind === "arp" && i % clStyle.rate === 0){
              const seq = ch.ints.concat([12, ch.ints[1]+12]);
              st.clean = [ midiHz(base + seq[(i/clStyle.rate) % seq.length]) ];
            }
          }
          steps.push(st);
        }
      }
    }
  }
  tr._steps = steps;
}

function playTrack(id){
  if (audio.trackId === id) return;
  audio.trackId = id;
  audio.track = MUSIC[id] || null;
  if (audio.track) compileTrack(audio.track);
  restartTrack();
}
function restartTrack(){
  audio.step = 0;
  if (audio.ctx) audio.nextTime = audio.ctx.currentTime + 0.08;
}

/* how long a lead note rings, counted in held steps */
function holdRun(steps, idx, field){
  let n = 1;
  for (let i=1;i<48;i++){
    const s = steps[(idx+i) % steps.length];
    if (!s) break;
    if (field === "lead" && s.lead === "-") { n++; continue; }
    if (field === "bass" && s.bassHold)     { n++; continue; }
    if (field === "gtr"  && s.gtrHold)      { n++; continue; }
    break;
  }
  return n;
}

function tickAudio(){
  if (!audio.ctx || !audio.track) return;
  const tr = audio.track, c = audio.ctx;
  const steps = tr._steps;
  if (!steps || !steps.length) return;
  const stepDur = 60 / tr.bpm / 4;
  const horizon = c.currentTime + 0.20;
  let guard = 0;
  while (audio.nextTime < horizon && guard++ < 96){
    const t = audio.nextTime;
    const idx = audio.step % steps.length;
    const s = steps[idx];

    if (s.lead && s.lead !== "." && s.lead !== "-"){
      const hz = noteHz(s.lead);
      if (hz){
        const dur = holdRun(steps, idx, "lead") * stepDur * 0.96;
        if (tr.gentle) cleanNote(hz, t, dur, 0.5);
        else leadNote(hz, t, dur, 0.34);
      }
    }
    if (s.bass){
      const dur = holdRun(steps, idx, "bass") * stepDur * 0.92;
      bassNote(s.bass, t, dur, 0.5);
    }
    if (s.gtr){
      const dur = holdRun(steps, idx, "gtr") * stepDur * 0.94;
      for (const f of s.gtr) guitarNote(f, t, dur, s.gtrMute ? 0.30 : 0.16, s.gtrMute);
    }
    if (s.keys){
      const k = s.keys;
      const dur = k.arp ? stepDur*1.8 : (k.beats ? stepDur*7 : stepDur*15);
      for (const f of k.notes) keysNote(f, t, dur, k.soft ? 0.13 : (k.arp ? 0.20 : 0.16));
    }
    if (s.clean){
      for (const f of s.clean) cleanNote(f, t, stepDur*3.4, 0.34);
    }
    if (s.drum && s.drum !== "." && s.drum !== "-") drum(s.drum, t);

    audio.nextTime += stepDur;
    audio.step++;
    if (audio.step > 1e7) audio.step = 0;
  }
}

/* ---------------- sound effects ---------------- */
function sfx(name){
  if (!audio.ctx || !audio.on) return;
  const c = audio.ctx, t = c.currentTime, D = audio.sfxGain;
  const beep = (f, at, dur, vol, type) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f, t + at);
    g.gain.setValueAtTime(0.0001, t + at);
    g.gain.linearRampToValueAtTime(vol == null ? 0.10 : vol, t + at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
    o.connect(g); g.connect(D);
    o.start(t + at); o.stop(t + at + dur + 0.03);
  };
  const sweep = (f0, f1, at, dur, peak, type) => {
    const s = c.createBufferSource(); s.buffer = audio.noise;
    const f = c.createBiquadFilter(); f.type = type || "bandpass";
    f.frequency.setValueAtTime(f0, t + at);
    f.frequency.exponentialRampToValueAtTime(f1, t + at + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t + at);
    g.gain.linearRampToValueAtTime(peak, t + at + dur*0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
    s.connect(f); f.connect(g); g.connect(D);
    s.start(t + at); s.stop(t + at + dur + 0.05);
  };
  switch(name){
    case "blip":    beep(760, 0, 0.04, 0.06, "triangle"); break;
    case "confirm": beep(520, 0, 0.05, 0.09, "triangle"); beep(780, 0.05, 0.09, 0.09, "triangle"); break;
    case "cancel":  beep(400, 0, 0.06, 0.08, "triangle"); beep(260, 0.06, 0.09, 0.08, "triangle"); break;
    case "hit":     sweep(2200, 380, 0, 0.17, 0.26); beep(150, 0, 0.1, 0.16, "sawtooth"); break;
    case "crit":    sweep(3200, 500, 0, 0.22, 0.32); beep(190, 0, 0.16, 0.22, "sawtooth");
                    beep(1320, 0.03, 0.09, 0.10); break;
    case "heal":    [523,659,784,1046].forEach((f,i) => beep(f, i*0.055, 0.20, 0.075, "triangle")); break;
    case "level":   [523,659,784,1046,1318].forEach((f,i) => beep(f, i*0.06, 0.16, 0.10, "sawtooth")); break;
    case "badge":   [392,523,659,784,1046].forEach((f,i) => beep(f, i*0.09, 0.30, 0.11, "sawtooth"));
                    beep(261, 0, 0.9, 0.09, "triangle"); break;
    case "recruit": [880,1108,1318,1760].forEach((f,i) => beep(f, i*0.055, 0.16, 0.09, "triangle")); break;
    case "faint": {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.5);
      g.gain.setValueAtTime(0.13, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(D); o.start(t); o.stop(t + 0.55);
      break;
    }
    /* kept as a fallback for anything that still asks for it by name; the
       encounter itself plays encounterSting(), which is the band, in key */
    case "encounter": encounterSting(); break;
    case "warp":    sweep(400, 3000, 0, 0.26, 0.12); beep(330, 0, 0.22, 0.07, "triangle"); break;
  }
}

/* tiny seeded rng so layouts are identical every run */
function mulberry(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function compileMap(def){
  const [w,h] = def.size;
  const g = [];
  for (let y=0;y<h;y++){ g.push(new Array(w).fill(def.base || ".")); }
  const put = (x,y,t) => { if (x>=0 && y>=0 && x<w && y<h) g[y][x] = t; };

  for (const op of def.ops){
    const rng = mulberry(op.seed != null ? op.seed : 1337);
    switch(op.op){
      case "border": {
        const t = op.t;
        for (let x=0;x<w;x++){ put(x,0,t); put(x,h-1,t); }
        for (let y=0;y<h;y++){ put(0,y,t); put(w-1,y,t); }
        if (op.thick){
          for (let x=0;x<w;x++){ put(x,1,t); put(x,h-2,t); }
          for (let y=0;y<h;y++){ put(1,y,t); put(w-2,y,t); }
        }
        break;
      }
      case "rect": {
        for (let y=op.y;y<op.y+op.h;y++) for (let x=op.x;x<op.x+op.w;x++) put(x,y,op.t);
        break;
      }
      case "frame": {
        for (let x=op.x;x<op.x+op.w;x++){ put(x,op.y,op.t); put(x,op.y+op.h-1,op.t); }
        for (let y=op.y;y<op.y+op.h;y++){ put(op.x,y,op.t); put(op.x+op.w-1,y,op.t); }
        break;
      }
      case "blob": {
        const r = op.r;
        for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){
          const d = Math.sqrt(dx*dx+dy*dy);
          if (d <= r - 0.5 + rng()*1.4) put(op.x+dx, op.y+dy, op.t);
        }
        break;
      }
      case "hpath": {
        for (let x=Math.min(op.x1,op.x2); x<=Math.max(op.x1,op.x2); x++){
          for (let k=0;k<(op.wide||2);k++) put(x, op.y+k, op.t);
        }
        break;
      }
      case "vpath": {
        for (let y=Math.min(op.y1,op.y2); y<=Math.max(op.y1,op.y2); y++){
          for (let k=0;k<(op.wide||2);k++) put(op.x+k, y, op.t);
        }
        break;
      }
      case "scatter": {
        const ax = op.x||0, ay = op.y||0, aw = op.w||w, ah = op.h||h;
        let placed = 0, guard = 0;
        while (placed < op.n && guard++ < op.n*60){
          const x = ax + Math.floor(rng()*aw), y = ay + Math.floor(rng()*ah);
          if (x<=0||y<=0||x>=w-1||y>=h-1) continue;
          if (op.onlyOn && !op.onlyOn.includes(g[y][x])) continue;
          put(x,y,op.t); placed++;
        }
        break;
      }
      case "cells": {
        for (const [x,y,t] of op.list) put(x,y,t);
        break;
      }
    }
  }
  return g.map(r => r.join(""));
}

/* ============================================================
   CONTENT  —  late-game zones, dungeons, gyms
   Everything here registers into ZONE_DEFS. ZONES is compiled at the bottom.

   ONE ENEMY PER BATTLE. A chapel or a cave holds many separate foes, each
   fought on its own, the way a Pokemon gym holds several trainers. Every
   champion below fields a single ace; startBattle already accepts an array,
   so multi-enemy squads can drop in later without touching this file.
   ============================================================ */

/* ---------------------------------------------------------------
   Wild-zone skeleton.
   Every late zone shares the same road layout so links are mechanical:
     vertical road at x 20-21 spanning y2 .. H-2
     horizontal road at y 14-15 spanning x2 .. W-2
   which guarantees a walkable tile beside every edge warp.
   --------------------------------------------------------------- */
const ROAD_Y = 14;
function wildZone(c){
  const [w,h] = c.size;
  const ops = [{ op:"border", t:c.wall, thick:true }];
  (c.grass  || []).forEach((g,i) => ops.push({ op:"blob", x:g[0], y:g[1], r:g[2], t:",",  seed:c.seed+i*7 }));
  (c.hazard || []).forEach((g,i) => ops.push({ op:"blob", x:g[0], y:g[1], r:g[2], t:g[3], seed:c.seed+130+i*11 }));
  ops.push({ op:"scatter", t:c.wall, n:c.clutter == null ? 46 : c.clutter, seed:c.seed+240, onlyOn:["."] });
  ops.push({ op:"scatter", t:c.deco || "f", n:9, seed:c.seed+360, onlyOn:["."] });
  /* roads last so nothing blocks them */
  ops.push({ op:"vpath", x:20, y1:2, y2:h-2, t:"=", wide:2 });
  ops.push({ op:"hpath", x1:2, x2:w-2, y:ROAD_Y, t:"=", wide:2 });
  (c.extraOps || []).forEach(op => ops.push(op));
  return {
    name:c.name, size:c.size, base:".", rate:c.rate, levels:c.levels,
    ops, spawn:c.spawn || [20, h-2], warps:c.warps || [], npcs:c.npcs || [],
    encounters:c.encounters, region:c.region || "wild",
  };
}
/* edge warps — the warp tile sits in the wall, the tile inside it is road */
const edgeTop    = (to, tx, ty) => [{x:20,y:1,to,tx,ty},{x:21,y:1,to,tx,ty}];
const edgeBottom = (h,to,tx,ty) => [{x:20,y:h-1,to,tx,ty},{x:21,y:h-1,to,tx,ty}];
const edgeLeft   = (to, tx, ty) => [{x:1,y:ROAD_Y,to,tx,ty},{x:1,y:ROAD_Y+1,to,tx,ty:ty+1}];
const edgeRight  = (w,to,tx,ty) => [{x:w-1,y:ROAD_Y,to,tx,ty},{x:w-1,y:ROAD_Y+1,to,tx,ty:ty+1}];

/* ---------------------------------------------------------------
   CHAMPIONS
   One ace each. Elite treatment: near-max Spark plus spent talent
   points, so a single foe is still a genuine fight.
   --------------------------------------------------------------- */
const CHAMP_SPARK    = { trainer:9, subboss:12, boss:15, leader:14 };
const CHAMP_RANKS    = { trainer:1, subboss:2,  boss:3,  leader:3  };
const CHAMP_LEVEL_UP = { trainer:0, subboss:1,  boss:3,  leader:2  };

function dressChampion(u, kind){
  const sp = CHAMP_SPARK[kind] || 9;
  for (const k in u.spark) u.spark[k] = Math.max(u.spark[k], sp);
  const r = CHAMP_RANKS[kind] || 1;
  u.talents.a1 = r; u.talents.a3 = r; u.talents.b1 = r; u.talents.b2 = r;
  if (kind === "boss" || kind === "leader"){
    /* 6 points in a branch unlocks that branch's capstone */
    u.talents.a1 = 3; u.talents.a3 = 3; u.talents.b1 = 3; u.talents.b2 = 3;
    u.talents.a4 = 1; u.talents.b4 = 1;
  }
  u.tp = 0;
  recalc(u); u.hp = u.maxHp; u.mp = u.maxMp;
  return u;
}
function buildFoeTeam(npc, bonusLv){
  const bump = (CHAMP_LEVEL_UP[npc.kind] || 0) + (bonusLv || 0);
  return npc.spec.map(([arch, lv]) => {
    const u = makeUnit(arch, Math.min(MAX_LEVEL, lv + bump), {});
    u.wild = false;
    return dressChampion(u, npc.kind);
  });
}
function isChampion(kind){ return kind === "trainer" || kind === "subboss" || kind === "boss" || kind === "leader"; }

/* ---------------------------------------------------------------
   REMATCHES
   A road trainer can be fought a second time, seven levels up, and then
   they are done. The whole mechanism is a second flag per trainer, so
   scaling later tiers off badge count is a matter of counting badges when
   picking the bonus — nothing here needs reworking for that.
   --------------------------------------------------------------- */
/* A flat +7 meant a trainer you rematched at two badges was still a pushover
   at eight. The bump now walks with the sigils you carry: +4 at none, +11 at
   all eight, and it is read at the moment the fight starts, so coming back
   later is coming back to a harder fight. */
const REMATCH_BASE = 4, REMATCH_PER_BADGE = 1;
function rematchLevels(){
  return REMATCH_BASE + REMATCH_PER_BADGE * badgeCount();
}
/* kept as the ceiling the old constant described, for anything that wants a
   single number to reason about */
const REMATCH_LEVELS = REMATCH_BASE + REMATCH_PER_BADGE * 8;
function rematchFlag(npc){ return npc.flag ? npc.flag + "_r2" : null; }
function rematchReady(npc){
  return !!(npc.road && npc.flag && state.flags[npc.flag] && !state.flags[rematchFlag(npc)]);
}
function championBeaten(npc){
  if (!npc.flag) return false;
  if (npc.road) return !!(state.flags[npc.flag] && state.flags[rematchFlag(npc)]);
  return !!state.flags[npc.flag];
}
/* A rematch pays double, since it is a harder fight for the same trip \u2014 but
   never a second Oathstone. Refighting Maeve for stones would quietly make the
   fourth tier farmable no matter how scarce the fixed drops are. */
function rematchReward(npc){
  const r = npc.reward || {};
  const items = Object.assign({}, r.items || {});
  delete items.oathstone;
  return { gold: Math.floor((r.gold || 0) * 2), items };
}
const REMATCH_LINES = [
  "Again? Good. I have not been idle since you left.",
  "I have thought about that fight every day. Let's correct it.",
  "You caught me on a bad afternoon. This is a good one.",
  "Back for the road? The toll went up.",
];
function rematchLine(npc){
  let h = 0; for (let i=0;i<npc.name.length;i++) h = (h*31 + npc.name.charCodeAt(i)) | 0;
  return REMATCH_LINES[Math.abs(h) % REMATCH_LINES.length];
}

/* ---------------------------------------------------------------
   DUNGEONS
   A cave is a zone: walls everywhere, caverns carved out (encounters),
   worked corridors between them (safe), sub-bosses standing in the
   corridor as gates, and a boss hall at the top.
   --------------------------------------------------------------- */
function dungeonZone(c){
  const [w,h] = c.size;
  const ops = [{ op:"rect", x:0, y:0, w:w, h:h, t:"c" }];
  (c.caverns || []).forEach((v,i) => ops.push({ op:"blob", x:v[0], y:v[1], r:v[2], t:"C", seed:c.seed+i*13 }));
  ops.push({ op:"vpath", x:17, y1:c.bossY+3, y2:h-3, t:"F", wide:2 });
  (c.branches || []).forEach(op => ops.push(op));
  ops.push({ op:"rect", x:c.bossX, y:c.bossY, w:12, h:6, t:"F" });
  ops.push({ op:"rect", x:15, y:h-5, w:6, h:4, t:"F" });
  ops.push({ op:"border", t:"c" });
  ops.push({ op:"cells", list:[[17,h-3,"^"],[18,h-3,"^"]] });
  return {
    name:c.name, size:c.size, base:"c", rate:c.rate, levels:c.levels,
    ops, spawn:[17,h-3], dark:true, region:"dungeon",
    warps:[ { x:17, y:h-1, to:c.exit[0], tx:c.exit[1], ty:c.exit[2] },
            { x:18, y:h-1, to:c.exit[0], tx:c.exit[1], ty:c.exit[2] } ],
    npcs:c.npcs, encounters:c.encounters,
  };
}

/* ---------------------------------------------------------------
   GYMS
   A chapel is a zone with no wild encounters: three trainers standing
   in the aisles and a leader at the altar, each a separate 1-on-1.
   --------------------------------------------------------------- */
function gymZone(c){
  const ops = [
    { op:"rect", x:0, y:0, w:20, h:17, t:"G" },
    { op:"border", t:"W" },
    { op:"cells", list:[[4,4,"P"],[15,4,"P"],[4,10,"P"],[15,10,"P"],[9,1,"P"],[10,1,"P"]] },
    { op:"cells", list:[[9,2,"^"],[10,2,"^"]] },
  ];
  return {
    name:c.name, size:[20,17], base:"G", rate:0, levels:[1,1],
    ops, spawn:[9,14], region:"gym", chapel:c.school,
    warps:[ { x:9,  y:16, to:c.exit[0], tx:c.exit[1], ty:c.exit[2] },
            { x:10, y:16, to:c.exit[0], tx:c.exit[1], ty:c.exit[2] } ],
    npcs:c.npcs, encounters:[],
  };
}
/* trainer and leader placement is identical in every chapel, so the maps stay readable */
function chapel(c){
  const tl = c.trainers;
  const npcs = [
    { x:15, y:13, kind:"sign", name:"Chapel Rules",
      line:c.name.toUpperCase() + " — " + (SCHOOLS[c.school] ? SCHOOLS[c.school].name : "Mixed") +
           " discipline. Beat the aisle, then the altar. Nothing wild walks in here." },
    { x:6,  y:11, kind:"trainer", flag:c.id+"_t1", school:c.school,
      name:tl[0].name, foeName:tl[0].name, spec:tl[0].spec,
      line:tl[0].line, defeatLine:"Go on up. The next one's harder than me.",
      reward:{ gold:tl[0].gold, items:tl[0].items } },
    { x:13, y:8, kind:"trainer", flag:c.id+"_t2", school:c.school,
      name:tl[1].name, foeName:tl[1].name, spec:tl[1].spec,
      line:tl[1].line, defeatLine:"Fair. Keep going.",
      reward:{ gold:tl[1].gold, items:tl[1].items } },
    { x:6,  y:6, kind:"trainer", flag:c.id+"_t3", school:c.school,
      name:tl[2].name, foeName:tl[2].name, spec:tl[2].spec,
      line:tl[2].line, defeatLine:"Last one before the altar. Good luck.",
      reward:{ gold:tl[2].gold, items:tl[2].items } },
    { x:9,  y:3, kind:"leader", flag:c.id+"_leader", school:c.school,
      name:c.leader.name, foeName:c.leader.name + ", " + c.leader.title, spec:c.leader.spec,
      line:c.leader.line, defeatLine:c.leader.defeatLine,
      reward:{ gold:c.leader.gold, items:c.leader.items, badge:c.badge } },
  ];
  ZONE_DEFS[c.id] = gymZone({ name:c.name, school:c.school, exit:c.exit, npcs });
  /* punch the door into the host zone */
  const host = ZONE_DEFS[c.host];
  host.ops.push({ op:"cells", list:[[c.door[0], c.door[1], "T"]] });
  host.warps.push({ x:c.door[0], y:c.door[1], to:c.id, tx:9, ty:14 });
}

function caveMouth(host, x, y, to){
  const h = ZONE_DEFS[host];

  const d = ZONE_DEFS[to];
  h.warps.push({ x, y, to, tx:d.spawn[0], ty:d.spawn[1] });
}

function trainerLoot(level){
  if (level < 12) return { salve:2, draught:1 };
  if (level < 22) return { greater_salve:2, draught:2 };
  if (level < 32) return { greater_salve:2, greater_draught:2, runed_sigil:1 };
  if (level < 42) return { greater_salve:3, greater_draught:3, master_sigil:1 };
  return { elixir:2, master_sigil:1, ascension_draught:1 };
}
for (const t of OVERWORLD_TRAINERS){
  const host = ZONE_DEFS[t.zone];
  if (!host) continue;
  const lv = Math.min(MAX_LEVEL, host.levels[1] + t.plus);
  host.npcs.push({
    x:t.at[0], y:t.at[1], kind:"trainer", road:true,
    flag:"road_" + t.zone + "_" + t.at[0] + "_" + t.at[1],
    school:t.school, name:t.name, foeName:t.name,
    spec:[[t.arch, lv]],
    line:t.line,
    defeatLine:"Good. The road's yours. Watch the grass, it's full of people worse than me.",
    reward:{ gold: lv * 28, items: trainerLoot(lv) },
  });
}

/* a smooth, seeded, irregular outline */
function regionOutline(r){
  if (r._pts) return r._pts;
  const n = 20, rng = mulberry(r.seed), off = [];
  for (let i=0;i<n;i++) off.push(0.62 + rng()*0.76);
  for (let pass=0; pass<2; pass++)
    for (let i=0;i<n;i++)
      off[i] = (off[(i-1+n)%n] + 2*off[i] + off[(i+1)%n]) / 4;
  const pts = [];
  for (let i=0;i<n;i++){
    const a = (i/n) * Math.PI * 2;
    pts.push([ r.cx + Math.cos(a)*r.rx*off[i], r.cy + Math.sin(a)*r.ry*off[i] ]);
  }
  r._pts = pts;
  return pts;
}

/* ============================================================
   CORE  —  state, stats, leveling, talents, recruiting

const cv = document.getElementById("screen");

function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function rf(a,b){ return a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function weighted(list){
  let tot = 0; for (const e of list) tot += e.w;
  let r = Math.random()*tot;
  for (const e of list){ r -= e.w; if (r <= 0) return e; }
  return list[list.length-1];
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------------- experience ---------------- */
function totalXpFor(level){ return Math.floor(0.8 * level*level*level); }
function xpToNext(u){ return totalXpFor(u.level+1) - totalXpFor(u.level); }

/* ---------------- talents ---------------- */
function emptyTalents(){
  const t = {};
  for (const id of NODE_IDS) t[id] = 0;
  return t;
}
function unitTree(u){ return treeOf(ARCHETYPES[u.arch].school); }
function branchSpend(u, b){
  let s = 0;
  for (const n of unitTree(u)[b]) s += (u.talents[n.id]||0);
  return s;
}
const ZERO_BONUS = { atkPct:0, defPct:0, spdPct:0, hpPct:0, mpPct:0, critPct:0, schoolPct:0,
                     statusRes:0, regen:0, critDmg:0, lowHpDmg:0, thorns:0, evadePct:0,
                     accPct:0, healPct:0, drainPct:0, statusPct:0, xpPct:0 };
function talentBonus(u){
  const o = Object.assign({ caps:{} }, ZERO_BONUS);
  const tree = unitTree(u);
  for (const b of BRANCH_KEYS) for (const n of tree[b]){
    const r = u.talents[n.id]||0; if (!r) continue;
    for (const k in n.eff){
      if (k === "cap") o.caps[n.eff.cap] = true;
      else o[k] = (o[k]||0) + n.eff[k] * r;
    }
  }
  /* a held charm folds into the same numbers, so nothing downstream is special-cased */
  const ch = u.held && ITEMS[u.held] && ITEMS[u.held].kind === "charm" ? ITEMS[u.held] : null;
  if (ch) for (const k in ch.eff){
    if (k === "cap") o.caps[ch.eff.cap] = true;
    else o[k] = (o[k]||0) + ch.eff[k];
  }
  return o;
}
function canLearnTalent(u, b, node){
  if ((u.talents[node.id]||0) >= node.max) return false;
  if (u.tp <= 0) return false;
  if (node.req && branchSpend(u,b) < node.req) return false;
  return true;
}
function heldOf(u){
  return (u.held && ITEMS[u.held] && ITEMS[u.held].kind === "charm") ? ITEMS[u.held] : null;
}

/* ---------------- stats ---------------- */
function rawStat(u, key){
  const A = ARCHETYPES[u.arch];
  const idx = { hp:0, mp:1, atk:2, def:3, spd:4 }[key];
  const b = A.base[idx], a = u.spark[key], L = u.level;
  if (key === "hp") return Math.floor(((2*b + a) * L)/100) + L + 12;
  if (key === "mp") return Math.floor(((2*b + a) * L)/100) + 10;
  return Math.floor(((2*b + a) * L)/100) + 5;
}
function badgeBonus(key){
  let p = 0;
  const held = state && state.badges ? state.badges : null;
  if (!held) return 0;
  for (const id in held){
    if (!held[id]) continue;
    const b = BADGES[id];
    if (b && b.stat === key) p += b.pct;
  }
  return p;
}
function badgeCount(){
  if (!state || !state.badges) return 0;
  return BADGE_KEYS.filter(k => state.badges[k]).length;
}
function statOf(u, key){
  const t = talentBonus(u);
  let v = rawStat(u, key);
  let pct = { hp:t.hpPct, mp:t.mpPct, atk:t.atkPct, def:t.defPct, spd:t.spdPct }[key] || 0;
  pct += badgeBonus(key);
  return Math.max(1, Math.floor(v * (1 + pct/100)));
}
function recalc(u){
  u.maxHp = statOf(u,"hp");
  u.maxMp = statOf(u,"mp");
  if (u.hp == null) u.hp = u.maxHp;
  if (u.mp == null) u.mp = u.maxMp;
  u.hp = clamp(u.hp, 0, u.maxHp);
  u.mp = clamp(u.mp, 0, u.maxMp);
}

/* Roughly one wild wanderer in two hundred turns up rare: same archetype, a
   different dye lot, and Spark rolled near the ceiling. The Spark is the prize —
   rewards are untouched, so this is a collecting hook, not a power spike. */
const RARE_CHANCE = 0.005;
function rollRare(){ return state.cheats.alwaysRare || Math.random() < RARE_CHANCE; }

let UID = 1;
function makeUnit(archId, level, opts){
  opts = opts || {};
  const A = ARCHETYPES[archId];
  const u = {
    uid: UID++,
    arch: archId,
    name: opts.name || pick(NAMES[A.school]),
    level: level,
    xp: totalXpFor(level),
    spark: opts.legend
      ? { hp:ri(14,15), mp:ri(14,15), atk:ri(14,15), def:ri(14,15), spd:ri(14,15) }
      : (opts.rare
        ? { hp:ri(12,15), mp:ri(12,15), atk:ri(12,15), def:ri(12,15), spd:ri(12,15) }
        : { hp:ri(0,15), mp:ri(0,15), atk:ri(0,15), def:ri(0,15), spd:ri(0,15) }),
    rare: !!opts.rare,
    legend: !!opts.legend,
    spells: [],
    talents: emptyTalents(),
    tp: 0,
    status: null, statusDur: 0,
    hp: null, mp: null,
    held: null,
    wild: !!opts.wild,
  };
  /* every spell whose learn level is <= current, newest 4 kept */
  const known = A.learn.filter(e => e[0] <= level).map(e => e[1]);
  const uniq = [];
  for (const s of known) if (!uniq.includes(s)) uniq.push(s);
  u.spells = uniq.slice(-4);
  if (!u.spells.length) u.spells = ["staff_strike"];
  /* Someone you raised earns a point a level. Someone you bind arrives with a
     third of that — enough to shape them, not enough to skip raising your own. */
  u.tpEarned = opts.wild ? boundTp(level) : tpEarnedBy(level);
  u.tp = u.tpEarned;
  recalc(u);
  return u;
}
function tpEarnedBy(level){
  let tp = level - 1;
  for (const m of TP_MILESTONES) if (level >= m) tp += 1;
  return Math.max(0, tp);
}
function boundTp(level){ return Math.floor(level / 3); }

function schoolOf(u){ return ARCHETYPES[u.arch].school; }
function archName(u){ return ARCHETYPES[u.arch].name; }

/* ---------------- growth ---------------- */
function gainXp(u, amount){
  const ev = [];
  if (u.hp <= 0) return ev;
  u.xp += amount;
  while (u.level < MAX_LEVEL && u.xp >= totalXpFor(u.level+1)){
    u.level++;
    const before = u.maxHp;
    const beforeTp = u.tp;
    if (u.tpEarned == null) u.tpEarned = tpEarnedBy(u.level - 1);
    u.tpEarned += 1 + (TP_MILESTONES.includes(u.level) ? 1 : 0);
    u.tp = u.tpEarned - spentTp(u);
    recalc(u);
    u.hp += (u.maxHp - before);
    ev.push({ t:"level", level:u.level, hpGain:u.maxHp-before, tpGain:u.tp-beforeTp });
    /* new spells */
    const A = ARCHETYPES[u.arch];
    for (const [lv, sid] of A.learn){
      if (lv === u.level && !u.spells.includes(sid)) ev.push({ t:"spell", id:sid });
    }
    /* Ascension. The first three stages happen on schedule; the fourth costs
       an Oathstone, so reaching Level 70 is not the same as ascending and the
       player decides who spends the stone. A blocked ascension reports itself
       rather than failing silently, or it looks like a bug. */
    if (A.ascend && u.level >= A.ascend.at){
      const need = A.ascend.needs;
      if (need && !(state.bag[need] > 0)){
        if (!u._oathTold){
          u._oathTold = true;
          ev.push({ t:"oathblocked", item:need, into:A.ascend.into });
        }
      } else {
        if (need){ useBagItem(need); delete u._oathTold; }
        const into = A.ascend.into;
        u.arch = into;
        recalc(u);
        u.hp = u.maxHp;
        ev.push({ t:"ascend", into:into });
      }
    }
  }
  return ev;
}
/* Ascending a pact who is already past the threshold. Returns a reason string
   on refusal so the satchel can say why rather than swallowing the press. */
function ascendReady(u){
  const A = ARCHETYPES[u.arch];
  if (!A || !A.ascend) return "no";
  if (u.level < A.ascend.at) return "level";
  return "ok";
}
function spendOath(u){
  const A = ARCHETYPES[u.arch];
  if (!A || !A.ascend) return { ok:false, why:"no" };
  if (u.level < A.ascend.at) return { ok:false, why:"level", at:A.ascend.at };
  const need = A.ascend.needs;
  if (need && !(state.bag[need] > 0)) return { ok:false, why:"item" };
  if (need) useBagItem(need);
  delete u._oathTold;
  const into = A.ascend.into;
  u.arch = into;
  recalc(u);
  u.hp = u.maxHp;
  return { ok:true, into:into };
}
function spentTp(u){
  let s = 0; for (const k in u.talents) s += u.talents[k];
  return s;
}
/* Ascension replaces the archetype, so a Pyre Magus's own learn table has
   forgotten everything the Cinder Acolyte ever knew. Walk the chain backwards
   so the relearner can offer the whole history, not just the current form. */
function archChainTo(archId){
  const chain = [archId];
  let cur = archId, guard = 0;
  while (guard++ < 6){
    let prev = null;
    for (const id in ARCHETYPES){
      const A = ARCHETYPES[id];
      if (A.ascend && A.ascend.into === cur){ prev = id; break; }
    }
    if (!prev) break;
    chain.unshift(prev); cur = prev;
  }
  return chain;
}
function learnableFor(u){
  const all = [];
  for (const id of archChainTo(u.arch)){
    for (const e of ARCHETYPES[id].learn){
      if (e[0] <= u.level && all.indexOf(e[1]) < 0) all.push(e[1]);
    }
  }
  return all.filter(sid => u.spells.indexOf(sid) < 0);
}
/* priced off what the spell does, so getting a starter move back is cheap and
   recovering a finisher is a decision */
function relearnCost(sid){
  const S = SPELLS[sid];
  const w = S.kind === "dmg" ? S.power : 60;
  return 120 + w * 6;
}

function learnSpell(u, sid){
  if (u.spells.includes(sid)) return;
  if (u.spells.length < 4) u.spells.push(sid);
  else u.spells[3] = sid;
}
function xpBonus(u){ const t = talentBonus(u); return 1 + (t.xpPct||0)/100; }
function xpReward(enemy){
  const A = ARCHETYPES[enemy.arch];
  /* XP_RATE lands here rather than in awardKill, so it applies to every kind
     of fight and to the half-share the rest of the party gets */
  return Math.max(1, Math.floor((A.xp * enemy.level * XP_RATE) / 6));
}
function goldReward(enemy){
  return Math.max(2, Math.floor(enemy.level * ri(3,7)));
}

/* ---------------- recruiting ---------------- */
/* `view` lets the battle plate quote the odds the player can currently SEE --
   the animating bar and the status badge -- while the actual roll still uses
   the unit's true state. */
function recruitChance(enemy, sigilMult, view){
  const A = ARCHETYPES[enemy.arch];
  const hpNow = (view && view.hp != null) ? view.hp : enemy.hp;
  const stNow = (view && "status" in view) ? view.status : enemy.status;
  const M = enemy.maxHp, C = Math.max(1, hpNow);
  let statusMult = 1;
  if (stNow === "root" || stNow === "chill" || stNow === "dazed") statusMult = 1.6;
  else if (stNow) statusMult = 1.3;
  const levelFactor = clamp(1.25 - enemy.level/80, 0.35, 1.25);
  const z = ZONES[state.zone];
  const zoneResist = (z && z.bindResist) ? z.bindResist : 1;
  const a = ((3*M - 2*C) / (3*M)) * A.catch * sigilMult * statusMult * levelFactor * zoneResist;
  return clamp(a/255, 0.015, 0.985);
}
function rollRecruit(p){
  const per = Math.pow(p, 0.25);
  let shakes = 0;
  for (let i=0;i<4;i++){ if (Math.random() < per) shakes++; else break; }
  return { ok: shakes === 4, shakes };
}

function partyAlive(){ return state.party.filter(u => u.hp > 0); }
function firstAlive(){ return state.party.find(u => u.hp > 0) || null; }
function fullHeal(){
  for (const u of state.party.concat(state.roster)){
    recalc(u); u.hp = u.maxHp; u.mp = u.maxMp; u.status = null; u.statusDur = 0;
  }
