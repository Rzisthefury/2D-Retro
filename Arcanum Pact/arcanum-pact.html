function addUnit(u){
  u.wild = false;
  state.bound[u.arch] = (state.bound[u.arch] || 0) + 1;
  if (u.rare) state.rareBound[u.arch] = (state.rareBound[u.arch] || 0) + 1;
  if (state.party.length < 6){ state.party.push(u); return "party"; }
  state.roster.push(u); return "roster";
}
function bagCount(id){ return state.bag[id] || 0; }
function useBagItem(id){ if (state.bag[id] > 0){ state.bag[id]--; if (!state.bag[id]) delete state.bag[id]; return true; } return false; }
function giveItem(id,n){ state.bag[id] = (state.bag[id]||0) + (n||1); }
/* ============================================================
   RENDER  —  UI primitives, sprites, overworld
   ============================================================ */

const FONT = (sz, w) => (w||"bold")+" "+sz+"px 'Trebuchet MS', 'Segoe UI', sans-serif";

function txt(s, x, y, o){
  o = o || {};
  ctx.font = FONT(o.size||14, o.weight);
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  if (o.shadow !== false){
    ctx.fillStyle = o.shadowColor || "rgba(0,0,0,.75)";
    ctx.fillText(s, x+1, y+1);
  }
  ctx.fillStyle = o.color || "#e8e2d5";
  ctx.fillText(s, x, y);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
}
function measure(s, size, weight){ ctx.font = FONT(size||14, weight); return ctx.measureText(s).width; }

function panel(x,y,w,h,o){
  o = o || {};
  ctx.fillStyle = o.fill || "rgba(20,16,32,.94)";
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = o.edge || "#6a5a93";
  ctx.lineWidth = 2;
  ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.strokeStyle = o.edge2 || "rgba(255,255,255,.08)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x+4,y+4,w-8,h-8);
}
function bar(x,y,w,h,pct,col,bg){
  pct = clamp(pct,0,1);
  ctx.fillStyle = bg || "#13101c"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = col; ctx.fillRect(x+1,y+1,Math.max(0,Math.round((w-2)*pct)),h-2);
  ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 1; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
}
function hpColor(pct){ return pct > .5 ? "#5fc45a" : (pct > .2 ? "#e0c24a" : "#e05a4a"); }

/* three diamonds, filled to the archetype's tier — the same progression the
   sprite shows, in a form a list can carry */
function tierPips(x, y, tier, col){
  for (let i=0;i<4;i++){
    const on = i < tier, px = x + i*8;
    ctx.beginPath();
    ctx.moveTo(px+3, y-3); ctx.lineTo(px+6, y); ctx.lineTo(px+3, y+3); ctx.lineTo(px, y);
    ctx.closePath();
    if (on){ ctx.fillStyle = col; ctx.fill(); }
    ctx.strokeStyle = on ? shadeHex(col, -0.35) : "#3a3150";
    ctx.lineWidth = 1; ctx.stroke();
  }
}

function schoolPill(sch, x, y, o){
  o = o || {};
  const S = SCHOOLS[sch];
  if (!S){ return; }
  const label = S.name.toUpperCase();
  const w = measure(label, o.size||10) + 14;
  ctx.fillStyle = S.dark; ctx.fillRect(x,y,w,14);
  ctx.strokeStyle = S.color; ctx.lineWidth = 1; ctx.strokeRect(x+.5,y+.5,w-1,13);
  txt(label, x+w/2, y+10, { size:o.size||10, color:S.color, align:"center" });
  return w;
}

/* ---------------- sprite drawing ----------------
   Sprite space is 12 wide x 16 tall, origin at the top-left of the figure.

   Three things carry identity, in descending order of legibility at 32px:

     SILHOUETTE  `build` sets the body — caster, warden or skirmisher — and
                 `tier` widens the shoulders. A tier-3 set is recognisable
                 across the screen because its outline is broken by things
                 sticking out of it, not because it has more detail.
     PALETTE     the archetype's three colours, lit down the left and shaded
                 down the right so the figure reads as a volume, not a decal.
     ORNAMENT    gems, rivets, visors. Battle scale only; at overworld scale
                 they turn to mush and cost legibility.

   Body geometry is collected into `ops` and drawn twice: once expanded in ink
   for a single clean outer outline, then in colour. Anything drawn after the
   two passes sits on top and is not outlined. */

const SPRITE_INK = "#120d1a";
/* at the top tier these schools lose the face entirely — a shadowed hood with
   two lit eyes. The other four keep a visible face under a crown or crest. */
const HOODED_AT_TOP = { ember:true, storm:true, umbra:true };

function shadeHex(hex, amt){
  let r, g, b;
  const str = String(hex);
  if (str.charAt(0) === "#"){
    const n = parseInt(str.slice(1), 16);
    r = (n>>16)&255; g = (n>>8)&255; b = n&255;
  } else {
    const m = /(\d+)\D+(\d+)\D+(\d+)/.exec(str) || [0,0,0,0];
    r = +m[1]; g = +m[2]; b = +m[3];
  }
  if (amt >= 0){ r += (255-r)*amt; g += (255-g)*amt; b += (255-b)*amt; }
  else { const k = 1+amt; r *= k; g *= k; b *= k; }
  return "rgb(" + (r|0) + "," + (g|0) + "," + (b|0) + ")";
}
/* rare wanderers wear the same gear in a different dye lot — a hue rotation
   keeps the archetype recognisable while making the individual unmistakable */
function hueShift(hex, deg, satBoost){
  const n = parseInt(String(hex).slice(1), 16);
  let r = ((n>>16)&255)/255, g = ((n>>8)&255)/255, b = (n&255)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn;
  let h = 0; const l = (mx+mn)/2;
  let sat = d === 0 ? 0 : d / (1 - Math.abs(2*l - 1));
  if (d !== 0){
    if (mx === r) h = ((g-b)/d) % 6;
    else if (mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  h = (h + deg) % 360;
  sat = Math.min(1, sat * (satBoost || 1.25));
  const c = (1 - Math.abs(2*l - 1)) * sat, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  let rr, gg, bb;
  if (h < 60){ rr=c; gg=x; bb=0; } else if (h < 120){ rr=x; gg=c; bb=0; }
  else if (h < 180){ rr=0; gg=c; bb=x; } else if (h < 240){ rr=0; gg=x; bb=c; }
  else if (h < 300){ rr=x; gg=0; bb=c; } else { rr=c; gg=0; bb=x; }
  return "rgb(" + (((rr+m)*255)|0) + "," + (((gg+m)*255)|0) + "," + (((bb+m)*255)|0) + ")";
}

const SHOULDER = {
  caster:     [0, 3.0, 3.7, 4.4, 5.0],
  warden:     [0, 3.4, 4.2, 5.2, 5.9],
  skirmisher: [0, 2.4, 2.9, 3.5, 4.1],
};
function tierOf(arch){ const A = ARCHETYPES[arch]; return (A && A.tier) || 1; }
function buildOf(arch){ const A = ARCHETYPES[arch]; return (A && A.build) || "caster"; }

function drawFigure(cx, footY, scale, arch, facing, frame, opts){
  opts = opts || {};
  const A = ARCHETYPES[arch] || ARCHETYPES.cinder_acolyte;
  const S = SCHOOLS[A.school] || SCHOOLS.ember;
  const tier = A.tier || 1;
  const build = A.build || "caster";
  const detail = scale >= 3;              /* battle scale earns the fine pass */
  const sw = SHOULDER[build][tier];
  const ox = cx - 6*scale, oy = footY - 16*scale;
  const P = (x,y,w,h,c) => { ctx.fillStyle = c;
    ctx.fillRect(Math.round(ox+x*scale), Math.round(oy+y*scale),
                 Math.max(1, Math.ceil(w*scale)), Math.max(1, Math.ceil(h*scale))); };

  const rare = !!opts.rare;
  const robe = rare ? hueShift(A.robe, 145) : A.robe;
  const trim = rare ? hueShift(A.trim, 145) : A.trim;
  const hat  = rare ? hueShift(A.hat, 145) : A.hat;
  const lit = shadeHex(robe, 0.20), dark = shadeHex(robe, -0.32);
  const hatDark = shadeHex(hat, -0.22), hatLit = shadeHex(hat, 0.16);
  const cloak = shadeHex(hat, -0.48);
  /* tier 4 inherits every tier-3 flourish and then adds its own, so one flag
     keeps the whole body of the function from sprouting `|| tier === 4` */
  const isTop = tier >= 3;   /* tier 4 inherits every tier-3 flourish */
  const hooded = isTop && HOODED_AT_TOP[A.school];
  const skin = hooded ? "#180f24" : (opts.skin || "#d8a87a");
  const bob = frame ? 1 : 0;

  /* ground shadow, sized off the build so a warden reads as heavy */
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.beginPath();
  ctx.ellipse(cx, footY-1*scale, (sw+1.4)*scale, 1.9*scale, 0, 0, Math.PI*2);
  ctx.fill();

  const ops = [];
  const R = (x,y,w,h,c) => ops.push([x,y,w,h,c]);

  /* ---- weapon, behind the body when facing away ---- */
  const wx = facing === "left" ? 0.9 : 10.1;
  const drawWeapon = () => {
    if (build === "warden"){
      /* hammer: short haft, block head that grows with tier */
      R(wx, 5.6+bob, 1.0, 9.4, "#6b4a2c");
      const hw = 1.6 + tier*0.5, hh = 1.4 + tier*0.35;
      R(wx+0.5-hw/2, 4.4+bob, hw, hh, tier >= 2 ? trim : "#8a8078");
      if (isTop) R(wx+0.5-hw/2-0.5, 4.9+bob, hw+1.0, 0.7, S.color);
    } else if (build === "skirmisher"){
      /* paired blades — one held out, one crossed behind at the top tier */
      R(wx, 6.4+bob, 1.1, 5.8, tier >= 2 ? trim : "#9a9088");
      R(wx-0.6, 12.0+bob, 2.3, 0.8, "#5a4028");
      R(wx+0.1, 12.6+bob, 0.9, 1.6, "#6b4a2c");
      if (isTop){ R(wx + (facing === "left" ? 1.6 : -1.6), 8.2+bob, 0.7, 4.2, trim); }
    } else {
      /* staff: the orb is the tier tell */
      R(wx, 3.0+bob, 1.0, 12.0, "#6b4a2c");
      if (tier >= 2) R(wx-0.3, 6.4+bob, 1.6, 0.8, trim);
      const orb = 1.4 + tier*0.45;
      R(wx+0.5-orb/2, 3.2+bob-orb, orb, orb*1.05, S.color);
    }
  };
  if (facing === "up") drawWeapon();

  /* ---- body ---- */
  if (build === "warden"){
    if (isTop) R(6-sw-0.4, 6.9, (sw+0.4)*2, 9.1-bob, cloak);
    R(6-2.4, 13.4-bob, 1.8, 2.6, dark);
    R(6+0.6, 13.4-bob, 1.8, 2.6, dark);
    R(6-2.8, 11.5-bob, 5.6, 2.2, robe);
    R(6-2.4, 7.8, 4.8, 4.0, robe);
    R(6-2.4, 9.6, 4.8, 1.0, trim);
    R(6-sw, 7.1, sw-1.9, 2.5, tier >= 2 ? trim : dark);
    R(6+1.9, 7.1, sw-1.9, 2.5, tier >= 2 ? trim : dark);
    if (isTop){
      R(6-sw-0.7, 6.0, 1.3, 1.7, trim);
      R(6+sw-0.6, 6.0, 1.3, 1.7, trim);
    }
    R(6-3.0, 9.7, 1.3, 2.6, dark);
    R(6+1.7, 9.7, 1.3, 2.6, dark);
  } else if (build === "skirmisher"){
    if (tier >= 2) R(6-sw-0.5, 7.5, (sw+0.5)*2, 8.3-bob, cloak);
    if (isTop){
      R(6-sw-1.6, 11.6-bob, 1.8, 4.4, cloak);
      R(6+sw-0.2, 11.6-bob, 1.8, 4.4, cloak);
    }
    R(6-1.8, 13.0-bob, 1.4, 3.0, dark);
    R(6+0.4, 13.0-bob, 1.4, 3.0, dark);
    R(6-2.0, 8.4, 4.0, 4.8-bob, robe);
    R(6-2.1, 11.3-bob, 4.2, 0.9, trim);
    if (tier >= 2) R(6-sw, 7.7, sw*2, 1.2, trim);
    if (isTop){
      R(6-sw-0.3, 6.4, 1.0, 1.7, trim);
      R(6+sw-0.7, 6.4, 1.0, 1.7, trim);
    }
    R(6-2.6, 9.0, 1.1, 2.6, dark);
    R(6+1.5, 9.0, 1.1, 2.6, dark);
  } else {
    if (isTop) R(6-sw-0.4, 7.3, (sw+0.4)*2, 8.8-bob, cloak);
    R(6-2.9, 14.5-bob, 5.8, 1.5, dark);
    R(6-2.6, 11.5-bob, 5.2, 3.2, robe);
    R(6-2.1, 8.5, 4.2, 3.2, robe);
    R(6-0.5, 9.0, 1.0, 5.4-bob, trim);
    if (tier >= 2) R(6-2.7, 11.3-bob, 5.4, 0.9, trim);
    if (tier >= 2){
      R(6-sw, 7.9, sw-1.5, 2.3, trim);
      R(6+1.5, 7.9, sw-1.5, 2.3, trim);
    }
    if (isTop){
      R(6-sw-0.5, 7.2, 1.1, 1.5, trim);
      R(6+sw-0.6, 7.2, 1.1, 1.5, trim);
    }
    R(6-2.9, 9.0, 1.2, 2.8, dark);
    R(6+1.7, 9.0, 1.2, 2.8, dark);
  }

  /* ---- head and headgear ---- */
  R(4, 4, 4, 4.2, skin);
  if (build === "warden"){
    R(3.8, 3.1, 4.4, 2.3, hatLit);
    R(3.6, 5.3, 4.8, 1.2, hatDark);            /* brow of the visor */
    if (tier >= 2) R(5.6, 2.0, 0.8, 1.4, trim);
    if (isTop){
      R(2.9, 2.6, 1.2, 2.2, trim);
      R(7.9, 2.6, 1.2, 2.2, trim);
    }
  } else if (build === "skirmisher"){
    R(3.9, 2.7, 4.2, 1.8, hat);
    R(3.4, 4.0, 1.1, 3.6, hat);
    R(7.5, 4.0, 1.1, 3.6, hat);
    R(4.3, 4.3, 3.4, 0.9, shadeHex(hat, -0.45));   /* the hood's own shadow */
    if (tier >= 2) R(4.4, 2.0, 3.2, 1.1, hat);
    if (isTop) R(5.4, 1.1, 1.2, 1.1, trim);
  } else {
    const hatTop = isTop ? -0.9 : (tier === 2 ? 0.1 : 0.8);
    R(5.2, hatTop, 1.6, 1.5, hat);
    R(4.7, hatTop+1.4, 2.6, 1.3, hat);
    R(4.2, hatTop+2.6, 3.6, 1.4, hat);
    R(2.6, 3.5, 6.8, 1.1, hat);
    if (tier >= 2) R(2.6, 3.5, 6.8, 0.5, trim);
    if (isTop){
      R(2.4, 2.9, 1.0, 1.3, trim);
      R(8.6, 2.9, 1.0, 1.3, trim);
    }
  }

  /* two passes: one outline, one colour */
  for (let i=0;i<ops.length;i++){ const o = ops[i]; P(o[0]-0.4, o[1]-0.4, o[2]+0.8, o[3]+0.8, SPRITE_INK); }
  for (let i=0;i<ops.length;i++){ const o = ops[i]; P(o[0], o[1], o[2], o[3], o[4]); }

  /* ---- form shading: a lit edge and a shadow column over the torso ---- */
  ctx.globalAlpha = 0.16;
  P(6+0.9, 8.2, 2.4, 6.2-bob, "#000");
  ctx.globalAlpha = 0.11;
  P(6-2.7, 8.4, 0.9, 5.6-bob, "#fff");
  ctx.globalAlpha = 1;

  /* ---- face ---- */
  if (hooded){
    /* shadow under the hood, two lit eyes */
    P(4.2, 4.6, 3.6, 2.6, "#0d0916");
    const ey = facing === "up" ? null : 5.6;
    if (ey != null){
      ctx.globalAlpha = 0.9;
      if (facing === "left")       P(4.4, ey, 1.0, 0.9, S.color);
      else if (facing === "right") P(6.6, ey, 1.0, 0.9, S.color);
      else { P(4.6, ey, 0.9, 0.9, S.color); P(6.5, ey, 0.9, 0.9, S.color); }
      ctx.globalAlpha = 0.28;
      P(4.2, ey-0.4, 3.6, 1.7, S.color);
      ctx.globalAlpha = 1;
    }
  } else if (build === "warden"){
    /* a plated face is a slit with two lit points in it — readable at 32px in a
       way that eyes under a helm never are */
    P(3.9, 5.4, 4.2, 1.0, "#100c18");
    if (facing !== "up"){
      ctx.globalAlpha = 0.95;
      if (facing === "left")       P(4.3, 5.6, 1.1, 0.6, S.color);
      else if (facing === "right") P(6.6, 5.6, 1.1, 0.6, S.color);
      else { P(4.6, 5.6, 1.0, 0.6, S.color); P(6.4, 5.6, 1.0, 0.6, S.color); }
      ctx.globalAlpha = 0.22; P(3.9, 5.2, 4.2, 1.4, S.color); ctx.globalAlpha = 1;
    }
  } else if (facing !== "up"){
    const eye = "#241608";
    P(4.2, 5.2, 3.6, 0.4, shadeHex(skin, -0.35));        /* brow line */
    if (facing === "left"){ P(4.3, 5.7, 1.1, 1.1, eye); P(3.6, 4.1, 1.0, 3.6, hatDark); }
    else if (facing === "right"){ P(6.6, 5.7, 1.1, 1.1, eye); P(7.4, 4.1, 1.0, 3.6, hatDark); }
    else { P(4.6, 5.7, 1.1, 1.1, eye); P(6.3, 5.7, 1.1, 1.1, eye); }
  } else {
    P(4, 4, 4, 3.4, hatDark);
  }

  /* ---- battle-scale ornament ---- */
  if (detail){
    if (tier >= 2){
      P(6-0.55, 9.3, 1.1, 1.1, S.color);                 /* school emblem */
      ctx.globalAlpha = 0.55; P(6-0.9, 9.0, 1.8, 1.7, S.color); ctx.globalAlpha = 1;
    }
    if (isTop){
      /* rivets along the pauldrons read as craftsmanship at 60px */
      const py = build === "warden" ? 7.7 : 8.6;
      P(6-sw+0.4, py, 0.5, 0.5, shadeHex(trim, 0.4));
      P(6+sw-0.9, py, 0.5, 0.5, shadeHex(trim, 0.4));
      P(6-0.35, build === "warden" ? 11.9 : 12.4, 0.7, 0.7, S.color);   /* belt gem */
    }
    if (tier >= 2) P(6-2.2, 14.2-bob, 4.4, 0.4, shadeHex(trim, 0.25));
  }

  if (facing !== "up") drawWeapon2(P, R, build, tier, wx, bob, S, trim, facing);

  /* ---- the top tier moves on its own, in its school's idiom ---- */
  if (isTop) tierAura(P, A.school, S.color, bob);
  /* tier 4 stands in its school's light permanently rather than flickering
     through it, and carries wings and a crown that break the outline further
     than any tier-3 spike does */
  if (tier >= 4) apotheosis(ox, oy, scale, P, S.color, trim, bob);
  if (rare) rareShimmer(P, S.color);

  if (opts.faint){
    ctx.globalAlpha = .55;
    ctx.fillStyle = "#000";
    ctx.fillRect(ox, oy-2*scale, 12*scale, 18*scale);
    ctx.globalAlpha = 1;
  }
}

/* the weapon is drawn outside the outline passes when it is in front, so it
   keeps its own clean edge against the body */
function drawWeapon2(P, R, build, tier, wx, bob, S, trim, facing){
  const ink = SPRITE_INK;
  const put = (x,y,w,h,c) => { P(x-0.35,y-0.35,w+0.7,h+0.7, ink); P(x,y,w,h,c); };
  if (build === "warden"){
    put(wx, 5.6+bob, 1.0, 9.4, "#6b4a2c");
    const hw = 1.6 + tier*0.5, hh = 1.4 + tier*0.35;
    put(wx+0.5-hw/2, 4.4+bob, hw, hh, tier >= 2 ? trim : "#8a8078");
    if (tier >= 3) P(wx+0.5-hw/2-0.5, 4.9+bob, hw+1.0, 0.7, S.color);
  } else if (build === "skirmisher"){
    put(wx, 6.4+bob, 1.1, 5.8, tier >= 2 ? trim : "#9a9088");
    put(wx-0.6, 12.0+bob, 2.3, 0.8, "#5a4028");
    put(wx+0.1, 12.6+bob, 0.9, 1.6, "#6b4a2c");
    if (tier >= 3) put(wx + (facing === "left" ? 1.9 : -1.9), 7.8+bob, 0.9, 4.6, trim);
  } else {
    put(wx, 3.0+bob, 1.0, 12.0, "#6b4a2c");
    if (tier >= 2) put(wx-0.3, 6.4+bob, 1.6, 0.8, trim);
    const orb = 1.4 + tier*0.45;
    put(wx+0.5-orb/2, 3.2+bob-orb, orb, orb*1.05, S.color);
    if (tier >= 2){ ctx.globalAlpha = 0.35;
      P(wx+0.5-orb, 3.2+bob-orb*1.4, orb*2, orb*1.6, S.color); ctx.globalAlpha = 1; }
    if (tier >= 3){
      /* a sigil orbiting the head of the staff — two of them at tier 4 */
      for (let i=0;i<(tier >= 4 ? 2 : 1); i++){
        const a = animTick/22 + i*Math.PI;
        P(wx+0.5+Math.cos(a)*1.9-0.3, 2.6+bob+Math.sin(a)*1.3-0.3, 0.7, 0.7, S.color);
      }
    }
  }
}

/* idle motion, one idiom per school, top tier only */
function tierAura(P, school, col, bob){
  const t = animTick;
  ctx.save();
  if (school === "ember"){
    for (let i=0;i<3;i++){
      const y = 9.5 - ((t/3.2 + i*4.4) % 10);
      ctx.globalAlpha = 0.28 + 0.42*(1 - Math.abs(y-4)/6);
      P(2.2 + i*3.9, y, 0.8, 0.8, col);
    }
  } else if (school === "tide"){
    for (let i=0;i<2;i++){
      const p = ((t/26 + i*0.5) % 1);
      ctx.globalAlpha = 0.5*(1-p);
      P(6 - (2.2 + p*4), 15.4, (2.2 + p*4)*2, 0.6, col);
    }
  } else if (school === "storm"){
    if (Math.floor(t/7) % 3 === 0){
      ctx.globalAlpha = 0.75;
      P(6-2.6, 7.6 + (Math.floor(t/3)%3)*0.7, 5.2, 0.4, col);
      P(6-0.3, 6.6, 0.5, 1.4, col);
    }
  } else if (school === "umbra"){
    ctx.globalAlpha = 0.24 + 0.16*Math.sin(t/17);
    P(6-4.2, 14.6, 8.4, 1.6, "#1b0f2e");
    ctx.globalAlpha = 0.4;
    for (let i=0;i<2;i++){
      const y = 13.5 - ((t/5 + i*5) % 8);
      P(1.6 + i*7.6, y, 0.7, 0.7, col);
    }
  } else if (school === "lumen"){
    ctx.globalAlpha = 0.30 + 0.22*Math.sin(t/15);
    P(3.4, 1.4, 5.2, 0.5, col);
    P(3.0, 1.9, 0.6, 0.5, col); P(8.4, 1.9, 0.6, 0.5, col);
  } else if (school === "verdant"){
    for (let i=0;i<3;i++){
      const p = ((t/40 + i*0.34) % 1);
      ctx.globalAlpha = 0.5*(1-p);
      P(1.6 + p*8.8 + Math.sin(p*7+i)*0.6, 4 + p*10, 0.8, 0.6, col);
    }
  } else {   /* stone — shards orbiting the shoulders */
    for (let i=0;i<3;i++){
      const a = t/28 + i*2.1;
      ctx.globalAlpha = 0.42 + 0.28*Math.sin(a);
      P(6 + Math.cos(a)*5.0 - 0.4, 9 + Math.sin(a)*1.7 - 0.4, 0.9, 0.9, col);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* The fourth-stage overlay. Stacked rectangles were the wrong primitive here:
   three bars a side read as extra arms, and one big translucent rect reads as
   a coloured box rather than a glow. Wings are swept curves and the aura is a
   radial gradient, both drawn in sprite space through the same ox/oy/scale the
   rest of the figure uses. */
function apotheosis(ox, oy, scale, P, col, trim, bob){
  const t = animTick;
  const X = x => ox + x*scale, Y = y => oy + y*scale;
  ctx.save();

  /* the aura: a soft glow centred on the chest, no visible edge */
  const gcx = X(6), gcy = Y(9.5), gr = 9.5*scale;
  const grad = ctx.createRadialGradient(gcx, gcy, gr*0.18, gcx, gcy, gr);
  const a0 = 0.30 + 0.08*Math.sin(t/20);
  grad.addColorStop(0,   "rgba(255,255,255," + (a0*0.5).toFixed(3) + ")");
  grad.addColorStop(0.35, col);
  grad.addColorStop(1,   "rgba(0,0,0,0)");
  ctx.globalAlpha = a0;
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(gcx, gcy, gr, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  /* wings: one swept curve a side, sweeping with the idle */
  const sweep = Math.sin(t/26) * 0.55;
  const wing = (dir) => {
    const root = 6 + dir*2.6;
    ctx.beginPath();
    ctx.moveTo(X(root), Y(8.4 - bob*0.3));
    ctx.quadraticCurveTo(X(root + dir*4.4), Y(3.4 + sweep),
                         X(root + dir*6.6), Y(6.2 + sweep));
    ctx.quadraticCurveTo(X(root + dir*5.2), Y(9.4 + sweep*0.5),
                         X(root + dir*4.0), Y(13.2 - bob*0.3));
    ctx.quadraticCurveTo(X(root + dir*2.0), Y(11.2), X(root), Y(9.8 - bob*0.3));
    ctx.closePath();
    ctx.fillStyle = col; ctx.globalAlpha = 0.52; ctx.fill();
    ctx.strokeStyle = shadeHex(col, -0.42); ctx.globalAlpha = 0.85;
    ctx.lineWidth = Math.max(1, scale*0.35); ctx.stroke();
    /* two feather splits, so it is a wing rather than a blade */
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.moveTo(X(root + dir*1.2), Y(9.0));
    ctx.lineTo(X(root + dir*5.4), Y(6.4 + sweep));
    ctx.moveTo(X(root + dir*1.6), Y(10.4));
    ctx.lineTo(X(root + dir*4.4), Y(9.6 + sweep*0.5));
    ctx.lineWidth = Math.max(1, scale*0.22); ctx.stroke();
  };
  wing(-1); wing(1);
  ctx.globalAlpha = 1;

  /* crown: three points and a band, above whatever headgear is already there */
  P(3.4, 1.5-bob*0.3, 5.2, 0.8, trim);
  P(3.6, 0.4-bob*0.3, 0.9, 1.2, trim);
  P(5.55, -0.3-bob*0.3, 0.9, 1.9, trim);
  P(7.5, 0.4-bob*0.3, 0.9, 1.2, trim);
  ctx.globalAlpha = 0.9;
  P(5.75, -0.7-bob*0.3, 0.5, 0.7, col);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* rare wanderers get a slow sweep of light across the sprite */
function rareShimmer(P, col){
  const p = (animTick/34) % 1.6;
  if (p > 1) return;
  ctx.save();
  ctx.globalAlpha = 0.42 * Math.sin(p*Math.PI);
  P(0.5, 0.5 + p*15, 11, 0.9, "#ffffff");
  ctx.globalAlpha = 0.5;
  P(2.4, 0.2, 0.7, 0.7, col); P(9.0, 3.4, 0.6, 0.6, col); P(1.4, 6.8, 0.6, 0.6, col);
  ctx.restore();
  ctx.globalAlpha = 1;
}
/* ---------------- overworld ---------------- */
const cam = { x:0, y:0 };
let animTick = 0;

function tileNoise(x,y){
  const n = Math.sin(x*12.9898 + y*78.233) * 43758.5453;
  return n - Math.floor(n);
}

let curGrid = null;
function gridCh(x,y){
  if (!curGrid || y<0 || y>=curGrid.length || x<0 || x>=curGrid[0].length) return null;
  return curGrid[y][x];
}
function drawTile(ch, sx, sy, wx, wy){
  const T = tileAt(ch);
  const n = tileNoise(wx,wy);
  ctx.fillStyle = n > .5 ? T.c2 : T.c1;
  ctx.fillRect(sx, sy, TS, TS);

  if (ch === "." || ch === "f"){
    ctx.fillStyle = "rgba(255,255,255,.045)";
    const a = (wx*7 + wy*13) % 4, bq = (wx*5 + wy*3) % 5;
    ctx.fillRect(sx + 4 + a*6, sy + 7 + bq*4, 3, 1);
    ctx.fillRect(sx + 18 + bq*2, sy + 21 - a*3, 3, 1);
    ctx.fillStyle = "rgba(0,0,0,.05)";
    ctx.fillRect(sx + 11 + a*3, sy + 14 + a*2, 2, 2);
  }
  if (ch === "#"){
    ctx.fillStyle = "#14290f"; ctx.fillRect(sx+2,sy+18,28,12);
    ctx.fillStyle = "#2f5e29";
    ctx.beginPath(); ctx.arc(sx+16, sy+14, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#3c7434";
    ctx.beginPath(); ctx.arc(sx+12, sy+11, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#4b3020"; ctx.fillRect(sx+14, sy+22, 4, 8);
  } else if (ch === ","){
    ctx.fillStyle = "#4d8a44";
    for (let i=0;i<5;i++){
      const gx = sx + 3 + ((i*7 + (wx*5+wy*3)%5) % 26);
      const gy = sy + 20 + ((i*3 + wy) % 6);
      ctx.fillRect(gx, gy, 2, 10-((i+wx)%4));
    }
    ctx.fillStyle = "#2a4f26"; ctx.fillRect(sx,sy+30,TS,2);
  } else if (ch === "r"){
    ctx.fillStyle = "#4a4844"; ctx.fillRect(sx+3,sy+8,26,22);
    ctx.fillStyle = "#6e6b64"; ctx.fillRect(sx+6,sy+5,18,18);
    ctx.fillStyle = "#87837a"; ctx.fillRect(sx+9,sy+7,8,7);
  } else if (ch === "~"){
    ctx.fillStyle = "rgba(255,255,255,.16)";
    const ph = Math.sin((animTick/26) + wx*0.9 + wy*0.5);
    ctx.fillRect(sx+4, sy+10+Math.round(ph*2), 12, 2);
    ctx.fillRect(sx+18, sy+20-Math.round(ph*2), 10, 2);
  } else if (ch === "H" || ch === "d"){
    const above = gridCh(wx, wy-1), below = gridCh(wx, wy+1);
    const isRoof = above !== "H" && above !== "d";
    const isBase = below !== "H" && below !== "d";
    /* wall body */
    ctx.fillStyle = "#4c382a"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#7d6049"; ctx.fillRect(sx,sy,TS,TS-1);
    ctx.fillStyle = "rgba(0,0,0,.10)";
    for (let by=0; by<TS; by+=8){
      const off = ((wy*4 + by/8) % 2) ? 8 : 0;
      for (let bx=-8; bx<TS; bx+=16) ctx.fillRect(sx+bx+off, sy+by, 1, 8);
      ctx.fillRect(sx, sy+by, TS, 1);
    }
    if (isRoof){
      ctx.fillStyle = "#8c3a30"; ctx.fillRect(sx, sy, TS, 14);
      ctx.fillStyle = "#a8483a"; ctx.fillRect(sx, sy+2, TS, 9);
      ctx.fillStyle = "#5e241d"; ctx.fillRect(sx, sy+13, TS, 3);
      ctx.fillStyle = "rgba(0,0,0,.18)";
      for (let bx=0; bx<TS; bx+=8) ctx.fillRect(sx+bx, sy+2, 1, 9);
    }
    if (ch === "H" && !isRoof){
      ctx.fillStyle = "#2b1f16"; ctx.fillRect(sx+8, sy+8, 16, 13);
      ctx.fillStyle = "#5a7f9e"; ctx.fillRect(sx+9, sy+9, 14, 11);
      ctx.fillStyle = "#8fb4cc"; ctx.fillRect(sx+10, sy+10, 5, 4);
      ctx.fillStyle = "#2b1f16"; ctx.fillRect(sx+15, sy+9, 2, 11); ctx.fillRect(sx+9, sy+13, 14, 2);
    }
    if (ch === "d"){
      ctx.fillStyle = "#2b1b10"; ctx.fillRect(sx+5, sy+(isRoof?14:2), 22, TS-(isRoof?14:2));
      ctx.fillStyle = "#3f2a19"; ctx.fillRect(sx+7, sy+(isRoof?16:4), 18, TS-(isRoof?16:4));
      ctx.fillStyle = "#e8c56a"; ctx.fillRect(sx+21, sy+20, 3, 3);
    }
    if (isBase){ ctx.fillStyle = "#33251b"; ctx.fillRect(sx, sy+TS-3, TS, 3); }
  } else if (ch === "="){
    ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(sx,sy,TS,2);
    ctx.fillStyle = "rgba(0,0,0,.09)";
    const a = (wx*11 + wy*7) % 5, bq = (wx*3 + wy*17) % 6;
    ctx.fillRect(sx + 5 + a*4, sy + 8 + bq*3, 3, 2);
    ctx.fillRect(sx + 20 - bq, sy + 22 - a*2, 2, 2);
    ctx.fillStyle = "rgba(255,255,255,.055)";
    ctx.fillRect(sx + 12 + bq*2, sy + 16 + a, 2, 2);
  } else if (ch === "c"){
    ctx.fillStyle = "#1b1722"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#2b2436"; ctx.fillRect(sx+1,sy+1,TS-2,TS-3);
    ctx.fillStyle = "#3a3148";
    const a = (wx*5+wy*11)%4;
    ctx.fillRect(sx+3+a*4, sy+4, 9, 6); ctx.fillRect(sx+16-a*3, sy+16, 11, 7);
    ctx.fillStyle = "#151120"; ctx.fillRect(sx, sy+TS-3, TS, 3);
  } else if (ch === "C"){
    ctx.fillStyle = "#4a4256";
    for (let i=0;i<4;i++){
      const gx = sx + 4 + ((i*8 + (wx*3+wy*5)%6) % 24);
      const gy = sy + 21 + ((i*3 + wy) % 5);
      ctx.fillRect(gx, gy, 2, 7-((i+wx)%3));
    }
    ctx.fillStyle = "rgba(146,96,201,.14)"; ctx.fillRect(sx+10,sy+9,6,6);
  } else if (ch === "F"){
    ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fillRect(sx,sy,TS,1); ctx.fillRect(sx,sy,1,TS);
    ctx.fillStyle = "rgba(255,255,255,.05)";
    const a = (wx*7+wy*3)%4; ctx.fillRect(sx+6+a*4, sy+12, 3, 2);
  } else if (ch === "A"){
    ctx.fillStyle = "#231d2b"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#4a4054"; ctx.fillRect(sx+1,sy+8,TS-2,TS-8);
    ctx.fillStyle = "#080610";
    ctx.beginPath(); ctx.moveTo(sx+16, sy+4); ctx.lineTo(sx+29, sy+TS); ctx.lineTo(sx+3, sy+TS); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(146,96,201," + (0.18+0.10*Math.sin(animTick/22)) + ")";
    ctx.fillRect(sx+12, sy+20, 8, 12);
  } else if (ch === "W"){
    ctx.fillStyle = "#2f2740"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#463a56"; ctx.fillRect(sx+1,sy+1,TS-2,TS-3);
    ctx.fillStyle = "rgba(0,0,0,.16)";
    for (let by=0; by<TS; by+=10){ ctx.fillRect(sx, sy+by, TS, 1);
      ctx.fillRect(sx + (((wy*3+by/10)%2) ? 16 : 6), sy+by, 1, 10); }
    ctx.fillStyle = "#5d4d72"; ctx.fillRect(sx,sy,TS,3);
  } else if (ch === "P"){
    ctx.fillStyle = "#5a4f6b"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#7d6c94"; ctx.fillRect(sx+6,sy,20,TS);
    ctx.fillStyle = "#9787ac"; ctx.fillRect(sx+9,sy,6,TS);
    ctx.fillStyle = "#463a56"; ctx.fillRect(sx+4,sy,24,5); ctx.fillRect(sx+4,sy+TS-5,24,5);
  } else if (ch === "T"){
    ctx.fillStyle = "#2f2740"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#1a1424"; ctx.fillRect(sx+4,sy+3,24,29);
    ctx.fillStyle = "#8a76a8"; ctx.fillRect(sx+6,sy+5,20,4);
    ctx.fillStyle = "rgba(232,197,106," + (0.30+0.15*Math.sin(animTick/20)) + ")";
    ctx.fillRect(sx+13, sy+14, 6, 6);
  } else if (ch === "G"){
    ctx.fillStyle = "rgba(0,0,0,.10)";
    if ((wx+wy)%2===0) ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "rgba(255,255,255,.045)"; ctx.fillRect(sx,sy,TS,1);
  } else if (ch === "+"){
    ctx.fillStyle = "#5d5344"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#6e6352"; ctx.fillRect(sx+1,sy+1,TS-2,TS-2);
    const pulse = 0.34 + 0.22*Math.sin(animTick/18);
    ctx.fillStyle = "rgba(124,232,160," + pulse + ")";
    ctx.fillRect(sx+4,sy+4,TS-8,TS-8);
    ctx.strokeStyle = "#9cf0b4"; ctx.lineWidth = 1;
    ctx.strokeRect(sx+4.5,sy+4.5,TS-9,TS-9);
    ctx.fillStyle = "#d8ffe4";
    ctx.fillRect(sx+14, sy+9, 4, 14); ctx.fillRect(sx+9, sy+14, 14, 4);
  } else if (ch === "^"){
    ctx.fillStyle = "rgba(232,197,106,"+(0.22+0.12*Math.sin(animTick/14))+")";
    ctx.fillRect(sx+3,sy+3,TS-6,TS-6);
    ctx.strokeStyle = "#e8c56a"; ctx.lineWidth = 1; ctx.strokeRect(sx+4.5,sy+4.5,TS-9,TS-9);
  } else if (ch === "f"){
    const c = ["#e8697d","#e8d169","#c069e8","#f0f0f0"][(wx*3+wy*7)%4];
    ctx.fillStyle = c;
    ctx.fillRect(sx+9,sy+14,4,4); ctx.fillRect(sx+20,sy+21,4,4); ctx.fillRect(sx+14,sy+25,3,3);
  } else if (ch === "b"){
    ctx.fillStyle = "#5a4028";
    for (let i=0;i<4;i++) ctx.fillRect(sx, sy+i*8, TS, 6);
    ctx.fillStyle = "#7d5d3c"; ctx.fillRect(sx,sy,TS,2);
  } else if (ch === "s"){
    ctx.fillStyle = "#3d6b3a"; ctx.fillRect(sx,sy,TS,TS);
    ctx.fillStyle = "#6b4f32"; ctx.fillRect(sx+14,sy+14,4,16);
    ctx.fillStyle = "#a88a5c"; ctx.fillRect(sx+4,sy+6,24,12);
    ctx.fillStyle = "#e8e2d5"; ctx.fillRect(sx+7,sy+9,18,2); ctx.fillRect(sx+7,sy+13,12,2);
  }
}

function currentZone(){ return ZONES[state.zone]; }

function npcGone(n){ return !!(n.flag && state.flags && state.flags[n.flag] && n.gate); }
function solidAt(zone, x, y){
  if (y < 0 || x < 0 || y >= zone.grid.length || x >= zone.grid[0].length) return true;
  const ch = zone.grid[y][x];
  if (tileAt(ch).solid) return true;
  for (const n of (zone.npcs||[])) if (n.x === x && n.y === y && !npcGone(n)) return true;
  if (typeof storyActorAt === "function" && storyActorAt(x, y)) return true;
  return false;
}
function warpAt(zone, x, y){
  for (const wp of (zone.warps||[])) if (wp.x === x && wp.y === y) return wp;
  return null;
}
function npcAt(zone, x, y){
  for (const n of (zone.npcs||[])) if (n.x === x && n.y === y && !npcGone(n)) return n;
  return null;
}

function renderOverworld(){
  const z = currentZone();
  const gw = z.grid[0].length, gh = z.grid.length;
  /* follow the sprite's real pixel position, not its tile, or the view jumps a
     whole tile at a time while the sprite slides between them */
  const trueX = player.px*TS + player.offX + TS/2;
  const trueY = player.py*TS + player.offY + TS/2;
  let camX = Math.round(trueX - W/2);
  let camY = Math.round(trueY - (H-96)/2);
  camX = clamp(camX, 0, Math.max(0, gw*TS - W));
  camY = clamp(camY, 0, Math.max(0, gh*TS - (H-96)));
  cam.x = camX; cam.y = camY;

  ctx.fillStyle = "#0d1a0c"; ctx.fillRect(0,0,W,H);

  curGrid = z.grid;
  const x0 = Math.floor(camX/TS), y0 = Math.floor(camY/TS);
  const x1 = Math.min(gw-1, x0 + Math.ceil(W/TS));
  const y1 = Math.min(gh-1, y0 + Math.ceil((H-96)/TS)+1);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
    drawTile(z.grid[y][x], x*TS - camX, y*TS - camY, x, y);
  }

  /* npcs */
  for (const n of (z.npcs||[])){
    if (npcGone(n)) continue;
    const sx = n.x*TS - camX + TS/2, sy = n.y*TS - camY + TS - 2;
    if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;
    if (isChampion(n.kind)){
      const beaten = championBeaten(n);
      const again = rematchReady(n);
      if (beaten) ctx.globalAlpha = 0.45;
      drawFigure(sx, sy, n.kind === "boss" ? 2.5 : 2.1, npcLook(n), "down", 0, {});
      ctx.globalAlpha = 1;
      if (!beaten){
        /* a rematch gets its own colour and a ring, so you can tell at a glance
           which road trainers still owe you a fight */
        const mark = again ? "#7ce8d8"
          : { trainer:"#e8c56a", subboss:"#e0a86a", boss:"#e05a6a", leader:"#e05a6a" }[n.kind];
        const yy = sy - (n.kind === "boss" ? 54 : 46) + Math.sin(animTick/14)*2;
        if (again){
          ctx.strokeStyle = "rgba(124,232,216,.75)"; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(sx, yy, 9, 0.4, 5.2); ctx.stroke();
        }
        ctx.fillStyle = mark;
        ctx.beginPath();
        ctx.moveTo(sx, yy-5); ctx.lineTo(sx+5, yy+4); ctx.lineTo(sx-5, yy+4);
        ctx.closePath(); ctx.fill();
      } else {
        txt("✓", sx, sy-44, { size:13, align:"center", color:"#7ce8a0" });
      }
      continue;
    }
    if (n.kind === "legend"){
      const taken = !!state.flags[n.flag];
      if (taken) ctx.globalAlpha = 0.4;
      drawFigure(sx, sy, 2.4, npcLook(n), "down", 0, { rare:!taken });
      ctx.globalAlpha = 1;
      if (!taken){
        const S = SCHOOLS[n.school] || SCHOOLS.lumen;
        const yy = sy - 52 + Math.sin(animTick/18)*2;
        ctx.globalAlpha = 0.30 + 0.16*Math.sin(animTick/13);
        ctx.fillStyle = S.color;
        ctx.beginPath(); ctx.arc(sx, sy-22, 22, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        txt("\u2726", sx, yy, { size:15, align:"center", color:"#fff0c0" });
      } else {
        txt("\u2713", sx, sy-46, { size:13, align:"center", color:"#7ce8a0" });
      }
      continue;
    }
    if (n.kind === "sign"){
      ctx.fillStyle = "#6b4f32"; ctx.fillRect(sx-2, sy-14, 4, 14);
      ctx.fillStyle = "#a88a5c"; ctx.fillRect(sx-11, sy-26, 22, 13);
      ctx.fillStyle = "#e8e2d5"; ctx.fillRect(sx-8, sy-22, 16, 2); ctx.fillRect(sx-8, sy-18, 10, 2);
    } else {
      drawFigure(sx, sy, 2, n.arch || NPC_LOOK[n.kind] || "beacon_healer", "down", 0, {});
      if (n.kind === "healer" || n.kind === "shop" || n.kind === "sanctum" ||
          n.kind === "gift" || n.kind === "relearn"){
        const gl = { healer:"#5fc45a", shop:"#e8c56a", sanctum:"#9260c9",
                     gift:"#7ce8c0", relearn:"#8fb4e8" }[n.kind];
        ctx.fillStyle = gl;
        const yy = sy - 44 + Math.sin(animTick/16)*2;
        ctx.beginPath(); ctx.arc(sx, yy, 3, 0, Math.PI*2); ctx.fill();
      }
    }
  }

  /* cutscene actors sit on the same layer as NPCs and are drawn after them,
     so somebody walking into frame passes in front of a signpost, not behind */
  if (typeof storyActorList === "function"){
    for (const a of storyActorList()){
      const sx = a.x*TS - camX + TS/2 + (a.ox||0), sy = a.y*TS - camY + TS - 2 + (a.oy||0);
      if (sx < -40 || sx > W+40 || sy < -40 || sy > H+40) continue;
      drawFigure(sx, sy, 2, a.arch || "beacon_healer", a.facing || "down", 0, {});
    }
  }

  if (z.dark){
    const pcx = player.px*TS - camX + TS/2 + player.offX;
    const pcy = player.py*TS - camY + TS/2 + player.offY;
    const g2 = ctx.createRadialGradient(pcx, pcy, 40, pcx, pcy, 300);
    g2.addColorStop(0, "rgba(4,2,10,0)");
    g2.addColorStop(0.55, "rgba(4,2,10,.42)");
    g2.addColorStop(1, "rgba(3,1,8,.80)");
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H-88);
  }

  /* player */
  const pfx = player.px*TS - camX + TS/2 + player.offX;
  const pfy = player.py*TS - camY + TS - 2 + player.offY;
  drawFigure(pfx, pfy, 2, state.party.length ? state.party[0].arch : "dawn_acolyte",
             player.facing, player.stepFrame,
             { rare: state.party.length ? state.party[0].rare : false });

  drawDayNight(z);
  /* the dialogue box overlaps the party HUD, so while anyone is talking the
     HUD steps aside and its strip is filled flat rather than left ragged */
  if (!ui.dialog) drawOverworldHud();
  else { ctx.fillStyle = "#0a0810"; ctx.fillRect(0, H-88, W, 88); }
}

/* ---------------- day and night ----------------
   Eight real minutes is a full cycle. It is a wash of colour over the map and
   nothing else: no spawn changes, no stat changes, nothing that would make a
   player wait for a clock. Indoors and underground are exempt, because a cave
   has no sky to change. */
const DAY_SECONDS = 480;
function dayPhase(){
  return ((state.playtime || 0) % DAY_SECONDS) / DAY_SECONDS;   /* 0 = dawn */
}
/* [r,g,b,alpha] at each quarter, interpolated */
const DAY_KEYS = [
  [0.00, 232, 150,  96, 0.16],   /* dawn  — low warm light */
  [0.22,   0,   0,   0, 0.00],   /* day   — nothing at all */
  [0.55, 240, 128,  64, 0.15],   /* dusk  — long orange */
  [0.72,  30,  34,  90, 0.34],   /* night — cold and deep */
  [0.92,  40,  40,  96, 0.26],   /* late  — lifting */
  [1.00, 232, 150,  96, 0.16],
];
function dayTint(){
  const p = dayPhase();
  for (let i=0;i<DAY_KEYS.length-1;i++){
    const a = DAY_KEYS[i], b = DAY_KEYS[i+1];
    if (p < a[0] || p > b[0]) continue;
    const t = (p - a[0]) / Math.max(1e-6, b[0] - a[0]);
    return [ a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t, a[4]+(b[4]-a[4])*t ];
  }
  return [0,0,0,0];
}
function drawDayNight(z){
  if (!state.opts || !state.opts.daynight) return;
  if (z && (z.dark || z.region === "gym")) return;      /* no sky down there */
  const c = dayTint();
  if (c[3] <= 0.004) return;
  ctx.save();
  ctx.globalCompositeOperation = "source-atop";
  ctx.fillStyle = "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + c[3].toFixed(3) + ")";
  ctx.fillRect(0, 0, W, H-88);
  ctx.restore();
}

const NPC_LOOK = { healer:"beacon_healer", shop:"dust_nomad", sanctum:"geode_seer",
                   talk:"rill_novice", gift:"prism_monk", relearn:"spore_chanter",
                   ferry_out:"tidecaller", ferry_home:"tidecaller" };
const CHAMP_LOOK = {
  ember:"flame_cantor", tide:"tidecaller", verdant:"grove_keeper", storm:"tempest_dancer",
  stone:"stoneward", umbra:"nightbinder", lumen:"sunwarden", none:"geode_seer",
};
function npcLook(n){
  if (n.arch) return n.arch;
  if (isChampion(n.kind)) return CHAMP_LOOK[n.school] || "geode_seer";
  return NPC_LOOK[n.kind] || "beacon_healer";
}

function drawOverworldHud(){
  const z = currentZone();
  panel(0, H-88, W, 88);
  txt(z.name, 16, H-64, { size:18, color:"#e8c56a" });
  txt(state.gold + " g", W-16, H-64, { size:16, align:"right", color:"#e8c56a" });

  const n = Math.min(6, state.party.length);
  for (let i=0;i<n;i++){
    const u = state.party[i];
    const bx = 16 + i*100, by = H-52;
    const pct = u.hp/u.maxHp;
    txt(u.name, bx, by+2, { size:11, color: u.hp>0 ? "#e8e2d5" : "#7a6f88" });
    txt("L"+u.level, bx+88, by+2, { size:10, align:"right", color:"#9a8fb5" });
    bar(bx, by+6, 88, 6, pct, hpColor(pct));
    bar(bx, by+15, 88, 4, u.mp/u.maxMp, "#4e7fd0");
    const S = SCHOOLS[schoolOf(u)];
    ctx.fillStyle = S.color; ctx.fillRect(bx, by+23, 88, 2);
  }
  txt("M  menu      Z  interact", W-16, H-14, { size:11, align:"right", color:"#6a5f80" });
}
/* ============================================================
   BATTLE
   ============================================================ */

let B = null;

/* ---------- lagging health bars ----------
   Damage lands on the unit the instant a spell resolves, but the log plays
   out one message at a time.  Every say() therefore snapshots the HP of all
   combatants; a bar only chases the snapshot belonging to the message that is
   currently on screen, so it drops when the hit is *read*, not when it is
   computed. */
function snapHp(){
  const m = new Map();
  if (!B) return m;
  for (const u of state.party) m.set(u, u.hp);
  for (const u of B.team) m.set(u, u.hp);
  return m;
}
function snapSt(){
  const m = new Map();
  if (!B) return m;
  for (const u of state.party) m.set(u, u.status);
  for (const u of B.team) m.set(u, u.status);
  return m;
}
/* every readout that reveals a combatant's condition -- the bar, the status
   badge, the pact odds -- has to lag the same way the bar does, or the plate
   spoils the hit a message early. */
function statusShow(u){
  if (B && B.stAt && B.stAt.has(u)) return B.stAt.get(u);
  return u.status;
}
function hpShow(u){ return (u._hpDisp == null) ? u.hp : u._hpDisp; }
function hpTarget(u){
  if (B && B.hpAt && B.hpAt.has(u)) return B.hpAt.get(u);
  return u.hp;
}
function hpSnapAll(){
  if (!B) return;
  for (const u of state.party) u._hpDisp = u.hp;
  for (const u of B.team) u._hpDisp = u.hp;
}
function hpTick(dt){
  if (!B) return;
  /* on a hit, hold the bars still for a beat so the slash lands first and the
     damage reads as a consequence of it rather than a simultaneous event */
  if (B.hpDelay > 0){ B.hpDelay -= dt; if (B.hpDelay > 0) return; }
  const sp = speedMult();
  const walk = (u) => {
    const tgt = hpTarget(u);
    if (u._hpDisp == null){ u._hpDisp = tgt; return; }
    if (u._hpDisp === tgt) return;
    /* a full bar drains in about 0.45s at Normal; the speed option divides that */
    const step = Math.max(u.maxHp / 0.45, 40) * dt * sp;
    if (Math.abs(tgt - u._hpDisp) <= step) u._hpDisp = tgt;
    else u._hpDisp += (tgt > u._hpDisp ? step : -step);
  };
  for (const u of state.party) walk(u);
  for (const u of B.team) walk(u);
}

function hurt(u, amount, isPlayerSide){
  const floor = (isPlayerSide && state.cheats.god) ? 1 : 0;
  u.hp = Math.max(floor, u.hp - amount);
}
/* the matchup as this fight scores it */
function battleTypeMult(atkSchool, defSchool){
  const tm = typeMult(atkSchool, defSchool);
  return (B && B.oathfall) ? compressMult(tm) : tm;
}
function stageMult(s){ s = clamp(s,-6,6); return s >= 0 ? (2+s)/2 : 2/(2-s); }

function effStat(unit, key, stages){
  let v = statOf(unit, key) * stageMult(stages[key]||0);
  if (key === "atk" && unit.status === "burn") v *= STATUSES.burn.atkMod;
  if (key === "spd" && unit.status === "chill") v *= STATUSES.chill.spdMod;
  return Math.max(1, Math.floor(v));
}

function startBattle(teamOrUnit, opts){
  opts = opts || {};
  const team = Array.isArray(teamOrUnit) ? teamOrUnit.slice() : [teamOrUnit];
  const kind = opts.kind || "wild";
  const rules = FOE_KIND[kind] || FOE_KIND.wild;
  const active = state.party.findIndex(u => u.hp > 0);
  B = {
    team, eIdx: 0, enemy: team[0], active, kind, rules,
    foeName: opts.foeName || null,
    reward: opts.reward || null,
    flag: opts.flag || null,
    clears: opts.clears || null,
    story: !!opts.story,
    oathfall: !!(ZONES[state.zone] && ZONES[state.zone].oathfall),
    ps: { atk:0, def:0, spd:0 }, es: { atk:0, def:0, spd:0 },
    phase: "intro", cursor: 0, sub: 0, page: 0,
    queue: [], result: null, turn: 0, hpAt: null, stAt: null, hpDelay: 0,
    fx: null, fxT: 0, shakeT: 0, flashT: 0,
    canRun: rules.run && opts.canRun !== false,
    legendFlag: opts.legendFlag || null,
    goldEarned: 0,
  };
  for (const u of team){ state.seen[u.arch] = true; recalc(u); }
  hpSnapAll();
  if (kind === "wild" && B.legendFlag){
    say((opts.foeName || B.enemy.name) + " does not move aside.", { kind:"sigil", side:"enemy" });
    say("Level " + B.enemy.level + ", one of one, and every Spark at the ceiling. No escape \u2014 bind it or leave it standing.");
  } else if (kind === "wild"){
    if (B.enemy.rare){
      say("The air bends — a rare " + archName(B.enemy) + " steps out!", { kind:"sigil", side:"enemy" });
      say(B.enemy.name + " is Level " + B.enemy.level + ", and every Spark in them runs hot.");
    } else {
      say("A wild " + archName(B.enemy) + " blocks the way!");
      say(B.enemy.name + " is Level " + B.enemy.level + ".");
    }
  } else {
    const label = { trainer:"challenges you", subboss:"bars the way", boss:"awaits you", leader:"accepts your challenge" }[kind] || "challenges you";
    say((B.foeName || B.enemy.name) + " " + label + "!");
    if (team.length === 1){
      say(B.enemy.name + " — Level " + B.enemy.level + " " + archName(B.enemy) + ". No escape, no pact.");
    } else {
      say(team.length + " to face.  Level " + team[0].level + "–" + team[team.length-1].level + ".  No escape.");
      say((B.foeName || B.enemy.name) + " sends out " + B.enemy.name + ", the " + archName(B.enemy) + "!");
    }
  }
  B.phase = "msg";
  B.after = () => { B.phase = "menu"; B.cursor = 0; };
  state.scene = "battle";
}
function foesLeft(){ return B.team.filter(u => u.hp > 0).length; }

function me(){ return state.party[B.active]; }
function firstAliveIdx(){ const i = state.party.findIndex(u => u.hp > 0); return i < 0 ? 0 : i; }
function say(text, fx){ B.queue.push({ text, fx: fx||null, hp: snapHp(), st: snapSt() }); }

const IMPACT_HOLD = 0.16;   /* seconds the bar waits after the blow connects */
function revealMsg(m){
  B.hpAt = m.hp || null;
  B.stAt = m.st || null;
  const k = m.fx && m.fx.kind;
  B.hpDelay = (k === "hit" || k === "crit" || k === "faint") ? IMPACT_HOLD / speedMult() : 0;
  applyFx(m.fx);
}
function advanceMsg(){
  B.queue.shift();
  if (B.queue.length){
    revealMsg(B.queue[0]);
    return;
  }
  B.hpAt = null; B.stAt = null; B.hpDelay = 0;
  const a = B.after; B.after = null;
  if (a) a(); else B.phase = "menu";
}
const FX_SOUND = {
  hit:"hit", crit:"crit", heal:"heal", level:"level", ascend:"badge",
  recruit:"recruit", faint:"faint", status:"cancel", debuff:"cancel",
  buff:"confirm", swapin:"confirm", sigil:"blip", cast:"blip",
};
function applyFx(fx){
  if (!fx) return;
  const sp = speedMult();
  B.fx = fx; B.fxT = 18 / sp;
  const shake = opt().shake ? 1 : 0;
  if (fx.kind === "hit"){ B.shakeT = 10 * shake / sp; }
  if (fx.kind === "crit"){ B.shakeT = 16 * shake / sp; B.flashT = 8 / sp; }
  const snd = FX_SOUND[fx.kind];
  if (snd) sfx(snd);
}
function runQueue(after){
  B.after = after || null;
  B.phase = "msg";
  if (B.queue.length) revealMsg(B.queue[0]);
  else { B.hpAt = null; B.stAt = null; B.hpDelay = 0; const f = B.after; B.after = null; if (f) f(); else B.phase = "menu"; }
}

/* ---------------- damage ---------------- */
function computeDamage(att, def, spell, attStages, defStages, attIsPlayer){
  if (attIsPlayer && state.cheats.ohko) return { dmg: 99999, crit: true, tm: 1 };
  const tb = talentBonus(att);
  let atk = effStat(att, "atk", attStages);
  /* Undertow: the defender's capstone saps a Chilled attacker */
  const preD = talentBonus(def);
  if (preD.caps.riptide && att.status === "chill") atk = Math.max(1, Math.floor(atk * 0.75));
  let dstage = defStages.def || 0;
  if (tb.caps.conflagration && SPELLS[spell].school === schoolOf(att) && dstage > 0) dstage -= 1;
  const dfn = Math.max(1, Math.floor(statOf(def,"def") * stageMult(dstage)));
  const S = SPELLS[spell];
  let dmg = Math.floor((((2*att.level/5 + 2) * S.power * atk / dfn) / 50)) + 2;

  const tm = battleTypeMult(S.school, schoolOf(def));
  dmg = Math.floor(dmg * tm);

  if (S.school === schoolOf(att) && S.school !== "none"){
    let m = 1.15 + tb.schoolPct/100;
    if (tb.caps.conflagration) m += 0.20;
    dmg = Math.floor(dmg * m);
  }

  const critChance = 6 + tb.critPct;
  const crit = Math.random()*100 < critChance;
  if (crit) dmg = Math.floor(dmg * (1.6 + (tb.critDmg||0)/100));

  dmg = Math.floor(dmg * rf(0.86, 1.0));

  const dtb = talentBonus(def);
  if (dtb.caps.bulwark && def.hp > def.maxHp/2) dmg = Math.floor(dmg * 0.8);
  if (dtb.lowHpDmg && def.hp <= def.maxHp/2) dmg = Math.floor(dmg * (1 - Math.min(60, dtb.lowHpDmg)/100));

  return { dmg: Math.max(1, dmg), crit, tm };
}

function effectLine(tm){
  if (tm >= 2) return "A resonant hit!";
  if (tm <= 0.5) return "It barely lands...";
  /* the compressed wheel still deserves a line, or Oathfall reads as if type
     stopped mattering rather than mattering less */
  if (tm > 1) return "It tells, a little.";
  if (tm < 1) return "The old vows blunt it.";
  return null;
}

function tryStatus(target, sid, chance, dur, targetIsPlayer, caster){
  if (target.status) return false;
  const tb = talentBonus(target);
  if (sid === "dazed" && tb.caps.unmoved) return false;
  const ctb = caster ? talentBonus(caster) : null;
  let c = chance + (ctb ? (ctb.statusPct||0) : 0) - tb.statusRes;
  if (Math.random()*100 >= c) return false;
  target.status = sid; target.statusDur = dur;
  say(target.name + " is " + STATUSES[sid].name + "!", { kind:"status", side: targetIsPlayer ? "player":"enemy" });
  return true;
}

/* ---------------- cast ---------------- */
function castSpell(caster, target, spellId, casterIsPlayer){
  const S = SPELLS[spellId];
  const cStages = casterIsPlayer ? B.ps : B.es;
  const tStages = casterIsPlayer ? B.es : B.ps;
  const side = casterIsPlayer ? "enemy" : "player";
  const tb = talentBonus(caster);

  /* mana */
  let cost = S.mana;
  if (cost > 0 && tb.caps.quickcast && Math.random() < 0.25){
    cost = 0;
    say(caster.name + " quickcasts!");
  }
  if (casterIsPlayer && state.cheats.infMana) cost = 0;
  if (caster.mp < cost){
    say(caster.name + " is out of Mana and swings wildly.");
    spellId = "staff_strike";
    return castSpell(caster, target, "staff_strike", casterIsPlayer);
  }
  caster.mp -= cost;

  /* skip from status */
  say(caster.name + " uses " + S.name + "!", { kind:"cast", school:S.school, side });

  /* accuracy */
  const ttb = talentBonus(target);
  let acc = (S.acc || 100) + (tb.accPct || 0);
  if (caster.status === "blind") acc *= STATUSES.blind.accMod;
  if (S.kind === "dmg" || S.kind === "debuff"){
    const sure = tb.caps.overload && S.kind === "dmg";
    if (!sure && Math.random()*100 > acc){ say("It misses."); return; }
    if (S.kind === "dmg" && ttb.evadePct && Math.random()*100 < ttb.evadePct){
      say(target.name + " slips aside."); return;
    }
  }

  if (S.kind === "dmg"){
    if (ttb.caps.aegis && Math.random() < 0.20){
      say(target.name + " turns it aside entirely.", { kind:"buff", side: casterIsPlayer?"enemy":"player" });
      return;
    }
    const r = computeDamage(caster, target, spellId, cStages, tStages, casterIsPlayer);
    hurt(target, r.dmg, !casterIsPlayer);
    say(target.name + " takes " + r.dmg + " damage.", { kind: r.crit ? "crit":"hit", side, school:S.school });
    if (r.crit) say("A critical channel!");
    const el = effectLine(r.tm); if (el) say(el);
    /* charm, talent and capstone drain all land here */
    let drainRate = (tb.drainPct || 0) / 100;
    if (tb.caps.eclipse) drainRate += 0.25;
    if (drainRate > 0 && caster.hp > 0){
      const d2 = Math.max(1, Math.floor(r.dmg * Math.min(0.8, drainRate)));
      caster.hp = Math.min(caster.maxHp, caster.hp + d2);
      say(caster.name + " siphons " + d2 + " HP.", { kind:"heal", side: casterIsPlayer?"player":"enemy" });
    }
    if (ttb.thorns && target.hp > 0){
      const th = Math.max(1, Math.floor(r.dmg * Math.min(60, ttb.thorns)/100));
      hurt(caster, th, casterIsPlayer);
      say(caster.name + " is cut by the backlash for " + th + ".", { kind:"hit", side: casterIsPlayer?"player":"enemy" });
    }
    if (S.drain){
      const heal = Math.max(1, Math.floor(r.dmg * S.drain));
      caster.hp = Math.min(caster.maxHp, caster.hp + heal);
      say(caster.name + " drains " + heal + " HP.", { kind:"heal", side: casterIsPlayer?"player":"enemy" });
    }
    if (S.recoil){
      const rec = Math.max(1, Math.floor(r.dmg * S.recoil));
      hurt(caster, rec, casterIsPlayer);
      say(caster.name + " is scorched for " + rec + ".", { kind:"hit", side: casterIsPlayer?"player":"enemy" });
    }
    if (S.status && target.hp > 0) tryStatus(target, S.status, S.chance, S.dur, !casterIsPlayer, caster);
  }
  else if (S.kind === "heal"){
    const amt = Math.floor(caster.maxHp * S.healPct * (1 + (tb.healPct||0)/100));
    const before = caster.hp;
    caster.hp = Math.min(caster.maxHp, caster.hp + amt);
    say(caster.name + " recovers " + (caster.hp-before) + " HP.", { kind:"heal", side: casterIsPlayer?"player":"enemy" });
    if (S.cleanse && caster.status){ say(caster.name + " is cleansed."); caster.status = null; caster.statusDur = 0; }
    if (S.buffStat){
      cStages[S.buffStat] = clamp(cStages[S.buffStat] + S.buffStages, -6, 6);
      say(caster.name + "'s " + statName(S.buffStat) + " rises.", { kind:"buff", side: casterIsPlayer?"player":"enemy" });
    }
  }
  else if (S.kind === "buff"){
    const before = cStages[S.stat];
    cStages[S.stat] = clamp(before + S.stages, -6, 6);
    if (cStages[S.stat] === before) say("It won't go any higher.");
    else say(caster.name + "'s " + statName(S.stat) + (S.stages>1?" rises sharply.":" rises."), { kind:"buff", side: casterIsPlayer?"player":"enemy" });
  }
  else if (S.kind === "debuff"){
    if (ttb.caps.unmoved){ say(target.name + " will not be moved."); return; }
    const before = tStages[S.stat];
    tStages[S.stat] = clamp(before + S.stages, -6, 6);
    if (tStages[S.stat] === before) say("It won't go any lower.");
    else say(target.name + "'s " + statName(S.stat) + " falls.", { kind:"debuff", side });
  }
  else if (S.kind === "cleanse"){
    let did = false;
    if (caster.status){ caster.status = null; caster.statusDur = 0; did = true; }
    for (const k of ["atk","def","spd"]) if (cStages[k] < 0){ cStages[k] = 0; did = true; }
    say(did ? (caster.name + " is cleared of afflictions.") : "Nothing to dispel.");
  }
}
function statName(k){ return { atk:"Power", def:"Ward", spd:"Speed" }[k] || k; }

/* ---------------- enemy AI ---------------- */
function enemyChoose(){
  const e = B.enemy, p = me();
  const usable = e.spells.filter(s => SPELLS[s].mana <= e.mp);
  if (!usable.length) return "staff_strike";
  const heals = usable.filter(s => SPELLS[s].kind === "heal");
  if (heals.length && e.hp < e.maxHp*0.3 && Math.random() < 0.6) return pick(heals);
  const dmg = usable.filter(s => SPELLS[s].kind === "dmg");
  if (!dmg.length) return pick(usable);
  const scored = dmg.map(s => {
    const S = SPELLS[s];
    let sc = S.power * battleTypeMult(S.school, schoolOf(p));
    if (S.school === schoolOf(e)) sc *= 1.15;
    return { s, sc };
  }).sort((a,b) => b.sc - a.sc);
  if (Math.random() < 0.75) return scored[0].s;
  return pick(dmg);
}

/* ---------------- turn resolution ---------------- */
function statusSkip(u){
  if (!u.status) return false;
  const st = STATUSES[u.status];
  if (!st.skip) return false;
  if (Math.random() < st.skip){
    say(u.name + " is held by " + st.name + " and cannot act.");
    return true;
  }
  return false;
}

function endOfTurn(){
  const p = me(), e = B.enemy;
  for (const [u, isP] of [[p,true],[e,false]]){
    if (u.hp <= 0) continue;
    const tb = talentBonus(u);
    if (tb.regen) u.mp = Math.min(u.maxMp, u.mp + tb.regen);
    if (tb.caps.evergrowth && u.hp > 0 && u.hp < u.maxHp){
      const g2 = Math.max(1, Math.floor(u.maxHp * 0.07));
      u.hp = Math.min(u.maxHp, u.hp + g2);
      say(u.name + " knits back " + g2 + " HP.", { kind:"heal", side: isP?"player":"enemy" });
    }
    if (u.status){
      const st = STATUSES[u.status];
      if (st.tick){
        let tickRate = st.tick;
        const src = isP ? B.enemy : me();
        if (u.status === "burn" && src && talentBonus(src).caps.conflagration) tickRate *= 2;
        const d = Math.max(1, Math.floor(u.maxHp * tickRate));
        hurt(u, d, isP);
        say(u.name + " suffers " + d + " from " + st.name + ".", { kind:"hit", side: isP?"player":"enemy" });
      }
      u.statusDur--;
      if (u.statusDur <= 0){ say(u.name + " shakes off " + st.name + "."); u.status = null; }
    }
  }
}

function checkEnd(){
  const p = me(), e = B.enemy;
  if (e.hp <= 0){
    say(e.name + " is spent and withdraws.", { kind:"faint", side:"enemy" });
    awardKill(e);
    if (B.eIdx + 1 < B.team.length){
      B.eIdx++;
      B.enemy = B.team[B.eIdx];
      B.es = { atk:0, def:0, spd:0 };
      say((B.foeName || "Your opponent") + " sends out " + B.enemy.name +
          ", the " + archName(B.enemy) + "!", { kind:"swapin", side:"enemy" });
      runQueue(() => { B.phase = "menu"; B.cursor = 0; });
      return true;
    }
    finishVictory();
    return true;
  }
  if (p.hp <= 0){
    say(p.name + " can no longer stand.", { kind:"faint", side:"player" });
    const alive = state.party.filter(u => u.hp > 0);
    if (!alive.length){
      runQueue(() => { B.result = "defeat"; say("You have no pacts left standing."); runQueue(() => finishBattle()); });
    } else {
      runQueue(() => { B.phase = "swap"; B.forceSwap = true; B.cursor = firstAliveIdx(); });
    }
    return true;
  }
  return false;
}

function awardKill(e){
  const baseXp = Math.floor(xpReward(e) * B.rules.xp * (state.cheats.fastXp ? 10 : 1));
  const gold = Math.floor(goldReward(e) * B.rules.gold);
  state.gold += gold;
  B.goldEarned += gold;
  say("You gain " + gold + " gold.");
  const active = me();
  const others = state.party.filter(u => u.hp > 0 && u !== active);
  const grant = [[active, baseXp]].concat(others.map(u => [u, Math.floor(baseXp*0.5)]));
  for (const [u, amt0] of grant){
    const amt = Math.floor(amt0 * xpBonus(u));
    const before = u.level;
    const evs = gainXp(u, amt);
    say(u.name + " gains " + amt + " XP.");
    for (const ev of evs){
      if (ev.t === "level"){
        say(u.name + " reaches Level " + ev.level + "!  (+" + ev.hpGain + " HP, +" + ev.tpGain + " TP)", { kind:"level", side:"player" });
      } else if (ev.t === "spell"){
        if (u.spells.length < 4){ learnSpell(u, ev.id); say(u.name + " learns " + SPELLS[ev.id].name + "!"); }
        else { B.pendingLearn = B.pendingLearn || []; B.pendingLearn.push([u, ev.id]); }
      } else if (ev.t === "ascend"){
        say(u.name + " is transformed —  now a " + ARCHETYPES[ev.into].name + "!", { kind:"ascend", side:"player" });
      } else if (ev.t === "oathblocked"){
        say(u.name + " strains at the edge of something — but an " + ITEMS[ev.item].name +
            " is needed to become " + ARCHETYPES[ev.into].name + ".", { kind:"sigil", side:"player" });
      }
    }
  }
}

function finishVictory(){
  if (B.kind !== "wild"){
    say("You have beaten " + (B.foeName || "your opponent") + "!");
  }
  const rw = B.reward;
  if (rw){
    if (rw.gold){ state.gold += rw.gold; say("Prize: " + rw.gold + " gold."); }
    if (rw.items) for (const id in rw.items){
      giveItem(id, rw.items[id]);
      say("Received " + ITEMS[id].name + (rw.items[id] > 1 ? " x" + rw.items[id] : "") + "!", { kind:"recruit", side:"player" });
    }
    if (rw.badge && !state.badges[rw.badge]){
      state.badges[rw.badge] = true;
      const b = BADGES[rw.badge];
      say("You earn the " + b.name + "!", { kind:"ascend", side:"player" });
      say(b.desc);
      for (const u of state.party.concat(state.roster)) recalc(u);
    }
  }
  if (B.flag) state.flags[B.flag] = true;
  const wasChampion = B.kind !== "wild";
  if (B.clears){ state.cleared[B.clears] = true; say("The " + ZONES[B.clears].name + " is cleared."); }
  B.result = "win";
  /* set before the queue runs: runQueue can reach finishBattle synchronously,
     and then B is already gone by the time the next line would execute */
  if (wasChampion) B.autosaveOnExit = true;
  runQueue(() => {
    if (B.pendingLearn && B.pendingLearn.length){
      B.learnPrompt = B.pendingLearn.shift();
      B.phase = "learn"; B.cursor = 0;
    } else finishBattle();
  });
}

function finishBattle(){
  /* a rival fight is a scene step: losing it does not send you home, because a
     cutscene that teleports you mid-sentence reads as a crash */
  if (B && B.story && typeof storyBattleDone === "function" && story && story.pending){
    if (B.result === "defeat") fullHeal();
    B = null;
    state.encGrace = 14;
    storyBattleDone();
    return;
  }
  if (B.result === "defeat"){
    fullHeal();
    state.zone = "hollowmere";
    player.px = 19; player.py = 12; player.offX = 0; player.offY = 0;
    player.moving = false; player.queued = null; player.moveT = 0;
    state.scene = "world";
    openToast("The Circle carried you home and mended everyone. No penalty — go again.");
  } else {
    state.scene = "world";
    if (B && B.autosaveOnExit) autosave("champion beaten");
  }
  state.encGrace = 14;
  B = null;
}

/* ---------------- player actions ---------------- */
function playerTurn(action){
  const p = me(), e = B.enemy;
  const eSpell = enemyChoose();
  const pPri = action.kind === "spell" ? (SPELLS[action.spell].priority||0) : (action.kind === "item" || action.kind === "swap" || action.kind === "run" ? 6 : 0);
  const ePri = SPELLS[eSpell].priority||0;
  const pSpd = effStat(p,"spd",B.ps), eSpd = effStat(e,"spd",B.es);
  let playerFirst;
  if (pPri !== ePri) playerFirst = pPri > ePri;
  else if (pSpd !== eSpd) playerFirst = pSpd > eSpd;
  else playerFirst = Math.random() < 0.5;

  const doPlayer = () => {
    if (action.kind === "spell"){
      if (statusSkip(p)) return;
      castSpell(p, e, action.spell, true);
    } else if (action.kind === "item"){
      applyItem(action.item, action.targetIdx);
    } else if (action.kind === "swap"){
      doSwap(action.idx);
    } else if (action.kind === "run"){
      attemptRun();
    }
  };
  const doEnemy = () => {
    if (e.hp <= 0 || B.result) return;
    if (statusSkip(e)) return;
    castSpell(e, me(), eSpell, false);
  };

  B.turn++;
  if (playerFirst){ doPlayer(); if (!B.result && B.enemy.hp > 0 && me().hp > 0) doEnemy(); }
  else { doEnemy(); if (!B.result && me().hp > 0 && B.enemy.hp > 0) doPlayer(); }

  if (B.result) return;

  if (B.enemy.hp <= 0 || me().hp <= 0){ if (checkEnd()) return; }

  endOfTurn();
  if (B.enemy.hp <= 0 || me().hp <= 0){ if (checkEnd()) return; }
  runQueue(() => { B.phase = "menu"; B.cursor = 0; });
}

function doSwap(idx){
  const u = state.party[idx];
  say(me().name + " steps back.");
  B.active = idx;
  B.ps = { atk:0, def:0, spd:0 };
  say(u.name + " steps up!", { kind:"swapin", side:"player" });
}

function attemptRun(){
  if (!B.canRun){ say("There is no way out of this one."); return; }
  const p = me(), e = B.enemy;
  const odds = clamp(0.55 + (effStat(p,"spd",B.ps) - effStat(e,"spd",B.es)) / 120 + B.turn*0.08, 0.35, 0.97);
  if (Math.random() < odds){
    say("You slip away.");
    B.result = "flee";
    runQueue(() => finishBattle());
  } else {
    say("You cannot break away!");
  }
}

function applyItem(id, targetIdx){
  const it = ITEMS[id];
  const target = targetIdx != null ? state.party[targetIdx] : me();
  if (it.kind === "heal"){
    const before = target.hp;
    target.hp = Math.min(target.maxHp, target.hp + it.amount);
    say(target.name + " recovers " + (target.hp-before) + " HP.", { kind:"heal", side:"player" });
  } else if (it.kind === "mana"){
    const before = target.mp;
    target.mp = Math.min(target.maxMp, target.mp + it.amount);
    say(target.name + " recovers " + (target.mp-before) + " Mana.", { kind:"heal", side:"player" });
  } else if (it.kind === "cure"){
    if (target.status){ say(target.name + " is cleansed."); target.status = null; target.statusDur = 0; }
    else say("Nothing to cure.");
  } else if (it.kind === "revive"){
    if (target.hp <= 0){ target.hp = Math.floor(target.maxHp/2); say(target.name + " returns to the fight!", { kind:"heal", side:"player" }); }
    else say(target.name + " is already standing.");
  } else if (it.kind === "flee"){
    say("Smoke fills the clearing.");
    B.result = "flee";
    runQueue(() => finishBattle());
  } else if (it.kind === "sigil"){
    offerPact(it);
  }
}

function offerPact(it){
  const e = B.enemy;
  if (!B.rules.recruit){ say("A sworn champion cannot be bound by a sigil."); return; }
  if (state.party.length + state.roster.length >= 66){ say("You cannot hold another pact."); return; }
  say("You hold out the " + it.name + "...", { kind:"sigil", side:"enemy" });
  const p = state.cheats.alwaysBind ? 1 : recruitChance(e, it.mult);
  const r = state.cheats.alwaysBind ? { ok:true, shakes:4 } : rollRecruit(p);
  if (r.ok){
    say(e.name + " accepts the pact!", { kind:"recruit", side:"enemy" });
    const where = addUnit(e);
    e.wild = false;
    recalc(e);
    say(e.name + " joins your " + (where === "party" ? "party." : "Sanctum roster."));
    /* a legendary is one of one: binding it clears it off the field for good.
       Knocking it out does NOT — it is back next time, or a bad turn would
       delete content permanently. */
    if (B.legendFlag){
      state.flags[B.legendFlag] = true;
      state.legendBound = (state.legendBound || 0) + 1;
      say("There is no second one of these.");
    }
    B.result = "recruit";
    runQueue(() => finishBattle());
  } else {
    const lines = ["The sigil dims — no deal.", "Close. " + e.name + " pulls away.", e.name + " shakes the sigil off.", e.name + " almost agreed!"];
    say(lines[Math.min(3, r.shakes)]);
  }
}

/* ---------------- battle rendering ---------------- */
function renderBattle(){
  const p = me(), e = B.enemy;
  const shake = B.shakeT > 0 ? Math.round(Math.sin(B.shakeT*1.8)*3) : 0;

  /* backdrop */
  const S = SCHOOLS[schoolOf(e)];
  const g = ctx.createLinearGradient(0,0,0,H-150);
  g.addColorStop(0, "#140f20"); g.addColorStop(1, S.dark);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(0, 282, W, 24);

  /* ground discs */
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(470, 172, 84, 20, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(150, 276, 94, 23, 0, 0, Math.PI*2); ctx.fill();

  if (B.kind !== "wild" && B.foeName){
    const lbl = B.foeName.toUpperCase();
    const lw = measure(lbl, 12) + 24;
    ctx.fillStyle = "rgba(10,7,18,.86)"; ctx.fillRect(W/2-lw/2, 94, lw, 20);
    ctx.strokeStyle = "#e05a6a"; ctx.lineWidth = 1; ctx.strokeRect(W/2-lw/2+.5, 94.5, lw-1, 19);
    txt(lbl, W/2, 108, { size:12, align:"center", color:"#f0c0a8" });
    /* team pips (only meaningful for a squad) */
    if (B.team.length > 1) for (let i=0;i<B.team.length;i++){
      const alive = B.team[i].hp > 0;
      ctx.fillStyle = alive ? "#e05a6a" : "#3a2f42";
      ctx.fillRect(W/2 - B.team.length*7 + i*14, 120, 10, 5);
    }
  }
  if (B.flashT > 0){ ctx.fillStyle = "rgba(255,255,255,"+(B.flashT/16)+")"; ctx.fillRect(0,0,W,H); }

  /* enemy */
  const eShake = (B.fx && B.fx.side === "enemy" && B.shakeT>0) ? shake : 0;
  drawFigure(470 + eShake, 170, 4, e.arch, "left", 0, { faint: hpShow(e)<=0, rare: e.rare });
  /* player */
  const pShake = (B.fx && B.fx.side === "player" && B.shakeT>0) ? shake : 0;
  drawFigure(150 + pShake, 274, 4.4, p.arch, "right", 0, { faint: hpShow(p)<=0, rare: p.rare });

  /* fx overlay */
  if (B.fx && B.fxT > 0) drawFx(B.fx, B.fxT);

  /* enemy plate */
  drawCombatPlate(24, 24, e, true);
  /* player plate */
  drawCombatPlate(W-24-292, 196, p, false);

  /* bottom */
  if (B.phase === "msg" || B.phase === "intro"){
    panel(0, H-132, W, 132);
    const m = B.queue[0];
    if (m) wrapText(m.text, 28, H-96, W-56, 20, { size:17 });
    txt("Z  ▸", W-34, H-20, { size:13, align:"right", color:"#e8c56a" });
  } else if (B.phase === "menu"){
    drawActionMenu();
  } else if (B.phase === "spells"){
    drawSpellMenu();
  } else if (B.phase === "bag"){
    drawBattleBag();
  } else if (B.phase === "swap"){
    drawSwapMenu();
  } else if (B.phase === "learn"){
    drawLearnMenu();
  }
}

function drawFx(fx, t){
  const strong = t/18;
  if (fx.side === "enemy"){ var cx = 470, cy = 132; } else { cx = 150; cy = 226; }
  const col = fx.school && SCHOOLS[fx.school] ? SCHOOLS[fx.school].color : "#ffffff";
  ctx.save();
  if (fx.kind === "cast"){
    ctx.globalAlpha = strong*0.9;
    for (let i=0;i<8;i++){
      const a = (i/8)*Math.PI*2 + (18-t)*0.2;
      const r = 30 + (18-t)*4;
      ctx.fillStyle = col;
      ctx.fillRect(cx + Math.cos(a)*r - 3, cy + Math.sin(a)*r*0.6 - 3, 6, 6);
    }
  } else if (fx.kind === "hit" || fx.kind === "crit"){
    ctx.globalAlpha = strong;
    ctx.strokeStyle = fx.kind === "crit" ? "#fff0a0" : col;
    ctx.lineWidth = fx.kind === "crit" ? 5 : 3;
    for (let i=0;i<4;i++){
      const a = i*1.1 + 0.3;
      ctx.beginPath();
      ctx.moveTo(cx - Math.cos(a)*46, cy - Math.sin(a)*46);
      ctx.lineTo(cx + Math.cos(a)*46, cy + Math.sin(a)*46);
      ctx.stroke();
    }
  } else if (fx.kind === "heal"){
    ctx.globalAlpha = strong;
    ctx.fillStyle = "#8ff09a";
    for (let i=0;i<6;i++){
      const yy = cy + 40 - ((18-t)*4 + i*9) % 90;
      ctx.fillRect(cx - 30 + i*11, yy, 5, 5);
    }
  } else if (fx.kind === "buff" || fx.kind === "level" || fx.kind === "ascend"){
    ctx.globalAlpha = strong;
    ctx.strokeStyle = fx.kind === "ascend" ? "#fff0c0" : "#a8d8ff";
    ctx.lineWidth = 3;
    const r = 20 + (18-t)*3;
    ctx.beginPath(); ctx.ellipse(cx, cy+40, r, r*0.35, 0, 0, Math.PI*2); ctx.stroke();
  } else if (fx.kind === "debuff" || fx.kind === "status"){
    ctx.globalAlpha = strong;
    ctx.fillStyle = "#c090e0";
    for (let i=0;i<5;i++) ctx.fillRect(cx-24+i*12, cy+10+Math.sin((18-t)/2+i)*8, 6, 6);
  } else if (fx.kind === "sigil" || fx.kind === "recruit"){
    ctx.globalAlpha = strong;
    ctx.strokeStyle = "#e8c56a"; ctx.lineWidth = 3;
    const r = 46 - (18-t)*2;
    ctx.beginPath(); ctx.arc(cx, cy, Math.max(4,r), 0, Math.PI*2); ctx.stroke();
  } else if (fx.kind === "faint"){
    ctx.globalAlpha = strong*0.7;
    ctx.fillStyle = "#000"; ctx.fillRect(cx-40, cy-40, 80, 120);
  }
  ctx.restore();
}

function drawCombatPlate(x, y, u, isEnemy){
  const w = 292, h = isEnemy ? 62 : 76;
  panel(x, y, w, h);
  txt((u.rare ? "\u2726 " : "") + u.name, x+14, y+24,
      { size:16, color: u.rare ? "#8ff0e0" : "#e8e2d5" });
  txt("L"+u.level, x+w-14, y+24, { size:14, align:"right", color:"#e8c56a" });

/* ---------- learn / forget ----------
   Forgetting a spell is permanent, so the screen has to make the trade
   legible: the incoming spell and the candidate sit in matching cards with
   the same stat rows, and a caution line calls out the things you only
   notice after you have already lost them (your last heal, your last free
   swing, your last spell of your own school). */
function spellStats(S){
  const bits = [];
  if (S.kind === "dmg") bits.push("Power " + S.power);
  else if (S.kind === "heal") bits.push("Heals " + Math.round(S.healPct*100) + "%");
  else if (S.kind === "buff") bits.push(statName(S.stat) + " +" + S.stages);
  else if (S.kind === "debuff") bits.push("Foe " + statName(S.stat) + " " + S.stages);
  else bits.push("Utility");
  bits.push(S.mana ? S.mana + " MP" : "free");
  if (S.acc != null && S.acc < 100) bits.push("Acc " + S.acc + "%");
  if (S.priority) bits.push("goes first");
  if (S.status) bits.push(STATUSES[S.status].name + " " + S.chance + "%");
  if (S.drain) bits.push("drain " + Math.round(S.drain*100) + "%");
  if (S.recoil) bits.push("recoil " + Math.round(S.recoil*100) + "%");
  if (S.cleanse) bits.push("cleanses");
  return bits.join("   ·   ");
}
/* what you lose that nothing else in the four covers */
function forgetCaution(u, idx, newId){
  const S = SPELLS[u.spells[idx]], N = SPELLS[newId];
  const others = u.spells.filter((s,i) => i !== idx && s).map(s => SPELLS[s]).concat([N]);
  if (S.kind === "heal" && !others.some(o => o.kind === "heal"))
    return "This is the last spell that heals.";
  if (S.mana === 0 && !others.some(o => o.mana === 0))
    return "This is the last spell that costs no Mana.";
  const own = schoolOf(u);
  if (S.school === own && !others.some(o => o.school === own))
    return "This is the last " + SCHOOLS[own].name + " spell — no same-school bonus without it.";
  if (S.kind === "dmg" && !others.some(o => o.kind === "dmg"))
    return "This is the last spell that deals damage.";
  return null;
}

function wrapText(s, x, y, maxW, lh, o){
  o = o || {};
  ctx.font = FONT(o.size||15, o.weight);
  const words = s.split(" ");
  let line = "", yy = y;
  for (const w of words){
    const test = line ? line+" "+w : w;
    if (ctx.measureText(test).width > maxW && line){
      txt(line, x, yy, o); line = w; yy += lh;
    } else line = test;
  }
  if (line) txt(line, x, yy, o);
  return yy;
}

/* ---------------- the continent ---------------- */
const MAP_SCALE = 2.45, MAP_OX = 24, MAP_OY = 26;
const mx = x => MAP_OX + x*MAP_SCALE;
const my = y => MAP_OY + y*MAP_SCALE;

/* grow is how far past its own coast a region reaches; the landmass pass uses
   an expansion big enough that neighbours meet and the whole thing reads as
   one continent rather than a scatter of islands */
const LAND_GROW = 1.36;
function regionPath(r, grow){
  const pts = regionOutline(r);
  const k = grow || 1;
  const P = p => [ r.cx + (p[0]-r.cx)*k, r.cy + (p[1]-r.cy)*k ];
  ctx.beginPath();
  const n = pts.length;
  const a = P(pts[n-1]), b = P(pts[0]);
  ctx.moveTo(mx((a[0]+b[0])/2), my((a[1]+b[1])/2));
  for (let i=0;i<n;i++){
    const cur = P(pts[i]), nxt = P(pts[(i+1)%n]);
    ctx.quadraticCurveTo(mx(cur[0]), my(cur[1]), mx((cur[0]+nxt[0])/2), my((cur[1]+nxt[1])/2));
  }
  ctx.closePath();
}

function renderMap(){
  /* sea */
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, "#0d2236"); g.addColorStop(1, "#081625");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(255,255,255,.035)";
  for (let i=0;i<26;i++){
    const wy2 = 20 + ((i*37 + Math.floor(animTick/6)) % (H-40));
    ctx.fillRect(18 + (i*53) % (W-70), wy2, 14, 1);
  }

  /* two sheets: the homeland, and Oathfall across the water */
  const pageTwo = ui.mapPage === 1 && oathfallSeen();
  const REG = pageTwo ? CONTINENT2 : CONTINENT;
  const ROADS = pageTwo ? MAP_ROADS2 : MAP_ROADS;
  if (!REG.some(r => r.id === ui.mapSel)) ui.mapSel = REG[0].id;

  const cur = REG.find(r => r.id === state.zone);
  const hostOf = zid => {
    const z = ZONES[zid];
    if (!z) return null;
    if (z.region === "wild") return zid;
    const back = (z.warps||[])[0];
    return back ? back.to : null;
  };
  const hereId = hostOf(state.zone);

  /* 1. continental shelf */
  ctx.save();
  ctx.globalAlpha = 0.45;
  ctx.lineJoin = "round";
  for (const r of REG){
    regionPath(r, LAND_GROW);
    ctx.strokeStyle = "#2f6a86"; ctx.lineWidth = 16; ctx.stroke();
  }
  ctx.restore();
  /* 2. one contiguous landmass, so the regions share a coast */
  for (const r of REG){ regionPath(r, LAND_GROW); ctx.fillStyle = "#4c4a3c"; ctx.fill(); }
  ctx.save();
  ctx.globalAlpha = 0.55;
  for (const r of REG){
    regionPath(r, LAND_GROW);
    ctx.strokeStyle = "#171d2a"; ctx.lineWidth = 2.5; ctx.stroke();
  }
  ctx.restore();

  /* 3. the regions themselves, inset on the land */
  for (const r of REG){
    const T = TERRAIN_COLOR[r.terr] || TERRAIN_COLOR.forest;
    const visited = !!state.seen["zone_" + r.id] || r.id === hereId || r.id === "hollowmere";
    regionPath(r, 1.12);
    ctx.fillStyle = visited ? T.fill : "#37354a";
    ctx.fill();
    ctx.strokeStyle = visited ? T.edge : "#262438";
    ctx.lineWidth = 1.5; ctx.stroke();
    if (ui.mapSel === r.id){
      ctx.strokeStyle = "#e8c56a"; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }

  /* roads */
  ctx.strokeStyle = "rgba(232,197,106,.42)"; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
  for (const [a,b] of ROADS){
    const ra = REG.find(r=>r.id===a), rb = REG.find(r=>r.id===b);
    if (!ra || !rb) continue;
    ctx.beginPath(); ctx.moveTo(mx(ra.cx), my(ra.cy)); ctx.lineTo(mx(rb.cx), my(rb.cy)); ctx.stroke();
  }
  ctx.setLineDash([]);

  /* pins and labels */
  for (const r of REG){
    const z = ZONES[r.id];
    const sites = MAP_SITES[r.id] || [];
    sites.forEach((st, i) => {
      const px = mx(r.cx) + (i ? 15 : -15), py = my(r.cy) + 17;
      const done = st.kind === "dungeon" ? !!state.cleared[st.id] : !!state.flags[st.id + "_leader"];
      ctx.fillStyle = done ? "#7ce8a0" : (st.kind === "dungeon" ? "#b48ae0" : "#e8c56a");
      ctx.beginPath();
      if (st.kind === "dungeon"){
        ctx.moveTo(px, py-5); ctx.lineTo(px+5, py); ctx.lineTo(px, py+5); ctx.lineTo(px-5, py);
      } else {
        ctx.moveTo(px, py-6); ctx.lineTo(px+5, py+4); ctx.lineTo(px-5, py+4);
      }
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 1; ctx.stroke();
    });
    txt(r.label, mx(r.cx), my(r.cy) - 8, { size:11, align:"center", color:"#f2ecdd" });
    if (z && z.rate) txt("L" + z.levels[0] + "-" + z.levels[1], mx(r.cx), my(r.cy) + 5,
        { size:9, align:"center", color:"rgba(255,255,255,.68)" });
    else txt("safe", mx(r.cx), my(r.cy) + 5, { size:9, align:"center", color:"rgba(160,240,180,.7)" });
  }

  /* you are here */
  if (hereId){
    const r = REG.find(x => x.id === hereId);
    if (r){
      const pr = 24 + Math.sin(animTick/12)*3;
      ctx.strokeStyle = "rgba(255,240,192,.9)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mx(r.cx), my(r.cy) - 2, pr, 0, Math.PI*2); ctx.stroke();
      txt("you are here", mx(r.cx), my(r.cy) - 2 - pr - 5,
          { size:9, align:"center", color:"#fff0c0" });
    }
  }

  /* selection readout */
  const sel = REG.find(r => r.id === ui.mapSel) || cur || REG[0];
  panel(16, H-78, W-32, 64);
  const sz = ZONES[sel.id];
  txt(sel.label, 30, H-56, { size:15, color:"#f0e2a8" });
  if (sz && sz.rate) txt("wild levels " + sz.levels[0] + "–" + sz.levels[1], 190, H-56,
      { size:12, color:"#9fe0a0" });
  else txt("no wild encounters", 190, H-56, { size:12, color:"#9fe0a0" });
  const sites = MAP_SITES[sel.id] || [];
  txt(sites.length ? sites.map(st => st.name + (
        (st.kind === "dungeon" ? state.cleared[st.id] : state.flags[st.id + "_leader"]) ? " ✓" : "")
      ).join("   ·   ") : "nothing built here",
      30, H-36, { size:11, color:"#c8c0d8" });
  txt("← →  pick a region      ◆ dungeon   ▲ chapel   ✓ cleared" +
      (oathfallSeen() ? "      \u2191\u2193 / TAB  " + (pageTwo ? "the homeland" : "Oathfall") : "") + "      X  back",
      W/2, H-16, { size:11, align:"center", color:"#e8c56a" });
  /* a sheet with no name reads as a bug the first time you flip to it */
  panel(W-128, 14, 112, 26);
  txt(pageTwo ? "OATHFALL" : "THE CIRCLE", W-72, 31, { size:11, align:"center", color:"#e8c56a" });
}

/* ---------------- the relearner ----------------
   Three steps in one screen: who, which spell, and \u2014 only when all four
   slots are full \u2014 what it displaces. The last step reuses the battle's
   comparison cards, so forgetting looks the same wherever it happens. */
function relearnPeople(){ return state.party; }
function renderRelearn(){
  ctx.fillStyle = "#100c1a"; ctx.fillRect(0,0,W,H);
  const g = ctx.createLinearGradient(0,0,0,54);
  g.addColorStop(0,"#1c2340"); g.addColorStop(1,"#100c1a");

  txt(state.gold + " g", W-24, 36, { size:16, align:"right", color:"#e8c56a" });

  const people = relearnPeople();
  const step = ui.relearnStep || 0;

  if (step === 0){
    txt("Whose records should I pull?", 24, 78, { size:14, color:"#c8c0d8" });
    for (let i=0;i<people.length;i++){
      const u = people[i], on = ui.cursor === i, y = 112 + i*44;
      if (on){ ctx.fillStyle = "rgba(143,180,232,.14)"; ctx.fillRect(18, y-26, W-36, 40); }
      drawFigure(52, y+10, 2.2, u.arch, "down", 0, { rare: u.rare });
      const S = SCHOOLS[schoolOf(u)];
      txt((on?"\u25b8 ":"  ") + u.name, 78, y-6, { size:15, color: on?"#fff0c0":"#e8e2d5" });
      txt(archName(u) + "  \u00b7  L" + u.level, 78, y+10, { size:11, color:"#9a8fb5" });
      ctx.fillStyle = S.color; ctx.fillRect(300, y-16, 3, 26);
      const n = learnableFor(u).length;
      txt(n ? (n + " forgotten") : "nothing forgotten", W-30, y+2,
          { size:12, align:"right", color: n ? "#8fb4e8" : "#5d5472" });
    }
    txt("Z  choose      X  leave", W/2, H-18, { size:12, align:"center", color:"#8fb4e8" });
    return;
  }

  const u = people[clamp(ui.sel, 0, Math.max(0, people.length-1))];
  if (!u){ ui.relearnStep = 0; return; }

  if (step === 1){
    const list = learnableFor(u);
    txt(u.name + " \u2014 " + list.length + " spell" + (list.length===1?"":"s") + " on record",
        24, 78, { size:14, color:"#c8c0d8" });
    if (!list.length){
      txt("Every spell they ever knew, they still know.", 24, 120, { size:15, color:"#7a6f88" });
