      return;
    }
    const per = 9, top = clamp(ui.cursor - 4, 0, Math.max(0, list.length - per));
    for (let i=0;i<Math.min(per, list.length);i++){
      const idx = top + i, sid = list[idx]; if (!sid) break;
      const S = SPELLS[sid], sc = SCHOOLS[S.school];
      const cost = relearnCost(sid), afford = state.gold >= cost;
      const on = ui.cursor === idx, y = 110 + i*28;
      if (on){ ctx.fillStyle = "rgba(143,180,232,.14)"; ctx.fillRect(18, y-18, 300, 25); }
      ctx.fillStyle = sc ? sc.color : "#7a7a88"; ctx.fillRect(26, y-13, 3, 15);
      txt((on?"\u25b8 ":"  ") + S.name, 36, y, { size:14,
          color: on ? "#fff0c0" : (afford ? "#e8e2d5" : "#7a6f88") });
      txt(cost + " g", 306, y, { size:12, align:"right",
          color: afford ? "#e8c56a" : "#a05a6a" });
    }
    const sid = list[clamp(ui.cursor, 0, list.length-1)];
    spellCard(330, 98, 292, 96, sid, "ON RECORD", "#8fb4e8", u);
    panel(330, 204, 292, 76);
    txt("Slots in use", 344, 226, { size:11, color:"#9a8fb5" });
    txt(u.spells.length + " / 4", 608, 226, { size:13, align:"right",
        color: u.spells.length >= 4 ? "#e0a86a" : "#7ce8c0" });
    wrapText(u.spells.length >= 4
        ? "Four slots are full, so you will be asked what this displaces."

      344, 248, 264, 14, { size:10.5, color:"#c8c0d8" });
    txt("Z  pay and relearn      X  back", W/2, H-18, { size:12, align:"center", color:"#8fb4e8" });
    return;

  /* step 2 \u2014 what it displaces, in the same cards the battle uses */
  const sid = ui.relearnSpell;
  txt(u.name + " already knows four. What goes?", 24, 78, { size:14, color:"#c8c0d8" });
  for (let i=0;i<5;i++){
    const on = ui.cursor === i, y = 112 + i*26;

    if (i < 4){
      const old = u.spells[i];

    txt("!", 28, 274, { size:13, color:"#e8b06a" });
    wrapText(warn, 42, 272, 244, 13, { size:10.5, color:"#e8c89a" });
  }
  txt(relearnCost(sid) + " g      Z  confirm      X  back", W/2, H-18,
      { size:12, align:"center", color:"#8fb4e8" });
}

/* ---------------- options ----------------
   Two of these change how the game feels rather than what it does: a run to
   Level 100 is a lot of battles, and every one of them was paced for the first
   one you ever saw. */
const SPEEDS = [
  { name:"Normal",  mult:1,   desc:"Bars drain and blows land at the pace they always have." },
  { name:"Fast",    mult:2,   desc:"Bars and effects run about twice as quick. Everything still reads." },
  { name:"Instant", mult:99,  desc:"Bars snap to their value and effects barely hold. Built for grinding." },

function opt(){

   game a player cannot fix by playing better. This is the answer: two prices,
   one that gambles and one that does not. */

/* the matchup grid, drawn rather than described */
function drawTypeChart(cx, cy){
  const n = SCHOOL_KEYS.length, cell = 22, x0 = cx - (n*cell)/2 + 14, y0 = cy - (n*cell)/2 + 14;
  txt("attacker  →", x0 - 8, y0 - 26, { size:10, color:"#7a6f92" });
  for (let i=0;i<n;i++){
    const S = SCHOOLS[SCHOOL_KEYS[i]];
    txt(S.glyph, x0 + i*cell + cell/2, y0 - 10, { size:13, align:"center", color:S.color });
    txt(S.glyph, x0 - 12, y0 + i*cell + cell/2 + 5, { size:13, align:"center", color:S.color });
  }
  for (let dy=0; dy<n; dy++) for (let dx=0; dx<n; dx++){
    const m = typeMult(SCHOOL_KEYS[dx], SCHOOL_KEYS[dy]);
    const x = x0 + dx*cell, y = y0 + dy*cell;
    ctx.fillStyle = m >= 2 ? "rgba(124,232,124,.30)" : (m <= 0.5 ? "rgba(232,124,124,.28)" : "rgba(255,255,255,.04)");

    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1;
    ctx.strokeRect(x+1.5, y+1.5, cell-3, cell-3);
    if (m !== 1) txt(m >= 2 ? "2x" : "½", x + cell/2, y + cell/2 + 4,
        { size:10, align:"center", color: m >= 2 ? "#a8f0a8" : "#f0a8a8" });
  }
  txt("↓ defender", x0 - 46, y0 + n*cell + 14, { size:10, color:"#7a6f92" });
  txt("green = double      red = half", x0 + n*cell/2, y0 + n*cell + 32,
      { size:10, align:"center", color:"#7a6f92" });
}

/* The stock outgrew the screen: 23 items at 30px from y=108 ran to y=768 on a
   480px canvas, so everything past the twelfth was drawn into the void with no
   way to reach it. Now a fixed window follows the cursor, and the description
   moved to a footer where it has room instead of being clipped by the panel. */
const SHOP_ROWS = 9;
/* a trader can carry its own list; ui.shopStock is set when you walk in */
function shopList(){ return ui.shopStock || SHOP_STOCK; }
function shopTop(){
  return clamp(ui.cursor - 4, 0, Math.max(0, shopList().length - SHOP_ROWS));
}
function renderShop(){
  renderOverworld();
  ctx.fillStyle = "rgba(8,6,14,.80)"; ctx.fillRect(0,0,W,H);

  const stock = shopList();
  const top = shopTop(), n = stock.length;
  for (let i=0;i<Math.min(SHOP_ROWS, n); i++){
    const idx = top + i, id = stock[idx]; if (!id) break;
    const it = ITEMS[id], on = ui.cursor === idx;

    if (on){ ctx.fillStyle = "rgba(232,197,106,.16)"; ctx.fillRect(48, y-19, W-108, 25); }

    txt(it.price + " g", 440, y, { size:14, align:"right", color: afford ? "#e8c56a" : "#a05a6a" });
    txt(owned ? ("have " + owned) : "", 536, y, { size:12, align:"right", color:"#9a8fb5" });
  }

  /* a real scrollbar, so the depth of the list is visible rather than guessed */
  if (n > SHOP_ROWS){
    const tx = W-56, ty = 84, th = SHOP_ROWS*28;
    ctx.fillStyle = "#1a1528"; ctx.fillRect(tx, ty, 5, th);
    const kh = Math.max(18, th * SHOP_ROWS / n);
    const ky = ty + (th - kh) * (top / Math.max(1, n - SHOP_ROWS));
    ctx.fillStyle = "#6a5a93"; ctx.fillRect(tx, ky, 5, kh);
  }

  const sel = ITEMS[stock[clamp(ui.cursor, 0, n-1)]];

  txt("\u2191\u2193  browse      Z  buy one      X  leave", W/2, H-40,
      { size:13, align:"center", color:"#e8c56a" });
}

/* ============================================================
   STORY  —  the first Circle is coming back

   Twenty scenes hung off beats the player already hits: a badge, a cleared
   dungeon, a road walked for the first time. A scene is a list of steps run by
   storyTick(); the only new engine piece is a scripted mover, because the whole
   point of a cutscene here is people walking into frame and out again.

   Everything is driven by state.flags, so a scene fires once and a save knows
   where it is. No scene ever blocks progress: if you skip the zone it lives in,
   you skip the scene.
   ============================================================ */

let story = null;            /* the scene in flight */
let storyOff = false;        /* hard off, for tests and for the cheat console */
const STORY_SPEED = 4.2;     /* tiles a second for a scripted walk */

function storyActive(){ return !!story; }
/* starting or loading a run has to drop whatever scene was in flight, or the
   old one keeps the controls and every later beat is blocked behind it */
function resetStory(){
  story = null;
  if (ui) ui.dialog = null;
}
function storyFlag(id){ return "story_" + id; }
function storySeen(id){ return !!state.flags[storyFlag(id)]; }

/* ---------------- the rival ----------------
   Teilo picks the starter that beats yours, which is decided the moment you
   pick, and his team grows across six meetings. His level is read off YOUR
   party at the moment the fight starts rather than written down, so he is a
   step above you whether you rushed here or ground for an hour. */
const RIVAL_COUNTER = {
  cinder_acolyte:  "rill_novice",      /* tide drowns ember */
  rill_novice:     "seedling_warden",  /* verdant drinks tide */
  seedling_warden: "cinder_acolyte",   /* ember burns verdant */
};
const RIVAL_CHAIN = {
  rill_novice:     ["rill_novice","tidecaller","abyssal_oracle","tidewrought"],
  seedling_warden: ["seedling_warden","grove_keeper","worldroot_druid","heartwood"],
  cinder_acolyte:  ["cinder_acolyte","flame_cantor","pyre_magus","emberthrone"],
};
/* the support he picks up, in the order he picks it up */
const RIVAL_SUPPORT = ["gravemarker","static_herald","prism_monk","mountainheart","skyrender"];

function rivalStarter(){
  if (state.rivalStarter) return state.rivalStarter;
  const mine = state.party.length ? state.party[0].arch : "cinder_acolyte";
  const base = RIVAL_COUNTER[mine] ? mine : "cinder_acolyte";
  state.rivalStarter = RIVAL_COUNTER[base];
  return state.rivalStarter;
}
function rivalAce(meeting){
  const chain = RIVAL_CHAIN[rivalStarter()] || RIVAL_CHAIN.cinder_acolyte;
  const stage = meeting <= 1 ? 0 : (meeting <= 3 ? 1 : (meeting <= 5 ? 2 : 3));
  return chain[stage];
}
function storyPartyLevel(){
  const alive = state.party.filter(u => u.level);
  if (!alive.length) return 6;
  let s = 0; for (const u of alive) s += u.level;
  return Math.round(s / alive.length);
}
/* he is always a little above you, and never below the floor the story implies */
const RIVAL_FLOOR = [8, 14, 22, 32, 44, 58];
function rivalLevel(meeting){
  const floor = RIVAL_FLOOR[clamp(meeting-1, 0, RIVAL_FLOOR.length-1)];
  return clamp(Math.max(floor, storyPartyLevel() + 2), 5, MAX_LEVEL);
}
function rivalTeam(meeting){
  const lv = rivalLevel(meeting);
  const size = meeting <= 2 ? 1 : (meeting <= 4 ? 2 : 3);
  const archs = [rivalAce(meeting)];
  for (let i=0; archs.length < size; i++) archs.unshift(RIVAL_SUPPORT[i % RIVAL_SUPPORT.length]);
  return archs.map((a, i) => {
    /* his people keep ordinary names out of the pool — he is a binder, not a
       boss, and "Teilo's ace" would read as a label rather than a person */
    const u = makeUnit(a, Math.max(5, lv - (archs.length - 1 - i)), {});
    u.wild = false;
    for (const k in u.spark) u.spark[k] = Math.max(u.spark[k], 8 + meeting);
    u.talents.a1 = Math.min(3, meeting); u.talents.b1 = Math.min(3, meeting);
    u.talents.a3 = Math.min(3, meeting); u.talents.b2 = Math.min(3, meeting);
    u.tp = 0;
    recalc(u); u.hp = u.maxHp; u.mp = u.maxMp;
    return u;
  });
}
function rivalLook(){ return rivalStarter(); }

/* ---------------- scene steps ----------------
   say    { who, line }            a dialogue box; Z advances
   spawn  { id, at:[x,y], arch, facing, name }
   move   { id, to:[x,y] }         walks, ignoring collision — it is a cutscene
   face   { id, dir }
   wait   { t }
   despawn{ id }
   fade   { }                      a black wipe, for a scene that ends elsewhere
   warp   { to, at:[x,y] }         move the player under the black
   fight  { meeting } | { kind, team, opts }
   flag   { set }                  a story flag other scenes can read
   shake  { t }

function sMove(id, to){ return { k:"move", id, to }; }
function sFace(id, dir){ return { k:"face", id, dir }; }
function sWait(t){ return { k:"wait", t }; }
function sDespawn(id){ return { k:"despawn", id }; }
function sFight(meeting){ return { k:"fight", meeting }; }

/* ---------------- lookup and triggering ---------------- */
const STORY_BY_ID = {};
for (const sc of STORY) STORY_BY_ID[sc.id] = sc;

/* a scene is ready when its zone matches, its flag is unset, and either its
   `after` flag is set or its `when` says so */
function storyReady(sc){
  if (storySeen(sc.id)) return false;
  if (sc.zone && state.zone !== sc.zone) return false;
  if (sc.after && !state.flags[sc.after]) return false;
  if (sc.when && !sc.when()) return false;
  return true;
}
function checkStory(){
  if (storyOff || (state.cheats && state.cheats.noStory)) return false;
  if (story || state.scene !== "world" || transition) return false;
  for (const sc of STORY){
    if (storyReady(sc)){ beginScene(sc); return true; }
  }
  return false;
}

function beginScene(sc){
  state.flags[storyFlag(sc.id)] = true;
  story = { id: sc.id, steps: sc.steps(), i: -1, t: 0, actors: {}, mover: null };
  state.scene = "story";
  ui.dialog = null;
  player.moving = false; player.queued = null; player.offX = 0; player.offY = 0;
  storyAdvance();
  return true;
}
function endScene(){
  story = null;
  ui.dialog = null;
  if (state.scene === "story") state.scene = "world";
  state.encGrace = 8;
  autosave("story");
}

function storyActorList(){
  if (!story) return [];
  const out = [];
  for (const id in story.actors) out.push(story.actors[id]);
  return out;
}
function storyActorAt(x, y){
  if (!story) return null;
  for (const id in story.actors){
    const a = story.actors[id];
    if (a.x === x && a.y === y) return a;
  }
  return null;
}

function storyAdvance(){
  if (!story) return;
  story.i++;
  if (story.i >= story.steps.length){ endScene(); return; }
  const s = story.steps[story.i];
  switch (s.k){
    case "say":
      ui.dialog = { name: s.who, line: s.line };
      return;                         /* waits for Z */
    case "spawn": {
      const a = { id:s.id, x:s.at[0], y:s.at[1], arch:s.arch, name:s.name || s.id,
                  facing:s.facing || "down", ox:0, oy:0 };
      story.actors[s.id] = a;
      break;
    }
    case "despawn": delete story.actors[s.id]; break;
    case "face": {
      const a = s.id === "player" ? player : story.actors[s.id];
      if (a) a.facing = s.dir;
      break;
    }
    case "move": {
      story.mover = { id:s.id, to:s.to, t:0 };
      return;                         /* waits for the walk */
    }
    case "wait": story.t = s.t; return;
    case "give":
      giveItem(s.item, s.n || 1);
      openToast("Received " + ITEMS[s.item].name + ".");
      break;
    case "flag": state.flags[s.set] = true; break;
    case "warp":
      state.zone = s.to;
      state.seen["zone_" + s.to] = true;
      player.px = s.at[0]; player.py = s.at[1];
      player.offX = 0; player.offY = 0;
      break;
    case "fight": {
      /* the scene parks here; storyBattleDone() picks it back up */
      const meeting = s.meeting;
      state.rivalMeetings = Math.max(state.rivalMeetings || 0, meeting);
      story.pending = true;
      ui.dialog = null;
      enterBattle("trainer", rivalTeam(meeting), {
        kind:"trainer",
        foeName: RIVAL_NAME + ", meeting " + meeting,
        reward:{ gold: 400 * meeting },
        story:true,
      });
      return;
    }
  }
  storyAdvance();
}

/* called by finishBattle when a story fight ends, win or lose */
function storyBattleDone(){
  if (!story || !story.pending) return false;
  story.pending = false;
  state.scene = "story";
  storyAdvance();
  return true;
}

function storyTick(dt){
  if (!story) return;
  if (story.pending) return;
  if (story.t > 0){
    story.t -= dt;
    if (story.t <= 0){ story.t = 0; storyAdvance(); }
    return;
  }
  const m = story.mover;
  if (!m) return;
  const a = m.id === "player" ? player : story.actors[m.id];
  if (!a){ story.mover = null; storyAdvance(); return; }
  const ax = m.id === "player" ? player.px : a.x;
  const ay = m.id === "player" ? player.py : a.y;
  if (ax === m.to[0] && ay === m.to[1]){
    a.ox = 0; a.oy = 0;
    story.mover = null;
    storyAdvance();
    return;
  }
  /* one axis at a time: x first, then y. A cutscene walker ignores collision,
     which is the only reason this needs no pathfinding. */
  let dx = 0, dy = 0;
  if (ax !== m.to[0]) dx = m.to[0] > ax ? 1 : -1;
  else dy = m.to[1] > ay ? 1 : -1;
  a.facing = dx ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  m.t += dt * STORY_SPEED;
  const step = Math.min(1, m.t);
  if (m.id === "player"){ player.offX = dx*TS*step; player.offY = dy*TS*step; }
  else { a.ox = dx*TS*step; a.oy = dy*TS*step; }
  if (m.t >= 1){
    m.t -= 1;
    if (m.id === "player"){ player.px += dx; player.py += dy; player.offX = 0; player.offY = 0; }
    else { a.x += dx; a.y += dy; a.ox = 0; a.oy = 0; }
  }
}

/* Z advances a line; nothing else does anything, so a cutscene cannot be
   walked out of halfway through */
function keyStory(k){
  if (!story) { state.scene = "world"; return; }
  if (story.pending) return;
  if (ui.dialog && (isConfirm(k) || isCancel(k))){
    ui.dialog = null;
    storyAdvance();
  }
}

/* ============================================================
   MAIN  —  player, input, save/load, loop
   ============================================================ */

const player = {
  px:19, py:12, offX:0, offY:0, facing:"down",
  moving:false, moveT:0, dir:null, stepFrame:0, stepCount:0, queued:null, walkPhase:0,
};
const TILES_PER_SEC = 5.4;   /* walk speed */
const RUN_MULT = 1.7;        /* hold Shift */
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
const keys = {};

/* ---------------- movement ---------------- */
function tryMove(dir){
  if (player.moving) return;
  player.facing = dir;
  const [dx,dy] = DIRS[dir];
  const nx = player.px + dx, ny = player.py + dy;
  const z = currentZone();

  const wp = warpAt(z, nx, ny);
  if (wp){ doWarp(wp); return; }

  if (solidAt(z, nx, ny)) return;
  player.moving = true; player.moveT = 0; player.dir = dir;
}
function autosave(reason){
  if (saveGame(true)) openToast("Autosaved — " + reason + ".");
}
/* every fight now arrives the same way: sting, animation, battle. The tier
   picks the key, the length and whether the flashes go red. */
function enterBattle(kind, team, opts){
  battleSting(kind);
  startTransition(stingTierFor(kind) === "boss" ? "encounter_boss" : "encounter",
    battleIntroDur(kind), () => {
      /* hand the music back with trackId nulled, so the battle theme restarts
         from its first bar instead of resuming mid-phrase */
      audio.lock = false; audio.trackId = null;
      startBattle(team, opts);
    });
}

const WARP_FADE = 0.72;
function applyWarp(wp){
  state.zone = wp.to;
  state.seen["zone_" + wp.to] = true;
  player.px = wp.tx; player.py = wp.ty;
  player.offX = 0; player.offY = 0; player.moving = false; player.queued = null;
  state.encGrace = 6;
  openToast(ZONES[wp.to].name);
  if (ZONES[wp.to].region === "wild" && !ZONES[wp.to].rate) autosave("reached " + ZONES[wp.to].name);
}
function doWarp(wp){
  if (transition) return;
  sfx("warp");
  startTransition("warp", WARP_FADE, null, 0.35, () => applyWarp(wp));
}
/* every other way the player crosses a map \u2014 the Hearthstone, the warp cheat \u2014
   goes through the same fade, or the one that does not looks broken next to it */
function fadeWarp(fn){
  if (transition){ fn(); return; }
  sfx("warp");
  startTransition("warp", WARP_FADE, null, 0.35, fn);
}
function updateMovement(dt){
  if (!player.moving) return;
  const speed = TILES_PER_SEC * (keys["Shift"] ? RUN_MULT : 1);
  player.moveT += dt * speed;
  const [dx,dy] = DIRS[player.dir];
  const t = Math.min(1, player.moveT);
  player.offX = dx*TS*t;
  player.offY = dy*TS*t;
  player.walkPhase += dt * speed * 2;
  player.stepFrame = (Math.floor(player.walkPhase) % 2);
  if (player.moveT >= 1){
    const carry = Math.min(player.moveT - 1, 0.6);
    player.px += dx; player.py += dy;
    player.offX = 0; player.offY = 0;
    player.moving = false; player.stepCount++;
    const zone = currentZone();
    const ch = zone.grid[player.py][player.px];
    if (ch === "+") healPad();
    checkEncounter();
    /* chain straight into the next step so held input never stutters at tile seams */
    if (state.scene === "world"){
      const nd = held() || player.queued;
      if (nd){
        player.queued = null;
        tryMove(nd);
        if (player.moving) player.moveT = carry;
      } else {
        player.walkPhase = 0; player.stepFrame = 0;
      }
    }
  }
}
function healPad(){
  const hurt = state.party.some(u => u.hp < u.maxHp || u.mp < u.maxMp || u.status);
  if (!hurt) return;
  fullHeal();
  openToast("The Pact Hall stone restores your whole party.");
}
/* ---------------- screen transition ---------------- */
let transition = null;
function startTransition(kind, dur, cb, midAt, midCb){
  transition = { kind, t:0, dur, cb, midAt: midAt || 0, midCb: midCb || null, midDone:false };
}
function updateTransition(dt){
  if (!transition) return;
  transition.t += dt;
  /* the midpoint hook is what makes a fade a fade: the world changes under the
     black, so the new zone never pops in over the old one */
  if (!transition.midDone && transition.midCb && transition.t >= transition.dur * transition.midAt){
    transition.midDone = true;
    transition.midCb();
  }
  if (transition.t >= transition.dur){
    const cb = transition.cb;
    transition = null;
    if (cb) cb();
  }
}
function drawTransition(){
  if (!transition) return;
  const p = clamp(transition.t / transition.dur, 0, 1);
  const cx = W/2, cy = (H-88)/2;
  if (transition.kind === "encounter" || transition.kind === "encounter_boss"){
    /* same shapes escalated, rather than a second animation to maintain: the
       flashes go red and quicken, the iris starts further out and closes
       slower, and four rings spin instead of two */
    const boss = transition.kind === "encounter_boss";
    const flashEnd = boss ? 0.34 : 0.40;
    if (p < flashEnd){
      const f = Math.floor(p / (boss ? 0.055 : 0.08));
      ctx.fillStyle = boss
        ? ((f % 2 === 0) ? "rgba(214,58,54,.82)" : "rgba(10,2,6,.96)")
        : ((f % 2 === 0) ? "rgba(255,255,255,.88)" : "rgba(6,3,14,.94)");
      ctx.fillRect(0,0,W,H);
    } else {
      const q = (p - flashEnd) / (1 - flashEnd);
      const maxR = Math.hypot(W, H) * (boss ? 0.80 : 0.62);
      const r = Math.max(0, maxR * (1 - q*q));
      ctx.save();
      ctx.fillStyle = boss ? "#140309" : "#05030c";
      ctx.beginPath();
      ctx.rect(0, 0, W, H);
      ctx.arc(cx, cy, r, 0, Math.PI*2, true);
      ctx.fill("evenodd");
      ctx.restore();
      if (boss){
        ctx.fillStyle = "rgba(176,28,38," + (0.34*(1-q)) + ")";
        ctx.fillRect(0,0,W,H);
      }
      const rings = boss ? 4 : 2;
      ctx.strokeStyle = boss
        ? "rgba(240,96,104," + (0.9*(1-q)) + ")"
        : "rgba(232,197,106," + (0.85*(1-q)) + ")";
      ctx.lineWidth = boss ? 4 : 3;
      for (let i=0;i<rings;i++){
        const rr = r * (1 + i*0.20) + 14;
        const a0 = q*(boss ? 11 : 9) + i*2.1;
        ctx.beginPath();
        ctx.arc(cx, cy, rr, a0, a0 + 2.3);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, rr, a0 + Math.PI, a0 + Math.PI + 2.3);
        ctx.stroke();
      }
    }
  } else if (transition.kind === "warp"){
    /* out, hold, in \u2014 0.25s / 0.14s / 0.33s */
    let a;
    if (p < 0.35) a = p / 0.35;
    else if (p < 0.55) a = 1;
    else a = 1 - (p - 0.55) / 0.45;
    ctx.fillStyle = "rgba(4,2,10," + clamp(a, 0, 1) + ")";
    ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle = "rgba(5,3,12," + Math.min(1, p*1.6) + ")";
    ctx.fillRect(0,0,W,H);
  }
}

function checkEncounter(){
  const z = currentZone();
  if (!z.rate) return;
  if (state.cheats.noEnc) return;
  if (state.encGrace > 0){ state.encGrace--; return; }
  const ch = z.grid[player.py][player.px];
  if (!tileAt(ch).enc) return;
  if (Math.random() > z.rate) return;
  if (!firstAlive()) return;
  spawnEncounter(z);
}
function spawnEncounter(z){
  const e = weighted(z.encounters);
  const [lo,hi] = z.levels;
  const lv = clamp(ri(lo,hi) + (Math.random()<0.12 ? ri(1,2) : 0), 2, MAX_LEVEL);
  const enemy = makeUnit(e.a, lv, { wild:true, rare: rollRare() });
  player.queued = null;
  enterBattle("wild", enemy, {});
}

/* ---------------- interaction ---------------- */
function interact(){
  const z = currentZone();
  const [dx,dy] = DIRS[player.facing];
  const n = npcAt(z, player.px+dx, player.py+dy);
  if (!n) return;
  if (n.kind === "healer"){
    fullHeal();
    ui.dialog = { name:n.name, line:"There. Every pact restored. Go get them hurt again." };
    state.scene = "dialog";
    return;
  }
  if (n.kind === "gift"){
    if (!state.flags.gotGift){
      const gifts = ["gravel_initiate","dawn_acolyte","rill_novice"];
      const mine = schoolOf(state.party[0]);
      const pickId = gifts.find(g => ARCHETYPES[g].school !== mine) || "gravel_initiate";
      const u = makeUnit(pickId, 5, {});
      recalc(u); u.hp = u.maxHp; u.mp = u.maxMp;
      addUnit(u);
      state.flags.gotGift = true;
      ui.dialog = { name:n.name, line:u.name + " the " + archName(u) + " will travel with you. Two pacts beat one — swap them mid-fight when the matchup turns." };
    } else {
      ui.dialog = { name:n.name, line:"Heal on the stone before every trip. And run from anything you can't out-damage — fleeing costs nothing." };
    }
    state.scene = "dialog";
    return;
  }
  if (isChampion(n.kind)){
    if (championBeaten(n)){
      ui.dialog = { name:n.name, line:n.defeatLine || "We've already done this." };
      state.scene = "dialog";
      return;
    }
    if (!firstAlive()){ openToast("Nobody left standing. Heal first."); return; }
    const again = rematchReady(n);
    ui.dialog = {
      name:n.name, line: again ? rematchLine(n) : n.line,
      then: () => {
        const bump = again ? rematchLevels() : 0;
        enterBattle(n.kind, buildFoeTeam(n, bump), {
          kind:n.kind, foeName: (n.foeName || n.name) + (again ? ", rematched" : ""),
          reward: again ? rematchReward(n) : n.reward,
          flag: again ? rematchFlag(n) : n.flag,
          clears:n.clears,
        });
      },
    };
    state.scene = "dialog";
    return;
  }
  if (n.kind === "relearn"){
    ui.dialog = { name:n.name, line:n.line, then: () => {
      state.scene = "menu"; ui.screen = "relearn";
      ui.relearnStep = 0; ui.cursor = 0; ui.sel = 0; ui.relearnSpell = null;
    } };
    state.scene = "dialog";
    return;
  }
  if (n.kind === "ferry_out" || n.kind === "ferry_home"){
    const home = n.kind === "ferry_home";
    if (!home && !state.cleared.hollowcrown){
      ui.dialog = { name:n.name, line:"Not yet. The Hollow Crown still sits on this side of the water — finish that, and I'll row." };
      state.scene = "dialog"; return;
    }
    const dest = home ? { to:"hollowmere", tx:37, ty:14 } : { to:"saltmarch", tx:20, ty:25 };
    ui.dialog = {
      name:n.name,
      line: home ? "Back to the Circle, then. Hold on."
                 : "Oathfall, then. Nothing under fifty walks those fields — I'll not wait for you at the far shore.",
      then: () => { fadeWarp(() => { applyWarp(dest); }); },
    };
    state.scene = "dialog";
    return;
  }
  if (n.kind === "shop"){
    state.scene = "shop"; ui.cursor = 0;
    ui.shopStock = n.stock || null;
    ui.shopName = n.shopName || null;
    return;
  }
  if (n.kind === "legend"){
    if (state.flags[n.flag]){
      ui.dialog = { name:n.name, line:n.defeatLine || "Gone." };
      state.scene = "dialog"; return;
    }
    if (!firstAlive()){ openToast("Nobody left standing. Heal first."); return; }
    ui.dialog = { name:n.name, line:n.line, then: () => {
      const u = makeUnit(n.arch, n.level, { wild:true, legend:true, name:n.name });
      recalc(u); u.hp = u.maxHp; u.mp = u.maxMp;
      enterBattle("boss", [u], { kind:"wild", foeName:n.name, legendFlag:n.flag, canRun:false });
    } };
    state.scene = "dialog";
    return;
  }
  if (n.kind === "reforge"){
    ui.dialog = { name:n.name, line:n.line, then: () => {
      state.scene = "menu"; ui.screen = "reforge"; ui.cursor = 0; ui.sub = 0; ui.reforgeStep = 0;
    } };
    state.scene = "dialog";
    return;
  }
  if (n.kind === "sanctum"){ state.scene = "menu"; ui.screen = "sanctum"; ui.sub = 0; ui.cursor = 0; return; }
  ui.dialog = { name:n.name, line:n.line };
  state.scene = "dialog";
}

/* ---------------- save / load ---------------- */
const SAVE_KEY = "arcanum_pact_save_v1";
function serialize(){
  return JSON.stringify({
    v:1, uid:UID,
    party:state.party, roster:state.roster, bag:state.bag, gold:state.gold,
    zone:state.zone, seen:state.seen, flags:state.flags,
    badges:state.badges, cleared:state.cleared, cheats:state.cheats, bound:state.bound,
    rareBound:state.rareBound, legendBound:state.legendBound, opts:state.opts,
    rivalStarter:state.rivalStarter, rivalMeetings:state.rivalMeetings,
    px:player.px, py:player.py, facing:player.facing, playtime:state.playtime,
  });
}
function saveGame(quiet){
  try { localStorage.setItem(SAVE_KEY, serialize()); if (!quiet) openToast("Run saved."); return true; }
  catch(e){ if (!quiet) openToast("Browser blocked saving. Use Export Save."); return false; }
}
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
}
function loadFromString(str){
  try {
    const d = JSON.parse(str);
    if (!d || !d.party) return false;
    resetStory();
    state.party = d.party; state.roster = d.roster || [];
    state.bag = d.bag || {}; state.gold = d.gold || 0;
    state.zone = ZONES[d.zone] ? d.zone : "hollowmere";
    state.seen = d.seen || {}; state.flags = d.flags || {};
    state.badges = d.badges || {}; state.cleared = d.cleared || {}; state.bound = d.bound || {};
    state.rareBound = d.rareBound || {};
    state.legendBound = d.legendBound || 0;
    state.opts = Object.assign({ speed:0, daynight:true, shake:true }, d.opts || {});
    state.playtime = d.playtime || 0;
    state.rivalStarter = d.rivalStarter || null;
    state.rivalMeetings = d.rivalMeetings || 0;
    state.cheats = Object.assign({ god:false, ohko:false, infMana:false, noEnc:false,
                                   alwaysBind:false, fastXp:false, alwaysRare:false,
                                   noStory:false }, d.cheats || {});
    UID = d.uid || 1;
    for (const u of state.party.concat(state.roster)){
      if (!u.talents) u.talents = emptyTalents();
      for (const id of NODE_IDS) if (u.talents[id] == null) u.talents[id] = 0;
      if (u.tpEarned == null) u.tpEarned = tpEarnedBy(u.level);
      if (u.held === undefined) u.held = null;
      recalc(u);
    }
    player.px = d.px != null ? d.px : ZONES[state.zone].spawn[0];
    player.py = d.py != null ? d.py : ZONES[state.zone].spawn[1];
    player.facing = d.facing || "down";
    player.offX = 0; player.offY = 0; player.moving = false;
    state.scene = "world"; state.encGrace = 10;
    openToast("Run loaded.");
    return true;
  } catch(e){ return false; }
}
function loadGame(){
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s){ openToast("No save found."); return false; }
    return loadFromString(s);
  } catch(e){ openToast("Cannot read save."); return false; }
}
function exportSave(){
  const s = serialize();
  /* on a phone the clipboard is the only practical way out of a prompt box */
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(
        () => openToast("Save code copied to the clipboard."),
        () => { try { window.prompt("Copy this save code and keep it somewhere safe:", s); } catch(e){} });
      return;
    }
  } catch(e){}
  try {
    window.prompt("Copy this save code and keep it somewhere safe:", s);
  } catch(e){ console.log(s); }
}
function importSave(){
  const s = window.prompt("Paste a save code:");
  if (s) { if (!loadFromString(s.trim())) openToast("That code didn't parse."); }
}

/* ---------------- new game ---------------- */
function newGame(starterIdx){
  resetStory();
  state.party = []; state.roster = [];
  state.bag = { salve:8, greater_salve:2, draught:4, sigil:10, cleansing_ash:2, revive_ember:1, smoke_vial:2 };
  state.gold = 800; state.zone = "hollowmere";
  state.seen = {}; state.flags = {}; state.badges = {}; state.cleared = {}; state.bound = {};
  state.cheats = { god:false, ohko:false, infMana:false, noEnc:false, alwaysBind:false,
                   fastXp:false, alwaysRare:false, noStory:false };
  state.rareBound = {}; state.legendBound = 0;
  state.rivalStarter = null; state.rivalMeetings = 0;
  state.opts = Object.assign({ speed:0, daynight:true, shake:true }, state.opts || {});

function warpTargets(){
  return Object.keys(ZONES).map(id => ({ id, name: ZONES[id].name, region: ZONES[id].region || "wild" }));
}
function doCheat(id){
  const P = state.party;
  switch(id){
    case "heal": fullHeal(); openToast("Party restored."); sfx("heal"); break;
    case "gold": state.gold += 10000; openToast("+10,000 gold."); sfx("confirm"); break;
    case "items":
      for (const k in ITEMS) state.bag[k] = Math.max(state.bag[k] || 0, 20);
      openToast("Satchel stocked."); sfx("confirm"); break;
    case "badges":
      for (const k of BADGE_KEYS) state.badges[k] = true;
      for (const u of P.concat(state.roster)) recalc(u);
      openToast("All eight sigils granted."); sfx("badge"); break;
    case "tp":
      for (const u of P){ u.tpEarned = (u.tpEarned||0) + 20; u.tp += 20; }
      openToast("+20 TP each."); sfx("level"); break;
    case "lvup":
      for (const u of P){
        const target = Math.min(MAX_LEVEL, u.level + 5);
        u.xp = totalXpFor(u.level);
        gainXp(u, totalXpFor(target) - u.xp + 1);
        u.hp = u.maxHp; u.mp = u.maxMp;
      }
      openToast("Party raised five levels."); sfx("level"); break;
    case "lvdn":
      for (const u of P){
        u.level = Math.max(1, u.level - 5);
        u.xp = totalXpFor(u.level);
        u.tpEarned = tpEarnedBy(u.level);
        u.tp = Math.max(0, u.tpEarned - spentTp(u));
        recalc(u); u.hp = u.maxHp; u.mp = u.maxMp;
      }
      openToast("Party lowered five levels."); sfx("cancel"); break;
    case "clear":
      for (const zid in ZONES) for (const n of (ZONES[zid].npcs || []))
        if (isChampion(n.kind) && n.flag) state.flags[n.flag] = true;
      openToast("Every gate is open."); sfx("confirm"); break;
    case "reset":
      for (const zid in ZONES) for (const n of (ZONES[zid].npcs || []))
        if (isChampion(n.kind) && n.flag){
          delete state.flags[n.flag];
          if (n.road) delete state.flags[rematchFlag(n)];
        }
      openToast("Champions reset — they'll fight you again."); sfx("confirm"); break;
  }
}
function keyCheats(k){
  const d = dirFromKey(k);
  /* zone-warp sub-list */
  if (ui.cheatSub === "warp"){
    const list = warpTargets();
    if (d === "up")   { ui.cursor = (ui.cursor - 1 + list.length) % list.length; sfx("blip"); }
    if (d === "down") { ui.cursor = (ui.cursor + 1) % list.length; sfx("blip"); }
    if (isConfirm(k)){
      const z = list[ui.cursor];
      state.scene = "world";
      ui.cheatSub = null; ui.cursor = 0;
      fadeWarp(() => {
        state.zone = z.id;
        const sp = ZONES[z.id].spawn;
        player.px = sp[0]; player.py = sp[1];
        player.offX = 0; player.offY = 0; player.moving = false; player.queued = null;
        state.encGrace = 10;
        openToast("Warped to " + z.name + ".");
      });
    }
    if (isCancel(k)){ ui.cheatSub = null; ui.cursor = 0; sfx("cancel"); }
    return;
  }
  if (d === "up")   { ui.cursor = (ui.cursor - 1 + CHEATS.length) % CHEATS.length; sfx("blip"); }
  if (d === "down") { ui.cursor = (ui.cursor + 1) % CHEATS.length; sfx("blip"); }
  if (isConfirm(k)){
    const c = CHEATS[ui.cursor];
    if (c.kind === "toggle"){
      state.cheats[c.id] = !state.cheats[c.id];
      openToast(c.name + (state.cheats[c.id] ? "  ON" : "  OFF"));
      sfx(state.cheats[c.id] ? "confirm" : "cancel");
    } else if (c.kind === "audio"){
      setAudioOn(!audio.on);
      openToast("Sound " + (audio.on ? "on" : "off"));
      if (audio.on) sfx("confirm");
    } else if (c.id === "warp"){
      ui.cheatSub = "warp"; ui.cursor = 0; sfx("confirm");
    } else {
      doCheat(c.id);
    }
  }
  if (isCancel(k)){ state.scene = ui.cheatReturn || "world"; sfx("cancel"); }
}

/* ---------------- input ---------------- */
const SPARK_LABEL = { hp:"HP", mp:"Mana", atk:"Power", def:"Ward", spd:"Speed" };
const CONFIRM = ["z","Z","Enter"," "];
const CANCEL  = ["x","X","Escape","Backspace"];
function isConfirm(k){ return CONFIRM.includes(k); }
function isCancel(k){ return CANCEL.includes(k); }
function dirFromKey(k){
  if (k==="ArrowUp"||k==="w"||k==="W") return "up";
  if (k==="ArrowDown"||k==="s"||k==="S") return "down";
  if (k==="ArrowLeft"||k==="a"||k==="A") return "left";
  if (k==="ArrowRight"||k==="d"||k==="D") return "right";
  return null;
}

function syncMusic(){
  if (!audio.started || audio.lock) return;
  if (state.scene === "battle" && B) playTrack(B.legendFlag ? "boss" : battleTrack(B.kind));
  else if (state.scene === "title" || state.scene === "starter") playTrack("town");
  else playTrack(zoneTrack(state.zone));
}

window.addEventListener("keydown", e => {
  audioStart();
  const k = e.key;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();
  keys[k] = true;
  route(k);
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

function route(k){
  if (transition) return;
  /* backquote opens the cheat console from anywhere sensible */
  if (k === "`" || k === "~"){
    if (state.scene === "cheats"){ state.scene = ui.cheatReturn || "world"; sfx("cancel"); }
    else if (state.scene === "world" || state.scene === "menu" || state.scene === "battle"){
      ui.cheatReturn = state.scene;
      state.scene = "cheats"; ui.cursor = 0; ui.cheatSub = null; ui.cheatScroll = 0;
      sfx("confirm");
    }
    return;
  }
  if (state.scene !== "world" && state.scene !== "cheats" && dirFromKey(k)) sfx("blip");
  if (state.scene !== "cheats" && isConfirm(k) && state.scene !== "world") sfx("confirm");
  switch(state.scene){
    case "cheats":     return keyCheats(k);
    case "title":      return keyTitle(k);
    case "starter":    return keyStarter(k);
    case "world":      return keyWorld(k);
    case "dialog":     return keyDialog(k);
    case "shop":       return keyShop(k);
    case "menu":       return keyMenu(k);
    case "battle":     return keyBattle(k);
    case "story":      return keyStory(k);
  }
}

function keyTitle(k){
  if (isConfirm(k)){ state.scene = "starter"; ui.cursor = 0; }
  if ((k==="l"||k==="L") && hasSave()) loadGame();
  if (k==="i"||k==="I") importSave();
}
function keyStarter(k){
  const d = dirFromKey(k);
  if (d === "left")  ui.cursor = (ui.cursor+2)%3;
  if (d === "right") ui.cursor = (ui.cursor+1)%3;
  if (isConfirm(k)) newGame(ui.cursor);
  if (isCancel(k)) state.scene = "title";
}
function keyWorld(k){
  if (k==="m"||k==="M"||isCancel(k)){ state.scene = "menu"; ui.screen = "menu"; ui.cursor = 0; return; }
  if (isConfirm(k)){ interact(); return; }
  const d = dirFromKey(k);
  if (d){ player.queued = d; if (!player.moving) player.facing = d; }
}
function keyDialog(k){
  if (isConfirm(k) || isCancel(k)){
    const then = ui.dialog && ui.dialog.then;
    ui.dialog = null;
    state.scene = "world";
    if (then) then();
  }
}
function keyShop(k){
  const d = dirFromKey(k);
  const stock = shopList();
  if (d==="up") ui.cursor = (ui.cursor-1+stock.length)%stock.length;
  if (d==="down") ui.cursor = (ui.cursor+1)%stock.length;
  if (isConfirm(k)){
    const id = stock[ui.cursor], it = ITEMS[id];
    if (state.gold >= it.price){ state.gold -= it.price; giveItem(id,1); openToast("Bought " + it.name + "."); }
    else openToast("Not enough gold.");
  }
  if (isCancel(k)) state.scene = "world";
}

function activeUnit(){ return ui.mode === "roster" ? state.roster[ui.sel] : state.party[ui.sel]; }

function keyMenu(k){
  const d = dirFromKey(k);
  const sc = ui.screen;

  if (sc === "menu"){
    if (d==="up") ui.cursor = (ui.cursor-1+MENU_ITEMS.length)%MENU_ITEMS.length;
    if (d==="down") ui.cursor = (ui.cursor+1)%MENU_ITEMS.length;
    if (isConfirm(k)){
      const it = MENU_ITEMS[ui.cursor];
      if (it==="Party"){ ui.screen="party"; ui.cursor=0; }
      else if (it==="Talents"){ if (state.party.length){ ui.screen="talents"; ui.mode="party"; ui.sel=0; ui.branch=0; ui.node=0; } }
      else if (it==="Satchel"){ ui.screen="satchel"; ui.cursor=0; }
      else if (it==="Sanctum"){ ui.screen="sanctum"; ui.sub=0; ui.cursor=0; }
      else if (it==="Sigils"){ ui.screen="badges"; }
      else if (it==="Manual"){ ui.screen="manual"; ui.page=0; }
      else if (it==="Pactdex"){ ui.screen="pactdex"; ui.cursor=0; }
      else if (it==="Jukebox"){ ui.screen="jukebox"; ui.cursor=0; audioStart(); }
      else if (it==="Map"){
        ui.screen="map";
        const z = ZONES[state.zone];
        const host = (z && z.region === "wild") ? state.zone : ((z.warps||[])[0] || {}).to;
        /* open on the sheet you are standing on */
        if (CONTINENT2.some(r => r.id === host)){ ui.mapPage = 1; ui.mapSel = host; }
        else { ui.mapPage = 0; ui.mapSel = CONTINENT.some(r => r.id === host) ? host : "hollowmere"; }
      }
      else if (it==="Save"){ saveGame(); }
      else if (it==="Save Code"){ ui.screen="savecode"; ui.cursor=0; }
      else if (it==="Options"){ ui.screen="options"; ui.cursor=0; }
      else state.scene="world";
    }
    if (isCancel(k)){ audio.lock = false; state.scene = "world"; }
    if (k==="e"||k==="E") exportSave();
    return;
  }
  if (sc === "options"){
    const n = OPTION_ROWS.length;
    if (d==="up")   ui.cursor = (ui.cursor - 1 + n) % n;
    if (d==="down") ui.cursor = (ui.cursor + 1) % n;
    const bump = (dir) => {
      const o = opt(), id = OPTION_ROWS[clamp(ui.cursor,0,n-1)].id;
      if (id === "speed") o.speed = (o.speed + (dir < 0 ? SPEEDS.length-1 : 1)) % SPEEDS.length;
      else if (id === "sound") setAudioOn(!audio.on);
      else o[id] = !o[id];
      sfx("blip");
    };
    if (d==="left")  bump(-1);
    if (d==="right" || isConfirm(k)) bump(1);
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }
  /* a phone has no E or I key, so the save code needs a screen of its own */
  if (sc === "savecode"){
    if (d==="up") ui.cursor = (ui.cursor+1)%2;
    if (d==="down") ui.cursor = (ui.cursor+1)%2;
    if (isConfirm(k)){
      if (ui.cursor === 0) exportSave();
      else importSave();
    }
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }

  if (sc === "party"){
    if (d==="up") ui.cursor = (ui.cursor-1+Math.max(1,state.party.length))%Math.max(1,state.party.length);
    if (d==="down") ui.cursor = (ui.cursor+1)%Math.max(1,state.party.length);
    if (isConfirm(k) && state.party.length){ ui.screen="detail"; ui.mode="party"; ui.sel=ui.cursor; ui.spellCur=0; ui.reorderFrom=null; }
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }

  if (sc === "detail"){
    const list = ui.mode === "roster" ? state.roster : state.party;
    if (!list.length){ ui.screen = "menu"; return; }
    const u = list[ui.sel];
    if (d==="left"){  ui.sel = (ui.sel-1+list.length)%list.length; ui.reorderFrom = null; ui.spellCur = 0; }
    if (d==="right"){ ui.sel = (ui.sel+1)%list.length; ui.reorderFrom = null; ui.spellCur = 0; }
    if (d==="up")   ui.spellCur = (ui.spellCur+3)%4;
    if (d==="down") ui.spellCur = (ui.spellCur+1)%4;
    if (isConfirm(k) && u){
      if (ui.reorderFrom == null){
        if (u.spells[ui.spellCur]) ui.reorderFrom = ui.spellCur;
        else openToast("That slot is empty.");
      } else {
        const a = ui.reorderFrom, b = ui.spellCur;
        if (a !== b){
          const tmp = u.spells[a];
          u.spells[a] = u.spells[b] === undefined ? null : u.spells[b];
          u.spells[b] = tmp;
          /* collapse any nulls introduced by swapping into an empty slot */
          u.spells = u.spells.filter(x => x != null);
          openToast("Slots reordered.");
        }
        ui.reorderFrom = null;
      }
      return;
    }
    if (k==="t"||k==="T"){ ui.reorderFrom = null; ui.screen="talents"; ui.branch=0; ui.node=0; }
    if (k==="h"||k==="H"){ ui.reorderFrom = null; ui.screen="held"; ui.sub=0; }
    if (isCancel(k)){
      if (ui.reorderFrom != null){ ui.reorderFrom = null; return; }
      ui.screen = ui.mode==="roster" ? "sanctum" : "party"; ui.cursor=ui.sel;
    }
    return;
  }

  if (sc === "talents"){
    const u = activeUnit();
    if (!u){ ui.screen="menu"; return; }
    if (d==="left")  { ui.branch = (ui.branch+2)%3; ui.node = clamp(ui.node,0,5); }
    if (d==="right") { ui.branch = (ui.branch+1)%3; ui.node = clamp(ui.node,0,5); }
    const nodes = unitTree(u)[BRANCH_KEYS[ui.branch]].length;
    if (d==="up")    ui.node = (ui.node - 1 + nodes) % nodes;
    if (d==="down")  ui.node = (ui.node + 1) % nodes;
    if (isConfirm(k)){
      const b = BRANCH_KEYS[ui.branch], node = unitTree(u)[b][clamp(ui.node,0,nodes-1)];
      if (canLearnTalent(u,b,node)){
        u.talents[node.id]++; u.tp--;
        const beforeHp = u.maxHp, beforeMp = u.maxMp;
        recalc(u);
        u.hp += (u.maxHp - beforeHp); u.mp += (u.maxMp - beforeMp);
        recalc(u);
      } else if (u.tp <= 0) openToast("No talent points left.");
      else if (node.req) openToast("Needs " + node.req + " points in this branch.");
      else openToast("Already maxed.");
    }
    if (k==="r"||k==="R"){
      u.talents = emptyTalents();
      u.tp = (u.tpEarned != null ? u.tpEarned : tpEarnedBy(u.level));
      const bh = u.maxHp; recalc(u); u.hp = clamp(u.hp - (bh - u.maxHp), 1, u.maxHp);
      openToast("Talents refunded.");
    }
    const lst = ui.mode === "roster" ? state.roster : state.party;
    if (k==="["){ ui.sel = (ui.sel-1+lst.length)%lst.length; }
    if (k==="]"){ ui.sel = (ui.sel+1)%lst.length; }
    if (isCancel(k)){ ui.screen="detail"; }
    return;
  }

  if (sc === "badges"){
    if (isCancel(k) || isConfirm(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }
  if (sc === "pactdex"){
    const n = DEX_LIST.length;
    if (d==="up")   ui.cursor = (ui.cursor - 1 + n) % n;
    if (d==="down") ui.cursor = (ui.cursor + 1) % n;
    if (d==="left")  ui.cursor = Math.max(0, ui.cursor - 10);
    if (d==="right") ui.cursor = Math.min(n-1, ui.cursor + 10);
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }
  if (sc === "map"){
    const pageTwo = ui.mapPage === 1 && oathfallSeen();
    const REG = pageTwo ? CONTINENT2 : CONTINENT;
    if ((k === "Tab" || d === "up" || d === "down") && oathfallSeen()){
      ui.mapPage = pageTwo ? 0 : 1;
      const R2 = ui.mapPage === 1 ? CONTINENT2 : CONTINENT;
      ui.mapSel = R2[0].id; sfx("blip"); return;
    }
    const idx = REG.findIndex(r => r.id === ui.mapSel);
    const n = REG.length;
    if (d==="left"  || d==="up")   ui.mapSel = REG[(idx - 1 + n) % n].id;
    if (d==="right" || d==="down") ui.mapSel = REG[(idx + 1) % n].id;
    if (isCancel(k) || isConfirm(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }
  if (sc === "held"){
    const u = activeUnit();
    if (!u){ ui.screen="party"; return; }
    const list = charmChoices();
    const n = list.length + (u.held ? 1 : 0);
    if (!n){ if (isCancel(k) || isConfirm(k)) ui.screen="detail"; return; }
    if (d==="up")   ui.sub = (ui.sub - 1 + n) % n;
    if (d==="down") ui.sub = (ui.sub + 1) % n;
    if (isConfirm(k)){
      const offset = u.held ? 1 : 0;
      if (u.held && ui.sub === 0){
        giveItem(u.held, 1);
        openToast(ITEMS[u.held].name + " returned to the satchel.");
        u.held = null;
      } else {
        const id = list[ui.sub - offset];
        if (id){
          if (u.held) giveItem(u.held, 1);
          useBagItem(id);
          u.held = id;
          openToast(u.name + " holds the " + ITEMS[id].name + ".");
        }
      }
      const bh = u.maxHp, bm = u.maxMp;
      recalc(u);
      u.hp = clamp(u.hp + (u.maxHp - bh), 1, u.maxHp);
      u.mp = clamp(u.mp + (u.maxMp - bm), 0, u.maxMp);
      ui.sub = 0;
      ui.screen = "detail";
    }
    if (isCancel(k)){ ui.screen="detail"; ui.sub=0; }
    return;
  }
  if (sc === "relearn"){
    const people = relearnPeople();
    const step = ui.relearnStep || 0;
    if (step === 0){
      const n = Math.max(1, people.length);
      if (d==="up")   ui.cursor = (ui.cursor - 1 + n) % n;
      if (d==="down") ui.cursor = (ui.cursor + 1) % n;
      if (isConfirm(k) && people.length){
        ui.sel = ui.cursor; ui.relearnStep = 1; ui.cursor = 0;
      }
      if (isCancel(k)){ ui.screen = "menu"; ui.cursor = 0; state.scene = "world"; }
      return;
    }
    const u = people[clamp(ui.sel, 0, Math.max(0, people.length-1))];
    if (!u){ ui.relearnStep = 0; return; }
    if (step === 1){
      const list = learnableFor(u);
      const n = Math.max(1, list.length);
      if (d==="up")   ui.cursor = (ui.cursor - 1 + n) % n;
      if (d==="down") ui.cursor = (ui.cursor + 1) % n;
      if (isConfirm(k) && list.length){
        const sid = list[clamp(ui.cursor, 0, list.length-1)];
        const cost = relearnCost(sid);
        if (state.gold < cost){ openToast("That costs " + cost + " gold."); return; }
        if (u.spells.length < 4){
          state.gold -= cost;
          u.spells.push(sid);
          openToast(u.name + " remembers " + SPELLS[sid].name + ".");
          sfx("level");
          ui.relearnStep = 0; ui.cursor = 0;
        } else {
          ui.relearnSpell = sid; ui.relearnStep = 2; ui.cursor = 0;
        }
      }
      if (isCancel(k)){ ui.relearnStep = 0; ui.cursor = clamp(ui.sel,0,5); }
      return;
    }
    /* step 2 */
    if (d==="up")   ui.cursor = (ui.cursor - 1 + 5) % 5;
    if (d==="down") ui.cursor = (ui.cursor + 1) % 5;
    if (isConfirm(k)){
      const sid = ui.relearnSpell, cost = relearnCost(sid);
      if (ui.cursor >= 4){ ui.relearnStep = 1; ui.cursor = 0; return; }
      if (state.gold < cost){ openToast("That costs " + cost + " gold."); return; }
      state.gold -= cost;
      const lost = SPELLS[u.spells[ui.cursor]].name;
      u.spells[ui.cursor] = sid;
      openToast(u.name + " trades " + lost + " for " + SPELLS[sid].name + ".");
      sfx("level");
      ui.relearnStep = 0; ui.cursor = 0; ui.relearnSpell = null;
    }
    if (isCancel(k)){ ui.relearnStep = 1; ui.cursor = 0; }
    return;
  }
  if (sc === "reforge"){
    const step = ui.reforgeStep || 0;
    if (step === 0){
      const n = Math.max(1, state.party.length);
      if (d==="up")   ui.cursor = (ui.cursor - 1 + n) % n;
      if (d==="down") ui.cursor = (ui.cursor + 1) % n;
      if (isConfirm(k) && state.party.length){
        ui.sub = ui.cursor; ui.reforgeStep = 1; ui.cursor = 0; ui.sel = 0;
      }
      if (isCancel(k)){ ui.screen = "menu"; ui.cursor = 0; state.scene = "world"; }
      return;
    }
    const u = state.party[clamp(ui.sub, 0, Math.max(0, state.party.length-1))];
    if (!u){ ui.reforgeStep = 0; return; }
    if (d==="up")    ui.cursor = (ui.cursor - 1 + 5) % 5;
    if (d==="down")  ui.cursor = (ui.cursor + 1) % 5;
    if (d==="left" || d==="right") ui.sel = ui.sel ? 0 : 1;
    if (isConfirm(k)){
      const key = SPARK_KEYS[clamp(ui.cursor,0,4)];
      const temper = ui.sel === 1;
      const cost = temper ? TEMPER_COST : REFORGE_COST;
      if (state.gold < cost){ openToast("That costs " + cost + " gold."); return; }
      if (temper && u.spark[key] >= 20){ openToast("Already at the ceiling."); return; }
      state.gold -= cost;
      const before = u.spark[key];
      u.spark[key] = temper ? 20 : ri(8,15);
      const bh = u.maxHp, bm = u.maxMp;
      recalc(u);
      u.hp = clamp(u.hp + (u.maxHp - bh), 1, u.maxHp);
      u.mp = clamp(u.mp + (u.maxMp - bm), 0, u.maxMp);
      const after = u.spark[key];
      openToast(u.name + "'s Spark " + before + " \u2192 " + after +
                (after > before ? "." : after === before ? " \u2014 the fire gave nothing back." : " \u2014 it came out worse."));
      sfx(after > before ? "level" : (after === before ? "blip" : "cancel"));
    }
    if (isCancel(k)){ ui.reforgeStep = 0; ui.cursor = clamp(ui.sub,0,5); }
    return;
  }
  if (sc === "jukebox"){
    const n = MUSIC_ORDER.length;
    if (d==="up")   ui.cursor = (ui.cursor - 1 + n) % n;
    if (d==="down") ui.cursor = (ui.cursor + 1) % n;
    if (isConfirm(k)){
      audioStart();
      audio.lock = true;
      audio.trackId = null;          /* force a restart even on a repeat press */
      playTrack(MUSIC_ORDER[clamp(ui.cursor,0,n-1)]);
    }
    if (isCancel(k)){
      audio.lock = false;            /* the zone takes its music back */
      ui.screen="menu"; ui.cursor=0;
    }
    return;
  }
  if (sc === "manual"){
    if (d === "left"  || k === "," ) { ui.page = (ui.page - 1 + MANUAL.length) % MANUAL.length; sfx("blip"); }
    if (d === "right" || isConfirm(k)) { ui.page = (ui.page + 1) % MANUAL.length; sfx("blip"); }
    if (d === "up")   { ui.page = (ui.page - 1 + MANUAL.length) % MANUAL.length; sfx("blip"); }
    if (d === "down") { ui.page = (ui.page + 1) % MANUAL.length; sfx("blip"); }
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }
  if (sc === "satchel"){
    const list = Object.keys(state.bag).filter(x => state.bag[x]>0);
    if (!list.length){ if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; } return; }
    if (d==="up") ui.cursor = (ui.cursor-1+list.length)%list.length;
    if (d==="down") ui.cursor = (ui.cursor+1)%list.length;
    if (isConfirm(k)){
      const id = list[clamp(ui.cursor,0,list.length-1)], it = ITEMS[id];
      if (["heal","mana","cure","revive","relic","tp","oath"].includes(it.kind)){ ui.screen="itemtarget"; ui.sub=0; ui.pendItem=id; }
      else if (it.kind === "charm"){ openToast("Charms are equipped from a person's page — press H there."); }
      else if (it.kind === "warp"){
        useBagItem(id);
        ui.screen = "menu"; ui.cursor = 0; state.scene = "world";
        fadeWarp(() => {
          state.zone = "hollowmere"; player.px = 19; player.py = 12;
          player.offX = 0; player.offY = 0; player.moving = false; player.queued = null;
          state.encGrace = 8;
          openToast("The Hearthstone pulls you back to Hollowmere.");
        });
      }
      else openToast(it.name + " is only useful in a fight.");
    }
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }

  if (sc === "itemtarget"){
    if (d==="up") ui.sub = (ui.sub-1+state.party.length)%state.party.length;
    if (d==="down") ui.sub = (ui.sub+1)%state.party.length;
    if (isConfirm(k)){
      const id = ui.pendItem, it = ITEMS[id], u = state.party[ui.sub];
      let used = false, msg = "";
      if (it.kind==="heal"){ if (u.hp>0 && u.hp<u.maxHp){ const b=u.hp; u.hp=Math.min(u.maxHp,u.hp+it.amount); msg=u.name+" +"+(u.hp-b)+" HP"; used=true; } else msg = u.hp<=0 ? "They're down — use a Revive Ember." : "Already at full HP."; }
      else if (it.kind==="mana"){ if (u.mp<u.maxMp){ const b=u.mp; u.mp=Math.min(u.maxMp,u.mp+it.amount); msg=u.name+" +"+(u.mp-b)+" Mana"; used=true; } else msg="Mana is full."; }
      else if (it.kind==="cure"){ if (u.status){ u.status=null; u.statusDur=0; msg=u.name+" cleansed."; used=true; } else msg="No status to cure."; }
      else if (it.kind==="revive"){ if (u.hp<=0){ u.hp=Math.floor(u.maxHp/2); msg=u.name+" revived."; used=true; } else msg=u.name+" is standing."; }
      else if (it.kind==="relic"){
        const cur = u.spark[it.stat];
        if (cur >= 20) msg = u.name + "'s " + SPARK_LABEL[it.stat] + " Spark is already maxed.";
        else {
          u.spark[it.stat] = Math.min(20, cur + it.amount);
          const before = u.maxHp;
          recalc(u); u.hp += (u.maxHp - before); recalc(u);
          msg = u.name + " absorbs it — " + SPARK_LABEL[it.stat] + " Spark " + cur + " to " + u.spark[it.stat] + ".";
          used = true;
        }
      }
      else if (it.kind==="tp"){ u.tp += it.amount; msg = u.name + " gains " + it.amount + " Talent Points."; used = true; }
      else if (it.kind==="oath"){
        /* spendOath consumes the stone itself, so this branch never sets used */
        const r = spendOath(u);
        if (r.ok){ msg = u.name + " ascends \u2014 " + archName(u) + "."; sfx("level"); }
        else if (r.why === "level") msg = u.name + " must reach Level " + r.at + " first.";
        else if (r.why === "no") msg = u.name + " has no further rank to ascend into.";
        else msg = "No Oathstone in the satchel.";
      }
      if (used) useBagItem(id);
      openToast(msg);
      ui.screen="satchel"; ui.cursor=0;
    }
    if (isCancel(k)){ ui.screen="satchel"; }
    return;
  }

  if (sc === "sanctum"){
    if (d==="left") { ui.sub = 0; ui.cursor = clamp(ui.cursor,0,5); }
    if (d==="right"){ ui.sub = 1; ui.cursor = clamp(ui.cursor,0,Math.max(0,state.roster.length-1)); }
    const len = ui.sub === 0 ? 6 : Math.max(1,state.roster.length);
    if (d==="up") ui.cursor = (ui.cursor-1+len)%len;
    if (d==="down") ui.cursor = (ui.cursor+1)%len;
    if (isConfirm(k)){
      if (ui.sub === 0){
        const u = state.party[ui.cursor];
        if (!u) openToast("Empty slot.");
        else if (state.party.length <= 1) openToast("You must keep one pact with you.");
        else { state.party.splice(ui.cursor,1); state.roster.push(u); openToast(u.name + " moved to the Sanctum."); ui.cursor = clamp(ui.cursor,0,5); }
      } else {
        const u = state.roster[ui.cursor];
        if (!u) openToast("Nobody there.");
        else if (state.party.length >= 6) openToast("Party is full.");
        else { state.roster.splice(ui.cursor,1); state.party.push(u); openToast(u.name + " joins the party."); ui.cursor = clamp(ui.cursor,0,Math.max(0,state.roster.length-1)); }
      }
    }
    if (k==="t"||k==="T"){
      const list = ui.sub===0 ? state.party : state.roster;
      if (list[ui.cursor]){ ui.mode = ui.sub===0?"party":"roster"; ui.sel = ui.cursor; ui.screen="detail"; ui.spellCur=0; ui.reorderFrom=null; }
    }
    if (isCancel(k)){ ui.screen="menu"; ui.cursor=0; }
    return;
  }
}

/* ---------------- battle input ---------------- */
function keyBattle(k){
  const d = dirFromKey(k);
  if (!B) return;

  if (B.phase === "msg" || B.phase === "intro"){
    if (isConfirm(k)) advanceMsg();
    return;
  }
  if (B.phase === "menu"){
    if (d==="left"||d==="right") ui.noop = 1;
    if (d==="up")   B.cursor = (B.cursor+2)%4;
    if (d==="down") B.cursor = (B.cursor+2)%4;
    if (d==="left") B.cursor = B.cursor%2===1 ? B.cursor-1 : B.cursor+1;
    if (d==="right")B.cursor = B.cursor%2===0 ? B.cursor+1 : B.cursor-1;
    if (isConfirm(k)){
      const a = ACTIONS[B.cursor];
      if (a==="Cast"){ B.phase="spells"; B.cursor=0; }
      else if (a==="Item"){ B.phase="bag"; B.cursor=0; }
      else if (a==="Swap"){ B.phase="swap"; B.forceSwap=false; B.cursor=firstAliveIdx(); }
      else { B.queue=[]; playerTurn({kind:"run"}); }
    }
    return;
  }
  if (B.phase === "spells"){
    const p = me();
    if (d==="up")   B.cursor = (B.cursor+2)%4;
    if (d==="down") B.cursor = (B.cursor+2)%4;
    if (d==="left") B.cursor = B.cursor%2===1 ? B.cursor-1 : B.cursor+1;
    if (d==="right")B.cursor = B.cursor%2===0 ? B.cursor+1 : B.cursor-1;
    if (isConfirm(k)){
      const sid = p.spells[B.cursor];
      if (!sid) return;
      if (p.mp < SPELLS[sid].mana && !state.cheats.infMana){
        const affordIdx = p.spells.findIndex(x => x && p.mp >= SPELLS[x].mana);
        if (affordIdx >= 0){
          openToast("Not enough Mana for " + SPELLS[sid].name + ".");
          B.cursor = affordIdx;
          return;
        }
        /* out of Mana entirely — never leave the player unable to act */
        B.queue = [];
        playerTurn({ kind:"spell", spell:"staff_strike" });
        return;
      }
      B.queue = [];
      playerTurn({ kind:"spell", spell:sid });
    }
    if (isCancel(k)){ B.phase="menu"; B.cursor=0; }
    return;
  }
  if (B.phase === "bag"){
    const list = battleItemList();
    if (!list.length){ if (isCancel(k)){ B.phase="menu"; B.cursor=0; } return; }
    if (d==="up") B.cursor = (B.cursor-1+list.length)%list.length;
    if (d==="down") B.cursor = (B.cursor+1)%list.length;
    if (isConfirm(k)){
      const id = list[clamp(B.cursor,0,list.length-1)];
      const it = ITEMS[id];
      if (it.kind === "sigil" && !B.rules.recruit){ openToast("A sworn champion cannot be bound."); return; }
      if (it.kind === "flee" && !B.canRun){ openToast("There is no escaping this one."); return; }
      if (it.kind === "warp" || it.kind === "relic" || it.kind === "tp" || it.kind === "charm" || it.kind === "oath"){ openToast("Not in a fight."); return; }
      useBagItem(id);
      B.queue = [];
      playerTurn({ kind:"item", item:id, targetIdx:B.active });
    }
    if (isCancel(k)){ B.phase="menu"; B.cursor=0; }
    return;
  }
  if (B.phase === "swap"){
    const n = state.party.length;
    const stepTo = (from, delta) => {
      for (let i=1;i<=n;i++){
        const j = (from + delta*i + n*n) % n;
        if (!B.forceSwap || state.party[j].hp > 0) return j;
      }
      return from;
    };
    if (d==="up") B.cursor = stepTo(B.cursor, -1);
    if (d==="down") B.cursor = stepTo(B.cursor, 1);
    if (isConfirm(k)){
      const u = state.party[B.cursor];
      if (!u || u.hp<=0){ openToast("They can't fight."); return; }
      if (B.cursor === B.active && !B.forceSwap){ openToast("Already out."); return; }
      if (B.forceSwap){
        B.active = B.cursor; B.ps = {atk:0,def:0,spd:0};
        B.forceSwap = false; B.queue = [];
        say(u.name + " steps up!", { kind:"swapin", side:"player" });
        runQueue(() => { B.phase="menu"; B.cursor=0; });
      } else {
        B.queue = [];
        playerTurn({ kind:"swap", idx:B.cursor });
      }
    }
    if (isCancel(k) && !B.forceSwap){ B.phase="menu"; B.cursor=0; }
    return;
  }
  if (B.phase === "learn"){
    if (d==="up") B.cursor = (B.cursor-1+5)%5;
    if (d==="down") B.cursor = (B.cursor+1)%5;
    if (isConfirm(k)){
      const [u, sid] = B.learnPrompt;
      if (B.cursor < 4){ u.spells[B.cursor] = sid; openToast(u.name + " learns " + SPELLS[sid].name + "."); }
      else openToast(u.name + " skips " + SPELLS[sid].name + ".");
      if (B.pendingLearn && B.pendingLearn.length){ B.learnPrompt = B.pendingLearn.shift(); B.cursor = 0; }
      else finishBattle();
    }
    return;
  }
}

/* ---------------- loop ---------------- */
let padOn = false;
function padReserveNow(){
  if (!padOn) return 8;
  /* in landscape the buttons live in the side gutters, so take no height */
  return window.innerHeight <= 520 ? 8 : 176;
}
function fit(){
  const availH = window.innerHeight - padReserveNow();
  const s = Math.max(0.35, Math.min(window.innerWidth/W, availH/H));
  cv.style.width = Math.floor(W*s) + "px";
  cv.style.height = Math.floor(H*s) + "px";
}
window.addEventListener("resize", fit);
fit();

function held(){
  for (const dir in DIRS){
    const ks = { up:["ArrowUp","w","W"], down:["ArrowDown","s","S"], left:["ArrowLeft","a","A"], right:["ArrowRight","d","D"] }[dir];
    for (const kk of ks) if (keys[kk]) return dir;
  }
  return null;
}

let lastTs = 0;
/* visual tests need the loop to stop repainting so they can lay out a contact
   sheet on the canvas and screenshot it */
let frozen = false;
function frame(ts){
  if (frozen){ requestAnimationFrame(frame); return; }
  ts = ts || 0;
  let dt = lastTs ? (ts - lastTs)/1000 : 1/60;
  lastTs = ts;
  if (!(dt > 0) || dt > 0.1) dt = 1/60;   /* tab-switch / hitch guard */
  const df = dt * 60;                     /* legacy "frames" multiplier */

  animTick += df;
  state.playtime = (state.playtime || 0) + dt;
  if (ui.toastT > 0) ui.toastT -= df;
  if (B){ if (B.fxT>0) B.fxT -= df; if (B.shakeT>0) B.shakeT -= df; if (B.flashT>0) B.flashT -= df; }
  if (B) hpTick(dt);

  updateTransition(dt);
  storyTick(dt);
  /* a beat is checked the moment the world is quiet again, so a scene lands
     right after the fight or the warp that earned it rather than a step later */
  if (state.scene === "world" && !transition) checkStory();
  if (state.scene === "world" && !transition){
    const d = held() || player.queued;
    if (d && !player.moving){ player.queued = null; tryMove(d); }
    updateMovement(dt);
  } else if (state.scene !== "world"){
    player.queued = null;
  }
  syncMusic();

  ctx.clearRect(0,0,W,H);
  switch(state.scene){
    case "title":   renderTitle(); break;
    case "starter": renderStarter(); break;
    case "world":   renderOverworld(); break;
    case "dialog":  renderDialog(); break;
    case "shop":    renderShop(); break;
    case "battle":  renderBattle(); break;
    case "cheats": renderCheats(); break;
    case "story":   renderStory(); break;
    case "menu":
      if (ui.screen === "menu") renderMenu();
      else if (ui.screen === "party") renderPartyList();
      else if (ui.screen === "detail") renderUnitDetail();
      else if (ui.screen === "talents") renderTalents();
      else if (ui.screen === "satchel") renderSatchel();
      else if (ui.screen === "itemtarget") renderItemTarget();
      else if (ui.screen === "sanctum") renderSanctum();
      else if (ui.screen === "badges") renderBadges();
      else if (ui.screen === "manual") renderManual();
      else if (ui.screen === "savecode") renderSaveCode();
      else if (ui.screen === "options") renderOptions();
      else if (ui.screen === "pactdex") renderPactdex();
      else if (ui.screen === "map") renderMap();
      else if (ui.screen === "jukebox") renderJukebox();
      else if (ui.screen === "relearn") renderRelearn();
      else if (ui.screen === "reforge") renderReforge();
      else if (ui.screen === "held") renderHeldPicker();
      else renderMenu();
      break;
  }
  /* the toast fades with the scene rather than punching through the black \u2014
     the zone name should arrive as the new map does, not before it */
  drawToast();
  drawTransition();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- touch controls ----------------
   Hidden on desktop. On a touch device they drive the same key router, so a
   tester on a phone gets the whole game without a keyboard. */
(function setupPad(){
  const pad = document.getElementById("pad");
  if (!pad) return;
  /* Chromium exposes touch APIs on plenty of desktops, so ask about the
     pointer instead; a real finger also reveals the pad on hybrid machines. */
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const showPad = () => {
    if (!pad.hidden) return;
    pad.hidden = false;
    document.body.classList.add("has-pad");
    padOn = true;
    fit();
  };
  window.addEventListener("touchstart", () => { showPad(); audioStart(); }, { passive:true });
  if (!coarse) return;
  pad.hidden = false;
  document.body.classList.add("has-pad");
  padOn = true;
  pad.addEventListener("touchstart", audioStart, { once:true });
  fit();
  window.addEventListener("orientationchange", () => setTimeout(fit, 150));
  const press = (b, k) => {
    keys[k] = true;
    b.classList.add("on");
    route(k);
  };
  const release = (b, k) => { keys[k] = false; b.classList.remove("on"); };
  for (const b of pad.querySelectorAll("button")){
    const k = b.dataset.k;
    /* The cheat console lives on the backquote key, which a phone keyboard
       never surfaces, so on touch it hangs off a long press of MENU: hold for
       CHEAT_HOLD and the console opens instead of the menu. The button fills
       gold as the hold arms, so the gesture is discoverable by accident.
       MENU therefore routes on release rather than on press \u2014 a long press
       has to be able to suppress the short one. */
    if (k === "m"){
      let timer = null, fired = false;
      const CHEAT_HOLD = 600;
      b.addEventListener("touchstart", e => {
        e.preventDefault();
        fired = false;
        b.classList.add("on");
        b.dataset.hold = "1";
        timer = setTimeout(() => {
          fired = true;
          b.classList.add("armed");
          route("`");
          if (navigator.vibrate) { try { navigator.vibrate(25); } catch(_){} }
        }, CHEAT_HOLD);
      }, { passive:false });
      const endHold = (e) => {
        if (e) e.preventDefault();
        clearTimeout(timer);
        b.classList.remove("on"); b.classList.remove("armed");
        delete b.dataset.hold;
        if (!fired) route("m");
      };
      b.addEventListener("touchend", endHold, { passive:false });
      b.addEventListener("touchcancel", () => {
        clearTimeout(timer);
        b.classList.remove("on"); b.classList.remove("armed");
        delete b.dataset.hold;
      }, { passive:false });
      b.addEventListener("contextmenu", e => e.preventDefault());
      continue;
    }
    b.addEventListener("touchstart", e => { e.preventDefault(); press(b,k); }, { passive:false });
    b.addEventListener("touchend",   e => { e.preventDefault(); release(b,k); }, { passive:false });
    b.addEventListener("touchcancel",e => { release(b,k); }, { passive:false });
    b.addEventListener("contextmenu",e => e.preventDefault());
  }
  /* stop the page itself from scrolling or pinch-zooming under the game */
  document.addEventListener("touchmove", e => { e.preventDefault(); }, { passive:false });
})();

/* test hooks */
window.__game = { state, ZONES, ARCHETYPES, SPELLS, makeUnit, startBattle, get B(){ return B; },
  player, newGame, gainXp, recruitChance, typeMult, statOf, route, cam, healPad,

  isChampion, championBeaten, ZONE_DEFS, xpReward, goldReward, FOE_KIND,
  __solidAt: solidAt, __CHAMP_LEVEL_UP: CHAMP_LEVEL_UP, badgeCount, statOf,
  MUSIC, ZONE_MUSIC, zoneTrack, battleTrack, noteHz, audio, audioStart, playTrack, setAudioOn, sfx,
  compileTrack, parseChord, DRUM_LIB, BASS_LIB, GTR_LIB,
  MUSIC_INFO, MUSIC_ORDER, trackSeconds, encounterSting, battleSting, battleIntroDur,
  stingTierFor, STING_SECONDS, enterBattle, rematchReady, rematchFlag, REMATCH_LEVELS,
  rematchLevels, REMATCH_BASE, REMATCH_PER_BADGE, LEGENDS,
  __shopTop: shopTop, SHOP_ROWS,
  rollRare, RARE_CHANCE, tierPips, hueShift, rematchReward, rematchLine,
  MAX_LEVEL, XP_RATE, TP_MILESTONES,
  learnableFor, relearnCost, archChainTo, relearnPeople,
  CHEATS, warpTargets, doCheat, MANUAL, MENU_ITEMS, spawnEncounter, totalXpFor,
  CONTINENT, MAP_SITES, DEX_LIST, dexBound, TREES, treeOf, unitTree, SCHOOL_TALENTS,
  TREE_BASE, NODE_IDS, boundTp, tpEarnedBy, charmChoices, CHARM_KEYS, heldOf,
  talentBonus, OVERWORLD_TRAINERS, autosave, saveGame, recalc, addUnit,
  regionOutline, SHOP_STOCK, gainXp, __doWarp: doWarp, __applyWarp: applyWarp,
  opt, speedMult, SPEEDS, OPTION_ROWS, optionValue, dayPhase, dayTint, DAY_SECONDS,
  STORY, STORY_BY_ID, storySeen, storyReady, checkStory, beginScene, storyActive,
  rivalTeam, rivalLevel, rivalAce, rivalStarter, RIVAL_NAME, RIVAL_COUNTER, RIVAL_CHAIN,
  get __story(){ return story; }, __tickStory: storyTick, __endScene: endScene,
  resetStory, loadFromString, serialize,
  /* a suite that is about something else needs the road clear of cutscenes */
  __skipAllStory: () => { storyOff = true; endScene();
    for (const sc of STORY) state.flags[storyFlag(sc.id)] = true; },
  CONTINENT2, MAP_ROADS2, oathfallSeen, OATHSWORN, OATH_BIND, compressMult,
  OATH_STRONG, OATH_WEAK, useBagItem, spendOath, ascendReady, archName,
  OATH_STOCK, shopList, REFORGE_COST, TEMPER_COST, SPARK_KEYS,
  __warpFade: WARP_FADE, __startTransition: startTransition,
  /* tests that are about the fight, not the intro, skip straight to it */
  __skipTransition: () => {
    if (!transition) return false;
    const cb = transition.cb, mid = transition.midCb, done = transition.midDone;
    transition = null;
    if (mid && !done) mid();
    if (cb) cb();
    return true;
  },
  drawFigure, tierOf, buildOf, shadeHex, HOODED_AT_TOP, __ctx: ctx,
  __freeze: (v) => { frozen = !!v; },
  __transition: () => transition, __encounterDur: 0.8 };
</script></body></html>
