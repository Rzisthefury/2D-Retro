  stars(f, L, R, r, 70, 60);
  f.fillStyle = '#e8e2c8'; f.beginPath(); f.arc(340, 34, 13, 0, 7); f.fill();
  f.fillStyle = '#291646'; f.beginPath(); f.arc(346, 30, 12, 0, 7); f.fill();
  skyline(f, L, R, r, 150, '#100c24', '#e8c860', 50, 132);
  // mid: the next rank of roofs, close enough to see their water tanks
  for (let x = 0; x < L.mid.width; x += r(70, 130)) {

    for (let k = 0; k < 5; k++) if (R() < 0.5) { m.fillStyle = '#d8b050'; m.fillRect(x + 8 + R() * 100, 150 - h + 10 + R() * (h - 14), 3, 4); }
    if (R() < 0.6) { const tx = x + 20 + R() * 70;
      m.fillStyle = '#2a2030'; m.fillRect(tx, 150 - h - 20, 17, 14);
      m.beginPath(); m.moveTo(tx - 2, 150 - h - 20); m.lineTo(tx + 8.5, 150 - h - 28); m.lineTo(tx + 19, 150 - h - 20); m.fill();
      m.fillRect(tx + 2, 150 - h - 6, 2, 6); m.fillRect(tx + 13, 150 - h - 6, 2, 6); }
  }
  // near: the roof you fight on, stepping up and down between blocks.
  // The last stretch is one big open roof under a billboard - the boss arena.
  const arena = len - 330;
  let x = 0;
  while (x < arena) {

    n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(x, top + 1, bw, 3);
    if (R() < 0.6) { n.fillStyle = '#2a2430'; n.fillRect(x + bw - 4, top - 12, 5, 250 - top); }  // party wall between roofs
    // what lives on a roof
    const put = [];
    if (R() < 0.75) put.push(() => {                                   // water tower
      const tx = x + 20 + R() * (bw - 70);
      n.fillStyle = '#16121c'; n.fillRect(tx + 3, top - 8, 3, 12); n.fillRect(tx + 34, top - 8, 3, 12);
      n.fillStyle = '#3a2a20'; n.fillRect(tx, top - 44, 40, 38);
      for (let k = 0; k < 40; k += 5) { n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(tx + k, top - 44, 1.5, 38); }
      n.fillStyle = '#5a4432'; n.fillRect(tx, top - 34, 40, 2); n.fillRect(tx, top - 20, 40, 2);
      n.fillStyle = '#2a2028'; n.beginPath(); n.moveTo(tx - 3, top - 44); n.lineTo(tx + 20, top - 60); n.lineTo(tx + 43, top - 44); n.fill();
    });
    if (R() < 0.7) put.push(() => {                                    // AC plant
      const ax = x + 20 + R() * (bw - 60);

    });
    if (R() < 0.5) put.push(() => {                                    // laundry on a line
      const lx = x + 16 + R() * (bw - 90);

    if (R() < 0.45) put.push(() => {                                   // satellite dishes
      const dx = x + 20 + R() * (bw - 40);

      for (let k = 0; k < 5; k++) if (R() < 0.5) { n.fillStyle = '#c8a048';
        n.fillRect(x + bw - gw + 5 + R() * (gw - 12), top + 20 + k * 22, 3, 4); }

    put.forEach(fn => fn());
    if (R() < 0.6) { const sx = x + 30 + R() * (bw - 60);              // stair bulkhead with a lit door
      n.fillStyle = '#382f40'; n.fillRect(sx, top - 40, 34, 41);
      n.fillStyle = '#463c50'; n.fillRect(sx - 2, top - 44, 38, 5);
      doorway(n, sx + 9, top - 28, 16, 29, R, { col: '#2a3a3a', light: false });
      n.fillStyle = '#e8c860'; n.fillRect(sx + 11, top - 26, 12, 4);
      n.fillStyle = 'rgba(232,200,96,0.10)'; n.fillRect(sx + 4, top - 24, 26, 24); }
    x += bw;
  }
  // the arena: one long unbroken roof, a billboard lighting it, the drop behind
  const atop = WALK + 2;
  n.fillStyle = '#2a2430'; n.fillRect(arena, atop, L.near.width - arena, 240 - atop);
  for (let k = 0; k < (L.near.width - arena) * 1.6; k++) { n.fillStyle = R() < 0.5 ? '#332c3a' : '#241f2b';
    n.fillRect(arena + R() * (L.near.width - arena), atop + 4 + R() * (236 - atop), 3, 1); }
  for (let sy = atop + 12; sy < 240; sy += 17) { n.fillStyle = 'rgba(0,0,0,0.16)'; n.fillRect(arena, sy, L.near.width - arena, 2); }
  n.fillStyle = '#4a4254'; n.fillRect(arena, atop - 12, L.near.width - arena, 13);
  n.fillStyle = '#5e5668'; n.fillRect(arena, atop - 12, L.near.width - arena, 3);
  n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(arena, atop + 1, L.near.width - arena, 3);
  // the billboard: a steel frame on the parapet with its own floodlights
  const bx0 = arena + 70, bw2 = 250;
  n.fillStyle = '#16121c';
  for (let k = 0; k < 5; k++) n.fillRect(bx0 + 10 + k * 58, atop - 74, 5, 72);
  n.strokeStyle = '#16121c'; n.lineWidth = 3;
  for (let k = 0; k < 4; k++) { n.beginPath(); n.moveTo(bx0 + 12 + k * 58, atop - 10);

  n.fillStyle = '#8a1428'; n.fillRect(bx0 + 3, atop - 88, bw2 - 6, 17);
  neonText(n, 'DUVALL', bx0 + 16, atop - 104, '#ffe8a0', 3);
  ptext(n, 'WHISKEY - SINCE 1911', bx0 + 18, atop - 84, '#f0d8a8', 1);
  for (let k = 0; k < 4; k++) {                      // floods on booms under the board
    const lx = bx0 + 28 + k * 64;
    n.fillStyle = '#16121c'; n.fillRect(lx, atop - 64, 3, 9); n.fillRect(lx - 5, atop - 68, 14, 5);
    n.fillStyle = '#fff2c0'; n.fillRect(lx - 4, atop - 67, 12, 3);
    n.fillStyle = 'rgba(255,242,192,0.08)';
    n.beginPath(); n.moveTo(lx - 4, atop - 64); n.lineTo(lx - 34, atop - 110); n.lineTo(lx + 38, atop - 110); n.lineTo(lx + 8, atop - 64); n.fill();
  }
  n.fillStyle = 'rgba(255,230,170,0.07)'; n.fillRect(arena, atop, L.near.width - arena, 240 - atop);
  // a water tower and a stair head at the far end, so the arena is not bare

    n.fillStyle = '#2a2028'; n.beginPath(); n.moveTo(tx - 4, atop - 56); n.lineTo(tx + 26, atop - 76); n.lineTo(tx + 56, atop - 56); n.fill();
    n.fillStyle = '#16121c'; n.fillRect(tx + 54, atop - 52, 2, 56);

  // the pipes and vents underfoot, and a skylight or two you can see down into

    if (R() < 0.5) { n.fillStyle = '#2a2a32'; n.fillRect(px_, 196, 34, 6);
      n.fillStyle = '#3a3a46'; n.fillRect(px_, 196, 34, 2);

    else { n.fillStyle = '#16141c'; n.fillRect(px_, 190, 30, 16);

  n.fillRect(10, WALK - 26, 2, 34); n.fillRect(48, WALK - 26, 2, 34);

  ptext(n, 'UP', 20, WALK - 40, 'rgba(200,190,210,0.35)');

// ------------------------------------------------------------ live overlays
// A train crossing the elevated deck. Baking it into the parallax layer would
// leave it parked forever, so it is drawn live over the top of the structure -
// the same way the dance floor is - and it runs on a fixed cycle.
const EL_PERIOD = 780, EL_RUN = 260;
function elTrainPhase() { const p = G.frames % EL_PERIOD; return p < EL_RUN ? p : -1; }
function drawElTrain(cx) {
  const p = elTrainPhase();
  if (p < 0) return;
  const dir = Math.floor(G.frames / EL_PERIOD) % 2 ? -1 : 1;
  const span = 470;
  const travel = W + span + 40;
  const x0 = dir > 0 ? -span - 20 + (p / EL_RUN) * travel : W + 20 - (p / EL_RUN) * travel;
  const lit = Math.floor(G.frames / 3) % 2;
  // The visible strip runs from just under the HUD down to the deck, so what
  // you see is a band of lit windows and the skirt riding past overhead.
  const TOP = 34, BOT = 56;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, TOP, W, BOT - TOP); ctx.clip();
  for (let c = 0; c < 4; c++) {
    const bx = x0 + c * 118;
    if (bx > W + 10 || bx + 112 < -10) continue;
    ctx.fillStyle = '#12101a'; ctx.fillRect(bx, TOP - 16, 112, BOT - TOP + 16);
    ctx.fillStyle = '#4e5766'; ctx.fillRect(bx + 1, TOP - 15, 110, BOT - TOP + 14);
    ctx.fillStyle = '#39414e'; ctx.fillRect(bx + 1, BOT - 8, 110, 8);
    ctx.fillStyle = '#c83030'; ctx.fillRect(bx + 1, BOT - 11, 110, 3);
    for (let wx = bx + 7; wx < bx + 104; wx += 20) {
      ctx.fillStyle = '#0e1620'; ctx.fillRect(wx, TOP - 1, 15, 14);
      ctx.fillStyle = '#ffeab0'; ctx.fillRect(wx + 1, TOP, 13, 12);
      if ((Math.round(wx) + c) % 3 === 0) { ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(wx + 5, TOP + 4, 5, 8); ctx.beginPath(); ctx.arc(wx + 7.5, TOP + 3, 2.4, 0, 7); ctx.fill(); }
    }
    ctx.fillStyle = '#20252e'; ctx.fillRect(bx + 10, BOT - 6, 22, 6); ctx.fillRect(bx + 80, BOT - 6, 22, 6);
    ctx.fillStyle = lit ? '#6a7484' : '#525c6c'; ctx.fillRect(bx + 12, BOT - 3, 18, 3); ctx.fillRect(bx + 82, BOT - 3, 18, 3);
    // the gap between one car and the next
    ctx.fillStyle = '#0b0a10'; ctx.fillRect(bx + 112, TOP - 16, 6, BOT - TOP + 16);
  }
  ctx.restore();
  // light spilling down between the girders as it goes over
  ctx.fillStyle = 'rgba(255,234,176,0.07)';
  for (let k = 0; k < 5; k++) {
    const gx = x0 + 40 + k * 118;
    if (gx < -60 || gx > W + 60) continue;
    ctx.beginPath(); ctx.moveTo(gx, 83); ctx.lineTo(gx - 30, 240); ctx.lineTo(gx + 66, 240); ctx.lineTo(gx + 36, 83); ctx.fill();
  }
}

// A rooftop steam riser: the hydrant's mechanic, wearing something that makes
// sense four storeys up.
function drawVent(hz, x, y) {
  const O = '#120a14';
  px(x - 9, y - 13, 18, 13, O); px(x - 8, y - 12, 16, 12, '#4a4e58');
  px(x - 8, y - 12, 16, 2, '#69707c');
  px(x - 5, y - 22, 10, 10, O); px(x - 4, y - 21, 8, 9, '#5a616d');
  px(x - 7, y - 24, 14, 3, O); px(x - 6, y - 23, 12, 2, '#7a838f');
  px(x - 3, y - 20, 2, 8, 'rgba(255,255,255,0.20)');
  px(x + 6, y - 18, 6, 3, '#39414e');
  if (hz.spray > 0) {
    const len = 80 * Math.min(1, (180 - hz.spray) / 10 + 0.2);
    const x0 = hz.dir > 0 ? x + 7 : x - 7 - len;
    for (let i = 0; i < 7; i++) {
      const k = i / 7;
      ctx.fillStyle = `rgba(226,230,240,${0.42 - k * 0.26})`;
      ctx.beginPath();
      ctx.arc(x0 + (hz.dir > 0 ? k * len : (1 - k) * len), y - 18 + Math.sin(G.frames / 3 + i) * 2, 3 + k * 7, 0, 7);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(hz.dir > 0 ? x + 7 : x - 11, y - 19, 5, 3);
  }
}


// ============================================================ STAGE 2: club interior helpers
// a crowd of silhouettes packed behind a rail, the thing that sells a club
function crowd(g, x0, x1, y, R, h = 26, col = 'rgba(0,0,0,0.62)') {
  for (let x = x0; x < x1; x += 5 + R() * 4) {
    const hh = h * (0.8 + R() * 0.4), bob = Math.sin(x * 0.7) * 2;
    g.fillStyle = col;
    g.fillRect(x, y - hh + bob, 5, hh);
    g.beginPath(); g.arc(x + 2.5, y - hh + bob - 2, 3, 0, 7); g.fill();
    if (R() < 0.3) { g.fillRect(x + 4, y - hh + bob - 8, 1.6, 9); }   // an arm up
  }
}
function trussRig(g, x0, x1, y, R, cols) {
  g.fillStyle = '#2a2a34'; g.fillRect(x0, y, x1 - x0, 4); g.fillRect(x0, y + 10, x1 - x0, 4);
  g.strokeStyle = '#3a3a46'; g.lineWidth = 2;
  for (let x = x0; x < x1; x += 16) { g.beginPath(); g.moveTo(x, y + 4); g.lineTo(x + 8, y + 10); g.lineTo(x + 16, y + 4); g.stroke(); }
  for (let x = x0 + 14; x < x1 - 10; x += 44) {
    g.fillStyle = '#16161e'; g.fillRect(x, y + 14, 11, 12);
    const c = cols[Math.floor(R() * cols.length)];
    g.save(); g.shadowColor = c; g.shadowBlur = 9; g.fillStyle = c; g.fillRect(x + 1, y + 25, 9, 4); g.restore();
  }
}


// ============================================================ STAGE 2-A: the neon canyon
// ---- A3: THE NEON CANYON --------------------------------------------------
// Signs stacked four deep over a street narrow enough to touch both sides, a
// gate you fight under, and tiled eaves above the shopfronts.
function canyonBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  skyGrad(f, L, [[0, '#08040e'], [0.6, '#2a0a22'], [1, '#5a1230']]);
  stars(f, L, R, r, 30, 40);
  f.fillStyle = '#12081a'; f.fillRect(0, 100, L.far.width, 56);
  m.fillStyle = 'rgba(0,0,0,0)'; m.fillRect(0, 0, 1, 1);
  for (let x = 0; x < L.mid.width; x += 54) {
    m.fillStyle = '#1a0c1e'; m.fillRect(x, 0, 50, 150);
    for (let k = 0; k < 6; k++) if (R() < 0.55) {
      const c = pick2(R, ['#ff2a6a', '#2affc8', '#ffd82a', '#6a8aff', '#ff8a2a']);
      m.save(); m.shadowColor = c; m.shadowBlur = 5; m.fillStyle = c;
      if (R() < 0.5) m.fillRect(x + 4 + R() * 30, 12 + k * 23, 16 + R() * 16, 4);
      else m.fillRect(x + 6 + R() * 34, 10 + k * 23, 5, 16);
      m.restore();
    }
  }
  // near: the street wall. Each building gets its own height, material and
  // upper floors, so the canyon is not one shopfront stamped along a row.
  let x = 0, seq = 0;
  while (x < len - 320) {
    const bw = 88 + R() * 54;
    const wall = pick2(R, ['#3a1c22', '#2e222c', '#402828', '#28242e', '#332030']);
    n.fillStyle = wall; n.fillRect(x, 0, bw, GROUND);
    for (let k = 0; k < 26; k++) { n.fillStyle = 'rgba(0,0,0,0.10)'; n.fillRect(x + R() * bw, R() * GROUND, 6 + R() * 18, 3 + R() * 8); }
    n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(x + bw - 3, 0, 3, GROUND);
    // Only y 34..86 is actually visible above the shopfronts (the HUD owns the
    // top 34 rows), so the storeys live in that band rather than behind it.
    const storeys = 2;
    for (let f2 = 0; f2 < storeys; f2++) {
      const fy = 36 + f2 * 25;
      if (fy + 22 > 88) break;
      const style = (seq + f2) % 3;
      if (style === 0) {
        for (let k = 0; k < 2; k++) {
          const wx = x + 10 + k * (bw - 26);
          n.fillStyle = '#120e16'; n.fillRect(wx - 2, fy - 2, 20, 22);
          const on = R() < 0.55;
          n.fillStyle = on ? '#f0c470' : '#231d2c'; n.fillRect(wx, fy, 16, 18);
          for (let b = 0; b < 18; b += 3) { n.fillStyle = 'rgba(18,14,22,0.68)'; n.fillRect(wx, fy + b, 16, 1.5); }
          if (on) { n.fillStyle = 'rgba(240,196,112,0.12)'; n.fillRect(wx - 6, fy - 2, 28, 26); }
        }
      } else if (style === 1) {
        n.fillStyle = '#1a1620'; n.fillRect(x + 5, fy + 18, bw - 10, 3);
        for (let k = 0; k < bw - 12; k += 5) { n.fillStyle = '#2c2534'; n.fillRect(x + 6 + k, fy + 9, 1.5, 9); }
        n.fillStyle = '#332b3c'; n.fillRect(x + 5, fy + 8, bw - 10, 2);
        n.fillStyle = '#120e16'; n.fillRect(x + bw / 2 - 11, fy - 4, 22, 22);
        const lit2 = R() < 0.6;
        n.fillStyle = lit2 ? '#f0c878' : '#241d30'; n.fillRect(x + bw / 2 - 9, fy - 2, 18, 20);
        if (lit2) { n.fillStyle = 'rgba(240,200,120,0.13)'; n.fillRect(x + bw / 2 - 18, fy - 4, 36, 26); }
        for (let k = 0; k < 3; k++) if (R() < 0.6) { n.fillStyle = '#2a6a3a';
          n.fillRect(x + 10 + k * 18, fy + 14, 6, 6); n.fillRect(x + 11 + k * 18, fy + 10, 4, 5); }
        if (R() < 0.6) { n.strokeStyle = 'rgba(190,190,205,0.45)'; n.lineWidth = 1;
          n.beginPath(); n.moveTo(x + 6, fy + 6); n.quadraticCurveTo(x + bw / 2, fy + 12, x + bw - 6, fy + 6); n.stroke();
          for (let k = 0; k < 4; k++) { n.fillStyle = pick2(R, ['#d8d0c0', '#8ab8d8', '#d88a9a', '#e8d070']);
            n.fillRect(x + 12 + k * (bw - 26) / 4, fy + 8 + k, 7, 10); } }
      } else {
        n.fillStyle = '#39414e'; n.fillRect(x + 8 + R() * (bw - 30), fy - 6, 5, 34);
        n.fillStyle = '#2a2a32'; n.fillRect(x + bw - 30, fy + 4, 20, 14);
        n.fillStyle = '#3d3d47'; n.fillRect(x + bw - 29, fy + 5, 18, 5);
        n.fillStyle = '#16121c'; n.fillRect(x + 12, fy + 2, 14, 18);
        n.fillStyle = R() < 0.3 ? '#c8a850' : '#191520'; n.fillRect(x + 14, fy + 4, 10, 14);
      }
    }
    // The deep tiled eave over the shopfront: the piece of architecture that
    // says this is not the same street as stage 1, so it has to read.
    for (const ey of [86, 34]) {
      n.fillStyle = '#1a0f12'; n.fillRect(x - 5, ey, bw + 10, 6);
      for (let tx = x - 5; tx < x + bw + 5; tx += 8) {
        n.fillStyle = pick2(R, ['#7a3a34', '#8c453c', '#6a322e', '#94514a']);
        n.beginPath(); n.moveTo(tx, ey + 1); n.lineTo(tx + 4, ey - 7); n.lineTo(tx + 8, ey + 1); n.fill();
        n.fillStyle = 'rgba(255,200,170,0.14)'; n.fillRect(tx + 3, ey - 6, 1.5, 7);
      }
      n.fillStyle = '#c08a5a'; n.fillRect(x - 5, ey + 1, bw + 10, 1.5);
      n.fillStyle = 'rgba(0,0,0,0.45)'; n.fillRect(x - 5, ey + 6, bw + 10, 4);
    }
    const sfTop = 90 + (seq % 3) * 4;
    n.fillStyle = '#16101a'; n.fillRect(x + 3, sfTop, bw - 6, GROUND - sfTop);
    if (R() < 0.18) {
      n.fillStyle = '#2a2430'; n.fillRect(x + 6, sfTop + 4, bw - 12, GROUND - sfTop - 4);
      for (let k = 0; k < bw - 12; k += 4) { n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(x + 6 + k, sfTop + 4, 2, GROUND - sfTop - 4); }
      graffiti(n, x + 12, GROUND - 24, R, bw - 28);
    } else {
      n.fillStyle = pick2(R, ['#e8c878', '#d8a850', '#c8d8a0', '#e8b070']);
      n.fillRect(x + 6, sfTop + 5, bw - 12, GROUND - sfTop - 7);
      n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(x + 6, sfTop + 5, bw - 12, 6);
      const trade = seq % 4;
      if (trade === 0) {
        for (let k = 0; k < 5; k++) { n.fillStyle = '#a8461f'; n.fillRect(x + 12 + k * 13, GROUND - 42, 7, 15);
          n.fillStyle = '#7d3216'; n.fillRect(x + 14 + k * 13, GROUND - 44, 2, 3); }
        n.fillStyle = '#b8bcc4'; for (let k = 0; k < 4; k++) n.fillRect(x + bw - 34, GROUND - 26 - k * 6, 24, 5);
        n.fillStyle = 'rgba(240,240,250,0.18)'; n.fillRect(x + bw - 36, GROUND - 40, 28, 14);
      } else if (trade === 1) {
        for (let k = 0; k < 4; k++) { n.fillStyle = pick2(R, ['#8a6a40', '#6a4a2a']);
          n.fillRect(x + 10 + k * 16, GROUND - 26, 14, 16);
          n.fillStyle = pick2(R, ['#c8703a', '#8aa83a', '#d8b83a']); n.fillRect(x + 12 + k * 16, GROUND - 29, 10, 4); }
        n.fillStyle = '#7a6a4a'; n.fillRect(x + bw - 30, GROUND - 30, 18, 20);
      } else if (trade === 2) {
        n.fillStyle = 'rgba(210,235,245,0.22)'; n.fillRect(x + 10, GROUND - 42, bw - 20, 18);
        for (let k = 0; k < 3; k++) { n.fillStyle = '#2a2a34'; n.fillRect(x + 16 + k * 22, GROUND - 24, 12, 14);
          n.fillStyle = '#5a2a2a'; n.fillRect(x + 16 + k * 22, GROUND - 28, 12, 5); }
      } else {
        n.fillStyle = '#6a4a2a'; n.fillRect(x + 8, GROUND - 24, bw - 16, 5);
        n.fillStyle = '#4a3220'; n.fillRect(x + 8, GROUND - 19, bw - 16, 9);
        for (let k = 0; k < 6; k++) { n.fillStyle = pick2(R, ['#d8d0c0', '#c8b8a0']); n.fillRect(x + 12 + k * 12, GROUND - 29, 7, 5); }
      }
      for (let k = 0; k < 4; k++) if (R() < 0.55) {
        const sx2 = x + 12 + k * (bw - 24) / 4;
        n.fillStyle = 'rgba(0,0,0,0.5)';
        n.fillRect(sx2, GROUND - 30, 6, 24); n.beginPath(); n.arc(sx2 + 3, GROUND - 32, 3.4, 0, 7); n.fill();
      }
      n.fillStyle = 'rgba(255,220,150,0.12)'; n.fillRect(x + 6, sfTop + 5, bw - 12, GROUND - sfTop - 7);
      for (let k = 0; k < bw - 12; k += 9) { n.fillStyle = pick2(R, ['#1e3a5a', '#5a1e2a', '#2a4a36']);
        n.fillRect(x + 6 + k, sfTop + 5, 8, 10); }
      n.fillStyle = 'rgba(255,214,150,0.10)';
      n.beginPath(); n.ellipse(x + bw / 2, WALK + 14, bw * 0.55, 15, 0, 0, 7); n.fill();
    }
    n.fillStyle = '#2a1a1e'; n.fillRect(x + 3, sfTop, bw - 6, 5);
    n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(x + 3, GROUND - 8, bw - 6, 8);
    // the blade sign bracketed off this building's own face
    if (R() < 0.85) {
      const sy = 16 + (seq % 3) * 16, h = 40 + R() * 24;
      const c = pick2(R, ['#ff2a6a', '#2affc8', '#ffd82a', '#6a8aff', '#ff8a2a', '#ff2aff']);
      const side = seq % 2 ? x + bw - 24 : x + 8;
      n.fillStyle = '#241e2a'; n.fillRect(side + 5, sy - 5, 6, 5);
      n.fillStyle = '#0e0810'; n.fillRect(side, sy, 16, h);
      n.save(); n.shadowColor = c; n.shadowBlur = 8; n.fillStyle = c;
      for (let k = 0; k < Math.floor(h / 11); k++) n.fillRect(side + 4, sy + 5 + k * 11, 8, 7);
      n.restore();
    }
    x += bw; seq++;
  }
  // the gate across the street, and the club behind it
  const g0 = len - 320, gw = L.near.width - g0;
  n.fillStyle = '#180a1c'; n.fillRect(g0, 0, gw, GROUND);
  for (let k = 0; k < 40; k++) { n.fillStyle = pick2(R, ['#ff2a6a', '#ffd82a', '#2affc8']);
    n.fillRect(g0 + R() * gw, 20 + R() * 100, 3, 3); }
  n.fillStyle = '#7a1a28'; n.fillRect(g0 + 28, 30, 16, GROUND - 30); n.fillRect(g0 + gw - 44, 30, 16, GROUND - 30);
  n.fillStyle = '#9a2a34'; n.fillRect(g0 + 30, 30, 5, GROUND - 30); n.fillRect(g0 + gw - 42, 30, 5, GROUND - 30);
  n.fillStyle = '#7a1a28'; n.fillRect(g0 + 20, 22, gw - 40, 12);
  for (let tx = g0 + 14; tx < g0 + gw - 14; tx += 8) { n.fillStyle = '#c8a030';
    n.beginPath(); n.moveTo(tx, 22); n.lineTo(tx + 4, 14); n.lineTo(tx + 8, 22); n.fill(); }
  n.fillStyle = '#c8a030'; n.fillRect(g0 + 14, 34, gw - 28, 3);
  neonText(n, 'CLUB VELVET', g0 + gw / 2 - tw('CLUB VELVET', 2) / 2, 42, '#ffd82a', 2);
  n.fillStyle = '#2a0a1a'; n.fillRect(g0 + gw / 2 - 30, GROUND - 58, 60, 58);
  n.fillStyle = 'rgba(255,42,106,0.20)'; n.fillRect(g0 + gw / 2 - 30, GROUND - 58, 60, 58);
  // the ground: tight wet setts, no kerb, no carriageway
  n.fillStyle = '#2f2830'; n.fillRect(0, WALK, L.near.width, 240 - WALK);
  for (let sy = WALK; sy < 240; sy += 9) for (let sx2 = 0; sx2 < L.near.width; sx2 += 12) {
    const t2 = R();
    n.fillStyle = t2 < 0.33 ? '#342d36' : t2 < 0.66 ? '#2d262e' : '#393240';
    n.fillRect(sx2 + ((Math.round(sy / 9)) % 2) * 6, sy, 11, 8);
    if (t2 > 0.94) { n.fillStyle = 'rgba(255,255,255,0.05)'; n.fillRect(sx2 + ((Math.round(sy / 9)) % 2) * 6, sy, 11, 2); }
  }
  n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(0, WALK, L.near.width, 3);
  n.fillStyle = '#20242e'; n.fillRect(L.near.width * 0, 214, L.near.width, 6);      // the drain channel
  for (let k = 0; k < L.near.width; k += 6) { n.fillStyle = '#2e3440'; n.fillRect(k, 215, 3, 4); }
  puddles(n, R, L.near.width, WALK + 10, 236, 40, 'rgba(255,120,180,0.13)');
  puddles(n, R, L.near.width, WALK + 10, 236, 24, 'rgba(90,200,220,0.12)');
  // THE signs: hung right across the street, four deep, overlapping
  for (let x2 = 10; x2 < L.near.width; x2 += 34 + R() * 26) {
    const c = pick2(R, ['#ff2a6a', '#2affc8', '#ffd82a', '#6a8aff', '#ff8a2a', '#ff2aff']);
    const kind = 1 + Math.floor(R() * 2);
    n.fillStyle = '#0e0810';
    if (kind === 1) {                                   // horizontal box
      const w2 = 40 + R() * 40, y0 = 12 + R() * 60;
      n.fillRect(x2, y0, w2, 16);
      n.save(); n.shadowColor = c; n.shadowBlur = 8; n.strokeStyle = c; n.lineWidth = 2;
      n.strokeRect(x2 + 3, y0 + 3, w2 - 6, 10); n.restore();
      neonText(n, pick2(R, ['BAR', 'KTV', 'NOODLE', 'PARLOUR', 'HOTEL']), x2 + 6, y0 + 5, c);
    } else {                                            // a hanging lantern cluster
      const y0 = 14 + R() * 30;
      n.fillStyle = '#2a1a22'; n.fillRect(x2 + 6, 0, 2, y0);
      for (let k = 0; k < 3; k++) {
        n.save(); n.shadowColor = '#ff5a3a'; n.shadowBlur = 8; n.fillStyle = pick2(R, ['#ff5a3a', '#ffb83a']);
        n.beginPath(); n.ellipse(x2 + 7, y0 + 10 + k * 17, 6, 8, 0, 0, 7); n.fill(); n.restore();
        n.fillStyle = '#c89030'; n.fillRect(x2 + 6, y0 + 1 + k * 17, 2, 3);
      }
    }
  }
  // the cables it all hangs from
  n.strokeStyle = 'rgba(30,24,36,0.9)'; n.lineWidth = 1;
  for (let x2 = 0; x2 < L.near.width; x2 += 80) {
    n.beginPath(); n.moveTo(x2, 8 + R() * 8); n.quadraticCurveTo(x2 + 40, 20 + R() * 10, x2 + 80, 8 + R() * 8); n.stroke();
  }
}


// ============================================================ STAGE 2-B: the basement
// ---- B2: THE BASEMENT -----------------------------------------------------
// Raw concrete, a scaffold rig and a wall of speakers. Colder, harder, and lit
// by strobe rather than colour.
function basementBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  f.fillStyle = '#07080c'; f.fillRect(0, 0, L.far.width, H);
  m.fillStyle = 'rgba(0,0,0,0)'; m.fillRect(0, 0, 1, 1);
  for (let x = 0; x < L.mid.width; x += 90) {           // the back of the room, lost in the dark
    m.fillStyle = '#0d0f14'; m.fillRect(x, 40, 84, 110);
    if (R() < 0.4) { m.fillStyle = '#161a22'; m.fillRect(x + 10, 60, 64, 50); }
  }
  crowd(m, 0, L.mid.width, 150, R, 34, 'rgba(0,0,0,0.75)');
  concrete(n, 0, 0, L.near.width, 150, '#2e3138', R);
  // Openings into the next room so the crowd in the mid layer actually shows:
  // a raised area behind a rail, glimpsed between the structure.
  // Placed in the gaps between the speaker stacks (which sit at 60, 260, 460...)
  // so the openings are not painted over by them.
  for (let ox = 158; ox < len - 400; ox += 200) {
    const ow = 84;
    n.clearRect(ox, 54, ow, 88);
    n.fillStyle = 'rgba(10,12,16,0.55)'; n.fillRect(ox, 54, ow, 88);
    crowd(n, ox + 2, ox + ow - 2, 140, R, 32, 'rgba(0,0,0,0.80)');
    crowd(n, ox + 6, ox + ow - 6, 126, R, 26, 'rgba(0,0,0,0.92)');
    n.fillStyle = '#39414e'; n.fillRect(ox - 4, 120, ow + 8, 4);           // the rail they lean on
    n.fillStyle = '#4e5866'; n.fillRect(ox - 4, 120, ow + 8, 1.5);
    for (let k = 0; k < ow + 8; k += 22) { n.fillStyle = '#2b323c'; n.fillRect(ox - 4 + k, 120, 3, 22); }
    n.fillStyle = '#20242c'; n.fillRect(ox - 6, 48, ow + 12, 7);           // the lintel over it
    n.fillStyle = '#2e343e'; n.fillRect(ox - 6, 48, ow + 12, 2);
    n.fillStyle = 'rgba(58,255,138,0.05)'; n.fillRect(ox, 54, ow, 88);
  }
  // structural columns and the scaffold rig bolted between them
  for (let x = 30; x < L.near.width; x += 210) {
    concrete(n, x, 0, 34, 150, '#353942', R);
    n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(x + 30, 0, 4, 150);
    graffiti(n, x + 2, 96 + R() * 30, R, 30);
  }
  for (let y = 12; y < 44; y += 20) {
    n.fillStyle = '#4a4e58'; n.fillRect(0, y, L.near.width, 4);
    for (let x = 0; x < L.near.width; x += 46) { n.fillStyle = '#5c616d'; n.fillRect(x, y - 1, 5, 6); }
  }
  for (let x = 0; x < L.near.width; x += 46) { n.fillStyle = '#4a4e58'; n.fillRect(x, 12, 4, 34); }
  for (let x = 20; x < L.near.width; x += 56) {
    n.fillStyle = '#16161c'; n.fillRect(x, 44, 12, 13);
    n.fillStyle = R() < 0.5 ? '#e8f4ff' : '#0f1014'; n.fillRect(x + 1, 55, 10, 4);
  }
  // the wall of speakers: the reason anybody came
  for (let x = 60; x < len - 360; x += 200) {
    for (let c = 0; c < 2; c++) for (let s = 0; s < 4; s++) {
      const sx = x + c * 46, sy = 64 + s * 21;
      n.fillStyle = '#0a0a0e'; n.fillRect(sx, sy, 44, 20);
      n.fillStyle = '#1a1a20'; n.fillRect(sx + 1, sy + 1, 42, 18);
      n.fillStyle = '#26262e'; n.beginPath(); n.arc(sx + 13, sy + 10, 7, 0, 7); n.arc(sx + 31, sy + 10, 7, 0, 7); n.fill();
      n.fillStyle = '#0e0e12'; n.beginPath(); n.arc(sx + 13, sy + 10, 3, 0, 7); n.arc(sx + 31, sy + 10, 3, 0, 7); n.fill();
    }
    n.fillStyle = '#3a3a46'; n.fillRect(x - 4, 148, 96, 4);
  }
  // chain-link penning off the far side, and a van somebody drove in
  for (let x = len - 700; x < len - 380; x += 6) {
    n.strokeStyle = 'rgba(130,142,164,0.16)'; n.lineWidth = 1;
    n.beginPath(); n.moveTo(x, 58); n.lineTo(x + 46, 150); n.stroke();
    n.beginPath(); n.moveTo(x, 58); n.lineTo(x - 46, 150); n.stroke();
  }
  const vanX = len - 620;
  n.fillStyle = '#0e1016'; n.fillRect(vanX, 82, 132, 62);
  n.fillStyle = '#4c5866'; n.fillRect(vanX + 2, 84, 128, 58);
  n.fillStyle = '#5c697a'; n.fillRect(vanX + 2, 84, 128, 4);               // roof line
  n.fillStyle = 'rgba(0,0,0,0.28)'; n.fillRect(vanX + 2, 128, 128, 14);    // sill shadow
  for (let k = 0; k < 128; k += 9) { n.fillStyle = 'rgba(0,0,0,0.14)'; n.fillRect(vanX + 2 + k, 90, 2, 38); }
  n.fillStyle = '#2b3542'; n.fillRect(vanX + 6, 96, 42, 30);               // the open back doors
  n.fillStyle = '#121820'; n.fillRect(vanX + 9, 99, 36, 24);
  n.fillStyle = 'rgba(58,255,138,0.10)'; n.fillRect(vanX + 9, 99, 36, 24);
  for (let k = 0; k < 3; k++) { n.fillStyle = '#0a0a0e'; n.fillRect(vanX + 12 + k * 11, 104, 9, 18);
    n.fillStyle = '#26262e'; n.beginPath(); n.arc(vanX + 16.5 + k * 11, 111, 3.4, 0, 7); n.fill(); }
  n.fillStyle = '#1c2430'; n.fillRect(vanX + 90, 92, 36, 22);              // cab window
  n.fillStyle = 'rgba(150,190,230,0.14)'; n.fillRect(vanX + 93, 94, 14, 18);
  n.fillStyle = '#39414e'; n.fillRect(vanX + 88, 116, 42, 4);
  graffiti(n, vanX + 54, 118, R, 30);
  n.fillStyle = '#0e1016'; n.fillRect(vanX + 12, 142, 108, 8);
  n.fillStyle = '#16181f'; n.beginPath(); n.arc(vanX + 30, 148, 10, 0, 7); n.arc(vanX + 104, 148, 10, 0, 7); n.fill();
  n.fillStyle = '#343a44'; n.beginPath(); n.arc(vanX + 30, 148, 4, 0, 7); n.arc(vanX + 104, 148, 4, 0, 7); n.fill();
  // the end of the room: the rig, a riser, and one red exit sign
  const r0 = len - 360;
  n.fillStyle = '#0c0e13'; n.fillRect(r0, 0, L.near.width - r0, 150);
  trussRig(n, r0 + 10, L.near.width - 10, 34, R, ['#e8f4ff', '#e8f4ff', '#3aff8a', '#ff2a4a']);
  n.fillStyle = '#1a1e26'; n.fillRect(r0 + 40, 104, L.near.width - r0 - 80, 46);
  n.fillStyle = '#252b36'; n.fillRect(r0 + 40, 104, L.near.width - r0 - 80, 4);
  for (let k = 0; k < 6; k++) { n.fillStyle = '#0a0a0e'; n.fillRect(r0 + 56 + k * 40, 66, 32, 36);
    n.fillStyle = '#26262e'; n.beginPath(); n.arc(r0 + 72 + k * 40, 84, 10, 0, 7); n.fill(); }
  n.fillStyle = '#2a0e12'; n.fillRect(L.near.width - 70, 40, 44, 18);
  n.save(); n.shadowColor = '#ff2a3a'; n.shadowBlur = 9; ptext(n, 'EXIT', L.near.width - 64, 45, '#ff4a56'); n.restore();
  // the floor: bare slab, taped lines, spilled everything
  n.fillStyle = '#23262c'; n.fillRect(0, 150, L.near.width, 90);
  for (let k = 0; k < L.near.width * 1.6; k++) { n.fillStyle = R() < 0.5 ? '#2a2e35' : '#1c1f25';
    n.fillRect(r(0, L.near.width), r(152, 240), 3, 1); }
  for (let x = 0; x < L.near.width; x += 74) { n.fillStyle = 'rgba(0,0,0,0.20)'; n.fillRect(x, 150, 2, 90); }
  for (let k = 0; k < L.near.width / 90; k++) { n.fillStyle = 'rgba(0,0,0,0.28)';
    n.beginPath(); n.ellipse(r(0, L.near.width), r(160, 234), 12 + R() * 20, 4 + R() * 5, 0, 0, 7); n.fill(); }
  for (let k = 0; k < L.near.width / 16; k++) {
    n.fillStyle = pick2(R, ['rgba(190,200,210,0.35)', 'rgba(140,170,120,0.3)', 'rgba(200,150,90,0.3)']);
    n.save(); n.translate(r(0, L.near.width), r(156, 236)); n.rotate(R() * 3); n.fillRect(0, 0, 3 + R() * 5, 2); n.restore();
  }
  n.fillStyle = 'rgba(232,200,40,0.5)'; n.fillRect(0, 226, L.near.width, 3);
  L.strobe = 1; L.haze = 1;
}


// ------------------------------------------------------------ live overlay
// The basement is lit by its rig rather than by daylight, so the light has to
// move. Deliberately kept off a hard full-screen white flash: it is a long
// fight, and SAVE.options.flashing turns even this much down for anyone who
// wants it off.
function drawClubStrobe() {
  if (!SAVE.options.flashing) return;
  const t = G.frames;
  const beat = t % 74;
  if (beat < 3) { ctx.fillStyle = 'rgba(226,240,255,0.16)'; ctx.fillRect(0, 0, W, 150); }
  else if (beat < 7) { ctx.fillStyle = 'rgba(226,240,255,0.07)'; ctx.fillRect(0, 0, W, 150); }
  for (let k = 0; k < 4; k++) {
    const a = t * 0.017 + k * 1.6;
    const x = W / 2 + Math.sin(a) * (W / 2 + 40);
    ctx.fillStyle = k % 2 ? 'rgba(58,255,138,0.055)' : 'rgba(226,240,255,0.045)';
    ctx.beginPath(); ctx.moveTo(x, 48); ctx.lineTo(x - 40, 240); ctx.lineTo(x + 26, 240); ctx.lineTo(x + 8, 48); ctx.fill();
  }
  // haze so the beams have something to land on
  for (let i = 0; i < 6; i++) {
    const seed = i * 211;
    const x = ((seed * 37 + t * (0.22 + (i % 3) * 0.1)) % (W + 200)) - 100;
    ctx.fillStyle = `rgba(200,210,235,${0.026 + (i % 3) * 0.010})`;
    ctx.beginPath(); ctx.ellipse(x, 122 + (seed % 66) , 58 + (i % 4) * 20, 15 + (i % 3) * 6, 0, 0, 7); ctx.fill();
  }
}


// ============================================================ STAGE 3 helpers
function siteDirt(n, L, R, r, base, a, b, c) {
  n.fillStyle = a; n.fillRect(0, base, L.near.width, 240 - base);
  for (let k = 0; k < L.near.width * 1.6; k++) { n.fillStyle = R() < 0.5 ? b : c;
    n.fillRect(r(0, L.near.width), r(base + 2, 240), 2, 1); }
  // tyre ruts churned down the length, and water standing in them
  for (const ry of [base + 26, base + 58]) for (let x = 0; x < L.near.width; x += 3) {
    n.fillStyle = 'rgba(0,0,0,0.20)'; n.fillRect(x, ry + Math.sin(x * 0.04) * 3, 3, 7);
  }
  for (let k = 0; k < L.near.width / 120; k++) { n.fillStyle = 'rgba(90,110,130,0.26)';
    n.beginPath(); n.ellipse(r(0, L.near.width), r(base + 20, 236), 14 + R() * 22, 4 + R() * 4, 0, 0, 7); n.fill(); }
  n.fillStyle = c; n.fillRect(0, base, L.near.width, 3);
}
function towerCrane(m, x, R, h = 120, col = '#3a1a2a') {
  m.fillStyle = col;
  m.fillRect(x, 150 - h, 7, h);
  for (let k = 0; k < h; k += 11) { m.strokeStyle = col; m.lineWidth = 1.5;
    m.beginPath(); m.moveTo(x, 150 - h + k); m.lineTo(x + 7, 150 - h + k + 11); m.stroke();
    m.beginPath(); m.moveTo(x + 7, 150 - h + k); m.lineTo(x, 150 - h + k + 11); m.stroke(); }
  m.fillRect(x - 46, 150 - h - 8, 150, 4);
  m.fillRect(x - 46, 150 - h - 4, 6, 4);
  for (let k = -44; k < 102; k += 12) { m.strokeStyle = col; m.lineWidth = 1;
    m.beginPath(); m.moveTo(x + k, 150 - h - 4); m.lineTo(x + k + 6, 150 - h - 12); m.lineTo(x + k + 12, 150 - h - 4); m.stroke(); }
  m.fillRect(x - 4, 150 - h - 20, 15, 12);
  m.fillStyle = '#e8c860'; m.fillRect(x - 2, 150 - h - 18, 10, 5);
  // the hook, on its cable, with something on it
  const hx = x + 54;
  m.fillStyle = col; m.fillRect(hx, 150 - h - 4, 1.5, 40);
  m.fillStyle = '#e8b020'; m.fillRect(hx - 6, 150 - h + 36, 13, 7);
}

function cityBelow(f, L, R, r, top) {
  f.fillStyle = '#2a1c3c'; f.fillRect(0, top, L.far.width, 240 - top);
  for (let x = 0; x < L.far.width; x += 7) { f.fillStyle = R() < 0.4 ? '#3a2a4e' : '#241a34';
    f.fillRect(x, top + R() * 10, 6, 240 - top); }
  for (let k = 0; k < L.far.width * 2.2; k++) { f.fillStyle = R() < 0.6 ? '#f2d070' : '#7ab8f0';
    f.fillRect(r(0, L.far.width), r(top + 4, 238), 1, 1); }
}
function duskSky(f, L, R, r) {
  const sky = f.createLinearGradient(0, 0, 0, 170);
  sky.addColorStop(0, '#1a1440'); sky.addColorStop(0.42, '#5a2a6a'); sky.addColorStop(0.76, '#e0704a'); sky.addColorStop(1, '#ffc068');
  f.fillStyle = sky; f.fillRect(0, 0, L.far.width, H);
  for (let i = 0; i < 46; i++) { f.fillStyle = 'rgba(255,255,255,0.45)'; f.fillRect(r(0, L.far.width), r(0, 46), 1, 1); }
  for (let k = 0; k < 10; k++) { f.fillStyle = 'rgba(255,200,180,0.16)'; f.fillRect(r(0, L.far.width), r(28, 96), r(50, 110), 4); }
}


// ============================================================ STAGE 3-A: the foundation
// ---- A1: THE FOUNDATION ---------------------------------------------------
function foundationBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  const sky = f.createLinearGradient(0, 0, 0, 160);
  sky.addColorStop(0, '#2a1a3a'); sky.addColorStop(0.55, '#a8506a'); sky.addColorStop(1, '#f0a060');
  f.fillStyle = sky; f.fillRect(0, 0, L.far.width, H);
  f.fillStyle = '#ffe0a0'; f.beginPath(); f.arc(330, 96, 16, 0, 7); f.fill();
  for (let k = 0; k < 9; k++) { f.fillStyle = 'rgba(255,220,200,0.18)'; f.fillRect(r(0, L.far.width), r(20, 90), r(40, 90), 3); }
  skyline(f, L, R, r, 140, '#4a2a4a', '#ffd070', 30, 92);
  for (let x = 40; x < L.mid.width; x += 250) towerCrane(m, x, R, 100 + R() * 34);
  // mid: the steel skeletons of the next plots
  for (let x = 0; x < L.mid.width; x += 150) {
    const h = 60 + R() * 54;
    m.strokeStyle = '#5a2a2a'; m.lineWidth = 2;
    for (let yy = 150; yy > 150 - h; yy -= 16) { m.beginPath(); m.moveTo(x, yy); m.lineTo(x + 66, yy); m.stroke(); }
    m.beginPath(); m.moveTo(x, 150); m.lineTo(x, 150 - h); m.moveTo(x + 66, 150); m.lineTo(x + 66, 150 - h); m.stroke();
    for (let yy = 150; yy > 166 - h; yy -= 16) { m.beginPath(); m.moveTo(x, yy); m.lineTo(x + 66, yy - 16); m.stroke(); }
  }
  // near: the perimeter. Real sites change their boundary as they go - plywood
  // hoarding here, mesh panels there, an open gap where the plant drives in -
  // so the run is not one continuous fence.
  let hx = 0, hs = 0;
  while (hx < L.near.width) {
    const hw = 170 + R() * 130, kind = hs % 3;
    if (kind === 0) {                                   // plywood hoarding, fly-posted
      n.fillStyle = '#6a5a44'; n.fillRect(hx, 58, hw, 84);
      for (let k = 0; k < hw; k += 17) { n.fillStyle = 'rgba(0,0,0,0.18)'; n.fillRect(hx + k, 58, 1.5, 84); }
      n.fillStyle = '#7d6c52'; n.fillRect(hx, 58, hw, 3);
      n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(hx, 136, hw, 6);
      for (let k = 0; k < 5; k++) {
        const px_ = hx + 8 + R() * (hw - 30);
        n.save(); n.translate(px_, 74 + R() * 42); n.rotate((R() - 0.5) * 0.18);
        n.fillStyle = pick2(R, ['#c8303a', '#2a5ac8', '#e8c030', '#2a8a5a', '#e8e8e8']);
        n.fillRect(0, 0, 17, 23);
        n.fillStyle = 'rgba(0,0,0,0.32)'; n.fillRect(2, 4, 13, 9); n.restore();
      }
      graffiti(n, hx + 14, 124, R, hw - 40);
    } else if (kind === 1) {                            // mesh panels with debris netting behind
      n.fillStyle = 'rgba(30,40,30,0.45)'; n.fillRect(hx, 58, hw, 84);
      n.strokeStyle = 'rgba(180,180,190,0.26)'; n.lineWidth = 1;
      for (let x2 = hx; x2 < hx + hw + 80; x2 += 7) {
        n.beginPath(); n.moveTo(x2, 58); n.lineTo(x2 + 70, 142); n.stroke();
        n.beginPath(); n.moveTo(x2, 58); n.lineTo(x2 - 70, 142); n.stroke();
      }
      for (let x2 = hx; x2 < hx + hw; x2 += 62) { n.fillStyle = '#7a7a86'; n.fillRect(x2, 54, 4, 90);
        n.fillStyle = '#9a9aa6'; n.fillRect(x2, 54, 4, 2);
        n.fillStyle = '#2a2a32'; n.fillRect(x2 - 5, 138, 14, 5); }
    } else {                                            // the gate: plant drives through here
      n.fillStyle = '#1c1826'; n.fillRect(hx, 58, hw, 84);
      for (let bx = hx + 8; bx < hx + hw; bx += 30) {   // the excavation seen through the gap
        const bh = 20 + R() * 40;
        n.fillStyle = '#2a2233'; n.fillRect(bx, 142 - bh, 26, bh);
      }
      n.fillStyle = '#7a7a86'; n.fillRect(hx, 50, 5, 94); n.fillRect(hx + hw - 5, 50, 5, 94);
      n.fillStyle = '#c8302a'; n.fillRect(hx + 10, 72, 46, 30);
      ptext(n, 'STOP', hx + 18, 82, '#f0e8e0', 1);
      n.fillStyle = '#e8c020'; n.fillRect(hx + hw - 70, 72, 58, 30);
      ptext(n, 'HARD', hx + hw - 64, 76, '#1a1a1e', 1);
      ptext(n, 'HATS', hx + hw - 64, 88, '#1a1a1e', 1);
    }
    hx += hw; hs++;
  }
  for (let x = 30; x < L.near.width; x += 400) {
    n.fillStyle = '#1e5a3a'; n.fillRect(x, 66, 150, 52);
    n.fillStyle = '#2a7a4a'; n.fillRect(x, 66, 150, 3);
    ptext(n, 'SYNDICATE', x + 14, 76, '#e8e8e0', 1);
    ptext(n, 'DEVELOPMENTS', x + 14, 88, '#e8b020', 1);
    ptext(n, 'NO ADMITTANCE', x + 14, 104, '#8ab8a0', 1);
  }
  // site huts stacked two high, a concrete pump, rebar cages, a skip
  let si = 0;
  for (let x = 170; x < L.near.width - 120; x += 260) {
    const kind = si % 4; si++;
    if (kind === 0) {                                  // stacked cabins
      for (let s = 0; s < 2; s++) {
        const cy = 142 - 34 - s * 32;
        n.fillStyle = '#16141c'; n.fillRect(x, cy, 118, 33);
        n.fillStyle = pick2(R, ['#8a9aa8', '#c8c0a8', '#6a8a7a']); n.fillRect(x + 2, cy + 2, 114, 29);
        for (let k = 0; k < 114; k += 8) { n.fillStyle = 'rgba(0,0,0,0.12)'; n.fillRect(x + 2 + k, cy + 2, 2, 29); }
        n.fillStyle = '#2a3a4a'; n.fillRect(x + 12, cy + 8, 22, 14); n.fillRect(x + 76, cy + 8, 22, 14);
        n.fillStyle = 'rgba(200,230,255,0.25)'; n.fillRect(x + 13, cy + 9, 20, 12);
        n.fillStyle = '#3a2418'; n.fillRect(x + 48, cy + 6, 16, 25);
      }
      n.fillStyle = '#4a4a54'; n.fillRect(x + 40, 130, 34, 4);        // the stair to the top one
      for (let k = 0; k < 4; k++) n.fillRect(x + 40, 116 + k * 5, 26, 3);
    } else if (kind === 1) {                           // concrete pump with its boom folded
      n.fillStyle = '#16141c'; n.fillRect(x, 106, 106, 36);
      n.fillStyle = '#c8501e'; n.fillRect(x + 2, 108, 102, 32);
      n.fillStyle = '#e06a2e'; n.fillRect(x + 2, 108, 102, 3);
      n.fillStyle = '#8a3414'; n.fillRect(x + 2, 128, 102, 12);
      n.fillStyle = '#2a2a32'; n.fillRect(x + 8, 116, 30, 18);            // the hopper
      n.fillStyle = '#3e3e48'; n.fillRect(x + 10, 118, 26, 5);
      for (let k = 0; k < 4; k++) { n.fillStyle = '#4a4a54'; n.fillRect(x + 46 + k * 13, 114, 9, 22); }  // outriggers
      n.fillStyle = '#e8c020'; n.fillRect(x + 44, 110, 56, 4);
      n.fillStyle = '#2a2a32'; n.fillRect(x + 20, 94, 64, 14);            // the turret
      n.fillStyle = '#3e3e48'; n.fillRect(x + 22, 96, 60, 4);
      n.strokeStyle = '#8a3414'; n.lineWidth = 8;                          // the boom, folded back
      n.beginPath(); n.moveTo(x + 52, 94); n.lineTo(x + 32, 62); n.lineTo(x + 100, 54); n.stroke();
      n.strokeStyle = '#c8501e'; n.lineWidth = 5; n.stroke();
      n.fillStyle = '#39414e'; n.fillRect(x + 96, 50, 10, 10);
      n.strokeStyle = '#2a2a32'; n.lineWidth = 3;                          // the delivery line down it
      n.beginPath(); n.moveTo(x + 100, 58); n.quadraticCurveTo(x + 120, 96, x + 112, 140); n.stroke();
      n.fillStyle = '#16141c'; n.beginPath(); n.arc(x + 22, 140, 8, 0, 7); n.arc(x + 82, 140, 8, 0, 7); n.fill();
      n.fillStyle = '#3a3a42'; n.beginPath(); n.arc(x + 22, 140, 3, 0, 7); n.arc(x + 82, 140, 3, 0, 7); n.fill();
    } else if (kind === 2) {                           // rebar cages and a bundle of bar
      for (let s = 0; s < 3; s++) {
        const cx = x + s * 34;
        n.strokeStyle = '#6a5a4a'; n.lineWidth = 1.5;
        for (let k = 0; k < 5; k++) { n.beginPath(); n.moveTo(cx + k * 6, 100); n.lineTo(cx + k * 6, 142); n.stroke(); }
        for (let k = 0; k < 4; k++) { n.beginPath(); n.moveTo(cx, 104 + k * 11); n.lineTo(cx + 24, 104 + k * 11); n.stroke(); }
      }
      n.fillStyle = '#5a4a3a'; n.fillRect(x - 10, 134, 110, 8);
      for (let k = 0; k < 110; k += 5) { n.fillStyle = '#7a6a56'; n.fillRect(x - 10 + k, 134, 2, 8); }
    } else {                                           // skip full of broken brick
      n.fillStyle = '#16141c'; n.fillRect(x, 112, 116, 30);
      n.fillStyle = '#c8a020'; n.fillRect(x + 2, 114, 112, 26);
      n.fillStyle = '#8a6a14'; n.fillRect(x + 2, 114, 112, 4);
      for (let k = 0; k < 40; k++) { n.fillStyle = pick2(R, ['#8a4a3a', '#6a3a2e', '#a8a09a', '#5a5a52']);
        n.fillRect(x + 6 + R() * 104, 106 + R() * 10, 5, 4); }
    }
  }
  // floodlight masts, the thing that lights a site at night
  for (let x = 90; x < L.near.width; x += 300) {
    n.fillStyle = '#16141c'; n.fillRect(x, 40, 4, 102); n.fillRect(x - 12, 36, 28, 5);
    n.fillStyle = '#fff8d0'; n.fillRect(x - 11, 41, 11, 3); n.fillRect(x + 4, 41, 10, 3);
    n.fillStyle = 'rgba(255,248,208,0.08)';
    n.beginPath(); n.moveTo(x - 11, 44); n.lineTo(x - 74, 240); n.lineTo(x + 78, 240); n.lineTo(x + 14, 44); n.fill();
  }
  siteDirt(n, L, R, r, 142, '#6a4a34', '#7a5a40', '#4a3424');
  // tracked plant has been over this all day: crawler prints, dropped bar,
  // boot-churned mud and the floodlights pooling on the wet patches
  for (let k = 0; k < L.near.width / 70; k++) {
    const tx = r(0, L.near.width), ty = r(152, 224);
    for (let s2 = 0; s2 < 8; s2++) { n.fillStyle = 'rgba(0,0,0,0.20)';
      n.fillRect(tx + s2 * 7, ty + s2 * 1.4, 5, 9); }
  }
  for (let k = 0; k < L.near.width / 90; k++) {
    n.fillStyle = pick2(R, ['#6a5a4a', '#7a6a56', '#5a4a3a']);
    n.save(); n.translate(r(0, L.near.width), r(150, 232)); n.rotate(R() * 3);
    n.fillRect(0, 0, 20 + R() * 26, 3); n.restore();
  }
  for (let k = 0; k < L.near.width / 130; k++) {
    n.fillStyle = pick2(R, ['#8a8a94', '#a8a096', '#6a6a72']);
    n.fillRect(r(0, L.near.width), r(154, 230), 7 + R() * 10, 5);
  }
  for (let x = 90; x < L.near.width; x += 300) {
    n.fillStyle = 'rgba(255,248,208,0.07)';
    n.beginPath(); n.ellipse(x + 2, 196, 96, 34, 0, 0, 7); n.fill();
  }
  // the excavation: the shaft hazard is a real hole with a ladder in it
  for (let x = 60; x < L.near.width; x += 230) {
    n.fillStyle = '#e8d020'; n.beginPath(); n.moveTo(x, 162); n.lineTo(x + 6, 146); n.lineTo(x + 12, 162); n.fill();
    n.fillStyle = '#1a1a1e'; n.fillRect(x + 5, 151, 2, 7); n.fillRect(x + 5, 159, 2, 2);
  }
  for (let x = 0; x < L.near.width; x += 14) { n.fillStyle = (Math.round(x / 14) % 2) ? '#e8b020' : '#1a1a1e'; n.fillRect(x, 232, 14, 4); }
}


// ============================================================ STAGE 3-B: the curtain wall
// ---- B4: THE CURTAIN WALL -------------------------------------------------
// The wildcard. The floor is being glazed: panels in, panels stacked, one bay
// still open to the sky, and the whole sunset doubled in the glass.
function glassBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  duskSky(f, L, R, r);
  cityBelow(f, L, R, r, 152);
  for (let x = 0; x < L.far.width; x += 84) { const h = 28 + R() * 54;
    f.fillStyle = '#2a2048'; f.fillRect(x, 152 - h, 38, h);
    for (let k = 0; k < 16; k++) if (R() < 0.3) { f.fillStyle = '#e8c060'; f.fillRect(x + 4 + R() * 30, 152 - h + 4 + R() * (h - 8), 3, 3); } }
  m.fillStyle = 'rgba(0,0,0,0)'; m.fillRect(0, 0, 1, 1);
  // near: the mullion grid, most bays glazed, some open, some with panels on a trolley
  const HEAD = 34, SILL = 142;
  n.fillStyle = '#39414e'; n.fillRect(0, HEAD - 10, L.near.width, 12);
  n.fillStyle = '#4e5a6a'; n.fillRect(0, HEAD - 10, L.near.width, 3);
  let x = 0, seq = 0;
  while (x < len - 320) {
    const bw = 76;
    const state = seq % 7 === 3 ? 'open' : (seq % 7 === 6 ? 'part' : 'glazed');
    if (state === 'glazed') {
      // the glass: the sky reflected, but shifted and cooler than the real one
      const g = n.createLinearGradient(0, HEAD, 0, SILL);
      g.addColorStop(0, '#2c2a58'); g.addColorStop(0.44, '#6a3a72'); g.addColorStop(0.78, '#c06a52'); g.addColorStop(1, '#e0a068');
      n.fillStyle = g; n.fillRect(x + 4, HEAD, bw - 8, SILL - HEAD);
      n.fillStyle = 'rgba(255,255,255,0.10)';                     // the sheen band
      n.beginPath(); n.moveTo(x + 4, SILL); n.lineTo(x + 30, HEAD); n.lineTo(x + 46, HEAD); n.lineTo(x + 20, SILL); n.fill();
      for (let k = 0; k < 16; k++) { n.fillStyle = 'rgba(242,208,112,0.45)';   // the city's lights, reflected
        n.fillRect(x + 8 + R() * (bw - 20), HEAD + 66 + R() * 42, 2, 2); }
      n.fillStyle = 'rgba(120,150,210,0.10)'; n.fillRect(x + 4, HEAD, bw - 8, SILL - HEAD);
      if (R() < 0.3) {                                            // a panel still carrying its protective film
        n.fillStyle = 'rgba(190,200,210,0.30)'; n.fillRect(x + 4, HEAD, bw - 8, SILL - HEAD);
        n.fillStyle = '#c8302a'; n.fillRect(x + 14, HEAD + 40, bw - 28, 8);
      }
    } else if (state === 'open') {
      n.fillStyle = 'rgba(0,0,0,0)'; n.clearRect(x + 4, HEAD, bw - 8, SILL - HEAD);
      n.fillStyle = '#c87a20'; n.fillRect(x + 4, SILL - 26, bw - 8, 4);       // the barrier across the hole
      n.fillRect(x + 4, SILL - 12, bw - 8, 4);
      for (let k = 0; k < bw - 8; k += 12) { n.fillStyle = '#1a1a1e'; n.fillRect(x + 4 + k, SILL - 26, 6, 4); n.fillRect(x + 4 + k, SILL - 12, 6, 4); }
      n.fillStyle = 'rgba(255,190,120,0.10)'; n.fillRect(x + 4, HEAD, bw - 8, SILL - HEAD - 26);
    } else {
      n.fillStyle = '#1c2029'; n.fillRect(x + 4, HEAD, bw - 8, SILL - HEAD);  // backing board, panel not yet on
      for (let k = 0; k < SILL - HEAD; k += 14) { n.fillStyle = '#262b36'; n.fillRect(x + 4, HEAD + k, bw - 8, 3); }
      n.fillStyle = '#39414e'; n.fillRect(x + 4, HEAD + 40, bw - 8, 5);
    }
    // the mullion itself, and the transom band across the middle
    n.fillStyle = '#39414e'; n.fillRect(x, HEAD - 4, 6, SILL - HEAD + 10);
    n.fillStyle = '#556172'; n.fillRect(x + 1, HEAD - 4, 2, SILL - HEAD + 10);
    n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(x + 4, HEAD - 4, 2, SILL - HEAD + 10);
    n.fillStyle = '#39414e'; n.fillRect(x, HEAD + 52, bw, 6);
    n.fillStyle = '#4e5a6a'; n.fillRect(x, HEAD + 52, bw, 2);
    x += bw; seq++;
  }
  // a stillage of glass waiting to go in, and a vacuum lifter
  for (let px_ = 120; px_ < len - 360; px_ += 380) {
    n.fillStyle = '#2a2e36'; n.fillRect(px_, 108, 90, 34);
    n.fillStyle = '#c8302a'; n.fillRect(px_, 104, 90, 5);
    for (let k = 0; k < 6; k++) { n.fillStyle = `rgba(150,190,200,${0.55 - k * 0.06})`;
      n.save(); n.translate(px_ + 10 + k * 5, 106); n.rotate(0.10); n.fillRect(0, -44, 4, 44); n.restore(); }
    n.fillStyle = '#39414e'; n.fillRect(px_ - 4, 140, 98, 4);
  }
  // the arena: the corner of the building, glazed on both faces
  const a0 = len - 320;
  n.fillStyle = '#39414e'; n.fillRect(a0, HEAD - 10, L.near.width - a0, 12);
  const g2 = n.createLinearGradient(0, HEAD, 0, SILL);
  g2.addColorStop(0, '#26244e'); g2.addColorStop(0.44, '#5e3468'); g2.addColorStop(0.8, '#b8604c'); g2.addColorStop(1, '#d89864');

// ============================================================ STAGE 4-B: the bridge run
// ---- B4: THE BRIDGE RUN ---------------------------------------------------
// The wildcard: the train is crossing a long girder bridge. The structure
// whips past on both sides, the river is a long way down, and the arena is the
// middle of the span where the steel opens out.
function bridgeBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  nightSky(f, L, R, r, '#04040f', '#121036', '#38224e');
  // far: the far bank and the water, a long way below
  f.fillStyle = '#0c0a1c'; f.fillRect(0, 108, L.far.width, 18);
  for (let x = 0; x < L.far.width; x += 30) { const h = 6 + R() * 18;
    f.fillStyle = '#141028'; f.fillRect(x, 108 - h, 26, h + 12);
    if (R() < 0.45) { f.fillStyle = '#c8a048'; f.fillRect(x + 6 + R() * 14, 112 - h, 2, 2); } }
  f.fillStyle = '#080a1c'; f.fillRect(0, 126, L.far.width, 114);
  for (let k = 0; k < L.far.width * 1.6; k++) {
    f.fillStyle = R() < 0.14 ? 'rgba(170,190,240,0.20)' : 'rgba(22,30,64,0.55)';
    f.fillRect(r(0, L.far.width), r(128, 238), 6 + R() * 12, 1);
  }
  for (let k = 0; k < 120; k++) { f.fillStyle = 'rgba(232,200,120,0.16)';      // the lights' reflection
    f.fillRect(r(0, L.far.width), r(130, 210), 3, 1); }
  // mid: the far truss of the bridge, and the piers going down into the water
  m.fillStyle = 'rgba(0,0,0,0)'; m.fillRect(0, 0, 1, 1);
  for (let x = 0; x < L.mid.width; x += 96) {
    m.fillStyle = '#1c1826'; m.fillRect(x, 46, 6, 104);
    m.strokeStyle = '#1c1826'; m.lineWidth = 4;
    m.beginPath(); m.moveTo(x + 3, 46); m.lineTo(x + 48, 96); m.lineTo(x + 96, 46); m.stroke();
    m.beginPath(); m.moveTo(x + 3, 96); m.lineTo(x + 48, 46); m.stroke();
  }
  m.fillStyle = '#1c1826'; m.fillRect(0, 40, L.mid.width, 8);
  m.fillStyle = '#272132'; m.fillRect(0, 40, L.mid.width, 2);
  L.speed = 1.5;
  // near: the deck you are on, and the near truss whipping past in front
  n.fillStyle = '#2f3641'; n.fillRect(0, 150, L.near.width, 90);
  for (let px_ = 0; px_ < L.near.width; px_ += 14) {                            // the deck: transverse timbers
    n.fillStyle = R() < 0.5 ? '#39414e' : '#333b47'; n.fillRect(px_, 150, 13, 90);
    n.fillStyle = 'rgba(0,0,0,0.28)'; n.fillRect(px_ + 13, 150, 2, 90);
  }
  n.fillStyle = '#242a34'; n.fillRect(0, 150, L.near.width, 4);
  for (const ry of [176, 214]) {                                                // the rails you are walking between
    n.fillStyle = '#8a8a96'; n.fillRect(0, ry, L.near.width, 4);
    n.fillStyle = '#c8c8d4'; n.fillRect(0, ry, L.near.width, 1.5);
    n.fillStyle = 'rgba(0,0,0,0.26)'; n.fillRect(0, ry + 4, L.near.width, 2);
  }
  // the near truss: verticals and diagonals in front of the fight, at speed
  // The near truss sits in front of the fight, so it is deliberately dark and
  // low-contrast - it reads as structure whipping past without competing with
  // the sprites for attention. The diagonals stop short of the walkable band.
  for (let x = 0; x < L.near.width; x += 96) {
    n.fillStyle = '#2a2028'; n.fillRect(x, 14, 10, 136);
    n.fillStyle = '#352a31'; n.fillRect(x + 1, 14, 3, 136);
    n.fillStyle = 'rgba(0,0,0,0.42)'; n.fillRect(x + 7, 14, 3, 136);
    n.strokeStyle = '#2a2028'; n.lineWidth = 6;
    n.beginPath(); n.moveTo(x + 5, 20); n.lineTo(x + 48, 82); n.lineTo(x + 96, 20); n.stroke();
    n.strokeStyle = '#231a21'; n.lineWidth = 4;
    n.beginPath(); n.moveTo(x + 5, 82); n.lineTo(x + 48, 20); n.stroke();
    for (let k = 0; k < 130; k += 18) { n.fillStyle = '#463945'; n.fillRect(x + 2, 20 + k, 2, 2); }
    n.fillStyle = '#20202a'; n.fillRect(x - 3, 146, 16, 5);                     // the shoe on the deck
  }
  n.fillStyle = '#2a2028'; n.fillRect(0, 8, L.near.width, 11);                  // the top chord, overhead
  n.fillStyle = '#382c35'; n.fillRect(0, 8, L.near.width, 3);
  for (let x = 0; x < L.near.width; x += 22) { n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(x, 19, 6, 4); }
  // the middle of the span: the steel opens out for the fight
  const a0 = len - 320;
  n.clearRect(a0 + 20, 8, 240, 142);
  n.fillStyle = '#2a2028'; n.fillRect(a0 + 20, 8, 240, 11);
  n.fillStyle = '#382c35'; n.fillRect(a0 + 20, 8, 240, 3);
  for (const px_ of [a0 + 20, a0 + 250]) {
    n.fillStyle = '#2a2028'; n.fillRect(px_, 14, 12, 136);
    n.fillStyle = '#352a31'; n.fillRect(px_ + 1, 14, 3, 136);
  }
  n.strokeStyle = '#2a2028'; n.lineWidth = 6;
  n.beginPath(); n.moveTo(a0 + 30, 22); n.lineTo(a0 + 136, 66); n.lineTo(a0 + 250, 22); n.stroke();
  n.fillStyle = '#c8302a'; n.fillRect(a0 + 110, 30, 58, 22);
  ptext(n, 'SPAN 7', a0 + 118, 37, '#f0e8e0', 1);
  n.fillStyle = '#2f3641'; n.fillRect(a0 + 20, 150, 240, 90);

    n.fillStyle = 'rgba(0,0,0,0.28)'; n.fillRect(px_ + 13, 150, 2, 90);
  }
  for (const ry of [176, 214]) {
    n.fillStyle = '#8a8a96'; n.fillRect(a0 + 20, ry, 240, 4);
    n.fillStyle = '#c8c8d4'; n.fillRect(a0 + 20, ry, 240, 1.5);
  }
}

// ------------------------------------------------------------ live overlay
// Steam drifting up off the locomotives in the shed.
function drawShedSteam(cx) {
  for (let i = 0; i < 8; i++) {
    const seed = i * 193;
    const life = (G.frames * 0.42 + seed) % 200;
    const x = ((seed * 31) % 1600) - (cx % 1600);
    if (x < -50 || x > W + 50) continue;
    const a = Math.max(0, 0.22 * (1 - life / 200));
    ctx.fillStyle = `rgba(226,226,236,${a})`;
    ctx.beginPath(); ctx.arc(x + Math.sin(life / 26) * 10, 150 - life * 0.62, 7 + life * 0.13, 0, 7); ctx.fill();
  }
}


// ============================================================ STAGE 5 helpers
function asphalt(n, L, R, r, top, a, b, c, opts = {}) {
  n.fillStyle = a; n.fillRect(0, top, L.near.width, 240 - top);
  for (let k = 0; k < L.near.width * 1.5; k++) { n.fillStyle = R() < 0.5 ? b : c;
    n.fillRect(r(0, L.near.width), r(top + 1, 240), 3, 1); }
  for (let k = 0; k < L.near.width / 170; k++) {                      // patched repairs
    n.fillStyle = 'rgba(0,0,0,0.20)'; n.fillRect(r(0, L.near.width), r(top + 4, 232), 34 + R() * 60, 9 + R() * 12); }
  for (const ty of [top + 26, top + 62]) for (let x = 0; x < L.near.width; x += 2) {
    if (R() < 0.5) { n.fillStyle = 'rgba(255,255,255,0.025)'; n.fillRect(x, ty, 2, 6); }
  }
  n.fillStyle = opts.edge || '#3a3a44'; n.fillRect(0, top, L.near.width, 2);
}
function laneMarks(n, L, ys, col = '#e8e4c8', dash = 28, gap = 26) {
  for (const ly of ys) for (let x = 0; x < L.near.width; x += dash + gap) { n.fillStyle = col; n.fillRect(x, ly, dash, 3); }
}
function guardrail(n, L, R, y, opts = {}) {
  n.fillStyle = opts.dark || '#3a3e48'; n.fillRect(0, y + 6, L.near.width, 4);
  n.fillStyle = '#8a8e9a'; n.fillRect(0, y, L.near.width, 7);
  n.fillStyle = '#c8ccd8'; n.fillRect(0, y, L.near.width, 2);
  n.fillStyle = 'rgba(0,0,0,0.28)'; n.fillRect(0, y + 5, L.near.width, 2);
  for (let x = 0; x < L.near.width; x += 34) {
    n.fillStyle = '#4a4e5a'; n.fillRect(x, y + 7, 5, 15);
    if (R() < 0.07) { n.fillStyle = '#6a6e7a'; n.fillRect(x - 6, y - 2, 20, 10); }   // a bent length
  }
  for (let x = 12; x < L.near.width; x += 68) { n.fillStyle = '#e8342a'; n.fillRect(x, y + 1, 3, 3); }  // reflectors
}

// lane markings that streak rather than sit still - drawn short and low
// contrast so they read as speed without fighting the sprites
function rideLanes(n, L, ys, col, dash = 22, gap = 34) {
  for (const ly of ys) for (let x = 0; x < L.near.width; x += dash + gap) {
    n.fillStyle = col; n.fillRect(x, ly, dash, 3);
    n.fillStyle = 'rgba(255,255,255,0.10)'; n.fillRect(x + dash, ly + 1, gap * 0.4, 1);
  }
}


// ============================================================ STAGE 5-A: the tunnel
// ---- A3: THE TUNNEL -------------------------------------------------------
function tunnelBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  f.fillStyle = '#07070a'; f.fillRect(0, 0, L.far.width, H);

  n.fillStyle = '#14161c'; n.fillRect(0, 0, L.near.width, 150);
  n.fillStyle = '#1c2029'; n.fillRect(0, 34, L.near.width, 8);

  for (let ty = 42; ty < 128; ty += 11) for (let tx = 0; tx < L.near.width; tx += 15) {

  for (let k = 0; k < L.near.width / 10; k++) { n.fillStyle = 'rgba(40,34,26,0.35)';   // grime up the tiles
    n.fillRect(r(0, L.near.width), r(96, 128), 12 + R() * 26, 6 + R() * 14); }
  n.fillStyle = '#2a2e36'; n.fillRect(0, 128, L.near.width, 8);
  n.fillStyle = '#3a404a'; n.fillRect(0, 128, L.near.width, 2);
  // the light ribbon, running the whole length just under the haunch
  n.fillStyle = '#1a1e26'; n.fillRect(0, 44, L.near.width, 9);
  for (let x = 0; x < L.near.width; x += 44) {
    const dead = R() < 0.08;
    n.fillStyle = dead ? '#3a3a40' : '#ffca6a'; n.fillRect(x + 3, 46, 36, 5);
    if (!dead) { n.fillStyle = 'rgba(255,202,106,0.10)'; n.fillRect(x - 6, 51, 56, 80); }
  }
  // ventilation fans and emergency niches let into the wall
  for (let x = 120; x < L.near.width; x += 300) {
    n.fillStyle = '#1a1e26'; n.fillRect(x, 56, 44, 44);
    n.fillStyle = '#242a34'; n.fillRect(x + 3, 59, 38, 38);
    n.fillStyle = '#12151b'; n.beginPath(); n.arc(x + 22, 78, 16, 0, 7); n.fill();
    for (let k = 0; k < 5; k++) { n.fillStyle = '#39414e'; n.save(); n.translate(x + 22, 78);
      n.rotate(k * 0.63); n.fillRect(-2, -15, 4, 30); n.restore(); }
    n.fillStyle = '#4a5260'; n.beginPath(); n.arc(x + 22, 78, 4, 0, 7); n.fill();
  }
  for (let x = 260; x < L.near.width; x += 300) {
    n.fillStyle = '#0e1016'; n.fillRect(x, 84, 30, 44);
    n.fillStyle = '#c8302a'; n.fillRect(x + 2, 86, 26, 14);
    ptext(n, 'SOS', x + 7, 89, '#f0e8e0', 1);
    n.fillStyle = '#2a2e36'; n.fillRect(x + 6, 104, 18, 22);
    n.fillStyle = '#e8c020'; n.fillRect(x + 9, 108, 12, 9);
  }
  // the service walkway along the wall, then the carriageway
  n.fillStyle = '#4a4e58'; n.fillRect(0, 136, L.near.width, 14);
  n.fillStyle = '#5a5f6a'; n.fillRect(0, 136, L.near.width, 3);

function heatWash(n, L, y0, y1, col = 'rgba(255,140,40,0.10)') {

function gantry(n, L, R, y, col = '#39414e', hi = '#4e5a6a') {
  n.fillStyle = col; n.fillRect(0, y, L.near.width, 12);

function pipeRun(n, L, R, ys, cool) {
  for (const py of ys) {

    n.fillStyle = cool ? '#4e5a6a' : '#5e3c30'; n.fillRect(0, py, L.near.width, 2);

      n.fillStyle = '#2a2e36'; n.fillRect(x, py - 8, 5, 8);
      n.strokeStyle = '#5a6270'; n.lineWidth = 2;

}
function plateFloor(n, L, R, r, top, a, b, c, diamond) {
  n.fillStyle = a; n.fillRect(0, top, L.near.width, 240 - top);
  for (let k = 0; k < L.near.width * 1.3; k++) { n.fillStyle = R() < 0.5 ? b : c;
    n.fillRect(r(0, L.near.width), r(top + 2, 240), 3, 1); }
  for (let x = 0; x < L.near.width; x += 46) { n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(x, top, 2, 240 - top); }
  for (let y = top + 22; y < 240; y += 24) { n.fillStyle = 'rgba(0,0,0,0.16)'; n.fillRect(0, y, L.near.width, 2); }
  if (diamond) for (let y = top + 6; y < 240; y += 10) for (let x = (Math.round(y / 10) % 2) * 6; x < L.near.width; x += 12) {
    n.fillStyle = 'rgba(255,255,255,0.045)'; n.fillRect(x, y, 5, 3);

  n.fillStyle = c; n.fillRect(0, top, L.near.width, 3);
}
// (the yard-ballast helper, needed by the torpedo option)
function ballast(n, L, R, r, base, a, b, c) {
  n.fillStyle = a; n.fillRect(0, base, L.near.width, 240 - base);
  for (let k = 0; k < L.near.width * 2.2; k++) { n.fillStyle = R() < 0.5 ? b : c;

}
function grating(n, L, top, h, a = '#2a3038', b = '#3e4650') {
  n.fillStyle = a; n.fillRect(0, top, L.near.width, h);

  for (let y = top; y < top + h; y += 16) { n.fillStyle = '#4e5a6a'; n.fillRect(0, y, L.near.width, 2); }
}
function moltenRun(n, L, R, r, x0, x1, y, h) {
  n.fillStyle = '#1a0e0a'; n.fillRect(x0, y - 3, x1 - x0, h + 6);

  n.fillStyle = g; n.fillRect(x0, y, x1 - x0, h);
  for (let k = 0; k < (x1 - x0) / 6; k++) { n.fillStyle = 'rgba(0,0,0,0.20)';

  n.fillStyle = 'rgba(255,150,40,0.16)'; n.fillRect(x0 - 16, y - 40, x1 - x0 + 32, h + 46);
}

  m.fillStyle = 'rgba(0,0,0,0)'; m.fillRect(0, 0, 1, 1);
  for (let x = 0; x < L.mid.width; x += 150) {                    // more torpedo cars, further off
    m.fillStyle = '#1e1a24'; m.beginPath(); m.ellipse(x + 62, 122, 62, 18, 0, 0, 7); m.fill();
    m.save(); m.shadowColor = '#ff8a20'; m.shadowBlur = 10; m.fillStyle = '#ffb040';
    m.fillRect(x + 118, 116, 8, 7); m.restore();
  }
  gantry(n, L, R, 18, '#2a2630', '#3e3846');
  pipeRun(n, L, R, [60], true);
  // the cars themselves: long cigars on bogies, glowing at the mouth
  let x = -40;
  while (x < len - 280) {
    const w2 = 250;
    n.fillStyle = '#161219'; n.beginPath(); n.ellipse(x + w2 / 2, 116, w2 / 2, 30, 0, 0, 7); n.fill();
    // Shade it hard as a cylinder: a bright band near the top, a broad mid tone,
    // then a deep shadow under the belly. A flat fill reads as a dark blob.
    const g = n.createLinearGradient(0, 89, 0, 143);
    g.addColorStop(0, '#6a6474'); g.addColorStop(0.14, '#5a5462');
    g.addColorStop(0.42, '#3e3946'); g.addColorStop(0.72, '#2a2530');
    g.addColorStop(1, '#171320');
    n.fillStyle = g; n.beginPath(); n.ellipse(x + w2 / 2, 116, w2 / 2 - 4, 27, 0, 0, 7); n.fill();
    // the binding rings, which curve with the barrel
    for (let k = 26; k < w2 - 26; k += 40) {
      const t3 = (k - w2 / 2) / (w2 / 2);
      const rh = 26 * Math.sqrt(Math.max(0, 1 - t3 * t3));
      n.fillStyle = 'rgba(0,0,0,0.26)'; n.fillRect(x + k, 116 - rh, 4, rh * 2);
      n.fillStyle = 'rgba(255,255,255,0.09)'; n.fillRect(x + k + 4, 116 - rh, 1.5, rh * 2);
    }
    n.fillStyle = 'rgba(255,255,255,0.16)';
    n.beginPath(); n.ellipse(x + w2 / 2, 100, w2 / 2 - 30, 5, 0, 0, 7); n.fill();
    n.fillStyle = 'rgba(0,0,0,0.30)';
    n.beginPath(); n.ellipse(x + w2 / 2, 138, w2 / 2 - 18, 6, 0, 0, 7); n.fill();
    // the charging mouth on top: a raised collar with the heat coming out of it
    n.fillStyle = '#14111a'; n.fillRect(x + w2 / 2 - 30, 82, 60, 14);
    n.fillStyle = '#2f2a38'; n.fillRect(x + w2 / 2 - 28, 84, 56, 10);
    n.fillStyle = '#413b4c'; n.fillRect(x + w2 / 2 - 28, 84, 56, 2);
    n.fillStyle = '#0d0a10'; n.fillRect(x + w2 / 2 - 22, 86, 44, 8);
    n.save(); n.shadowColor = '#ffb020'; n.shadowBlur = 16;
    n.fillStyle = '#ffd060'; n.fillRect(x + w2 / 2 - 20, 86, 40, 6);
    n.fillStyle = '#fff0b0'; n.fillRect(x + w2 / 2 - 14, 87, 28, 3); n.restore();
    n.fillStyle = 'rgba(255,176,32,0.16)'; n.fillRect(x + w2 / 2 - 50, 66, 100, 40);
    // the end spout, dribbling
    n.fillStyle = '#2a2430'; n.fillRect(x + w2 - 26, 106, 30, 16);
    n.save(); n.shadowColor = '#ff8a20'; n.shadowBlur = 10;
    n.fillStyle = '#ffb040'; n.fillRect(x + w2 - 2, 110, 8, 7); n.restore();
    // the bogies underneath
    for (const bx of [x + 40, x + w2 - 70]) {
      n.fillStyle = '#16141c'; n.fillRect(bx, 140, 40, 10);
      for (const wx of [bx + 8, bx + 30]) { n.fillStyle = '#26242c'; n.beginPath(); n.arc(wx, 152, 7, 0, 7); n.fill();
        n.fillStyle = '#3c3a46'; n.beginPath(); n.arc(wx, 152, 3, 0, 7); n.fill(); }
    }
    x += w2 + 18;
  }
  ballast(n, L, R, r, 148, '#2c2830', '#3a343e', '#201c26');
  railPair(n, L, R, 186, '#3a3028', '#8a8a96', '#c8c8d4');
  railPair(n, L, R, 220, '#3a3028', '#8a8a96', '#c8c8d4');
  for (let k = 0; k < 20; k++) { n.fillStyle = 'rgba(255,150,40,0.14)';
    n.beginPath(); n.ellipse(r(0, L.near.width), r(170, 232), 12 + R() * 18, 4, 0, 0, 7); n.fill(); }
  heatWash(n, L, 150, 240, 'rgba(255,140,40,0.09)');
  L.heat = 1;
}



// ============================================================ STAGE 7: the lab
// The lab under the works. Contract for every option in this file:
//   * nothing meaningful above y=34 - the HUD sits there
//   * the floor starts at y<=150 and NOTHING solid is painted in 150..230,
//     which is the band the fighters walk through
// The Vault carries a falling hazard, so all three C options need honest
// structure overhead; A and B carry trailing-cable hazards, so a cable run
// that has been torn open belongs somewhere in each of those.
const LAB_TOP = 148;                 // where every lab floor begins

// ---- surfaces ------------------------------------------------------------
// A glossy epoxy floor: flat colour, a bay grid, and a sheen that catches
// whatever is glowing above it. The sheen is what sells "clean room".
function epoxyFloor(n, L, R, r, top, base, seam, sheen) {
  const w = L.near.width;
  const g = n.createLinearGradient(0, top, 0, 240);
  g.addColorStop(0, sheen); g.addColorStop(0.35, base); g.addColorStop(1, base);
  n.fillStyle = g; n.fillRect(0, top, w, 240 - top);
  for (let x = 0; x < w; x += 58) { n.fillStyle = seam; n.fillRect(x, top, 1, 240 - top); }
  for (let y = top + 18; y < 240; y += 26) { n.fillStyle = seam; n.fillRect(0, y, w, 1); }
  for (let k = 0; k < w * 0.5; k++) {                      // scuffs, so it is not a flat wash
    n.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.07)';
    n.fillRect(r(0, w), r(top + 3, 240), 5 + R() * 14, 1);
  }
}
// A raised access floor instead: square panels with lifting slots.
function tileFloor(n, L, R, r, top, base, hi, lo, pitch = 34) {
  const w = L.near.width;
  n.fillStyle = base; n.fillRect(0, top, w, 240 - top);
  for (let y = top, row = 0; y < 240; y += pitch, row++) {
    for (let x = -((row % 2) * pitch / 2); x < w; x += pitch) {
      n.fillStyle = (row + Math.round(x / pitch)) % 2 ? hi : lo;
      n.fillRect(x + 1, y + 1, pitch - 2, pitch - 2);
      n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(x + pitch / 2 - 3, y + 3, 6, 1);
    }
  }
  n.fillStyle = 'rgba(0,0,0,0.18)'; n.fillRect(0, top, w, 2);
}
// A gasketed wall panel run - the modular sandwich panel every clean room is
// built out of. Vertical seams with a bright bead of sealant down each one.
function panelWall(g, x, y, w, h, R, col, hi, seam, pitch = 44) {
  g.fillStyle = col; g.fillRect(x, y, w, h);
  for (let px = x; px < x + w; px += pitch) {
    g.fillStyle = seam; g.fillRect(px, y, 2, h);
    g.fillStyle = hi; g.fillRect(px + 2, y, 1, h);
  }
  g.fillStyle = hi; g.fillRect(x, y, w, 2);                    // coving at the top
  g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x, y + h - 4, w, 4);
  for (let k = 0; k < w * 0.06; k++) {                          // grime along the skirting
    g.fillStyle = 'rgba(0,0,0,0.10)'; g.fillRect(x + R() * w, y + h - 12 - R() * 10, 8 + R() * 16, 2);
  }
}
// Yellow-and-black hazard banding.
function hazardBand(g, x, y, w, h, a = '#e8c040', b = '#181410') {
  g.fillStyle = b; g.fillRect(x, y, w, h);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.strokeStyle = a; g.lineWidth = 4;
  for (let k = -h; k < w + h; k += 10) { g.beginPath(); g.moveTo(x + k, y + h); g.lineTo(x + k + h, y); g.stroke(); }
  g.restore();
}
// A ceiling light strip with a real housing, repeated down the run.
function lightStrip(n, L, y, col, glow, period = 96, lit = 1) {
  const w = L.near.width;
  for (let x = 20; x < w; x += period) {
    n.fillStyle = '#2a3038'; n.fillRect(x, y, 66, 7);
    n.fillStyle = '#3a4450'; n.fillRect(x, y, 66, 2);
    const on = ((x / period) | 0) % 9 !== 7;                    // one tube in nine is dead
    n.fillStyle = on ? col : '#2e3440'; n.fillRect(x + 3, y + 4, 60, 4);
    if (on) {
      n.save(); n.shadowColor = col; n.shadowBlur = 10; n.fillStyle = col;
      n.fillRect(x + 3, y + 5, 60, 2); n.restore();
      const gr = n.createLinearGradient(0, y + 8, 0, y + 8 + 48 * lit);
      gr.addColorStop(0, glow); gr.addColorStop(1, 'rgba(0,0,0,0)');
      n.fillStyle = gr; n.fillRect(x - 14, y + 8, 94, 48 * lit);
    }
  }
}
// A cable tray - the hazard's alibi. Every so often a span has been torn open
// and the looms hang out of it.
function cableTray(n, L, R, y, col = '#39414e', torn = true) {
  const w = L.near.width;
  n.fillStyle = col; n.fillRect(0, y, w, 6);
  n.fillStyle = 'rgba(255,255,255,0.10)'; n.fillRect(0, y, w, 1);
  n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(0, y + 5, w, 2);
  for (let x = 0; x < w; x += 24) { n.fillStyle = '#20252c'; n.fillRect(x, y - 3, 3, 4); }
  const cols = ['#b03a3a', '#3a6ab0', '#c8b040', '#3a9a6a', '#8a8a96'];
  for (let x = 0; x < w; x += 3) {                              // the loom sitting in the tray
    n.fillStyle = cols[(x / 3 | 0) % 5]; n.fillRect(x, y - 3 + ((x / 3 | 0) % 3), 3, 2);
  }
  if (!torn) return;
  for (let x = 120; x < w; x += 340) {                          // a burst span, cables swinging
    n.fillStyle = '#12161c'; n.fillRect(x - 6, y - 5, 44, 12);
    for (let k = 0; k < 5; k++) {
      const c = cols[k % 5], hx = x + 2 + k * 8, drop = 16 + (k % 3) * 11;
      n.strokeStyle = c; n.lineWidth = 2;
      n.beginPath(); n.moveTo(hx, y + 4);
      n.quadraticCurveTo(hx + 4, y + drop * 0.7, hx - 3 + k, y + drop); n.stroke();
      n.fillStyle = '#e8e0b0'; n.fillRect(hx - 4 + k, y + drop, 2, 2);
    }
    n.fillStyle = 'rgba(180,220,255,0.10)'; n.fillRect(x - 12, y, 60, 34);
  }
}
// A pressure door with interlock lights: the punctuation of a corridor.
function bulkhead(g, x, y, w, h, R, col, hi, lit = '#5ad06a', label = '') {
  g.fillStyle = '#12161c'; g.fillRect(x - 5, y - 4, w + 10, h + 4);
  g.fillStyle = col; g.fillRect(x, y, w, h);
  g.fillStyle = hi; g.fillRect(x, y, w, 3); g.fillRect(x, y, 3, h);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x + w - 4, y, 4, h);
  g.fillStyle = '#12161c'; g.fillRect(x + w / 2 - 1, y, 2, h);  // the split
  g.strokeStyle = hi; g.lineWidth = 2;
  g.beginPath(); g.arc(x + w / 2, y + h * 0.42, Math.min(w, h) * 0.26, 0, 7); g.stroke();
  hazardBand(g, x, y + h - 9, w, 9);
  g.save(); g.shadowColor = lit; g.shadowBlur = 7;
  g.fillStyle = lit; g.fillRect(x + 6, y + 7, 5, 5); g.fillRect(x + w - 11, y + 7, 5, 5);
  g.restore();
  if (label) ptext(g, label, x + w / 2 - tw(label) / 2, y + 16, 'rgba(210,230,245,0.65)');
}
// A window into the next room, with whatever is behind it already drawn.
function viewPane(g, x, y, w, h, tint, frame = '#2a323c') {
  g.fillStyle = frame; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.fillStyle = tint; g.fillRect(x, y, w, h);
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + w * 0.45, y); g.lineTo(x + w * 0.62, y); g.lineTo(x + w * 0.16, y + h); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.16)'; g.fillRect(x, y, w, 1);
}
// A tall tank of fluid with something suspended in it.
function tank(g, x, y, w, h, R, fluid, glow, opts = {}) {
  g.fillStyle = '#1a2028'; g.fillRect(x - 4, y - 6, w + 8, 8);       // top collar
  g.fillStyle = '#242c36'; g.fillRect(x - 5, y + h, w + 10, 10);     // base
  g.fillStyle = '#323c48'; g.fillRect(x - 5, y + h, w + 10, 2);
  const gr = g.createLinearGradient(x, y, x, y + h);
  gr.addColorStop(0, glow); gr.addColorStop(0.5, fluid); gr.addColorStop(1, '#0b1410');
  g.fillStyle = gr; g.fillRect(x, y, w, h);
  if (opts.body !== false) {                                          // the silhouette inside
    const cx = x + w / 2, cy = y + h * 0.5;
    g.fillStyle = 'rgba(8,16,14,0.62)';
    g.beginPath(); g.ellipse(cx, cy - h * 0.17, w * 0.17, h * 0.075, 0, 0, 7); g.fill();
    g.fillRect(cx - w * 0.17, cy - h * 0.10, w * 0.34, h * 0.26);
    g.beginPath(); g.moveTo(cx - w * 0.17, cy + h * 0.16); g.lineTo(cx - w * 0.09, cy + h * 0.34);
    g.lineTo(cx + w * 0.09, cy + h * 0.34); g.lineTo(cx + w * 0.17, cy + h * 0.16); g.fill();
    g.fillRect(cx - w * 0.30, cy - h * 0.07, w * 0.13, h * 0.24);
    g.fillRect(cx + w * 0.17, cy - h * 0.07, w * 0.13, h * 0.24);
  }
  for (let k = 0; k < h * 0.5; k++) {                                 // bubbles caught in the glass
    g.fillStyle = 'rgba(220,255,240,0.18)';
    g.fillRect(x + 2 + R() * (w - 4), y + 4 + R() * (h - 8), 1, 1 + (R() < 0.3 ? 1 : 0));
  }
  g.fillStyle = 'rgba(255,255,255,0.13)'; g.fillRect(x + 4, y + 4, 4, h - 10);   // glass highlight
  g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(x + w - 8, y + 6, 2, h - 14);
  g.strokeStyle = '#2e3a44'; g.lineWidth = 2;
  for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(x - 4, y + h * k / 4); g.lineTo(x + w + 4, y + h * k / 4); g.stroke(); }
  g.save(); g.shadowColor = glow; g.shadowBlur = 14; g.fillStyle = glow;
  g.fillRect(x + 2, y + h - 6, w - 4, 3); g.restore();
  if (opts.label) ptext(g, opts.label, x + w / 2 - tw(opts.label) / 2, y + h + 2, 'rgba(200,230,215,0.55)');
}
// A rack of blinking gear. Deterministic LEDs so a still frame still reads.
function rack(g, x, y, w, h, R, col = '#1a1e26', led = '#5ad06a') {
  g.fillStyle = '#10141a'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = col; g.fillRect(x, y, w, h);
  for (let ry = y + 3; ry < y + h - 4; ry += 7) {
    g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(x + 2, ry, w - 4, 5);
    g.fillStyle = 'rgba(0,0,0,0.40)'; g.fillRect(x + 2, ry + 5, w - 4, 1);
    for (let k = 0; k < 4; k++) {
      const on = ((ry * 7 + k * 13 + Math.round(x)) % 5) < 3;
      g.fillStyle = on ? (k === 3 ? '#e8a030' : led) : 'rgba(255,255,255,0.08)';
      g.fillRect(x + 4 + k * 4, ry + 2, 2, 2);
    }
  }
  g.save(); g.shadowColor = led; g.shadowBlur = 9; g.fillStyle = led;
  g.fillRect(x + 3, y + 3, 2, 2); g.restore();
}
// Overhead structure: a coffered slab with services hung under it. Reads as
// weight above the fight without stealing contrast from the sprites.
function ceilingSlab(n, L, y, d, col, hi, shade) {
  const w = L.near.width;
  n.fillStyle = col; n.fillRect(0, y, w, d);
  n.fillStyle = hi; n.fillRect(0, y, w, 2);
  n.fillStyle = shade; n.fillRect(0, y + d - 3, w, 3);
  for (let x = 0; x < w; x += 72) { n.fillStyle = shade; n.fillRect(x, y, 5, d); }
  for (let x = 30; x < w; x += 72) { n.fillStyle = 'rgba(0,0,0,0.25)'; n.fillRect(x, y + 3, 28, d - 8); }
}
// Insulated duct running the length of a ceiling.
function ductRun(n, L, y, h, col, hi) {
  const w = L.near.width;
  n.fillStyle = col; n.fillRect(0, y, w, h);
  n.fillStyle = hi; n.fillRect(0, y, w, 2);
  n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(0, y + h - 3, w, 3);
  for (let x = 0; x < w; x += 56) {
    n.fillStyle = hi; n.fillRect(x, y - 2, 4, h + 4);
    n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(x + 4, y, 2, h);
  }
}
// A soft pool of light thrown onto the floor by something above it.
function floorGlow(n, L, x, top, w, col) {
  const g = n.createLinearGradient(0, top, 0, 240);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  n.save(); n.globalCompositeOperation = 'lighter'; n.fillStyle = g;
  n.beginPath(); n.moveTo(x - w * 0.3, top); n.lineTo(x + w * 0.3, top);
  n.lineTo(x + w * 0.62, 240); n.lineTo(x - w * 0.62, 240); n.fill();
  n.restore();
}
// Stencilled floor marking - a walkway lane or a keep-clear box. Paint only,
// so it never reads as something you would trip over.
function floorMark(n, x, y, w, h, col, label) {
  n.strokeStyle = col; n.lineWidth = 2; n.strokeRect(x, y, w, h);
  if (label) ptext(n, label, x + 6, y + 5, col);
}


// ---- 7-A: CLEAN CORRIDOR -------------------------------------------------
function corridorBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  // far: the corridor carrying on, blown out and out of focus
  const sky = f.createLinearGradient(0, 34, 0, 150);
  sky.addColorStop(0, '#e6eef3'); sky.addColorStop(1, '#a8b8c2');
  f.fillStyle = sky; f.fillRect(0, 0, L.far.width, H);
  for (let x = 0; x < L.far.width; x += 128) {
    f.fillStyle = 'rgba(150,170,182,0.35)'; f.fillRect(x, 48, 40, 100);
    f.fillStyle = 'rgba(255,255,255,0.40)'; f.fillRect(x + 44, 40, 70, 8);
  }
  // mid: rooms on the far side of the glass, each a different colour of work
  const tints = ['#9fd8c0', '#a8c4de', '#cdd6a8', '#c6a8cc'];
  m.fillStyle = '#6d7e8a'; m.fillRect(0, 34, L.mid.width, 114);
  for (let x = 0; x < L.mid.width; x += 176) {
    const t = tints[(x / 176 | 0) % 4];
    m.fillStyle = t; m.fillRect(x + 6, 40, 156, 108);
    m.fillStyle = 'rgba(255,255,255,0.50)'; m.fillRect(x + 14, 46, 140, 5);    // the room's own light strip
    m.fillStyle = 'rgba(0,0,0,0.26)';
    for (let k = 0; k < 4; k++) m.fillRect(x + 18 + k * 36, 96 + (k % 2) * 8, 26, 52);   // benches
    m.fillStyle = 'rgba(0,0,0,0.38)';
    for (let k = 0; k < 3; k++) m.fillRect(x + 26 + k * 46, 66 + (k % 2) * 7, 16, 26);   // gear on them
    m.fillStyle = 'rgba(255,255,255,0.22)'; m.fillRect(x + 6, 40, 156, 2);
    m.fillStyle = 'rgba(0,0,0,0.28)'; m.fillRect(x + 162, 40, 14, 108);        // the wall between rooms
  }
  // near: the near wall with glazed bays, the ceiling services, the floor
  ceilingSlab(n, L, 34, 15, '#c2ccd4', '#e2ebf0', '#93a0aa');
  ductRun(n, L, 49, 11, '#b3bec7', '#d8e2e9');
  lightStrip(n, L, 62, '#f4fcff', 'rgba(228,244,255,0.26)', 108);
  cableTray(n, L, R, 92, '#8e9ba6', true);
  const W2 = L.near.width;
  for (let x = 0; x < W2; x += 176) {                            // glazed bays through to the labs
    n.fillStyle = '#b4c0c9'; n.fillRect(x, 60, 176, 6);           // the transom over the glass
    n.fillStyle = '#dbe5ec'; n.fillRect(x, 60, 176, 2);
    n.fillStyle = '#aeb9c2'; n.fillRect(x + 8, 66, 152, 3);       // the glazing frame
    n.fillStyle = '#aeb9c2'; n.fillRect(x + 8, 66, 4, 62);
    n.fillStyle = '#aeb9c2'; n.fillRect(x + 156, 66, 4, 62);
    n.fillStyle = '#aeb9c2'; n.fillRect(x + 80, 66, 3, 62);       // the mullion
    n.fillStyle = 'rgba(255,255,255,0.09)';                        // one soft reflection, not a slab
    n.beginPath(); n.moveTo(x + 12, 128); n.lineTo(x + 56, 69); n.lineTo(x + 68, 69); n.lineTo(x + 24, 128); n.fill();
    n.fillStyle = 'rgba(255,255,255,0.20)'; n.fillRect(x + 12, 66, 144, 1);
    panelWall(n, x, 128, 176, 20, R, '#d4dee5', '#eef5fa', '#aab6c0', 46);   // the dado under the glass
    n.fillStyle = '#9aa6b0'; n.fillRect(x + 160, 56, 16, 92);      // the pier between bays
    n.fillStyle = '#c4ced6'; n.fillRect(x + 160, 56, 5, 92);
