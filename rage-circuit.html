// ------------------------------------------------------------ live overlays
// A lab is never quite still: the tubes hum and the brightness breathes. Kept
// far under the level that would read as a flash, and off entirely for anyone
// who has turned flashing lights off.
function drawLabHum() {
  if (!SAVE.options.flashing) return;
  const k = 0.012 + Math.abs(Math.sin(G.frames / 96)) * 0.012;
  ctx.fillStyle = `rgba(210,230,245,${k})`;
  ctx.fillRect(0, 34, W, 116);
}
// Cryogenic vapour is heavier than air, so it rolls along the floor rather
// than rising. Drawn over the fighters' feet, which is where it belongs.
function drawCryoFog(cx) {
  for (let i = 0; i < 16; i++) {
    const seed = i * 149;
    const x = ((seed * 37 + G.frames * (0.28 + (i % 4) * 0.16)) % (W + 220)) - 110;
    const y = 192 + ((seed % 40)) + Math.sin(G.frames / 70 + i) * 4;
    ctx.fillStyle = `rgba(214,240,255,${0.030 + (i % 3) * 0.014})`;
    ctx.beginPath(); ctx.ellipse(x, y, 40 + (i % 5) * 26, 7 + (i % 3) * 5, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(190,225,255,0.030)'; ctx.fillRect(0, 34, W, 206);
}
// Bubbles rising inside the capsules. The pitch is the capsule spacing of the
// birthing floor, so the columns line up with the glass rather than drifting
// across it.
function drawCapsuleBubbles(cx) {
  const pitch = 96;
  const first = Math.floor(cx / pitch) - 1;
  for (let i = first; i < first + Math.ceil(W / pitch) + 2; i++) {
    const bx = i * pitch - cx;
    if (bx < -pitch || bx > W + pitch) continue;
    for (let k = 0; k < 5; k++) {
      const seed = i * 53 + k * 29;
      const life = (G.frames * (0.5 + (seed % 4) * 0.18) + seed * 7) % 62;
      const y = 142 - life;
      if (y < 86) continue;
      ctx.fillStyle = `rgba(226,236,255,${0.09 + (1 - life / 62) * 0.20})`;
      ctx.fillRect(bx + 26 + (seed % 38) + Math.sin(life / 7 + k) * 2, y, 2, 2);
    }
  }
}

// ============================================================ STAGE 8: the tower
// Eighty floors up. Same contract as the lab: nothing meaningful above y=34
// (the HUD), and nothing solid painted in 150..230 (the walkable band), which
// leaves y 34..148 to carry the whole stage.
const FLOOR8 = 148;                  // interior floors
const DECK8  = 146;                  // roof decks
const A8_PIT = 960;                  // where the atrium's pit hazard stands

// The city seen through a window from inside: flat, dim, glass in front of it.
function cityPlate(g, x, y, w, h, R, r, dark = '#0b0a18') {
  g.fillStyle = dark; g.fillRect(x, y, w, h);
  for (let bx = x; bx < x + w; bx += 11) {
    const bh = 8 + ((bx * 13) % 26);
    g.fillStyle = ((bx / 11) | 0) % 2 ? '#171426' : '#12101f';
    g.fillRect(bx, y + h - bh, 10, bh);
  }
  for (let k = 0; k < w * h * 0.010; k++) {
    g.fillStyle = R() < 0.6 ? 'rgba(226,190,96,0.75)' : 'rgba(112,168,232,0.70)';
    g.fillRect(r(x + 1, x + w - 1), r(y + h * 0.35, y + h - 1), 1, 1);
  }
  for (let k = 0; k < 3; k++) {
    g.fillStyle = 'rgba(232,58,58,0.8)'; g.fillRect(r(x, x + w), r(y + 2, y + h * 0.4), 1, 2);
  }
}
// A curtain wall: mullions, transoms, and glass that reflects the room as much
// as it shows the outside.
function curtainWall(n, L, x, w, y, h, R, r, opts = {}) {
  const bay = opts.bay || 64, frame = opts.frame || '#2a2740', hi = opts.hi || '#454065';
  const tran = opts.transom !== false;
  n.save(); n.beginPath(); n.rect(x, y, w, h); n.clip();
  for (let bx = x; bx < x + w; bx += bay) {
    const bw = Math.min(bay - 7, x + w - bx - 7);
    if (bw < 6) break;
    cityPlate(n, bx, y, bw, h, R, r, opts.dark);
    n.fillStyle = 'rgba(150,190,255,0.055)'; n.fillRect(bx, y, bw, h);
    n.fillStyle = 'rgba(190,220,255,0.07)';
    n.beginPath(); n.moveTo(bx, y + h); n.lineTo(bx + bw * 0.5, y);
    n.lineTo(bx + bw * 0.78, y); n.lineTo(bx + bw * 0.2, y + h); n.fill();
    n.fillStyle = frame; n.fillRect(bx + bw, y, 7, h);
    n.fillStyle = hi; n.fillRect(bx + bw, y, 2, h);
    if (tran) { n.fillStyle = frame; n.fillRect(bx, y + Math.round(h * 0.38), bw, 3); }
  }
  n.restore();
  n.fillStyle = frame; n.fillRect(x, y - 4, w, 5);
  n.fillStyle = hi; n.fillRect(x, y - 4, w, 2);
  n.fillStyle = frame; n.fillRect(x, y + h - 2, w, 5);
}
// Polished stone: big slabs, veining, and a reflection of whatever is lit above.
function stoneFloor(n, L, R, r, top, base, vein, sheen, slab = 62) {
  const w = L.near.width;
  const g = n.createLinearGradient(0, top, 0, 240);
  g.addColorStop(0, sheen); g.addColorStop(0.4, base); g.addColorStop(1, base);
  n.fillStyle = g; n.fillRect(0, top, w, 240 - top);
  for (let x = 0; x < w; x += slab) { n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(x, top, 1, 240 - top); }
  for (let y = top + 20; y < 240; y += 28) { n.fillStyle = 'rgba(0,0,0,0.18)'; n.fillRect(0, y, w, 1); }
  for (let k = 0; k < w * 0.30; k++) {
    const vx = r(0, w), vy = r(top + 2, 238);
    n.strokeStyle = vein; n.lineWidth = 1;
    n.beginPath(); n.moveTo(vx, vy);
    n.quadraticCurveTo(vx + r(-14, 14), vy + r(-5, 5), vx + r(-26, 26), vy + r(-8, 8)); n.stroke();
  }
  n.fillStyle = 'rgba(255,255,255,0.05)'; n.fillRect(0, top, w, 2);
}
// A roof deck of concrete pavers on pedestals, with the joints open.
function deckFloor(n, L, R, r, top, base, hi, seam, pitch = 40) {
  const w = L.near.width;
  n.fillStyle = base; n.fillRect(0, top, w, 240 - top);
  for (let y = top, row = 0; y < 240; y += pitch, row++) {
    for (let x = -((row % 2) * 12); x < w; x += pitch) {
      n.fillStyle = (row + Math.round(x / pitch)) % 3 ? base : hi;
      n.fillRect(x + 1, y + 1, pitch - 2, pitch - 2);
      n.fillStyle = seam; n.fillRect(x, y, 1, pitch); n.fillRect(x, y, pitch, 1);
    }
  }
  for (let k = 0; k < w * 0.8; k++) {
    n.fillStyle = R() < 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.10)';
    n.fillRect(r(0, w), r(top, 240), 3 + R() * 9, 1);
  }
  n.fillStyle = hi; n.fillRect(0, top, w, 2);
}
// A void through the floor plate - the pit's alibi. Painted ABOVE the walkable
// band only: the edge nosing at `top`, then darkness the pit prop stands in.
function floorVoid(n, x, top, w, R, r, deep = '#07060e') {
  n.fillStyle = deep; n.fillRect(x, top - 26, w, 26);
  for (let d = 0; d < 3; d++) {
    n.fillStyle = `rgba(90,110,160,${0.08 - d * 0.02})`;
    n.fillRect(x + 4 + d * 3, top - 22 + d * 7, w - 8 - d * 6, 2);
  }
  for (let k = 0; k < w * 0.2; k++) {
    n.fillStyle = 'rgba(226,190,96,0.35)'; n.fillRect(r(x + 3, x + w - 3), r(top - 24, top - 3), 1, 1);
  }
  n.fillStyle = '#3a3552'; n.fillRect(x - 3, top - 4, w + 6, 4);
  n.fillStyle = '#585070'; n.fillRect(x - 3, top - 4, w + 6, 1);
  hazardBand(n, x - 3, top - 10, w + 6, 6);
}
// A handrail with balusters: an edge you can see over.
function railing(g, x, y, w, col = '#4a4660', hi = '#6a6688', pitch = 22) {
  g.fillStyle = col; g.fillRect(x, y, w, 3);
  g.fillStyle = hi; g.fillRect(x, y, w, 1);
  g.fillStyle = col; g.fillRect(x, y + 13, w, 2);
  for (let px = x; px < x + w; px += pitch) { g.fillStyle = col; g.fillRect(px, y, 2, 24); }
  g.fillStyle = 'rgba(160,200,255,0.035)'; g.fillRect(x, y + 3, w, 21);
}
// A rooftop plant box: chiller, cooling tower, riser cluster.
function plantBox(g, x, y, w, h, R, r, col = '#1e1c26', hi = '#33303e') {

// A lattice mast with its aircraft beacon.
function mast(g, x, top, bot, col = '#16121e', beacon = '#ff3a3a', wide = 10) {
  g.fillStyle = col; g.fillRect(x - 1, top, 3, bot - top); g.fillRect(x + wide - 1, top, 3, bot - top);
  for (let y = top + 6; y < bot; y += 13) {

}
// The pad marking: a circle and an H, painted flat so nobody trips on it.
function padMark(n, cx, cy, rad, col = '#e8e8f0', lw = 5) {
  n.strokeStyle = col; n.lineWidth = lw;

}
// Perimeter lights along a roof edge, with their falloff.

    n.fillStyle = 'rgba(170,210,255,0.08)'; n.fillRect(cx - 58, 62, 116, 50);

    n.beginPath(); n.moveTo(cx - 58, 112); n.lineTo(cx - 14, 62); n.lineTo(cx + 2, 62); n.lineTo(cx - 42, 112); n.fill();

// The contents of one vitrine: a little piece of a place you have been.
function modelCity(g, cx, y, w, h, kind, R, r) {
  const base = y + h - 6;
  g.fillStyle = '#15121e'; g.fillRect(cx - w / 2 + 3, base, w - 6, 6);
  if (kind === 'el') {                                   // stage 1 - under the el
    for (let x = cx - w / 2 + 6; x < cx + w / 2 - 6; x += 9) {
      const bh = 10 + ((x * 7) % 18);
      g.fillStyle = '#3a3450'; g.fillRect(x, base - bh, 8, bh);
      for (let k = 0; k < 3; k++) { g.fillStyle = 'rgba(242,201,76,0.6)'; g.fillRect(x + 2 + (k % 2) * 4, base - bh + 3 + k * 5, 1, 1); }
    }
    g.fillStyle = '#5a4e30'; g.fillRect(cx - w / 2 + 4, base - 24, w - 8, 3);
    for (let x = cx - w / 2 + 8; x < cx + w / 2 - 6; x += 16) g.fillRect(x, base - 21, 3, 21);
  } else if (kind === 'neon') {                          // stage 2 - the strip
    for (let x = cx - w / 2 + 6; x < cx + w / 2 - 6; x += 11) {
      const bh = 12 + ((x * 11) % 22);
      g.fillStyle = '#332c48'; g.fillRect(x, base - bh, 10, bh);
      g.fillStyle = ['#e8283a', '#4ac0e8', '#c86aff'][((x / 11) | 0) % 3];
      g.fillRect(x + 1, base - bh + 3, 8, 2); g.fillRect(x + 3, base - bh + 8, 2, 6);
    }
  } else if (kind === 'frame') {                         // stage 3 - the tower site
    for (let k = 0; k < 6; k++) { g.fillStyle = '#5a5060'; g.fillRect(cx - 22 + k * 9, base - 34, 3, 34); }
    for (let k = 0; k < 5; k++) { g.fillStyle = '#4a4250'; g.fillRect(cx - 24, base - 32 + k * 7, 50, 2); }
    g.fillStyle = '#e8a030'; g.fillRect(cx + 26, base - 42, 3, 42);
    g.fillStyle = '#e8a030'; g.fillRect(cx - 4, base - 42, 34, 2);
  } else if (kind === 'yard') {                          // stage 4 - the rail yard
    for (let k = 0; k < 4; k++) { g.fillStyle = '#2e2a3a'; g.fillRect(cx - w / 2 + 6, base - 6 - k * 7, w - 12, 2); }
    for (let x = cx - 30; x < cx + 26; x += 14) { g.fillStyle = '#4a4258'; g.fillRect(x, base - 20, 12, 8); }
    g.fillStyle = '#8a3030'; g.fillRect(cx - 34, base - 21, 18, 9);
  } else if (kind === 'road') {                          // stage 5 - the interchange
    g.strokeStyle = '#4a4458'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(cx - w / 2 + 4, base - 8); g.quadraticCurveTo(cx, base - 34, cx + w / 2 - 4, base - 12); g.stroke();

// ------------------------------------------------------------ glyph text
const PAD_GLYPH = { X: '#3a7ae8', Y: '#e8c020', A: '#3ab84a', B: '#e8283a' };
function keyLabel(code) { return code.replace('Key', '').replace('Arrow', '').replace('Digit', '').replace('Enter', 'ENT').slice(0, 5); }
function glyphFor(tok) {
  const map = { X: 'attack', Y: 'back', A: 'jump', B: 'special', LB: 'pick', RB: 'ally' };
  const act = map[tok];
  if (Input.lastDevice === 'pad') {
    const idx = Input.padMap()[act];
    return { pad: true, label: PAD_NAMES[idx] || tok };
  }
  return { pad: false, label: keyLabel(Input.keyMap()[act]) };
}
// draws text with {X} {Y} {A} {B} {LB} {RB} button glyphs
function gtext(str, x, y, col = '#fff') {
  const parts = str.split(/(\{[A-Z]+\})/);
  let cx = x;
  for (const part of parts) {
    if (!part) continue;
    const m = part.match(/^\{([A-Z]+)\}$/);
    if (m) {
      const g = glyphFor(m[1]);
      const w = textWidth(g.label) + 4;
      const c = g.pad ? (PAD_GLYPH[g.label] || '#6a6a88') : '#4a4a66';
      ctx.fillStyle = '#120a14'; ctx.fillRect(cx - 1, y - 2, w + 2, 11);
      ctx.fillStyle = c;
      if (g.pad && g.label.length === 1) { ctx.beginPath(); ctx.arc(cx + w / 2, y + 3.5, 5, 0, 7); ctx.fill(); }
      else ctx.fillRect(cx, y - 1, w, 9);
      text(g.label, cx + 2, y, '#fff', 1, 0, null);
      cx += w + 3;
    } else { text(part, cx, y, col); cx += textWidth(part.toUpperCase()) + 6; }
  }
}

function fighterUnlocked(r) {
  if (!r.hidden) return true;
  return SAVE.unlocks[r.id] || SESSION.unlocked[r.id] || CHEAT.unlockall;
}
function setupFighters() { return ROSTER.filter(fighterUnlocked); }
function partnerOpts() { return [null].concat(ROSTER.filter(r => r.live && fighterUnlocked(r)).map(r => r.id)); }
function stagesAvail() {
  const n = CHEAT.allstages ? 8 : Math.min(8, SAVE.reached);
  return STAGES.slice(0, Math.max(1, n));
}
function updateSetup() {
  Music.play('menu');
  if (!S.init) {
    S.init = true;
    S.stage = 0; S.fighter = 0; S.partner = S.partner || 0; S.cmd = S.cmd || 0;
    S.diff = S.diff === undefined ? 1 : S.diff; S.classic = S.classic || 0;
    S.codeBuf = [];
  }
  // code entry: hold LB + RB
  const coding = Input.held.pick && Input.held.ally;
  if (coding) {
    for (const a of ['left', 'right', 'up', 'down', 'attack', 'back', 'special', 'jump']) {
      if (Input.pressed[a]) {
        S.codeBuf.push(a); if (S.codeBuf.length > 10) S.codeBuf.shift();
        for (const r of ROSTER) if (r.code) {
          const c = r.code, tail = S.codeBuf.slice(-c.length);
          if (tail.length === c.length && tail.every((v, i) => v === c[i])) {
            SESSION.unlocked[r.id] = true; sfx('levelup');
            S.msg = r.name + ' UNLOCKED FOR THIS SESSION'; S.msgT = 180; S.codeBuf = [];
          }
        }
      }
    }
    return;
  } else S.codeBuf = [];
  const rows = S.rush ? ['fighter', 'partner', 'cmd', 'diff', 'start'] : ['stage', 'fighter', 'partner', 'cmd', 'diff', 'rules', 'start'];
  const v = navV();
  if (v) {
    do { S.cur = (S.cur + v + rows.length) % rows.length; } while (rows[S.cur] === 'cmd' && !S.partner);
    sfx('move');
  }
  const h = v ? 0 : navH();
  const row = rows[S.cur];
  if (h) {
    sfx('move');
    if (row === 'stage') S.stage = (S.stage + h + stagesAvail().length) % stagesAvail().length;
    if (row === 'fighter') S.fighter = (S.fighter + h + setupFighters().length) % setupFighters().length;
    if (row === 'partner') S.partner = (S.partner + h + partnerOpts().length) % partnerOpts().length;
    if (row === 'cmd') S.cmd = (S.cmd + h + 3) % 3;
    if (row === 'diff') S.diff = (S.diff + h + 4) % 4;
    if (row === 'rules') S.classic = S.classic ? 0 : 1;
  }
  if (Input.pressed.cancel) { sfx('back'); go('title', { menu: true }); return; }
  if (Input.pressed.confirm || Input.pressed.start) {
    if (row !== 'start' && !Input.pressed.start) { S.cur = rows.length - 1; sfx('move'); return; }
    const st = stagesAvail()[S.stage], fr = setupFighters()[S.fighter];
    if (!S.rush && !st.live) { sfx('err'); S.msg = 'STAGE ' + st.n + ' IS NOT IN THIS BUILD YET'; S.msgT = 150; return; }
    if (!fr.live) { sfx('err'); S.msg = fr.name + ' IS STILL IN DEVELOPMENT'; S.msgT = 150; return; }
    sfx('ok');
    const pc = partnerOpts()[S.partner];
    SESSION.lastChar = fr.id;
    const opts = { mode: 'story', diff: S.diff, classic: !!S.classic, char: fr.id, partner: !!pc, partnerChar: pc, allyCmd: S.cmd,
      stage: S.rush ? 8 : st.n, rush: !!S.rush };
    const launch = () => { startRun(opts); if (cheatsActive()) G.cheated = true; go('play'); };
    if (!SESSION.introSeen && !S.rush) { SESSION.introSeen = true; go('intro', { next: launch, line: 0 }); }
    else launch();
  }
}

function updatePlay() {
  if (G.loadQ && G.loadQ.length) { prewarm(G.loadQ, 14); return; }
  if (Input.pressed.start && !G.done) { sfx('ok'); go('pause', { cur: 0 }); return; }
  if (G.mode === 'story' && cheatsActive()) G.cheated = true;
  if (Input.pressed.ally && G.partner && G.ally) {
    G.allyCmd = (G.allyCmd + 1) % 3; sfx('move');
    popText('CPU: ' + ALLY_CMDS[G.allyCmd], G.ally.x, G.ally.y - 60, '#5ad06a');
  }
  stepWorld();
  if (G.gameOver) { go('continue', { n: 10 }); Music.stop(); jingle('over'); return; }
  if (G.done) { finishStage(); return; }
}
function stepWorld() {
  G.frames++;
  if (G.slowmo > 0) { G.slowmo--; if (G.slowmo % 3 !== 0) { updateFx(); return; } }
  if (G.fadeDir) {
    G.fade += G.fadeDir * 0.05;
    if (G.fadeDir > 0 && G.fade >= 1) { G.fade = 1; G.fadeDir = 0; const cb = G.fadeCb; G.fadeCb = null; if (cb) cb(); return; }
    if (G.fadeDir < 0 && G.fade <= 0) { G.fade = 0; G.fadeDir = 0; }
  }
  updateFighters();
  updateProjs();
  updateItems();
  updateHazards();
  updateStage();
  updateFx();
  if (G.comboT > 0) { G.comboT--; if (G.comboT === 0) resetCombo(false); }
  if (G.comboShow > 0) G.comboShow--;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 0.5);
  if (G.flashT > 0) G.flashT--;
  if (G.banner) G.banner.t--;
  if (!G.clearT) G.stageFrames++;
}
function renderPlay() {
  if (G.loadQ && G.loadQ.length) {
    ctx.fillStyle = '#07060b'; ctx.fillRect(0, 0, W, H);
    const k = 1 - G.loadQ.length / (G.loadQ.total || 1);

}
function pauseItems() {
  if (G.mode === 'training') return [
    { id: 'resume', label: 'RESUME' },
    { id: 'dummy', label: 'DUMMY: ' + ['STAND', 'WALK', 'GUARD', 'ATTACK'][G.trainDummy] },
    { id: 'count', label: 'DUMMIES: ' + G.trainCount },

    { id: 'quit', label: 'QUIT TO TITLE' },
  ];
  const it = [{ id: 'resume', label: 'RESUME' }, { id: 'moves', label: 'MOVE LIST' }];
  if (G.partner && G.ally) it.push({ id: 'cmd', label: 'CPU: ' + ALLY_CMDS[G.allyCmd] });
  it.push({ id: 'cheats', label: 'CHEATS' }, { id: 'options', label: 'OPTIONS' }, { id: 'quit', label: 'QUIT TO TITLE' });

function updatePause() {
  const items = pauseItems();
  moveCursor(items.length);
  const it = items[S.cur];
  const h = navH();
  if (h && it.id === 'dummy') { G.trainDummy = (G.trainDummy + h + 4) % 4; sfx('move'); }
  if (h && it.id === 'count') { G.trainCount = clamp(G.trainCount + h, 1, 3); trainingSpawn(); sfx('move'); }
  if (h && it.id === 'cmd') { G.allyCmd = (G.allyCmd + h + 3) % 3; sfx('move'); }
  if ((Input.pressed.start && !Input.pressed.confirm) || Input.pressed.cancel) { sfx('back'); go('play'); return; }
  if (Input.pressed.confirm) {
    sfx('ok');
    if (it.id === 'resume') go('play');
    else if (it.id === 'moves') go('movelist', { back: 'pause' });
    else if (it.id === 'cheats') go('cheats', { from: 'pause' });
    else if (it.id === 'options') go('options', { from: 'pause' });
    else if (it.id === 'dummy') G.trainDummy = (G.trainDummy + 1) % 4;
    else if (it.id === 'count') { G.trainCount = G.trainCount % 3 + 1; trainingSpawn(); }
    else if (it.id === 'cmd') G.allyCmd = (G.allyCmd + 1) % 3;
    else if (it.id === 'quit') { Music.stop(); G = null; go('title', { menu: true }); }
  }
}

function cheatRows() {
  const rows = CHEAT_DEFS.filter(c => !c.shop || SAVE.cheatsOwned.includes(c.id)).map(c => ({ type: 'cheat', c }));
  if (S.from === 'pause' && G && G.mode === 'story') rows.push({ type: 'act', id: 'skip', label: 'SKIP THIS SCENE' }, { type: 'act', id: 'kill', label: 'KILL ALL FOES' }, { type: 'act', id: 'full', label: 'FULL POWER NOW' });
  rows.push({ type: 'act', id: 'all', label: 'ALL CORE CHEATS ON' }, { type: 'act', id: 'clear', label: 'CLEAR ALL' }, { type: 'act', id: 'back', label: 'BACK' });
  return rows;
}
function updateCheats() {
  const rows = cheatRows();
  moveCursor(rows.length);
  const r = rows[S.cur];
  const h = navH();
  const back = () => { go(S.from === 'pause' ? 'pause' : 'title', S.from === 'pause' ? { cur: 3 } : { menu: true, cur: 5 }); };
  if (Input.pressed.cancel) { sfx('back'); back(); return; }
  if (r.type === 'cheat' && (h || Input.pressed.confirm)) {
    const c = r.c;
    if (c.values) CHEAT[c.id] = (CHEAT[c.id] + (h || 1) + c.values.length) % c.values.length;
    else CHEAT[c.id] = CHEAT[c.id] ? 0 : 1;
    sfx('ok');
    if (G && G.mode === 'story' && cheatsActive()) G.cheated = true;
    if (c.id === 'maxstars' && G && CHEAT.maxstars) G.stars = 3;
    return;
  }
  if (Input.pressed.confirm && r.type === 'act') {
    sfx('ok');
    if (r.id === 'back') { back(); return; }
    if (r.id === 'clear') clearCheats();
    if (r.id === 'all') for (const c of CHEAT_DEFS) if (!c.shop && !c.values) CHEAT[c.id] = 1;
    if (r.id === 'skip' || r.id === 'kill' || r.id === 'full') {
      G.cheated = true;
      if (r.id === 'kill') for (const e of G.ents) if (e.team === 'foe' && !e.killed) { e.hp = 0; }
      if (r.id === 'skip') {
        G.spawnQ = []; for (const e of G.ents) if (e.team === 'foe') e.remove = true;
        G.waveIdx = G.scene.waves.length; G.wave = null; G.lockX = null;
        if (G.sceneIdx < stageDef().scenes.length - 1) { G.fadeDir = 1; G.fade = 0; G.fadeCb = () => loadScene(G.sceneIdx + 1, false); }
        else { G.bossDead = true; G.clearT = 1; }
      }
      if (r.id === 'full') { const p = G.player; p.hp = p.maxHp; p.meter = 1; G.stars = 3; }
      go('play');
      return;
    }
    if (G && G.mode === 'story' && cheatsActive()) G.cheated = true;
  }
}

function computeGrade() {
  const p = G.player;
  const dmgPts = 40 * (1 - Math.min(1, G.dmgTaken / ((p ? p.maxHp : 100) * 3)));
  const livesPts = G.livesLost === 0 ? 20 : G.livesLost === 1 ? 10 : 0;
  const comboPts = 20 * Math.min(1, G.bestCombo / 20);
  const par = 60 * 60 * 4;
  const speedPts = 20 * clamp((par * 1.75 - G.stageFrames) / (par * 0.75), 0, 1);
  let total = dmgPts + livesPts + comboPts + speedPts;
  let g = GRADES.find(x => total >= x.min);
  if (G.continued && 'SAB'.includes(g.g)) g = GRADES.find(x => x.g === 'C');
  return { g, total, dmgPts, livesPts, comboPts, speedPts };
}
function finishStage() {
  const lifeB = Math.max(0, G.lives) * 1000;
  const comboB = G.bestCombo * 100;
  const nodmgB = G.dmgTaken === 0 ? 20000 : 0;
  const itemB = G.breaks * 300;
  const pre = G.score;
  const lines = [
    ['STAGE SCORE', pre - G.stageScore0],
    ['LIFE BONUS', lifeB],
    ['COMBO BONUS', comboB],
    ['NO-DAMAGE BONUS', nodmgB],
    ['ITEMS BONUS', itemB],
  ];
  addScore(lifeB + comboB + nodmgB + itemB);
  const gr = computeGrade();
  const earned = G.score - G.stageScore0;
  const T = { lines, gr, earned, bank: 0, xp: 0, lvlUp: null, saved: false, newBest: false };
  if (!G.cheated) {
    const d = diffOf();
    T.bank = Math.round(earned * d.bank * gr.g.mult);
    SAVE.bank += T.bank;
    const cs = charSave();
    const before = masteryLevel(cs.xp);
    T.xp = Math.round(G.kos * 10 + 300 + 400 * gr.g.mult);
    cs.xp += T.xp;
    const after = masteryLevel(cs.xp);
    if (after > before) T.lvlUp = { lvl: after, move: MASTERY_BY_CHAR[G.char][after - 1] };
    if (!G.rush) SAVE.reached = Math.min(8, Math.max(SAVE.reached, G.stage + 1));
    const gk = `${G.classic ? 'c' : 'u'}_${G.rush ? 'rush' : G.diff}_${G.stage}`;
    const old = SAVE.grades[gk];
    if (!old || GRADE_ORDER.indexOf(gr.g.g) < GRADE_ORDER.indexOf(old)) SAVE.grades[gk] = gr.g.g;
    const bk = `${G.classic ? 'c' : 'u'}_${G.diff}`;
    if (!SAVE.best[bk] || G.score > SAVE.best[bk]) { SAVE.best[bk] = G.score; T.newBest = true; }
    SAVE.stats.kos += G.kos; SAVE.stats.clears++;
    if (G.rush) {
      const rk = 'd' + G.diff;
      T.rushTime = G.stageFrames;
      if (!SAVE.bossRushTimes[rk] || G.stageFrames < SAVE.bossRushTimes[rk]) { SAVE.bossRushTimes[rk] = G.stageFrames; T.rushBest = true; }
    } else {
      // beating Vex on the highway wins her over
      if (G.stage === 5 && !SAVE.unlocks.vex) { SAVE.unlocks.vex = true; T.unlocked = 'VEX JOINS YOU'; }
      if (G.stage === 8) {
        SAVE.cleared = true;
        if (!SAVE.unlocks.bossrush) { SAVE.unlocks.bossrush = true; T.unlocked = 'BOSS RUSH UNLOCKED'; }
        T.ending = endingFor();
        SAVE.endings[T.ending.id] = true;
      }
    }
    T.saved = writeSave();
  }
  Music.play('menu');
  go('tally', { T, step: 0 });
}

  if (G.diff >= 1 && G.freedUnit) return ENDINGS.best;
  if (G.diff >= 1) return ENDINGS.good;

const SCREENS = {
  title: [updateTitle, renderTitle], setup: [updateSetup, renderSetup], intro: [updateIntro, renderIntro],
  play: [updatePlay, renderPlay], pause: [updatePause, renderPause], movelist: [updateMovelist, renderMovelist],

  ending: [updateEnding, renderEnding], coming: [updateComing, renderComing], stageintro: [updateStageIntro, renderStageIntro], continue: [updateContinue, renderContinue], gameover: [updateGameOver, renderGameOver],
  soundtest: [updateSoundTest, renderSoundTest], gallery: [updateGallery, renderGallery],
};
let frozen = false, last = 0, acc = 0;
function tick() {
  Input.poll();

  S.t++;
}
function render() {
  ctx.setTransform(PX, 0, 0, PX, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const s = SCREENS[SCREEN];
  if (s) s[1]();
  if (SAVE.options.scanlines) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; for (let y = 0; y < H; y += 2) ctx.fillRect(0, y, W, 1); }
}
function frame(ts) {
  if (!frozen) {
    if (!last) last = ts;
    acc += Math.min(100, ts - last);
    last = ts;
    let n = 0;
    while (acc >= STEP && n < 4) { tick(); acc -= STEP; n++; }
    if (n) render();
  }
  requestAnimationFrame(frame);
}
function boot() {
  loadSave();
  clearCheats();
  go('title');
  cv.focus();
  requestAnimationFrame(frame);
}
