<script>
'use strict';
// ============================================================ CORE
const W = 426, H = 240;          // logical (world) units - gameplay space, unchanged
const PX = 2;                    // device pixels per logical unit (854x480 backbuffer)
// round a logical coordinate onto the device pixel grid
const RP = v => Math.round(v * PX) / PX;
const FPS = 60, STEP = 1000 / FPS;
const cv = document.getElementById('cv');
cv.width = W * PX; cv.height = H * PX;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const rand = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const fmt = n => Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const DEG = Math.PI / 180;

// ------------------------------------------------------------ canvas fit
function fitCanvas() {
  const sw = window.innerWidth - 32, sh = window.innerHeight - 20;
  let s = Math.min(sw / W, sh / H);
  if (s >= 1) s = Math.floor(s * PX) / PX;
  s = Math.max(s, 0.5);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ------------------------------------------------------------ bitmap font 5x7
const GLYPHS = {
  A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],
  E:[31,16,16,30,16,16,31],F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],
  I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],L:[16,16,16,16,16,16,31],
  M:[17,27,21,21,17,17,17],N:[17,17,25,21,19,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],
  Q:[14,17,17,17,21,18,13],R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],
  U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],X:[17,17,10,4,10,17,17],
  Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],
  '0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[30,1,1,14,1,1,30],
  '4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],
  '8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
  '.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],':':[0,12,12,0,12,12,0],'!':[4,4,4,4,4,0,4],
  '?':[14,17,1,2,4,0,4],'-':[0,0,0,31,0,0,0],'+':[0,4,4,31,4,4,0],'/':[1,1,2,4,8,16,16],
  "'":[4,4,8,0,0,0,0],'"':[10,10,0,0,0,0,0],'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],
  '%':[25,25,2,4,8,19,19],'*':[0,21,14,31,14,21,0],'#':[10,10,31,10,31,10,10],'<':[2,4,8,16,8,4,2],
  '>':[8,4,2,1,2,4,8],'=':[0,0,31,0,31,0,0],'&':[12,18,20,8,21,18,13],'_':[0,0,0,0,0,0,31],
  '[':[14,8,8,8,8,8,14],']':[14,2,2,2,2,2,14],'$':[4,15,20,14,5,30,4],
  '↑':[4,14,21,4,4,4,0],'↓':[0,4,4,4,21,14,4],'←':[0,4,8,31,8,4,0],'→':[0,4,2,31,2,4,0],
  '★':[4,4,31,14,14,27,17],'•':[0,0,14,14,14,0,0],'×':[0,17,10,4,10,17,0],
};
const FONT_KEYS = Object.keys(GLYPHS);
const fontCache = new Map();
function fontAtlas(color) {
  let c = fontCache.get(color);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = FONT_KEYS.length * 6; c.height = 7;
  const g = c.getContext('2d');
  g.fillStyle = color;
  FONT_KEYS.forEach((k, i) => {
    const rows = GLYPHS[k];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++)
      if (rows[y] & (16 >> x)) g.fillRect(i * 6 + x, y, 1, 1);
  });
  const idx = {}; FONT_KEYS.forEach((k, i) => idx[k] = i);
  c.idx = idx;
  fontCache.set(color, c);
  return c;
}
function textWidth(str, s = 1) { return str.length * 6 * s - s; }
// align: 0 left, 1 center, 2 right
function text(str, x, y, color = '#fff', s = 1, align = 0, shadow = '#000') {
  str = String(str).toUpperCase();
  const w = textWidth(str, s);
  let sx = align === 1 ? Math.round(x - w / 2) : align === 2 ? x - w : x;
  if (shadow) drawText(str, sx + s, y + s, shadow, s);
  drawText(str, sx, y, color, s);
}
function drawText(str, x, y, color, s) {
  const a = fontAtlas(color);
  for (let i = 0; i < str.length; i++) {
    const k = a.idx[str[i]];
    if (k !== undefined) ctx.drawImage(a, k * 6, 0, 5, 7, x + i * 6 * s, y, 5 * s, 7 * s);
  }
}

// ------------------------------------------------------------ save
const SAVE_KEY = 'ragecircuit_save_v1';
function defaultSave() {
  return {
    v: 1,
    bank: 0,
    chars: {
      cole: { atk: 0, hp: 0, meter: 0, def: 0, starlock: false, freesp: false, xp: 0, perks: [], moves: [] },
      anita: { atk: 0, hp: 0, meter: 0, def: 0, starlock: false, freesp: false, xp: 0, perks: [], moves: [] },
      tank: { atk: 0, hp: 0, meter: 0, def: 0, starlock: false, freesp: false, xp: 0, perks: [], moves: [] },
      jett: { atk: 0, hp: 0, meter: 0, def: 0, starlock: false, freesp: false, xp: 0, perks: [], moves: [] },
      vex: { atk: 0, hp: 0, meter: 0, def: 0, starlock: false, freesp: false, xp: 0, perks: [], moves: [] },
      unit9: { atk: 0, hp: 0, meter: 0, def: 0, starlock: false, freesp: false, xp: 0, perks: [], moves: [] },
    },
    perksOwned: [],
    slots: 2,
    consumables: { life: 0, weapon: 0, rage: 0 },
    cheatsOwned: [],
    reached: 1,
    grades: {},     // key `${mode}_${diff}_${stage}` -> grade letter
    best: {},       // key `${mode}_${diff}` -> score
    unlocks: { vex: false, unit9: false, bossrush: false },
    cleared: false,
    endings: {},
    bossRushTimes: {},
    stats: { kos: 0, clears: 0 },
    options: { music: 7, sfx: 8, vibration: true, friendly: false, scanlines: false, flashing: true,
      pad: null, keys: null },
  };
}
let SAVE = defaultSave();
let storageOK = true;
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      const base = defaultSave();
      SAVE = Object.assign(base, d);
      SAVE.options = Object.assign(defaultSave().options, d.options || {});
      SAVE.chars = Object.assign(defaultSave().chars, d.chars || {});
      for (const k in SAVE.chars) { SAVE.chars[k] = Object.assign(defaultSave().chars.cole, SAVE.chars[k]); if (!Array.isArray(SAVE.chars[k].moves)) SAVE.chars[k].moves = []; }
      SAVE.consumables = Object.assign(defaultSave().consumables, d.consumables || {});
      SAVE.unlocks = Object.assign(defaultSave().unlocks, d.unlocks || {});
      SAVE.endings = Object.assign({}, d.endings || {});
      SAVE.stats = Object.assign(defaultSave().stats, d.stats || {});
    }
  } catch (e) { storageOK = false; }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); return true; }
  catch (e) { storageOK = false; return false; }
}
function eraseSave() {
  const opts = SAVE.options;
  SAVE = defaultSave();
  SAVE.options = opts;
  writeSave();
}

// ------------------------------------------------------------ input
const PAD_NAMES = ['A','B','X','Y','LB','RB','LT','RT','BACK','START','LS','RS','UP','DOWN','LEFT','RIGHT','HOME'];
const DEFAULT_PAD = { attack: 2, jump: 0, special: 1, back: 3, pick: 4, ally: 5, start: 9 };
const DEFAULT_KEYS = { attack: 'KeyJ', jump: 'KeyK', special: 'KeyL', back: 'KeyU', pick: 'KeyI', ally: 'KeyO', start: 'Enter' };
const REMAP_ACTIONS = ['attack', 'jump', 'special', 'back', 'pick', 'ally'];
const ACTIONS = ['up','down','left','right','attack','jump','special','back','pick','ally','start','confirm','cancel'];

const Input = {
  held: {}, pressed: {}, released: {}, dbl: {},
  prev: {}, keys: new Set(), keyEdges: new Set(),
  frame: 0, lastTap: {}, pad: null, padPrev: [], padNow: [],
  lastDevice: 'key', anyEdge: false, heldFrames: {},
  padMap() { return Object.assign({}, DEFAULT_PAD, SAVE.options.pad || {}); },
  keyMap() { return Object.assign({}, DEFAULT_KEYS, SAVE.options.keys || {}); },
  getPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let best = null;
    for (const p of pads) { if (p && p.connected) { if (!best || p.mapping === 'standard') best = p; } }
    return best;
  },
  poll() {
    this.frame++;
    const k = this.keys, e = this.keyEdges;
    const km = this.keyMap(), pm = this.padMap();
    const pad = this.getPad();
    this.pad = pad;
    this.padPrev = this.padNow;
    this.padNow = pad ? pad.buttons.map(b => b.pressed || b.value > 0.5) : [];
    const pb = i => !!this.padNow[i];
    const ax = pad ? (pad.axes[0] || 0) : 0, ay = pad ? (pad.axes[1] || 0) : 0;
    const kk = (...codes) => codes.some(c => k.has(c));
    const ke = (...codes) => codes.some(c => e.has(c));
    const now = {
      up: kk('ArrowUp','KeyW') || pb(12) || ay < -0.5,
      down: kk('ArrowDown','KeyS') || pb(13) || ay > 0.5,
      left: kk('ArrowLeft','KeyA') || pb(14) || ax < -0.5,
      right: kk('ArrowRight','KeyD') || pb(15) || ax > 0.5,
    };
    const edge = {
      up: ke('ArrowUp','KeyW'), down: ke('ArrowDown','KeyS'),
      left: ke('ArrowLeft','KeyA'), right: ke('ArrowRight','KeyD'),
    };
    for (const a of ['attack','jump','special','back','pick','ally','start']) {
      now[a] = k.has(km[a]) || pb(pm[a]);
      edge[a] = e.has(km[a]);
    }
    now.confirm = kk('Enter','Space') || k.has(km.jump) || k.has(km.attack) || pb(0);
    edge.confirm = ke('Enter','Space') || e.has(km.jump) || e.has(km.attack);
    now.cancel = kk('Escape','Backspace') || k.has(km.special) || pb(1);
    edge.cancel = ke('Escape','Backspace') || e.has(km.special);
    if (now.start === false && k.has('Escape')) now.start = false;
    this.anyEdge = false;
    for (const a of ACTIONS) {
      const h = !!now[a];
      this.pressed[a] = (h && !this.prev[a]) || !!edge[a];
      this.released[a] = !h && !!this.prev[a];
      this.held[a] = h;
      this.heldFrames[a] = h ? (this.heldFrames[a] || 0) + 1 : 0;
      this.prev[a] = h;
      if (this.pressed[a]) this.anyEdge = true;
    }
    // escape doubles as pause
    if (e.has('Escape')) this.pressed.start = true;
    // double taps
    for (const d of ['left','right','up','down']) {
      this.dbl[d] = false;
      if (this.pressed[d]) {
        const last = this.lastTap[d];
        if (last !== undefined && this.frame - last <= 14) { this.dbl[d] = true; this.lastTap[d] = undefined; }
        else this.lastTap[d] = this.frame;
        const opp = { left:'right', right:'left', up:'down', down:'up' }[d];
        this.lastTap[opp] = undefined;
      }
    }
    if (this.padNow.some((v, i) => v && !this.padPrev[i])) { this.lastDevice = 'pad'; tryResumeAudio(); }
    e.clear();
  },
  rawPadPressed() {
    for (let i = 0; i < this.padNow.length; i++) if (this.padNow[i] && !this.padPrev[i]) return i;
    return -1;
  },
  clearAll() { for (const a of ACTIONS) { this.pressed[a] = false; } },
  lastRawKey: null,
};
window.addEventListener('keydown', ev => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Backspace'].includes(ev.code)) ev.preventDefault();
  if (!ev.repeat) { Input.keyEdges.add(ev.code); Input.lastRawKey = ev.code; }
  Input.keys.add(ev.code);
  Input.lastDevice = 'key';
  tryResumeAudio();
});
window.addEventListener('keyup', ev => Input.keys.delete(ev.code));
window.addEventListener('blur', () => Input.keys.clear());
window.addEventListener('mousedown', () => { tryResumeAudio(); cv.focus(); });

// menu navigation with hold-repeat. A frame that moves never also changes a value.
const Nav = { t: {} };
function navRepeat(dir) {
  if (Input.pressed[dir]) { Nav.t[dir] = 20; return true; }
  if (Input.held[dir]) {
    Nav.t[dir] = (Nav.t[dir] || 0) - 1;
    if (Nav.t[dir] <= 0) { Nav.t[dir] = 6; return true; }
  }
  return false;
}
function navV() { const u = navRepeat('up'), d = navRepeat('down'); return u && !d ? -1 : d && !u ? 1 : 0; }
function navH() { const l = navRepeat('left'), r = navRepeat('right'); return l && !r ? -1 : r && !l ? 1 : 0; }

// ------------------------------------------------------------ rumble
function rumble(strong, weak, ms) {
  if (!SAVE.options.vibration) return;
  const p = Input.pad;
  try {
    if (p && p.vibrationActuator && p.vibrationActuator.playEffect)
      p.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak });
  } catch (e) {}
}
// ============================================================ AUDIO
let AC = null, masterMusic = null, masterSfx = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterMusic = AC.createGain(); masterMusic.connect(AC.destination);
    masterSfx = AC.createGain(); masterSfx.connect(AC.destination);
    const comp = AC.createDynamicsCompressor();
    masterSfx.disconnect(); masterSfx.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 1, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
  } catch (e) { AC = null; }
}
function applyVolumes() {
  if (!AC) return;
  masterMusic.gain.value = (SAVE.options.music / 10) * 0.32;
  masterSfx.gain.value = (SAVE.options.sfx / 10) * 0.55;
}
function tryResumeAudio() {
  initAudio();
  if (AC && AC.state === 'suspended') AC.resume().then(() => Music.ensure()).catch(() => {});
  else Music.ensure();
}
function audioBlocked() { return !AC || AC.state !== 'running'; }

function envGain(dest, t, vol, att, dec) {
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec);
  g.connect(dest);
  return g;
}
function tone(type, f0, f1, dur, vol, delay = 0, dest = null, filt = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  const g = envGain(dest || masterSfx, t, vol, 0.004, dur);
  if (filt) {
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filt;
    o.connect(f); f.connect(g);
  } else o.connect(g);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f0, f1, delay = 0, dest = null, q = 1) {
  if (!AC) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
  const g = envGain(dest || masterSfx, t, vol, 0.002, dur);
  s.connect(f); f.connect(g);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const SFX = {
  hitL() { noise(0.08, 0.7, 'lowpass', 2400, 600); tone('square', 180, 70, 0.07, 0.35); },
  hitH() { noise(0.16, 0.9, 'lowpass', 1800, 200); tone('square', 120, 40, 0.14, 0.5); tone('sine', 90, 35, 0.2, 0.6); },
  hitX() { noise(0.25, 1, 'lowpass', 3000, 150); tone('sawtooth', 160, 30, 0.25, 0.5); tone('sine', 70, 25, 0.3, 0.8); },
  whiff() { noise(0.07, 0.25, 'bandpass', 900, 2600, 0, null, 2); },
  jump() { tone('square', 220, 440, 0.07, 0.12); },
  land() { tone('sine', 110, 50, 0.06, 0.3); },
  fall() { noise(0.2, 0.7, 'lowpass', 500, 80); tone('sine', 80, 30, 0.25, 0.8); },
  brk() { noise(0.25, 0.8, 'highpass', 800, 3000); tone('square', 900, 300, 0.12, 0.15); tone('square', 1400, 700, 0.1, 0.1, 0.05); },
  pickup() { tone('square', 660, 660, 0.05, 0.18); tone('square', 990, 990, 0.08, 0.18, 0.05); },
  cash() { tone('square', 1320, 1320, 0.05, 0.15); tone('square', 1760, 1760, 0.18, 0.15, 0.05); },
  food() { tone('sine', 400, 150, 0.1, 0.4); tone('sine', 300, 600, 0.12, 0.35, 0.1); },
  oneup() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('square', f, f, 0.08, 0.16, i * 0.07)); },
  power() { [392, 523, 659, 784].forEach((f, i) => tone('sawtooth', f, f * 1.01, 0.09, 0.14, i * 0.05, null, 3000)); },
  special() { tone('sawtooth', 200, 900, 0.3, 0.3, 0, null, 2500); noise(0.35, 0.5, 'bandpass', 500, 3000, 0, null, 1.5); },
  charge() { tone('triangle', 200, 800, 0.35, 0.18); },
  glass() { noise(0.4, 0.8, 'highpass', 3000, 6000); [2400, 3100, 2800].forEach((f, i) => tone('sine', f, f * 0.98, 0.25, 0.12, i * 0.04)); },
  horn() { tone('square', 330, 330, 0.25, 0.22, 0, null, 1500); tone('square', 415, 415, 0.25, 0.18, 0, null, 1500); tone('square', 330, 330, 0.4, 0.22, 0.3, null, 1500); },
  engine() { tone('sawtooth', 80, 160, 0.6, 0.35, 0, null, 600); noise(0.6, 0.4, 'lowpass', 400, 1200); },
  water() { noise(0.9, 0.5, 'lowpass', 1500, 600); },
  move() { tone('square', 880, 880, 0.03, 0.1); },
  ok() { tone('square', 660, 660, 0.04, 0.14); tone('square', 1320, 1320, 0.06, 0.14, 0.04); },
  back() { tone('square', 500, 300, 0.07, 0.12); },
  buy() { [784, 988, 1175, 1568].forEach((f, i) => tone('square', f, f, 0.06, 0.14, i * 0.05)); },
  err() { tone('sawtooth', 120, 100, 0.18, 0.2); },
  knife() { tone('triangle', 2400, 1800, 0.12, 0.15); noise(0.05, 0.3, 'highpass', 5000, 5000); },
  clank() { tone('square', 700, 500, 0.12, 0.2); tone('square', 1100, 900, 0.1, 0.12); },
  roar() { tone('sawtooth', 110, 70, 0.8, 0.4, 0, null, 900); noise(0.8, 0.4, 'bandpass', 400, 200, 0, null, 2); },
  slam() { tone('sine', 60, 25, 0.5, 1); noise(0.45, 0.9, 'lowpass', 600, 60); },
  grab() { tone('sine', 150, 90, 0.06, 0.4); },
  dizzy() { for (let i = 0; i < 4; i++) tone('sine', 900 - i * 80, 1100 - i * 80, 0.08, 0.08, i * 0.08); },

};

// ============================================================ the guitars
// A guitar is a bright, slightly detuned pair of sawtooths through a
// waveshaper, then through an "amp": a resonant lowpass around 3k and a
// highpass at 90 to kill the mud. The pick attack is a short filtered noise
// burst - without it the notes sound blown rather than struck.
function ampChain(drive, tone = 3000, presence = 2.0, lo = 90) {
  const pre = AC.createGain(); pre.gain.value = drive.pre;
  const ws = AC.createWaveShaper(); ws.curve = drive.curve; ws.oversample = '4x';
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = lo;
  const cab = AC.createBiquadFilter(); cab.type = 'lowpass';
  cab.frequency.value = tone; cab.Q.value = presence;
  const post = AC.createGain(); post.gain.value = drive.post;
  pre.connect(ws); ws.connect(hp); hp.connect(cab); cab.connect(post);
  return { input: pre, output: post };
}
const DRIVE = {
  clean: () => ({ curve: SHAPE_SOFT, pre: 0.9, post: 0.85 }),
  crunch: () => ({ curve: SHAPE_SOFT, pre: 3.2, post: 0.36 }),
  hot: () => ({ curve: SHAPE_HOT, pre: 5.0, post: 0.22 }),
  fuzz: () => ({ curve: SHAPE_FUZZ, pre: 7.5, post: 0.15 }),
};
// One struck string. `bend` lifts into the note the way a player does.
function pickNoise(t, dest, v) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 0.9;
  const g = AC.createGain(); g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.022);
  s.connect(bp); bp.connect(g); g.connect(dest);
  s.start(t, Math.random() * 0.4); s.stop(t + 0.04);
}
const Gtr = {
  // The lead voice: two saws a few cents apart, vibrato that arrives late
  // (players don't shake a note the instant they hit it), amp, verb, echo.
  lead(t, m, dur, o = {}) {
    const drive = (DRIVE[o.drive] || DRIVE.crunch)();
    const amp = ampChain(drive, o.tone || 3200, o.presence || 2.4);
    const env = adsr(t, dur, o.vol || 0.30, 0.006, 0.09, 0.72, o.rel || 0.16);
    amp.output.connect(env.g);
    outChain(env.g, o.send !== undefined ? o.send : 0.24, o.echo !== undefined ? o.echo : 0.14);
    pickNoise(t, amp.input, (o.vol || 0.30) * 0.5);
    const f = mtof(m);
    for (const det of (o.wide ? [-9, 9] : [-5, 5])) {
      const osc = AC.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.value = f; osc.detune.value = det;
      if (o.bend) {                                     // slide up into the note
        osc.frequency.setValueAtTime(f * Math.pow(2, -o.bend / 12), t);
        osc.frequency.exponentialRampToValueAtTime(f, t + 0.055);

      const lfo = AC.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.2;
      const lg = AC.createGain();

      lg.gain.linearRampToValueAtTime(o.vib || 11, t + Math.min(0.34, dur * 0.8));
      lfo.connect(lg); lg.connect(osc.detune);
      osc.connect(amp.input); osc.start(t); osc.stop(env.end); lfo.start(t); lfo.stop(env.end);
    }
  },
  // Palm-muted chug: short, thick, gated. The engine of a rock track.
  chug(t, m, dur, o = {}) {
    const drive = (DRIVE[o.drive] || DRIVE.hot)();
    const amp = ampChain(drive, o.tone || 2100, 1.4, 70);
    const g = AC.createGain();
    g.gain.setValueAtTime(o.vol || 0.24, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 0.16));
    amp.output.connect(g); outChain(g, 0.06, 0);

      const osc = AC.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.value = mtof(m); osc.detune.value = det;
      osc.connect(amp.input); osc.start(t); osc.stop(t + Math.min(dur, 0.2) + 0.02);
    }
  },
  // A power chord: root, fifth, octave. No third, which is why it works under
  // any melody and why every rock record is built out of them.
  power(t, m, dur, o = {}) {
    const drive = (DRIVE[o.drive] || DRIVE.hot)();
    const amp = ampChain(drive, o.tone || 2600, 1.8, 80);
    const env = adsr(t, dur, o.vol || 0.17, 0.008, 0.10, 0.70, 0.14);
    amp.output.connect(env.g); outChain(env.g, o.send !== undefined ? o.send : 0.16, 0);

  },
  // Clean electric through a chorus: two triangles, one slowly drifting.
  clean(t, m, dur, o = {}) {

    const env = adsr(t, dur, o.vol || 0.17, 0.004, 0.12, 0.55, 0.22);
    amp.output.connect(env.g);
    outChain(env.g, o.send !== undefined ? o.send : 0.34, o.echo !== undefined ? o.echo : 0.18);
    pickNoise(t, amp.input, (o.vol || 0.17) * 0.8);
    for (const [det, rate] of [[-7, 0.6], [7, 0.83]]) {
      const osc = AC.createOscillator(); osc.type = 'triangle';
      osc.frequency.value = mtof(m); osc.detune.value = det;
      const lfo = AC.createOscillator(); lfo.frequency.value = rate;
      const lg = AC.createGain(); lg.gain.value = 6;

  sustain(t, m, dur, o = {}) {

    amp.output.connect(env.g); outChain(env.g, 0.40, 0.22);

      const osc = AC.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.value = mtof(m); osc.detune.value = det;
      const lfo = AC.createOscillator(); lfo.frequency.value = 4.6;
      const lg = AC.createGain();

  },

// ============================================================ keys
const Keys = {
  // Rhodes-ish: a sine fundamental with a bell partial that decays much
  // faster. Two-operator FM in all but name, and the cheapest convincing
  // electric piano there is.
  ep(t, m, dur, o = {}) {
    const f = mtof(m);

    const tone = AC.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = o.tone || 3400;

    const mod = AC.createOscillator(); mod.type = 'sine'; mod.frequency.value = f * 2;
    const mg = AC.createGain();
    mg.gain.setValueAtTime(f * (o.bite || 1.9), t);

    const tg = AC.createGain(); tg.gain.setValueAtTime((o.vol || 0.15) * 0.22, t);

    const tone = AC.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = o.tone || 3000;
    tone.connect(env.g); outChain(env.g, o.send !== undefined ? o.send : 0.24, 0);

    for (const [ratio, lvl] of bars) {

      osc.frequency.value = f * ratio; osc.detune.value = (ratio % 2 ? 4 : -4);

    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 1.2;

    f.connect(env.g); outChain(env.g, o.send !== undefined ? o.send : 0.5, 0);

      osc.frequency.value = mtof(m + iv); osc.detune.value = det;
      const g = AC.createGain(); g.gain.value = iv ? 0.4 : 0.8;

    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 7;

    f.connect(env.g); outChain(env.g, o.send !== undefined ? o.send : 0.22, o.echo || 0.10);
    for (const det of [-8, 8]) {
      const osc = AC.createOscillator(); osc.type = o.wave || 'sawtooth';

    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.tone || 3600;

    const g2 = AC.createGain(); g2.gain.value = 0.3;

// ============================================================ bass
const Bass = {
  // Picked electric bass: saw + square, a filter that closes fast, and a
  // fingernail transient on top.
  pick(t, m, dur, o = {}) {
    const env = adsr(t, dur, o.vol || 0.34, 0.006, 0.12, 0.55, 0.1);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 4;
    f.frequency.setValueAtTime(o.bright || 2200, t);
    f.frequency.exponentialRampToValueAtTime(o.close || 320, t + Math.max(0.12, dur * 0.7));
    f.connect(env.g); outChain(env.g, 0.04, 0);
    for (const [type, lvl, det] of [['sawtooth', 1, 0], ['square', 0.4, -6]]) {
      const osc = AC.createOscillator(); osc.type = type;
      osc.frequency.value = mtof(m); osc.detune.value = det;
      const g = AC.createGain(); g.gain.value = lvl;
      osc.connect(g); g.connect(f); osc.start(t); osc.stop(env.end);
    }
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.2;
    const g = AC.createGain(); g.gain.setValueAtTime((o.vol || 0.34) * 0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
    s.connect(bp); bp.connect(g); outChain(g, 0, 0); s.start(t, Math.random() * 0.4); s.stop(t + 0.04);

    // In the low keys this voice never needed one - at A minor its fundamental
    // is already under 80Hz. Up at D it sits right on the line and the whole
    // bassline crosses into the band above, which is how stage 7 came out with
    // a fifth of the low end of every other stage in the game.
    if (o.sub) {
      const sb = AC.createOscillator(); sb.type = 'sine'; sb.frequency.value = mtof(m - 12);
      const sg = AC.createGain(); sg.gain.value = o.sub;
      sb.connect(sg); sg.connect(env.g); sb.start(t); sb.stop(env.end);
    }
  },
  // Pure sub: a sine and nothing else. What drum and bass is actually made of.
  sub(t, m, dur, o = {}) {
    const env = adsr(t, dur, o.vol || 0.42, 0.012, 0.06, 0.9, 0.08);
    outChain(env.g, 0, 0);
    const osc = AC.createOscillator(); osc.type = 'sine'; osc.frequency.value = mtof(m);
    if (o.glide) {
      osc.frequency.setValueAtTime(mtof(m - o.glide), t);
      osc.frequency.exponentialRampToValueAtTime(mtof(m), t + 0.09);
    }
    osc.connect(env.g); osc.start(t); osc.stop(env.end);

// ============================================================ the song format
// A song is sections, not a loop. Each section names which chord run, which
// drum pattern, which bass line, which guitar part and which lead phrase is
// playing, so the arrangement can build, drop out and come back - which is the
// whole difference between a game loop you stop hearing after a minute and one
// you do not.
//
//   chords : named runs of [semitoneOffsetFromKey, quality]
//   drums  : named kits of 16-char-per-bar strings, one per piece
//   bass   : named lines - arrays of bars, each bar 16 slots of scale degrees
//   gtr    : named guitar parts, same shape (used by chug / power / clean)
//   leads  : named melodies - arrays of bars, 16 slots, absolute scale degrees
//   form   : the running order
//
// Velocity comes out of the pattern character: 'X' accents, 'x' is normal,
// 'o' is the open/alternate variant, '-' is a ghost. '.' is a rest.

const CHORD = {
  M:   [0, 4, 7], m:   [0, 3, 7], M7:  [0, 4, 7, 11], m7:  [0, 3, 7, 10],
  7:   [0, 4, 7, 10], sus: [0, 5, 7], dim: [0, 3, 6], m9:  [0, 3, 7, 10, 14],
  M9:  [0, 4, 7, 11, 14], add9: [0, 4, 7, 14], m6: [0, 3, 7, 9], 5: [0, 7],
};
// A chord voiced for keys: spread across an octave and a bit so it does not
// sit in a lump where the bass already is.
function voice(root, quality, spread = 1) {
  const ivs = CHORD[quality] || CHORD.M;
  const out = [root + ivs[0]];
  for (let i = 1; i < ivs.length; i++) out.push(root + ivs[i] + (spread && i === 1 ? 0 : 0));
  return out;
}
const VEL = { X: 1.12, x: 0.88, o: 0.82, '-': 0.35, '+': 1.0 };
function vel(ch) { return VEL[ch] !== undefined ? VEL[ch] : 0.88; }

// Turn "0 . 12 . -5 ." into [0,null,12,null,-5,null] - one entry per 16th.
function P(str) {
  return String(str).trim().split(/\s+/).map(t => (t === '.' ? null : (t === '_' ? '_' : +t)));
}
// How long a note lasts: until the next note or the end of the bar. '_' ties.
function holdLen(bar, i) {
  let n = 1;
  while (i + n < bar.length && (bar[i + n] === null || bar[i + n] === '_') && n < 16) n++;
  return n;
}

// ============================================================ the sequencer
// One function emits every event for one 16th step at an absolute time, and
// both the live player and the offline renderer drive it. That way what you
// hear in the picker is exactly what renders to a file.
function stepEvents(S, sec, barInSec, step, t, spb) {
  const F = S.form[sec];
  if (!F) return;
  const swing = (S.swing || 0) * spb * (step % 2 ? 1 : 0);
  t += swing;
  const chords = S.chords[F.chords] || S.chords.main;
  const absBar = F._barOffset + barInSec;
  const ch = chords[absBar % chords.length];
  const root = S.key + ch[0];
  const qual = ch[1];
  const band = S.band || {};
  // F.gain shapes the arrangement; S.level is the whole song's headroom trim,
  // so a track can be pulled back without re-balancing every instrument in it.
  const gain = (F.gain === undefined ? 1 : F.gain) * (S.level === undefined ? 1 : S.level);

  // ---- drums
  const dk = S.drums[F.drums];
  if (dk) {
    const bar = i => (Array.isArray(dk[i]) ? dk[i][absBar % dk[i].length] : dk[i]);
    const k = bar('k'), s = bar('s'), h = bar('h'), r = bar('r'), c = bar('c'), tm = bar('t');
    const mt = bar('m'), dp = bar('d'), ai = bar('a');
    if (k && k[step] && k[step] !== '.') Kit.kick(t, vel(k[step]) * gain, band.kick || {});
    if (s && s[step] && s[step] !== '.') {
      const cch = s[step];
      Kit.snare(t, vel(cch) * gain, cch === '-' ? { rim: false } : (band.snare || {}));
    }
    if (h && h[step] && h[step] !== '.') Kit.hat(t, vel(h[step]) * gain, h[step] === 'o');
    if (r && r[step] && r[step] !== '.') Kit.ride(t, vel(r[step]) * gain, r[step] === 'X');
    if (c && c[step] && c[step] !== '.') Kit.crash(t, vel(c[step]) * gain);
    if (mt && mt[step] && mt[step] !== '.') {          // struck metal
      const p = { X: 760, x: 520, o: 380, '-': 900 }[mt[step]] || 520;
      Kit.clank(t, vel(mt[step]) * gain, Object.assign({ pitch: p }, band.clank));
    }
    if (dp && dp[step] && dp[step] !== '.') Kit.drop(t, vel(dp[step]) * gain);
    if (ai && ai[step] && ai[step] !== '.') {          // air: brakes, steam
      const long = ai[step] === 'X';
      Kit.hiss(t, vel(ai[step]) * gain, Object.assign({ dur: long ? 1.6 : 0.7 }, band.hiss));
    }
    if (tm && tm[step] && tm[step] !== '.') {
      const p = { X: 190, x: 150, o: 118, '-': 96 }[tm[step]] || 150;
      Kit.tom(t, vel(tm[step]) * gain, p);
    }
  }
  // ---- a chopped break instead of a kit, for the drum and bass track
  const bk = S.breaks && S.breaks[F.breaks];
  if (bk) {
    const line = bk[absBar % bk.length];
    const cch = line[step];
    if (cch && cch !== '.') Kit.breakHit(t, (cch === cch.toUpperCase() ? 1.05 : 0.8) * gain, cch.toLowerCase());
  }
  // ---- bass
  const bl = S.bass[F.bass];
  if (bl) {
    const bar = bl[absBar % bl.length], n = bar[step];
    if (n !== null && n !== '_') {
      const len = holdLen(bar, step) * spb * 0.92;
      const voiceFn = Bass[F.bassVoice || S.bassVoice || 'pick'] || Bass.pick;
      voiceFn.call(Bass, t, root - 24 + n, len, Object.assign({}, band.bass, { vol: (band.bass && band.bass.vol || 0.34) * gain }));
    }
  }
  // ---- rhythm guitar
  const gp = S.gtr && S.gtr[F.gtr];
  if (gp) {
    const bar = gp[absBar % gp.length], n = bar[step];
    if (n !== null && n !== '_') {
      const len = holdLen(bar, step) * spb * 0.9;
      const style = F.gtrStyle || S.gtrStyle || 'chug';
      const o = Object.assign({}, band.gtr);
      o.vol = (band.gtr && band.gtr.vol || 0.22) * gain;
      Gtr[style].call(Gtr, t, root - 12 + n, len, o);
    }
  }
  // ---- keys: a chord on the downbeat, or a rhythmic stab pattern
  if (F.keys) {
    const kp = S.keys && S.keys[F.keys];
    const style = F.keyStyle || S.keyStyle || 'pad';
    if (kp) {
      const bar = kp[absBar % kp.length], n = bar[step];
      if (n !== null && n !== '_') {
        const len = holdLen(bar, step) * spb * 0.95;
        for (const m of voice(root + 12 + n, qual)) {
          Keys[style].call(Keys, t, m, len, Object.assign({}, band.keys,
            { vol: (band.keys && band.keys.vol || 0.10) * gain }));
        }
      }
    } else if (step === 0) {                       // no pattern: hold the chord
      const len = spb * 16 * 0.98;
      for (const m of voice(root + 12, qual)) {
        Keys[style].call(Keys, t, m, len, Object.assign({}, band.keys,
          { vol: (band.keys && band.keys.vol || 0.09) * gain }));
      }
    }
  }
  // ---- arpeggio
  if (F.arp && S.arps && S.arps[F.arp]) {
    const a = S.arps[F.arp];
    if (step % (a.rate || 2) === 0) {
      const idx = (step / (a.rate || 2)) % a.notes.length;
      const ivs = CHORD[qual] || CHORD.M;
      const deg = a.notes[idx];
      const m = root + 24 + (a.chordal ? ivs[deg % ivs.length] + 12 * Math.floor(deg / ivs.length) : deg);
      Keys[a.voice || 'pluck'].call(Keys, t, m, spb * (a.rate || 2) * 1.4,
        Object.assign({}, band.arp, { vol: (band.arp && band.arp.vol || 0.075) * gain }));
    }
  }
  // ---- lead
  if (F.lead && S.leads[F.lead]) {
    const ph = S.leads[F.lead];
    const bar = ph[barInSec % ph.length], n = bar[step];
    if (n !== null && n !== '_') {
      const len = holdLen(bar, step) * spb * 0.94;
      const style = F.leadStyle || S.leadStyle || 'lead';
      const o = Object.assign({}, band.lead);
      o.vol = (band.lead && band.lead.vol || 0.30) * gain;
      if (len > spb * 5) o.bend = 2;                   // slide into the long ones
      const fn = Gtr[style] ? Gtr[style] : Keys[style];
      fn.call(Gtr[style] ? Gtr : Keys, t, S.lkey + n, len, o);
    }
  }
  // ---- a second voice answering the lead
  if (F.harm && S.leads[F.harm]) {
    const ph = S.leads[F.harm];
    const bar = ph[barInSec % ph.length], n = bar[step];
    if (n !== null && n !== '_') {
      const len = holdLen(bar, step) * spb * 0.94;
      const style = F.harmStyle || S.harmStyle || 'clean';
      const o = Object.assign({}, band.harm);
      o.vol = (band.harm && band.harm.vol || 0.15) * gain;
      const fn = Gtr[style] ? Gtr : Keys;
      fn[style].call(fn, t, S.lkey + n, len, o);
    }
  }
}
// Work out where each section starts, so chord runs longer than a section
// still line up.
function prepSong(S) {
  let off = 0;
  for (const F of S.form) { F._barOffset = off; off += F.bars; }
  S._bars = off;
  S.lkey = S.lkey === undefined ? S.key + 24 : S.lkey;
  // Where the form restarts after it has played through once. A track that
  // opens with a sparse intro sets loopFrom past it: an intro that comes back
  // every 45 seconds is not an intro, it is a hole in the music, and under
  // combat SFX the player hears it as the music cutting out. Default 0 keeps
  // the whole form looping, which is right for anything with no intro.
  S._loopFrom = Math.min(Math.max(S.loopFrom || 0, 0), S.form.length - 1);
  return S;
}
function songSeconds(S) { return S._bars * 16 * (60 / S.bpm / 4); }

// ---- the live player -----------------------------------------------------
const LivePlayer = {
  song: null, name: null, timer: null, next: 0, step: 0, bar: 0, sec: 0, secBar: 0,
  play(name, songs) {
    if (this.name === name) return;
    this.stop();
    const S = songs[name];
    if (!S || !AC) return;
    this.name = name; this.song = prepSong(S);
    setDelayTime(60 / S.bpm / 2 * (S.echo || 1));
    setTone(S.tone && S.tone.freq, S.tone && S.tone.gain);
    this.next = AC.currentTime + 0.1; this.step = 0; this.bar = 0; this.sec = 0; this.secBar = 0;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.name = null; this.song = null; },
  tick() {
    if (!AC || !this.song || AC.state !== 'running') return;
    const S = this.song, spb = 60 / S.bpm / 4;
    if (this.next < AC.currentTime - 0.3) this.next = AC.currentTime + 0.05;
    while (this.next < AC.currentTime + 0.15) {
      stepEvents(S, this.sec, this.secBar, this.step, this.next, spb);
      this.next += spb; this.step++;
      if (this.step >= 16) {
        this.step = 0; this.secBar++;
        if (this.secBar >= S.form[this.sec].bars) {
          this.secBar = 0; this.sec++;
          if (this.sec >= S.form.length) this.sec = S._loopFrom;
        }
      }
    }

};
// ---- offline render, for writing a track to a file -----------------------
function scheduleSong(S, seconds, startAt = 0) {
  prepSong(S);
  setDelayTime(60 / S.bpm / 2 * (S.echo || 1));
  setTone(S.tone && S.tone.freq, S.tone && S.tone.gain);
  const spb = 60 / S.bpm / 4;
  let t = startAt, sec = 0, secBar = 0, step = 0;
  while (t < startAt + seconds) {
    stepEvents(S, sec, secBar, step, t, spb);
    t += spb; step++;
    if (step >= 16) {
      step = 0; secBar++;
      if (secBar >= S.form[sec].bars) {
        secBar = 0; sec++;
        if (sec >= S.form.length) sec = S._loopFrom;
      }
    }
  }
}

  // the game calls this once with its own context and music bus
  init(ctx, dest) { if (ready) return; initBand(ctx, dest); ready = true; },
  ready() { return ready; },
  has(name) { return !!SONGS[name]; },
  names() { return Object.keys(SONGS); },
  seconds(name) { return SONGS[name] ? songSeconds(SONGS[name]) : 0; },
  // Pure-data self check, so the game's own test suite can catch the two
  // faults that are otherwise completely silent: a form section naming a
  // pattern the song does not define (that lane just plays nothing), and a
  // loopFrom that would leave no loop at all. Costs nothing and touches no
  // audio, so the headless tests can call it.
  audit() {
    const TABLES = { drums: 'drums', breaks: 'breaks', bass: 'bass', gtr: 'gtr',
                     keys: 'keys', lead: 'leads', harm: 'leads', arp: 'arps' };
    const bad = [];
    for (const k in SONGS) {
      const S = SONGS[k];
      S.form.forEach((F, i) => {
        for (const lane in TABLES) {
          const want = F[lane];
          if (!want) continue;
          if (!((S[TABLES[lane]] || {})[want])) bad.push(k + ' sec' + i + ': ' + lane + ":'" + want + "' is not defined");
        }
      });
      const from = S._loopFrom || 0;
      if (from >= S.form.length) bad.push(k + ': loopFrom ' + from + ' is past the end of the form');
      const loopBars = S.form.slice(from).reduce((n, F) => n + F.bars, 0);
      if (loopBars < 2) bad.push(k + ': only ' + loopBars + ' bar(s) left to loop over');
    }
    return bad;
  },
  // where a song's loop begins, for the tests
  loopInfo(name) {
    const S = SONGS[name];
    if (!S) return null;
    const from = S._loopFrom || 0;
    const loopBars = S.form.slice(from).reduce((n, F) => n + F.bars, 0);
    // Does section 0 look like an intro? No lead and no harmony line means
    // there is no tune in it, which is fine once at the top of a fight and
    // wrong every 40 seconds for the rest of it.
    const F0 = S.form[0] || {};
    const introish = !F0.lead && !F0.harm;
    return { loopFrom: from, loopBars, introBars: S._bars - loopBars, bars: S._bars, introish };
  },
  play(name) { if (SONGS[name]) LivePlayer.play(name, SONGS); },
  stop() { LivePlayer.stop(); },
  playing() { return LivePlayer.name; },
};

// Rebuilt proportions: longer legs, a shorter/denser torso and a real neck, so
// the figure reads as a constructed body instead of a stack of tubes.
const RIG = { thigh: 16.5, shin: 15.5, torso: 21, ua: 12, fa: 11.6, neck: 4.4 };
const dn = a => [Math.sin(a * DEG), Math.cos(a * DEG)];
function lookScale(look) { return (look.scale || 1) * GS * VS; }
function solvePose(P, look) {
  const s = lookScale(look), gr = look.girth || 1;
  const lg = look.legs || 1, tl = look.torso || 1;
  const L = { thigh: RIG.thigh * s * lg, shin: RIG.shin * s * lg, torso: RIG.torso * s * tl, ua: RIG.ua * s, fa: RIG.fa * s, neck: RIG.neck * s };
  const [t, h, ua1, la1, ua2, la2, th1, kn1, th2, kn2] = P;
  const J = { s };
  const up = [Math.sin(t * DEG), -Math.cos(t * DEG)];
  J.up = up;
  J.hip = [0, 0];
  J.sh = [up[0] * L.torso, up[1] * L.torso];
  // HEAD_PROP: let the head scale with the character instead of being a fixed
  // 14 px bitmap, so a 1.4x boss stops wearing a street punk's head.
  // The head scales with the whole sprite, so head-to-body stays fixed whatever
  // GS is - a 1.4x boss no longer wears a street punk's head.
  const hs = HEAD_PROP ? (look.headScale || 1) * (look.scale || 1) * GS * VS
    : Math.max(1, Math.round(look.headScale || 1));
  const hr = (look.headR || 7) * hs;
  J.hr = hr; J.hs = hs;
  J.neck = [J.sh[0] + up[0] * L.neck, J.sh[1] + up[1] * L.neck];
  J.head = [J.neck[0] + up[0] * hr * 0.95, J.neck[1] + up[1] * hr * 0.95];
  J.headA = t + h;
  const arm = (ua, la, off) => {
    const sh = [J.sh[0] + off[0], J.sh[1] + off[1]];
    const d1 = dn(ua), el = [sh[0] + d1[0] * L.ua, sh[1] + d1[1] * L.ua];
    const d2 = dn(ua + la), hd = [el[0] + d2[0] * L.fa, el[1] + d2[1] * L.fa];
    return { sh, el, hd, fa: ua + la, ua };
  };
  J.a1 = arm(ua1, la1, [-2.6 * gr * s, 1.8 * s]);
  J.a2 = arm(ua2, la2, [1.4 * gr * s, 1.8 * s]);
  const hipW = (look.fem ? 2.3 : 1.7) * gr * s;
  const leg = (th, kn, off) => {
    const hp = [off[0], off[1]];
    const d1 = dn(th), kn_ = [hp[0] + d1[0] * L.thigh, hp[1] + d1[1] * L.thigh];
    const sa = th - kn, d2 = dn(sa), an = [kn_[0] + d2[0] * L.shin, kn_[1] + d2[1] * L.shin];
    const d3 = dn(sa + 90), ft = [an[0] + d3[0] * 6.2 * s, an[1] + d3[1] * 6.2 * s];
    return { hp, kn: kn_, an, ft, sa, th };
  };
  J.l1 = leg(th1, kn1, [-hipW * 0.7, 0]);
  J.l2 = leg(th2, kn2, [hipW * 0.7, 0]);
  const r = P[10] * DEG, c = Math.cos(r), sn = Math.sin(r);
  let low = -1e9;
  const pts = [[J.hip, 5 * gr * s], [J.sh, 6 * gr * s], [J.head, hr], [J.a1.el, 3 * s], [J.a1.hd, 3 * s], [J.a2.el, 3 * s], [J.a2.hd, 3 * s],
    [J.l1.kn, 4 * s], [J.l1.an, 3 * s], [J.l1.ft, 2 * s], [J.l2.kn, 4 * s], [J.l2.an, 3 * s], [J.l2.ft, 2 * s]];
  for (const [p, pad] of pts) { const y = p[0] * sn + p[1] * c + pad; if (y > low) low = y; }
  J.snap = -low;
  J.rot = P[10];
  return J;
}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function rgb2hsl(r, g, b) {

}
function hueToward(h, target, amt) { let d = ((target - h + 540) % 360) - 180; return h + Math.sign(d) * Math.min(Math.abs(d), amt); }
function ramp(hex) {
  const [h, s, l] = rgb2hsl(...hexRgb(hex));

  return [
    mk(hueToward(h, 48, 10), Math.min(1, s * 1.02), Math.min(0.96, l + 0.22)),
    mk(h, Math.min(1, s * 1.12), Math.min(0.9, l * 1.06)),
    // Shadows cool and DESATURATE. The old ramp pushed saturation up and let
    // hueToward take the short way round, so every warm tone hit pure red at
    // the shade step - fine under uniform tube limbs, glaring once the forms
    // have real volume and the shade covers half of every limb.
    mk(h - 8, s * 0.84, l * 0.64),
    mk(h - 20, s * 0.76, l * 0.36),
  ];
}
const lum = hex => { const [r, g, b] = hexRgb(hex); return r * 0.3 + g * 0.59 + b * 0.11; };

function perpLight(a, b) {

  let nx = -dy / l, ny = dx / l;

  segLine(g, [a[0] + n[0] * o1, a[1] + n[1] * o1], [b[0] + n[0] * o1, b[1] + n[1] * o1], w * 0.6, col(look, mat, t0 + 1));
  if (w >= 4) segLine(g, [a[0] + n[0] * o2, a[1] + n[1] * o2], [b[0] + n[0] * o2, b[1] + n[1] * o2], Math.max(1, w * 0.2), col(look, mat, t0));
}

  if (r > 2.5) disc(g, [p[0] - r * 0.35, p[1] - r * 0.4], r * 0.28, col(look, mat, t0));

function buildOf(look) {
  if (look._bd) return look._bd;
  const name = look.build || (look.robot ? 'robot' : look.fem ? 'lean'
    : (look.girth || 1) > 1.12 ? 'blocky' : 'heroic');
  const base = BUILDS[name] || BUILDS.heroic;
  const b = Object.assign({}, base);
  b.arm = base.arm.slice(); b.leg = base.leg.slice();
  if (look.bld) for (const k in look.bld) { const v = look.bld[k]; b[k] = Array.isArray(v) ? v.slice() : v; }
  look._bd = b;
  return b;
}
// 'box' is a build as well as a face for the training dummy
BUILDS.box = { sh: 9.0, chest: 8.4, rib: 8.2, waist: 7.8, hip: 7.6,
  arm: [6.4, 5.6, 4.6], leg: [8.2, 6.6, 5.2], swell: 0, foot: 6.0, trap: 0.8, neck: 4.6 };
for (const k in LOOKS) {
  const e = CAST_BUILD[k] || CAST_BUILD[k.replace(/(CPU|[AB])$/, '')];
  if (!e) continue;
  const [b, f, ov, fov] = e;
  const L = LOOKS[k];
  L.build = b; if (f) L.face = f;
  if (ov) L.bld = ov;
  if (fov) L.fc = fov;
  L._bd = null; L._fc = null;
}
// girth still widens a fighter, but the build already carries most of the bulk,
// so it only nudges from here.
const girthK = look => 1 + ((look.girth || 1) - 1) * 0.35;

// ------------------------------------------------------------ shape helpers
const nrm = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
const perp = d => [-d[1], d[0]];
// a limb that TAPERS from w0 to w1 with a muscle belly, not a uniform tube
function taper(g, look, a, b, w0, w1, mat, back, bulge = 0) {
  const d = nrm(a, b);
  let n = perp(d);
  if (n[0] * LIGHT[0] + n[1] * LIGHT[1] < 0) n = [-n[0], -n[1]];
  const t0 = back ? 1 : 0;
  const m = lp(a, b, 0.42), wm = (w0 + w1) / 2 + bulge;
  // n points at the light. The limb is BASE tone all over, with a shadow band
  // hugging the far edge and a highlight strip inside the lit edge - the whole
  // form lit, rather than a shade-coloured limb with one lit half.
  const at = (p, w, f) => add2(p, n, w * f);
  poly(g, [at(a, w0, 0.5), at(m, wm, 0.5), at(b, w1, 0.5),
    at(b, w1, -0.5), at(m, wm, -0.5), at(a, w0, -0.5)], col(look, mat, t0 + 1));
  poly(g, [at(a, w0, -0.5), at(m, wm, -0.5), at(b, w1, -0.5),
    at(b, w1, -0.16), at(m, wm, -0.12), at(a, w0, -0.14)], col(look, mat, t0 + 2));
  if (Math.min(w0, w1) > 2.6)
    segLine(g, at(a, w0, 0.34), at(b, w1, 0.32), Math.max(1, Math.min(w0, w1) * 0.2), col(look, mat, t0));
}
// A hard contour under a limb that passes in front of the body. Without it a
// blue sleeve over a blue torso is one flat shape.
function inkLimb(g, pts, endR) {
  const pad = 2.0;                       // total, so 1 px of rim on each side
  // Walk one side and back up the other: a single polygon, so there are no
  // round caps spilling onto the torso at the shoulder.
  const A = [], B = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i][0];
    const d = i < pts.length - 1 ? nrm(p, pts[i + 1][0]) : nrm(pts[i - 1][0], p);
    const n = perp(d), w = pts[i][1] / 2 + pad / 2;
    A.push(add2(p, n, w)); B.unshift(add2(p, n, -w));
    if (i > 0 && i < pts.length - 1) disc(g, p, w, OUTLINE);   // round the bend
  }
  poly(g, A.concat(B), OUTLINE);
  if (endR) disc(g, pts[pts.length - 1][0], endR + pad / 2, OUTLINE);
}
// rounded joint so two segments read as one limb
function joint(g, look, p, r, mat, back) {
  const t0 = back ? 1 : 0;
  disc(g, p, r, col(look, mat, t0 + 1));
  disc(g, add2(p, LIGHT, -r * 0.30), r * 0.74, col(look, mat, t0 + 2));
  disc(g, add2(p, LIGHT, r * 0.34), r * 0.36, col(look, mat, t0 + 1));
}
// hand: a closed fist - roughly as long as it is wide, with a knuckle ridge on
// the far face and the thumb folded across. Big, but still a fist.
function hand2(g, look, A, r, mat, back) {
  const d = nrm(A.el, A.hd);
  let n = perp(d);
  if (n[0] * LIGHT[0] + n[1] * LIGHT[1] < 0) n = [-n[0], -n[1]];
  const t0 = back ? 1 : 0;
  const c = add2(A.hd, d, r * 0.16);
  const tip = add2(c, d, r * 0.74), root = add2(c, d, -r * 0.76);
  const w = r * 0.62;                       // half-width of the fist
  poly(g, [add2(root, n, w * 0.92), add2(add2(root, d, r * 0.18), n, w),
    add2(add2(tip, d, -r * 0.16), n, w * 0.94), add2(tip, n, w * 0.60),
    add2(tip, n, -w * 0.62), add2(add2(tip, d, -r * 0.16), n, -w * 0.96),
    add2(add2(root, d, r * 0.18), n, -w), add2(root, n, -w * 0.88)], col(look, mat, t0 + 2));
  poly(g, [add2(root, n, w * 0.92), add2(add2(root, d, r * 0.18), n, w),
    add2(add2(tip, d, -r * 0.16), n, w * 0.94), add2(tip, n, w * 0.60),
    add2(tip, n, w * 0.02), add2(root, n, w * 0.06)], col(look, mat, t0 + 1));
  // knuckle ridge
  segLine(g, add2(add2(tip, d, -r * 0.10), n, w * 0.52), add2(add2(tip, d, -r * 0.10), n, -w * 0.52), Math.max(0.8, r * 0.16), col(look, mat, t0 + 2));
  // thumb folded across the shadow side
  segLine(g, add2(add2(c, d, -r * 0.30), n, -w * 0.72), add2(add2(c, d, r * 0.26), n, -w * 0.52), Math.max(0.9, r * 0.3), col(look, mat, t0 + 1));
}
// boot: a wedge with a sole, not a stroke
function boot2(g, look, an, ft, w, back, heel) {
  const d = nrm(an, ft);
  let n = perp(d);
  if (n[0] * LIGHT[0] + n[1] * LIGHT[1] < 0) n = [-n[0], -n[1]];
  const t0 = back ? 1 : 0;
  const bk = add2(an, d, -w * 0.42), toe = add2(ft, d, w * 0.1);
  poly(g, [add2(bk, n, w * 0.60), add2(toe, n, w * 0.30), add2(toe, n, -w * 0.34), add2(bk, n, -w * 0.52)], col(look, 'boots', t0 + 2));
  poly(g, [add2(bk, n, w * 0.60), add2(toe, n, w * 0.30), add2(toe, n, w * 0.02), add2(bk, n, w * 0.10)], col(look, 'boots', t0 + 1));
  segLine(g, add2(bk, n, -w * 0.44), add2(toe, n, -w * 0.30), Math.max(1, w * 0.2), col(look, 'boots', 3));
  if (heel) segLine(g, add2(bk, n, -w * 0.2), add2(bk, n, -w * 0.5), Math.max(1, w * 0.22), col(look, 'boots', 3));
}

// ------------------------------------------------------------ arm
function paintArm(g, look, A, back, s) {
  const B = buildOf(look), ar = look.arms || 1, k = s * girthK(look) * ar;
  const wSh = B.arm[0] * k, wEl = B.arm[1] * k, wWr = B.arm[2] * k;
  const sw = B.swell * k;
  const sl = look.sleeve || 'short';
  const upMat = sl === 'none' ? 'skin' : 'top';
  const loMat = sl === 'long' ? 'top' : 'skin';
  const t0 = back ? 1 : 0;
  const fist = (look.fist || 3.0) * Math.pow(s, 0.72) * ar * 1.34;
  // A sleeve sits over the upper arm and is wider than the arm itself; the
  // contour below has to clear it or it gets painted out.
  const cuffW = sl === 'short' ? 1.0 * k : (sl === 'elbow' && look.cuffs) ? 1.1 * k : 0;
  // The front arm crosses the torso in the same material, so lay a hard contour
  // under it first: OUTLINE is a detail colour, so it survives the downsample
  // and becomes the line that makes the arm read as a separate limb.
  if (!back) inkLimb(g, [[lp(A.sh, A.el, 0.14), wSh + cuffW], [A.el, wEl + cuffW * 0.9], [A.hd, wWr]], fist * 0.76);
  taper(g, look, A.sh, A.el, wSh, wEl, upMat, back, sw * 1.3);        // biceps belly
  joint(g, look, A.el, wEl * 0.46, loMat, back);
  taper(g, look, A.el, A.hd, wEl * 0.86, wWr, loMat, back, sw * 0.9); // forearm belly
  if (look.gloves && loMat === 'skin') {
    // the glove is a cuff at the wrist, not the whole forearm
    taper(g, look, lp(A.el, A.hd, 0.78), A.hd, wWr * 1.16, wWr * 1.04, 'gloves', back, 0);
  }
  if (sl === 'short') {
    const cuff = lp(A.sh, A.el, 0.46);
    taper(g, look, A.sh, cuff, wSh + 0.9 * k, wEl + 1.0 * k, 'top', back, 0);
    const n = perp(nrm(A.sh, A.el));
    segLine(g, add2(cuff, n, wEl * 0.6), add2(cuff, n, -wEl * 0.6), 1, col(look, 'top', t0 + 2));
  } else if (sl === 'elbow' && look.cuffs) {
    taper(g, look, lp(A.sh, A.el, 0.55), lp(A.sh, A.el, 0.92), wSh * 0.96 + 0.9 * k, wEl + 1.1 * k, 'top', back, 0);
  }
  if (back) joint(g, look, A.sh, wSh * 0.52, sl === 'none' ? 'skin' : 'top', back);   // deltoid cap
  if (look.robot) disc(g, A.el, wEl * 0.5, col(look, 'hair', back ? 3 : 2));
  // wrist break: without it a dark glove and a dark sleeve are one shape
  segLine(g, add2(A.hd, nrm(A.el, A.hd), -fist * 0.62), add2(A.hd, nrm(A.el, A.hd), -fist * 0.50),
    wWr * 1.15, look.ink[look.gloves ? 'gloves' : 'skin'] || OUTLINE);
  hand2(g, look, A, fist, look.gloves ? 'gloves' : 'skin', back);
}
// ------------------------------------------------------------ leg
function paintLeg(g, look, Lg, back, s) {
  const B = buildOf(look), k = s * girthK(look);
  const wHip = B.leg[0] * k, wKn = B.leg[1] * k, wAn = B.leg[2] * k;
  const sw = B.swell * k;
  const bare = look.bare === 'legs' || look.shorts;
  const mat = bare ? 'skin' : 'pants';
  taper(g, look, Lg.hp, Lg.kn, wHip, wKn, mat, back, sw * 1.5);       // quad belly
  if (look.shorts) taper(g, look, Lg.hp, lp(Lg.hp, Lg.kn, 0.38), wHip + 1.1 * k, wKn + 1.5 * k, 'pants', back, 0);
  joint(g, look, Lg.kn, wKn * 0.5, mat, back);
  taper(g, look, Lg.kn, Lg.an, wKn * 0.96, wAn, mat, back, sw * 1.6); // calf, belly high on the shin
  const bootTop = look.tallBoots ? 0.06 : 0.62;
  taper(g, look, lp(Lg.kn, Lg.an, bootTop), Lg.an,
    (look.tallBoots ? wKn * 0.98 : wAn * 1.35) + 0.7 * k, wAn + 0.8 * k, 'boots', back, 0);
  if (look.tallBoots) segLine(g, lp(Lg.kn, Lg.an, 0.04), lp(Lg.kn, Lg.an, 0.14), wKn + 1.4 * k, col(look, 'boots', back ? 1 : 0));
  boot2(g, look, Lg.an, Lg.ft, B.foot * k, back, !look.robot);
  if (look.robot) disc(g, Lg.kn, wKn * 0.55, col(look, 'hair', back ? 3 : 2));
}
// ------------------------------------------------------------ torso
// pelvis -> waist pinch -> ribcage flare -> deltoids -> trapezius slope
function paintTorso(g, look, J, s) {
  const B = buildOf(look), fem = look.fem;
  const hip = J.hip, sh = J.sh, u = J.up, n = [-u[1], u[0]];
  const Lt = Math.hypot(sh[0] - hip[0], sh[1] - hip[1]);
  const P = (t, k) => [hip[0] + u[0] * Lt * t + n[0] * k, hip[1] + u[1] * Lt * t + n[1] * k];
  const g0 = s * girthK(look);
  const belly = (look.belly || 0) * s * 0.42;
  const hipW = B.hip * g0, waistW = B.waist * g0 + belly;
  const ribW = B.rib * g0 + belly * 0.7, chestW = B.chest * g0, shW = B.sh * g0;
  const front = [P(-0.04, hipW * 0.86), P(0.10, hipW), P(0.30, waistW * 1.06), P(0.44, waistW),
    P(0.62, ribW), P(0.80, chestW), P(0.94, shW * 0.92), P(1.03, shW * 0.72), P(1.10, shW * 0.34)];
  const rear = [P(1.10, -shW * 0.36), P(1.03, -shW * 0.76), P(0.94, -shW * 0.96), P(0.78, -chestW * 0.96),
    P(0.60, -ribW * 0.98), P(0.44, -waistW * 1.02), P(0.30, -waistW * 1.1), P(0.10, -hipW * 0.98), P(-0.04, -hipW * 0.84)];
  const outline = front.concat(rear);
  const mat = look.bare === 'chest' ? 'skin' : 'top';
  poly(g, outline, col(look, mat, 1));
  // The key light comes over the back shoulder, so the shadow is a band down
  // the front of the body and the highlight a rim along the back.
  const F = 0.34;   // how far the shadow reaches back from the front edge
  poly(g, front.concat([P(1.06, shW * F * 0.5), P(0.88, chestW * F), P(0.68, ribW * F),
    P(0.48, waistW * F), P(0.28, waistW * F), P(0.08, hipW * F)]), col(look, mat, 2));
  segLine(g, P(0.30, -waistW * 0.86), P(0.62, -ribW * 0.84), 1.1, col(look, mat, 0));
  segLine(g, P(0.80, -chestW * 0.84), P(1.02, -shW * 0.72), 1.3, col(look, mat, 0));
  // anatomy
  if (!fem) {
    segLine(g, P(0.86, chestW * 0.12), P(0.86, -chestW * 0.12), 1.1 * g0, col(look, mat, 2));   // sternum
    segLine(g, P(0.80, chestW * 0.82), P(0.90, chestW * 0.2), 1, col(look, mat, 2));            // pec
    if (B.swell > 0.5) for (let i = 0; i < 2; i++)
      segLine(g, P(0.52 - i * 0.14, waistW * 0.55), P(0.52 - i * 0.14, -waistW * 0.55), 0.9, col(look, mat, 2));
  } else {
    segLine(g, P(0.78, chestW * 0.86), P(0.86, chestW * 0.2), 1, col(look, mat, 2));
    disc(g, P(0.80, chestW * 0.52), 1.5 * g0, col(look, mat, 1));
  }
  segLine(g, P(0.92, -chestW * 0.5), P(0.62, -ribW * 0.9), 1, col(look, mat, 2));               // lat
  poly(g, [P(1.00, shW * 0.58), P(1.06 + 0.07 * B.trap, shW * 0.20), P(1.06 + 0.07 * B.trap, -shW * 0.22), P(1.00, -shW * 0.62)], col(look, mat, 1));
  // ---- clothing layers on the new silhouette
  if (look.tank) {
    poly(g, [P(1.04, shW * 0.9), P(1.14, shW * 0.3), P(0.96, shW * 0.42), P(0.90, shW * 0.86)], col(look, 'skin', 1));
    poly(g, [P(1.04, -shW * 0.92), P(1.14, -shW * 0.32), P(0.96, -shW * 0.46), P(0.90, -shW * 0.9)], col(look, 'skin', 2));
  }
  if (look.crop) {
    poly(g, [P(0.04, hipW * 0.98), P(0.30, waistW * 1.06), P(0.46, waistW), P(0.46, -waistW), P(0.30, -waistW * 1.1), P(0.04, -hipW * 0.96)], col(look, 'skin', 1));
    segLine(g, P(0.24, waistW * 0.5), P(0.38, waistW * 0.5), 0.8, col(look, 'skin', 2));
  }
  if (look.jacket && look.inner) {
    const lo = look.crop ? 0.46 : 0.06;
    const pan = [P(lo, waistW * 0.80), P(0.66, ribW * 0.78), P(0.88, chestW * 0.70), P(1.03, shW * 0.34), P(1.03, shW * 0.02), P(lo, waistW * 0.16)];
    poly(g, pan, col(look, 'inner', 2));
    poly(g, pan.map(p => [p[0] - 0.5, p[1] - 0.6]), col(look, 'inner', 1));
    segLine(g, P(1.02, shW * 0.46), P(0.66, chestW * 0.96), 1.3, col(look, 'top', 0));
  } else if (look.vest && look.inner) {
    poly(g, [P(0.08, waistW * 0.9), P(0.80, chestW * 0.86), P(1.02, shW * 0.36), P(0.08, waistW * 0.2)], col(look, 'inner', 1));
  } else if (look.corset || look.leotard) {
    poly(g, [P(0.18, waistW * 0.92), P(0.74, chestW * 0.9), P(0.74, chestW * 0.26), P(0.18, waistW * 0.26)], col(look, 'inner', 1));
    for (let k = 0; k < 3; k++) segLine(g, P(0.3 + k * 0.14, waistW * 0.32), P(0.3 + k * 0.14, waistW * 0.82), 0.8, col(look, 'inner', 3));
  }
  if (look.stripe) segLine(g, P(0.56, -chestW * 0.92), P(0.56, chestW * 0.92), 2.1 * g0, col(look, 'stripe', 1));
  if (look.chain) {
    g.strokeStyle = FLAT.gold; g.lineWidth = 1.1;
    g.beginPath(); g.moveTo(...P(1.0, chestW * 0.6)); g.quadraticCurveTo(...P(0.72, chestW * 0.74), ...P(0.76, chestW * 0.06)); g.stroke();
  }
  if (look.robot) {
    poly(g, [P(0.5, waistW * 0.9), P(0.86, chestW * 0.8), P(0.86, chestW * 0.1), P(0.5, waistW * 0.1)], col(look, 'inner', 1));
    disc(g, P(0.70, chestW * 0.46), 1.4 * g0, FLAT.glow);
  }
  // belt sits on the pelvis and follows the hip line
  const bm = look.P.belt ? 'belt' : 'acc';
  poly(g, [P(0.05, hipW * 0.93), P(0.14, hipW * 0.97), P(0.14, -hipW * 0.95), P(0.05, -hipW * 0.89)], col(look, bm, 1));
  segLine(g, P(0.14, hipW * 0.95), P(0.14, -hipW * 0.93), 0.8, col(look, bm, 2));
  if (!fem) disc(g, P(0.095, hipW * 0.42), 1.3, FLAT.gold);
  if (look.spikes) for (let k = 0; k < 3; k++) disc(g, P(1.06, -shW * (0.84 - k * 0.28)), 0.9, look.P.metal[0]);
}
function paintSkirt(g, look, J, s) {
  const gr = look.girth || 1;
  const u = J.up, n = [-u[1], u[0]];
  const hw = 7 * s * gr;
  const a = [J.hip[0] + u[0] * 2 + n[0] * hw, J.hip[1] + u[1] * 2 + n[1] * hw];
  const b = [J.hip[0] + u[0] * 2 - n[0] * hw, J.hip[1] + u[1] * 2 - n[1] * hw];
  const k1 = lp(J.l2.hp, J.l2.kn, 0.42), k2 = lp(J.l1.hp, J.l1.kn, 0.42);
  const spread = 2.4 * s;
  const d1 = perpLight(J.l2.hp, J.l2.kn), d2 = perpLight(J.l1.hp, J.l1.kn);
  const pts = [b, a, add2(k1, d1, -spread), add2(k1, d1, spread), add2(k2, d2, spread), add2(k2, d2, -spread)];
  poly(g, pts, col(look, 'acc', 2));
  poly(g, [a, b, lp(b, k2, 0.7), lp(a, k1, 0.7)], col(look, 'acc', 1));
  segLine(g, lp(a, k1, 0.3), lp(b, k2, 0.3), 1, col(look, 'acc', 0));
  segLine(g, a, b, 1.6, col(look, 'belt', 1));
}
function paintStamp(g, look, name, cx, cy, sc) {
  const rows = STAMPS[name] || STAMPS.clean;
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === '.') continue;
      let c;
      if (STAMP_KEYS[ch]) { const [m, t] = STAMP_KEYS[ch]; c = col(look, m, t); }
      else if (ch === 'w') c = FLAT.eyeW;
      else if (ch === 'p') c = FLAT.pupil;
      else if (ch === 'm') c = look.lip;
      else if (ch === 'e') c = FLAT.glow;
      else if (ch === 'g') c = FLAT.gold;
      else if (ch === 'k') c = OUTLINE;
      else continue;
      g.fillStyle = c;
      g.fillRect(cx + (x - 6) * sc, cy + (y - 7) * sc, sc + 0.02, sc + 0.02);
    }
  }
}
// ------------------------------------------------------------ constructed head
// At 426x240 a head was 13 px and a hand-pixeled stamp beat anything procedural.
// At 854x480 it is ~27 px, which is enough room to build a skull: cranium, brow,
// cheekbone, jaw and chin, each shaped per character, with the hair as a mass
// that has its own silhouette.
const FACES = {
  // cran  cranium width      jaw   jaw width at the cheekbone
  // chin  chin width         tall  skull height       brow  brow ridge weight
  // nose  nose projection    hood  heavy brow/eye shadow
  square: { cran: 0.92, jaw: 0.90, chin: 0.52, tall: 0.96, brow: 1.15, nose: 1.00 },
  round: { cran: 0.95, jaw: 0.80, chin: 0.46, tall: 0.90, brow: 0.90, nose: 0.92 },
  long: { cran: 0.84, jaw: 0.76, chin: 0.44, tall: 1.06, brow: 1.00, nose: 1.08 },
  heavy: { cran: 0.98, jaw: 1.00, chin: 0.62, tall: 0.92, brow: 1.35, nose: 1.05, hood: 1 },
  fine: { cran: 0.86, jaw: 0.70, chin: 0.38, tall: 0.94, brow: 0.70, nose: 0.86 },
  box: { cran: 1.00, jaw: 0.98, chin: 0.74, tall: 0.94, brow: 1.10, nose: 0.80 },

    }

// ---- windows -------------------------------------------------------------
// One window with a life of its own: lit or dark, blinds, curtains, an AC unit,

function windowUnit(g, x, y, w, h, R, opts = {}) {

    g.fillStyle = 'rgba(0,0,0,0.18)'; g.fillRect(x, y + h * 0.55, w, h * 0.45);
    const roll = R();
    if (roll < 0.26) {                                   // somebody at the window
      const px_ = x + w * (0.3 + R() * 0.4), py = y + h;
      g.fillStyle = 'rgba(0,0,0,0.62)';
      g.fillRect(px_ - 2.5, py - h * 0.62, 5, h * 0.62);
      g.beginPath(); g.arc(px_, py - h * 0.66, 2.6, 0, 7); g.fill();

      g.fillStyle = 'rgba(160,220,255,0.55)'; g.fillRect(x + 1, y + h * 0.45, w - 2, h * 0.3);
    } else if (roll < 0.54) {                            // a plant on the sill
      g.fillStyle = '#2a6a3a'; g.fillRect(x + 1, y + h - 5, 4, 4);
      g.fillRect(x + 1.5, y + h - 8, 3, 3);
    }

  if (R() < (opts.blindRate === undefined ? 0.3 : opts.blindRate)) {           // half-drawn blind
    const bh = h * (0.2 + R() * 0.45);
    g.fillStyle = 'rgba(20,16,28,0.78)'; g.fillRect(x, y, w, bh);
    for (let by = y + 1; by < y + bh; by += 2) { g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(x, by, w, 1); }
  }

  g.fillStyle = '#120e1c';

function bldgBrownstone(g, x, w, R) {

  brick(g, x, top, w, GROUND - top, wall, R, { course: 4, bw: 10 });
  cornice(g, x, top, w, '#7d4a38', 6);
  // tall sash windows in two storeys, stone lintels above each
  for (let row = 0; row < 2; row++) {
    const wy = top + 16 + row * 34;
    const n = Math.max(2, Math.floor(w / 26));
    for (let i = 0; i < n; i++) {
      const wx = x + 8 + i * ((w - 16) / n);
      g.fillStyle = '#8a6a58'; g.fillRect(wx - 3, wy - 4, 16, 3);
      windowUnit(g, wx, wy, 10, 20, R, { litRate: 0.45, sill: '#8a6a58' });
    }

  // parlour floor: door up a stoop, garden level below it
  const dx = x + w * 0.58;
  g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(x, GROUND - 34, w, 34);
  doorway(g, dx, GROUND - 40, 15, 28, R, { col: '#3a2418' });

  g.fillStyle = '#16121c'; g.fillRect(x + 6, GROUND - 20, 14, 18);     // garden-level window
  g.fillStyle = R() < 0.5 ? '#e8c060' : '#241f38'; g.fillRect(x + 8, GROUND - 18, 10, 14);
  for (let k = 8; k < 19; k += 3) { g.fillStyle = '#16121c'; g.fillRect(x + k, GROUND - 19, 1, 16); }  // bars
  if (R() < 0.5) fireEscape(g, x + 4, top + 30, 18, 2, R);
}

function bldgTheatre(g, x, w, R) {
  const top = 8;

  for (let k = 0; k < 40; k++) { g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(x + R() * w, top + R() * (GROUND - top), 4 + R() * 16, 2 + R() * 7); }
  cornice(g, x, top, w, '#5a4460', 7);

  const n = Math.max(3, Math.round(w / 34));
  for (let i = 0; i < n; i++) {
    const wx = x + 10 + i * ((w - 20) / n), wy = top + 20;

    g.arc(wx + 7, wy + 8, 7, Math.PI, 0); g.lineTo(wx + 14, wy + 26); g.fill();

  g.fillStyle = '#241c2e'; g.fillRect(mx + 2, my + 2, mw - 4, 16);
  for (let k = mx + 3; k < mx + mw - 3; k += 6) {

  }
  const line = pick2(R, ['CLOSED', 'ONE NIGHT', 'TONIGHT', 'SOLD OUT']);

  }
  for (let k = 0; k < 2; k++) {

    g.fillStyle = pick2(R, ['#8a2a3a', '#2a4a8a', '#6a2a6a']); g.fillRect(px_ + 1, GROUND - 43, 14, 24);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(px_ + 3, GROUND - 38, 10, 12);

}

  for (let k = 0; k < mw; k += 12) { g.fillStyle = (k / 12) % 2 ? '#e8b020' : '#1a1a1e'; g.fillRect(mx + k, GROUND - 43, 12, 4); }
  g.fillStyle = '#2a2a34'; g.fillRect(mx - 14, GROUND - 26, 13, 26);    // booth

function bldgVacantLot(g, x, w, R) {

  }
  for (let k = 0; k < 40; k++) { g.fillStyle = R() < 0.6 ? '#d8b050' : '#6aa0e0'; g.fillRect(x + R() * w, GROUND - 90 + R() * 44, 1, 1); }
  // the party wall of the surviving neighbour, with the ghost of stairs on it
  g.fillStyle = '#3a2e34'; g.fillRect(x + w - 10, 20, 10, GROUND - 20);
  g.fillStyle = 'rgba(255,255,255,0.05)';

function bldgDiner(g, x, w, R) {
  const top = 46 + R() * 10;

const STREET_BUILDINGS = [
  { f: bldgBrownstone, w: [118, 160] }, { f: bldgBodega, w: [104, 140] },
  { f: bldgTheatre, w: [150, 200] },    { f: bldgTenement, w: [132, 186] },
  { f: bldgGarage, w: [126, 168] },     { f: bldgVacantLot, w: [86, 120] },
  { f: bldgDiner, w: [116, 150] },
];
// Walk a block choosing buildings without repeating the last two, so the
// street never reads as one template stamped over and over.
function blockRun(g, from, to, R, r, pool = STREET_BUILDINGS) {
  let x = from; const recent = [];
  while (x < to) {
    let pick, guard = 0;
    do { pick = Math.floor(R() * pool.length); } while (recent.includes(pick) && guard++ < 12);
    recent.push(pick); if (recent.length > 2) recent.shift();
    const b = pool[pick], w = Math.min(r(b.w[0], b.w[1]), to - x + 40);
    b.f(g, x, w, R);
    x += w;
  }
}

function skyGrad(f, L, stops) {
  const sky = f.createLinearGradient(0, 0, 0, 150);
  stops.forEach(([p, c]) => sky.addColorStop(p, c));
  f.fillStyle = sky; f.fillRect(0, 0, L.far.width, H);
}
function stars(f, L, R, r, n = 90, top = 74) {
  for (let i = 0; i < n; i++) { f.fillStyle = R() < 0.3 ? '#fff' : '#8a88b0'; f.fillRect(r(0, L.far.width), r(0, top), 1, 1); }
}
function skyline(f, L, R, r, base, col, lit, hMin = 40, hMax = 105) {
  for (let x = 0; x < L.far.width;) {
    const bw = r(18, 46), bh = r(hMin, hMax);
    f.fillStyle = col; f.fillRect(x, base - bh, bw, bh + 22);
    for (let wy = base - bh + 4; wy < base - 4; wy += 6) for (let wx = x + 3; wx < x + bw - 3; wx += 5)
      if (R() < 0.2) { f.fillStyle = R() < 0.7 ? lit : '#80c0e8'; f.fillRect(wx, wy, 2, 2); }
    if (R() < 0.18) { f.fillStyle = '#e8283a'; f.fillRect(x + bw / 2, base - bh - 6, 1, 6); f.fillRect(x + bw / 2 - 1, base - bh - 7, 3, 2); }
    x += bw + r(0, 7);
  }
}
// The pavement, kerb and carriageway. Every street option shares this contract
// so the walkable band never changes.
function paveAndRoad(n, L, R, r, opts = {}) {
  const P = opts.pave || '#4a4556', P2 = opts.pave2 || '#544e62', P3 = opts.pave3 || '#3a3644';
  n.fillStyle = P; n.fillRect(0, WALK, L.near.width, CURB - WALK + 3);
  // flagstones, with a few cracked and a few replaced in a different shade
  for (let y = WALK + 2; y < CURB; y += 13) n.fillStyle = P2, n.fillRect(0, y, L.near.width, 11);
  // individual flags: a few replaced, a few sunken, a few cracked right through
  for (let xx = 0; xx < L.near.width; xx += 26) {
    n.fillStyle = P3; n.fillRect(xx + ((xx / 26) % 2) * 6, WALK, 1, CURB - WALK);
    for (let fy = WALK + 2; fy < CURB; fy += 13) {
      const roll = R();
      if (roll < 0.10) { n.fillStyle = 'rgba(0,0,0,0.15)'; n.fillRect(xx, fy, 25, 11); }
      else if (roll < 0.17) { n.fillStyle = 'rgba(255,255,255,0.055)'; n.fillRect(xx, fy, 25, 11); }
      else if (roll < 0.22) { n.strokeStyle = 'rgba(0,0,0,0.30)'; n.lineWidth = 1;
        n.beginPath(); n.moveTo(xx + 2, fy + R() * 10); n.lineTo(xx + 12, fy + R() * 10); n.lineTo(xx + 23, fy + R() * 10); n.stroke(); }
    }
  }
  // gum, stains and litter - the grain that stops it reading as a flat slab
  for (let k = 0; k < L.near.width / 6; k++) {
    n.fillStyle = 'rgba(0,0,0,0.13)';
    n.beginPath(); n.arc(r(0, L.near.width), r(WALK + 6, CURB - 4), 1 + R() * 1.6, 0, 7); n.fill();
  }
  for (let k = 0; k < L.near.width / 40; k++) {
    n.fillStyle = pick2(R, ['rgba(220,214,196,0.5)', 'rgba(190,180,160,0.45)', 'rgba(150,170,180,0.4)']);
    n.save(); n.translate(r(0, L.near.width), r(WALK + 8, CURB - 6)); n.rotate(R() * 3);
    n.fillRect(0, 0, 3 + R() * 5, 2 + R() * 2); n.restore();
  }
  n.fillStyle = opts.kerbTop || '#3a3448'; n.fillRect(0, WALK, L.near.width, 2);
  // tree pits, grates and manhole covers punched into the pavement
  for (let xx = 40; xx < L.near.width; xx += 150 + R() * 90) {
    if (R() < 0.5) { n.fillStyle = '#231f28'; n.fillRect(xx, CURB - 20, 18, 14);
      for (let k = 0; k < 18; k += 3) { n.fillStyle = '#3a3642'; n.fillRect(xx + k, CURB - 19, 2, 12); } }
    else { n.fillStyle = '#2a2730'; n.beginPath(); n.ellipse(xx, CURB - 12, 9, 4, 0, 0, 7); n.fill();
      n.strokeStyle = '#4a4552'; n.lineWidth = 1; n.beginPath(); n.ellipse(xx, CURB - 12, 9, 4, 0, 0, 7); n.stroke(); }
  }
  n.fillStyle = opts.kerb || '#b8b0c0'; n.fillRect(0, CURB, L.near.width, 3);
  n.fillStyle = '#8a8298'; n.fillRect(0, CURB + 3, L.near.width, 2);
  n.fillStyle = opts.road || '#2a2834'; n.fillRect(0, ROAD, L.near.width, 240 - ROAD);
  for (let k = 0; k < L.near.width * 1.4; k++) { n.fillStyle = R() < 0.5 ? (opts.road2 || '#32303e') : (opts.road3 || '#24222e');
    n.fillRect(r(0, L.near.width), r(ROAD + 1, 240), 2, 1); }
  // worn tyre tracks down the lane, and drain grates at the kerb
  for (const ty of [214, 232]) for (let xx = 0; xx < L.near.width; xx += 2) {
    if (R() < 0.55) { n.fillStyle = 'rgba(255,255,255,0.028)'; n.fillRect(xx, ty, 2, 5); }
  }
  for (let xx = 60; xx < L.near.width; xx += 190 + R() * 120) {
    n.fillStyle = '#1c1a22'; n.fillRect(xx, ROAD + 1, 22, 6);
    for (let k = 0; k < 22; k += 4) { n.fillStyle = '#34323e'; n.fillRect(xx + k, ROAD + 2, 2, 4); }
    n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(xx - 6, ROAD + 5, 34, 4);
  }
  for (let k = 0; k < L.near.width / 260; k++) {                       // oil stains
    n.fillStyle = 'rgba(0,0,0,0.26)';
    n.beginPath(); n.ellipse(r(0, L.near.width), r(ROAD + 8, 234), 12 + R() * 16, 4 + R() * 4, 0, 0, 7); n.fill();
  }
  // patched repairs and a worn centre line
  for (let k = 0; k < L.near.width / 200; k++) { n.fillStyle = 'rgba(0,0,0,0.22)';
    n.fillRect(r(0, L.near.width), r(ROAD + 4, 232), 30 + R() * 50, 8 + R() * 10); }
  if (opts.line !== false) { n.fillStyle = opts.lineCol || '#e8c040';
    for (let xx = 0; xx < L.near.width; xx += 40) n.fillRect(xx, 226, 22, 2); }
}
// A crossing: the stripes, a light on the corner and a change of rhythm.
function crossing(n, x, R, opts = {}) {
  n.fillStyle = 'rgba(232,232,224,0.85)';
  for (let k = 0; k < 7; k++) n.fillRect(x + k * 9, ROAD + 4, 6, 240 - ROAD - 6);
  n.fillStyle = opts.kerb || '#b8b0c0'; n.fillRect(x - 6, CURB, 76, 3);

}

// ============================================================ STAGE 1-A: under the elevated
// ---- A3: UNDER THE ELEVATED ----------------------------------------------
// The street runs beneath an el line. Steel columns march past in the
// foreground, a train thunders over in the mid layer, and the light is all
// sodium pooling between the girders.
function elevatedBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
  skyGrad(f, L, [[0, '#08060f'], [0.6, '#241a33'], [1, '#4a2a3e']]);
  stars(f, L, R, r, 60, 60);
  skyline(f, L, R, r, 126, '#120e22', '#d8a048', 30, 80);
  // mid: the underside of the elevated deck, seen further down the avenue.
  // The train itself is drawn live over the top, so it can actually pass.
  m.fillStyle = '#1a1622'; m.fillRect(0, 54, L.mid.width, 22);
  m.fillStyle = '#26202e'; m.fillRect(0, 54, L.mid.width, 3);
  for (let x = 0; x < L.mid.width; x += 12) { m.fillStyle = 'rgba(0,0,0,0.35)'; m.fillRect(x, 57, 2, 19); }
  for (let x = 0; x < L.mid.width; x += 150) {         // the far row of trestles
    m.fillStyle = '#151220'; m.fillRect(x, 76, 7, 74);
    m.strokeStyle = '#151220'; m.lineWidth = 3;
    m.beginPath(); m.moveTo(x + 3, 86); m.lineTo(x + 74, 78); m.stroke();
    m.beginPath(); m.moveTo(x + 3, 86); m.lineTo(x - 68, 78); m.stroke();
  }
  // buildings glimpsed between the trestles, so the middle distance is not empty
  for (let x = 0; x < L.mid.width;) {
    const bw = r(44, 82), bh = r(40, 74);
    m.fillStyle = '#211a34'; m.fillRect(x, 150 - bh, bw, bh);
    for (let wy = 150 - bh + 6; wy < 146; wy += 10) for (let wx = x + 5; wx < x + bw - 6; wx += 9)
      if (R() < 0.26) { m.fillStyle = '#c8a860'; m.fillRect(wx, wy, 4, 5); }
    x += bw + r(6, 22);
  }
  blockRun(n, 0, len - 300, R, r);
  // the end of the run: the line widens into a station, and the fight happens
  // in the lit space underneath it with the stair coming down into the street.
  const u0 = len - 320;
  n.fillStyle = '#0c0a14'; n.fillRect(u0, 0, L.near.width - u0, GROUND);
  for (let k = 0; k < 50; k++) { n.fillStyle = '#c8a048'; n.fillRect(r(u0, L.near.width), r(46, 118), 1, 1); }
  // the platform box overhead, its underside lit, adverts along the fascia
  n.fillStyle = '#1c1826'; n.fillRect(u0 - 20, 40, L.near.width - u0 + 40, 40);
  n.fillStyle = '#2a2434'; n.fillRect(u0 - 20, 6, L.near.width - u0 + 40, 4);
  n.fillStyle = '#100d18'; n.fillRect(u0 - 20, 80, L.near.width - u0 + 40, 6);
  for (let ax = u0; ax < L.near.width; ax += 88) {
    n.fillStyle = '#16131e'; n.fillRect(ax, 46, 62, 28);
    n.fillStyle = pick2(R, ['#b8485a', '#3a6a9a', '#c8a030', '#3a8a6a']); n.fillRect(ax + 2, 48, 58, 24);
    n.fillStyle = 'rgba(0,0,0,0.32)'; n.fillRect(ax + 6, 53, 30, 14);
    n.fillStyle = 'rgba(255,255,255,0.10)'; n.fillRect(ax + 2, 48, 58, 2);
  }
  for (let lx = u0 + 24; lx < L.near.width; lx += 64) {   // strip lights under the platform
    n.fillStyle = '#ffeec0'; n.fillRect(lx, 82, 34, 3);
    n.fillStyle = 'rgba(255,238,192,0.09)'; n.fillRect(lx - 14, 85, 62, 58);
  }
  // the stair down from the platform, and the station name board
  const sx0 = u0 + 40;
  n.fillStyle = '#171420'; n.fillRect(sx0, 86, 76, 56);
  n.fillStyle = '#221d2c'; n.fillRect(sx0 + 3, 89, 70, 53);
  for (let k = 0; k < 11; k++) { n.fillStyle = k % 2 ? '#2e2838' : '#262030';
    n.fillRect(sx0 + 5, 92 + k * 4.6, 66, 3); }
  n.fillStyle = '#16121c'; n.fillRect(sx0 - 3, 86, 4, 56); n.fillRect(sx0 + 74, 86, 4, 56);
  n.fillStyle = 'rgba(255,238,192,0.10)'; n.fillRect(sx0, 90, 76, 52);
  n.fillStyle = '#1e5a3a'; n.fillRect(u0 + 150, 90, 116, 18);
  ptext(n, 'FRANKLIN AV', u0 + 158, 95, '#e8f0e8', 1);
  neonText(n, 'TRAINS', u0 + 152, 114, '#4ae8ff');
  paveAndRoad(n, L, R, r, { pave: '#4e4a58', pave2: '#5a5666', road: '#262430', lineCol: '#d8b038' });
  // The structure itself, in front of everything. It sits low enough that the
  // train on top of it clears the HUD band (the top 34 rows) and high enough
  // that the shopfronts underneath stay readable.
  const DECK = 56;                                   // top of the girder deck
  n.fillStyle = '#1a1620'; n.fillRect(0, DECK, L.near.width, 10);
  n.fillStyle = '#2b2536'; n.fillRect(0, DECK, L.near.width, 3);
  for (let x = 0; x < L.near.width; x += 9) { n.fillStyle = 'rgba(0,0,0,0.30)'; n.fillRect(x, DECK + 3, 3, 7); }
  n.fillStyle = '#141119'; n.fillRect(0, DECK + 10, L.near.width, 5);
  n.strokeStyle = '#211c2a'; n.lineWidth = 2;                          // lattice web
  for (let x = 0; x < L.near.width; x += 22) {
    n.beginPath(); n.moveTo(x, DECK + 10); n.lineTo(x + 11, DECK + 15); n.lineTo(x + 22, DECK + 10); n.stroke();
  }
  n.fillStyle = '#1a1620'; n.fillRect(0, DECK + 15, L.near.width, 8);
  n.fillStyle = '#252031'; n.fillRect(0, DECK + 15, L.near.width, 2);
  for (let x = 4; x < L.near.width; x += 16) { n.fillStyle = '#453d52'; n.fillRect(x, DECK + 18, 2, 2); }
  n.fillStyle = 'rgba(0,0,0,0.45)'; n.fillRect(0, DECK + 23, L.near.width, 4);
  // water finding its way through the deck, streaking the air below it
  for (let k = 0; k < L.near.width / 120; k++) {
    const dx = r(0, L.near.width);
    n.fillStyle = 'rgba(150,180,220,0.16)'; n.fillRect(dx, DECK + 27, 1, 18 + R() * 40);
    n.fillStyle = 'rgba(150,180,220,0.09)'; n.fillRect(dx - 1, DECK + 27, 3, 12);
  }
  for (let x = 20; x < L.near.width; x += 108) {
    n.fillStyle = '#1e1a26'; n.fillRect(x, DECK + 27, 9, WALK - DECK - 27);
    n.fillStyle = '#2c2636'; n.fillRect(x + 1, DECK + 27, 3, WALK - DECK - 27);
    n.fillStyle = '#100d16'; n.fillRect(x - 5, WALK - 4, 19, 5);       // base plate
    for (let k = 0; k < 5; k++) { n.fillStyle = '#4a4254'; n.fillRect(x - 3, WALK - 3, 2, 2); n.fillRect(x + 11, WALK - 3, 2, 2); }
    // riveted bracing up to the deck
    n.strokeStyle = '#1e1a26'; n.lineWidth = 4;
    n.beginPath(); n.moveTo(x + 4, DECK + 40); n.lineTo(x + 54, DECK + 28); n.stroke();
    n.beginPath(); n.moveTo(x + 4, DECK + 40); n.lineTo(x - 46, DECK + 28); n.stroke();
    n.fillStyle = '#171420'; n.fillRect(x - 4, DECK + 27, 17, 5);      // capital plate
    for (let k = 0; k < 4; k++) { n.fillStyle = '#4a4254';
      n.fillRect(x + 1, DECK + 34 + k * 12, 2, 2); n.fillRect(x + 6, DECK + 40 + k * 12, 2, 2); }
    // rubbish drifts against the base of a column, and someone has tagged it
    if (R() < 0.5) trashBags(n, x + 12, WALK + 8, R, 1 + Math.floor(R() * 2));
    // flyposters pasted round the column and torn back off again
    if (R() < 0.6) for (let k = 0; k < 2 + Math.floor(R() * 2); k++) {
      const py2 = DECK + 44 + k * 15 + R() * 6;
      if (py2 > WALK - 14) break;
      n.fillStyle = pick2(R, ['#c8303a', '#2a5ac8', '#e8c030', '#e8e8e8', '#2a8a5a']);
      n.fillRect(x - 1, py2, 11, 11);
      n.fillStyle = 'rgba(0,0,0,0.35)'; n.fillRect(x + 1, py2 + 2, 7, 4);
      n.fillStyle = 'rgba(0,0,0,0.22)'; n.fillRect(x - 1, py2 + 9, 11, 2);
    }
    n.fillStyle = 'rgba(0,0,0,0.20)'; n.fillRect(x - 10, WALK - 1, 29, 4);   // grime at the foot
    // the lamp bolted to every third column, and the pool it throws
    if ((x / 108) % 3 === 0) {
      n.fillStyle = '#2a2433'; n.fillRect(x - 5, DECK + 32, 19, 4);
      n.fillStyle = '#ffd68a'; n.fillRect(x - 3, DECK + 36, 15, 4);
      n.fillStyle = 'rgba(255,214,138,0.13)';
      n.beginPath(); n.moveTo(x - 3, DECK + 40); n.lineTo(x - 42, 240); n.lineTo(x + 52, 240); n.lineTo(x + 12, DECK + 40); n.fill();
      n.fillStyle = 'rgba(255,214,138,0.09)';
      n.beginPath(); n.ellipse(x + 5, CURB - 16, 40, 13, 0, 0, 7); n.fill();
    }
  }
  let pi = 0;
  const props = [(x) => newsBox(n, x, WALK + 50, R), (x) => trashBags(n, x, WALK + 50, R, 3),
    (x) => hydrant(n, x, WALK + 50), (x) => crates(n, x, WALK + 48, R, 2), (x) => g_mailbox(n, x, WALK + 50, R)];
  for (let x = 70; x < L.near.width - 40; x += 104 + R() * 60) { props[pi % props.length](x); pi++; }
  for (let x = 180; x < L.near.width - 80; x += 240 + R() * 130) parkedCar(n, x, 236, R);
}


// ============================================================ STAGE 1-B: the rooftops
// ---- B4: THE ROOFTOPS -----------------------------------------------------
// The wildcard: the alley goes up instead of along. Tar roofs, water towers,

function roofsBg(L, R, r, len) {
  const f = L.far.getContext('2d'), m = L.mid.getContext('2d'), n = L.near.getContext('2d');
