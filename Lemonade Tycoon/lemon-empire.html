<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LEMON EMPIRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1430;--panel:#2a2148;--panel2:#352a5c;--panel3:#43367a;--ink:#fff7d6;--dim:#b8aee0;--lemon:#ffd83a;--lemon2:#f5a623;--good:#6be36b;--bad:#ff6b6b;--line:#0d0a1a;--blue:#5ec8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'VT323',monospace;font-size:20px;line-height:1.15}
body{background:radial-gradient(circle at 50% 0,#2c2152,#140f26 70%) fixed}
#app{max-width:980px;margin:0 auto;padding:8px 8px 40px}
.pf{font-family:'Press Start 2P',monospace}
#hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.chip{background:var(--panel);border:3px solid var(--line);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:4px 8px;font-size:20px;white-space:nowrap}
.chip b{color:var(--lemon)}
#hud .sp{flex:1}
#cvwrap{position:relative;border:4px solid var(--line);box-shadow:0 0 0 3px var(--lemon2),0 8px 0 rgba(0,0,0,.4);background:#000}
canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#panel{margin-top:12px;background:var(--panel);border:4px solid var(--line);box-shadow:inset 0 0 0 2px var(--panel3);padding:10px}
.btn{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.3;color:var(--line);background:var(--lemon);border:3px solid var(--line);box-shadow:inset -3px -3px 0 var(--lemon2),inset 3px 3px 0 #fff3a8;padding:8px 10px;cursor:pointer;touch-action:manipulation;user-select:none}
.btn:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 var(--lemon2)}
.btn[disabled]{background:#6d6690;box-shadow:inset -3px -3px 0 #4f4970;color:#2a2448;cursor:not-allowed}
.btn.alt{background:var(--blue);box-shadow:inset -3px -3px 0 #2c8fc4,inset 3px 3px 0 #b8ecff}
.btn.red{background:var(--bad);box-shadow:inset -3px -3px 0 #c23d3d,inset 3px 3px 0 #ffb0b0}
.btn.grn{background:var(--good);box-shadow:inset -3px -3px 0 #3aa83a,inset 3px 3px 0 #c4ffc4}

.btn.sm{font-size:8px;padding:6px 7px}
.btn.on{background:#fff;box-shadow:inset -3px -3px 0 #bbb}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 8px}
.tab{font-family:'Press Start 2P',monospace;font-size:9px;background:var(--panel2);color:var(--dim);border:3px solid var(--line);padding:8px 8px;cursor:pointer;touch-action:manipulation}
.tab.act{background:var(--panel3);color:var(--lemon)}
.tab.lock{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--panel2);border:3px solid var(--line);padding:8px 10px;margin-bottom:8px}
.card.own{border-color:var(--good)}
.card.locked{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.h{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--lemon);margin:2px 0 6px}
.dim{color:var(--dim)}
.good{color:var(--good)}.bad{color:var(--bad)}.lem{color:var(--lemon)}
.step{display:flex;align-items:center;gap:6px;margin:6px 0}
.step .lbl{width:150px}
.step .val{min-width:64px;text-align:center;font-size:24px;color:var(--lemon)}
.bar{height:12px;background:#120d24;border:2px solid var(--line);position:relative;margin-top:3px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.mix{display:flex;height:12px;border:2px solid var(--line);margin-top:4px}
.mix span{display:block;height:100%}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:left;border-bottom:2px solid var(--panel3);vertical-align:middle}
th{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--dim);font-weight:normal}
#modal{position:fixed;inset:0;background:rgba(8,5,18,.78);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:20px 10px}
#modal.show{display:flex}
#mbox{background:var(--panel);border:4px solid var(--line);box-shadow:0 0 0 3px var(--lemon2),0 10px 0 rgba(0,0,0,.5);max-width:640px;width:100%;padding:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel3);border:3px solid var(--line);padding:8px 14px;z-index:60;max-width:90vw;text-align:center}
.fc{display:flex;align-items:center;gap:10px}
.fc .ic{font-size:34px}
.legend span{display:inline-block;margin-right:10px;font-size:17px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border:1px solid #000}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px}
.livegrid .chip{text-align:center}
#log{min-height:60px;font-size:18px}
.ladder{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.ladder span{font-family:'Press Start 2P',monospace;font-size:8px;padding:6px;border:2px solid var(--line);background:var(--panel2);color:var(--dim)}
.ladder span.done{color:var(--good)}
.ladder span.cur{background:var(--lemon);color:var(--line)}
@media (max-width:600px){html,body{font-size:18px}.step .lbl{width:110px}.btn.big{font-size:12px}}

<body>
<div id="app">
  <div id="hud"></div>
  <div id="cvwrap"><canvas id="cv" width="400" height="225"></canvas></div>

</div>
<div id="modal"><div id="mbox"></div></div>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=v=>(v<0?'-':'')+'$'+Math.round(Math.abs(v)).toLocaleString('en-US');
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=Math.random()*t;for(const k in o){r-=o[k];if(r<=0)return k;}return Object.keys(o)[0];}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

/* ================= data ================= */
const W=400,H=225,STAND_X=200,DAY_LEN=600,REAL_SEC_PER_DAY=80;
const GM_PER_SEC=DAY_LEN/REAL_SEC_PER_DAY;

const TYPES={
 kid:    {name:'Kids',          col:'#ff6fa3',max:0.80,L:3,B:2, ice:1, heat:1.0,stop:1.10,speed:20,pat:30},
 jogger: {name:'Joggers',       col:'#7cd65a',max:1.30,L:5,B:-1,ice:1, heat:1.4,stop:0.90,speed:32,pat:15},
 office: {name:'Office Workers',col:'#5d7bd8',max:2.10,L:4,B:0, ice:0, heat:0.9,stop:0.80,speed:17,pat:12},
 tourist:{name:'Tourists',      col:'#ffb347',max:2.60,L:4,B:1, ice:0, heat:1.1,stop:1.20,speed:12,pat:28},
 senior: {name:'Seniors',       col:'#c9b6e4',max:1.20,L:4,B:0, ice:-2,heat:0.8,stop:1.00,speed:9, pat:40},
};
const NB_HINTS={
 kid:{taste:'Like it SWEET: light on lemons, heavy on sugar (about 3 lemons / 5 sugar).',more:'Love extra ice. Rarely pay much over $0.80 unless it is scorching.'},
 jogger:{taste:'Like it TART and STRONG: lots of lemon, less sugar (about 5 lemons / 4 sugar).',more:'Want extra ice. Will pay around $1.30. Get very thirsty on hot days.'},
 office:{taste:'Classic balance: equal lemons and sugar (about 4 / 4).',more:'Normal ice. Pay well (around $2.10) but HATE waiting in line.'},
 tourist:{taste:'A touch sweeter than classic (about 4 lemons / 5 sugar).',more:'Normal ice. Big spenders (around $2.60) and patient.'},
 senior:{taste:'Classic balance: equal lemons and sugar (about 4 / 4).',more:'Go EASY on ice (about 2 cubes less). Pay around $1.20. Very patient.'},
};
const LOCS=[
 {id:'maple',   name:'Maple Street',   tier:0,traffic:70, permit:0, mix:{kid:35,senior:30,jogger:20,office:10,tourist:5},desc:'Quiet suburb. Free to set up.'},
 {id:'park',    name:'Sunny Park',     tier:1,traffic:115,permit:6, mix:{jogger:40,kid:25,senior:20,tourist:10,office:5},desc:'Joggers and families all day.'},
 {id:'downtown',name:'Downtown Plaza', tier:1,traffic:160,permit:15,mix:{office:55,tourist:20,senior:10,jogger:10,kid:5},desc:'Busy suits. Big lunch rush.'},
 {id:'beach',   name:'Boardwalk Beach',tier:1,traffic:185,permit:22,mix:{tourist:45,jogger:25,kid:20,senior:5,office:5},desc:'Huge crowds when sunny. Dead when it rains.',beach:true},
];
const locById=id=>LOCS.find(l=>l.id===id);
const SUP={
 lemons:{name:'Lemons',ic:'🍋',packs:[[12,1.20],[48,4.20],[144,11.00]]},
 sugar: {name:'Sugar', ic:'🧂',unit:'cups',packs:[[10,0.80],[40,2.80],[100,6.00]]},
 ice:   {name:'Ice',   ic:'🧊',unit:'cubes',packs:[[50,1.00],[200,3.20],[500,7.00]]},
 cups:  {name:'Cups',  ic:'🥤',packs:[[50,1.00],[200,3.50],[500,7.50]]},
};
const UPG=[
 {id:'juicer', name:'Hand Juicer',  tier:0,cost:15, desc:'Serve customers 20% faster.'},
 {id:'rack',   name:'Pitcher Rack', tier:0,cost:20, desc:'Mix new pitchers twice as fast.'},
 {id:'sign',   name:'Painted Sign', tier:0,cost:20, desc:'More passers-by stop to buy.'},
 {id:'parasol',name:'Parasol',      tier:0,cost:25, desc:'More stop on sunny/hot days. Customers wait 25% longer.'},
 {id:'cooler', name:'Foam Cooler',  tier:0,cost:30, desc:'Keep 50% of your ice overnight.'},
 {id:'radio',  name:'Weather Radio',tier:0,cost:35, desc:'Forecasts become far more accurate.'},
 {id:'press',  name:'Lever Press',  tier:1,cost:120,req:'juicer',desc:'Serve another 25% faster.'},
 {id:'banner', name:'Bell & Banner',tier:1,cost:150,req:'sign',desc:'Even more customers stop.'},
 {id:'chest',  name:'Ice Chest',    tier:1,cost:160,req:'cooler',desc:'Keep 90% of your ice overnight.'},
 {id:'crate',  name:'Lemon Crate',  tier:1,cost:90, desc:'Lemons spoil 3% per night instead of 10%.'},
 {id:'tipjar', name:'Tip Jar',      tier:1,cost:60, desc:'Happy customers (80%+) leave a 15% tip.'},
 {id:'shaver', name:'Ice Shaver',   tier:1,cost:140,desc:'+6 satisfaction on every cup.'},
];
const stars=r=>r>=90?5:r>=70?4:r>=50?3:r>=30?2:r>=15?1:0;
const starStr=r=>'★'.repeat(stars(r))+'☆'.repeat(5-stars(r));
const TIERS=[
 {name:'Cardboard Box',service:6,attract:0,loan:50,music:0,next:100,
  goals:[{t:'Serve 250 cups total',v:s=>s.life.cups,n:250},
         {t:'Earn $200 in total sales',v:s=>s.life.revenue,n:200,m:1},
         {t:'Reach 2★ reputation',v:s=>stars(s.rep),n:2}],
  unlock:'Wooden Cart: move between 4 locations, hire a helper, 6 new upgrades, bigger loans.'},
 {name:'Wooden Cart',service:5,attract:0.06,loan:400,music:1,next:1500,
  goals:[{t:'Serve 1,500 cups total',v:s=>s.life.cups,n:1500},
         {t:'Reach 4★ reputation',v:s=>stars(s.rep),n:4},
         {t:'Make $90 profit in one day',v:s=>s.life.best,n:90,m:1},
         {t:'Sell at 3 different locations',v:s=>s.life.locs.length,n:3}],
  unlock:'Kiosk'},
 {name:'Kiosk',future:true},{name:'Café',future:true},{name:'Franchise',future:true},{name:'Bottling Co.',future:true},{name:'Global Brand',future:true},
];
const WX={
 heat:  {n:'Heat Wave',    ic:'🔥',p:8, t:[95,104],m:1.0},
 sunny: {n:'Sunny',        ic:'☀️',p:35,t:[75,92], m:1.0},
 partly:{n:'Partly Cloudy',ic:'⛅',p:25,t:[68,85], m:0.9},
 cloudy:{n:'Cloudy',       ic:'☁️',p:20,t:[60,75], m:0.75},
 rain:  {n:'Rainy',        ic:'🌧️',p:12,t:[55,68], m:0.4},
};
const WX_ORDER=['heat','sunny','partly','cloudy','rain'];
const WAGE=10;
const COMPLAINTS={sour:'Too sour',sweet:'Too sweet',watery:'Watery',strong:'Too strong',moreice:'Needs ice',icy:'Too icy',pricey:'Too pricey',slow:'Line too slow',soldout:'Sold out'};
const ADVICE={sour:'Add sugar or use fewer lemons.',sweet:'Use less sugar.',watery:'Add more lemons per pitcher.',strong:'Use fewer lemons per pitcher.',moreice:'Add ice per cup. Hot days want more ice.',icy:'Use less ice per cup.',pricey:'Lower the price, or find a richer crowd.',slow:'Line moved too slowly. Buy faster equipment or hire a helper.',soldout:'You ran out! Stock up before opening.'};

/* ================= state ================= */
let S=null;           // saved game state
let phase='title';    // title | prep | day | report
let tab='supplies';
let G=null;           // live day sim
const AMB=[];         // ambient walkers (title/prep)
const FLOATS=[];
let clouds=[],rain=[];

function newState(){
 const s={v:1,day:1,cash:20,rep:10,tier:0,loc:'maple',inv:{lemons:0,sugar:0,ice:0,cups:0},
  recipe:{L:4,S:4,ice:3},price:0.75,upg:{},helper:false,loan:0,spent:0,
  life:{cups:0,revenue:0,best:0,locs:[],days:0},nb:{kid:0,jogger:0,office:0,tourist:0,senior:0},
  wx:{k:'sunny',temp:82},fc:{k:'sunny',temp:82},lastReport:null,grandma:0};
 return s;
}
function genWeather(){
 const ps={};for(const k in WX)ps[k]=WX[k].p;
 const k=wpick(ps);const temp=ri(WX[k].t[0],WX[k].t[1]);
 const acc=S.upg.radio?0.95:0.7;
 let fk=k;
 if(Math.random()>acc){const i=WX_ORDER.indexOf(k);const j=clamp(i+(Math.random()<.5?-1:1),0,WX_ORDER.length-1);fk=WX_ORDER[j===i?(i===0?1:i-1):j];}
 const err=S.upg.radio?2:7;
 S.wx={k,temp};S.fc={k:fk,temp:temp+ri(-err,err)};
 resetSky();
}
function tierDef(){return TIERS[S.tier];}
function attract(){let a=tierDef().attract;if(S.upg.sign)a+=0.10;if(S.upg.banner)a+=0.12;if(S.upg.parasol&&(S.wx.k==='sunny'||S.wx.k==='heat'))a+=0.10;return a;}
function serviceTime(){let t=tierDef().service;if(S.upg.juicer)t*=0.8;if(S.upg.press)t*=0.75;if(S.helper)t*=0.65;return t;}
function mixTime(){return S.upg.rack?5:10;}
function thirst(type,temp,wk){let th=clamp((temp-50)/40,0.15,1.2)*TYPES[type].heat;if(wk==='rain')th*=0.7;return Math.min(th,1.4);}
function tolerance(type){const th=thirst(type,S.wx.temp,S.wx.k);return TYPES[type].max*(0.75+0.45*th)*(1+S.rep/250);}
function iceIdeal(type,temp){return clamp(Math.round((temp-52)/8)+TYPES[type].ice,0,6);}
function rateCup(type){
 const t=TYPES[type],r=S.recipe;
 const dL=r.L-t.L,dB=(r.S-r.L)-t.B,dI=r.ice-iceIdeal(type,S.wx.temp);
 const pL=Math.max(0,Math.abs(dL)-0.5)*13,pB=Math.max(0,Math.abs(dB)-0.5)*13,pI=Math.max(0,Math.abs(dI)-0.5)*8;
 const ratio=S.price/tolerance(type);const pP=Math.max(0,ratio-0.6)*45;
 let sat=clamp(100-pL-pB-pI-pP+(S.upg.shaver?6:0),0,100);
 let worst=null,wv=0;
 if(pL>wv){wv=pL;worst=dL<0?'watery':'strong';}
 if(pB>wv){wv=pB;worst=dB<0?'sour':'sweet';}
 if(pI>wv){wv=pI;worst=dI<0?'moreice':'icy';}
 if(pP>wv){wv=pP;worst='pricey';}
 return {sat,worst};
}
function costPerCup(){const r=S.recipe;return r.L*0.10/12+r.S*0.08/12+r.ice*0.02+0.02;}
function cupsPossible(){
 const r=S.recipe,i=S.inv;
 const pitchers=Math.min(Math.floor(i.lemons/r.L),r.S>0?Math.floor(i.sugar/r.S):999);
 return Math.min(pitchers*12,r.ice>0?Math.floor(i.ice/r.ice):99999,i.cups);
}
function goalsMet(){const t=tierDef();if(!t.goals)return false;return t.goals.every(g=>g.v(S)>=g.n);}

/* ================= saves ================= */
const SKEY='lemonEmpire_';
function lsGet(k){try{return localStorage.getItem(SKEY+k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(SKEY+k,v);return true;}catch(e){return false;}}
function slotInfo(k){const raw=lsGet(k);if(!raw)return null;try{const s=JSON.parse(raw);return s;}catch(e){return null;}}
function validState(s){return s&&s.v===1&&s.inv&&s.recipe&&s.life&&typeof s.cash==='number';}
function saveTo(k){const ok=lsSet(k,JSON.stringify(Object.assign({},S,{savedAt:Date.now()})));return ok;}
function loadState(s){S=Object.assign(newState(),s);S.life=Object.assign(newState().life,s.life);S.nb=Object.assign(newState().nb,s.nb);phase='prep';tab='supplies';resetSky();AMB.length=0;FLOATS.length=0;playMusic(tierDef().music);renderAll();}

/* ================= audio ================= */
const AU={ctx:null,master:null,mus:null,sfx:null,musicOn:true,sfxOn:true,track:-1,step:0,nextT:0,timer:null};
try{const m=lsGet('audio');if(m){const o=JSON.parse(m);AU.musicOn=o.m!==false;AU.sfxOn=o.s!==false;}}catch(e){}
function auInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 AU.ctx=new AC();AU.master=AU.ctx.createGain();AU.master.gain.value=0.5;AU.master.connect(AU.ctx.destination);
 AU.mus=AU.ctx.createGain();AU.mus.gain.value=AU.musicOn?0.35:0;AU.mus.connect(AU.master);
 AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=AU.sfxOn?0.6:0;AU.sfx.connect(AU.master);
 const nb=AU.ctx.createBuffer(1,AU.ctx.sampleRate*0.5,AU.ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
 AU.timer=setInterval(sched,25);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,type,vol,dest,slideTo){
 const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.02);
}
function noise(t,dur,vol,dest,hp){
 const s=AU.ctx.createBufferSource();s.buffer=AU.noise;const f=AU.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp||6000;
 const g=AU.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+0.02);
}
const TRACKS=[
 {bpm:118,lead:[76,79,84,79,81,79,76,72, 74,77,81,77,79,0,79,0, 76,79,84,86,84,81,79,76, 74,76,72,71,72,0,0,0,
                72,76,79,76,77,76,74,72, 71,74,77,74,76,0,72,0, 69,72,76,77,79,77,76,74, 76,74,72,71,72,0,67,0],
  bass:[48,55,48,55, 50,57,55,43, 48,55,53,57, 55,43,48,48, 45,52,45,52, 43,50,43,50, 41,48,43,50, 43,50,48,48]},
 {bpm:132,lead:[79,83,86,83,88,86,83,79, 81,84,88,84,86,0,83,0, 79,81,83,86,91,88,86,83, 81,83,79,78,79,0,0,0,
                84,83,81,79,81,83,84,86, 88,86,84,83,81,0,79,0, 76,79,83,84,86,84,83,81, 79,78,79,81,79,0,74,0],
  bass:[43,50,43,50, 45,52,50,38, 48,55,47,50, 50,38,43,43, 48,55,48,55, 45,52,45,52, 40,47,48,50, 50,38,43,43]},
];
function playMusic(i){AU.track=i;AU.step=0;if(AU.ctx)AU.nextT=AU.ctx.currentTime+0.1;}
function sched(){
 if(!AU.ctx||AU.track<0)return;const tr=TRACKS[AU.track];const st=60/tr.bpm/2;
 if(AU.nextT<AU.ctx.currentTime-0.5)AU.nextT=AU.ctx.currentTime+0.05;
 while(AU.nextT<AU.ctx.currentTime+0.12){
  const t=AU.nextT,i=AU.step%tr.lead.length;
  if(AU.musicOn){

/* ================= simulation ================= */
function spawnWalker(list,type){
 const dir=Math.random()<.5?1:-1;
 const c={type,dir,x:dir>0?-12:W+12,y:rnd(166,200),speed:TYPES[type].speed*rnd(0.85,1.15),look:makeLook(type),state:'walk',decided:false,anim:Math.random(),moving:true,bub:null,wait:0};
 list.push(c);return c;
}
function startDay(){
 const loc=locById(S.loc);const fees=loc.permit+(S.helper?WAGE:0);
 if(S.cash<fees){toast('You need '+fmt(fees)+' for today\'s permit'+(S.helper?' and helper wage':'')+'.');sfx('err');return;}
 if(cupsPossible()<1){toast('Buy supplies first. You can\'t make a single cup.');sfx('err');return;}
 S.cash-=fees;S.spent+=fees;
 AMB.length=0;
 const wm=WX[S.wx.k].m*(loc.beach?({sunny:1.15,heat:1.2,partly:0.95,cloudy:0.6,rain:0.5}[S.wx.k]):1);
 const N=Math.round(loc.traffic*wm*rnd(0.9,1.1));
 const spawns=[];
 for(let i=0;i<N;i++){const r=Math.random();let t;
  if(r<0.5)t=rnd(0,DAY_LEN);else if(r<0.8)t=270+gauss()*70;else t=540+gauss()*35;
  spawns.push(clamp(t,0,DAY_LEN-15));}
 spawns.sort((a,b)=>a-b);
 G={cust:[],queue:[],time:0,speed:1,spawns,pitcher:0,serveT:0,mixT:0,soldOut:false,soldWhy:'',fees,
  st:{walkers:0,stopped:0,served:0,revenue:0,tips:0,sat:0,refused:0,slow:0,soldLost:0,c:{sour:0,sweet:0,watery:0,strong:0,moreice:0,icy:0,pricey:0,slow:0,soldout:0},byType:{}},
  log:[],used:{lemons:0,sugar:0,ice:0,cups:0},liveT:0};
 phase='day';sfx('day');renderAll();
}
function gauss(){return (Math.random()+Math.random()+Math.random()-1.5)*1.4;}
function say(c,txt,col){c.bub={txt,col,t:1.6};}
function addLog(txt,cls){G.log.unshift('<span class="'+(cls||'')+'">'+clockStr(G.time)+' — '+txt+'</span>');if(G.log.length>7)G.log.pop();}
function queueSpot(i){return {x:244+i*13,y:192};}
function decide(c){
 c.decided=true;if(G.time>=DAY_LEN)return;
 const t=TYPES[c.type],th=thirst(c.type,S.wx.temp,S.wx.k);
 let p=(0.12+0.35*th)*t.stop*(0.5+S.rep/100)*(1+attract());
 if(G.queue.length>=5)p*=0.5;
 p=Math.min(p,0.92);
 if(Math.random()>=p)return;
 G.st.stopped++;
 if(G.soldOut){say(c,'Sold out?','#ff6b6b');G.st.soldLost++;G.st.c.soldout++;return;}
 if(S.price>tolerance(c.type)){say(c,'$$$?!','#ff6b6b');addLog(TYPES[c.type].name.replace(/s$/,'')+' walked off: too pricey','bad');G.st.refused++;G.st.c.pricey++;sfx('bad');return;}
 if(G.queue.length>=8){say(c,'Busy!','#888');return;}
 c.state='toQueue';c.wait=0;G.queue.push(c);
}
function setSoldOut(why){
 if(G.soldOut)return;G.soldOut=true;G.soldWhy=why;addLog('SOLD OUT — out of '+why+'!','bad');sfx('err');
 for(const c of G.queue){say(c,'Sold out?','#ff6b6b');c.state='leave';c.dir=Math.random()<.5?1:-1;G.st.soldLost++;G.st.c.soldout++;}
 G.queue.length=0;
}
function tryServe(){
 const r=S.recipe,i=S.inv;
 if(G.pitcher<=0){
  if(i.lemons<r.L){setSoldOut('lemons');return;}
  if(i.sugar<r.S){setSoldOut('sugar');return;}
  i.lemons-=r.L;i.sugar-=r.S;G.used.lemons+=r.L;G.used.sugar+=r.S;G.pitcher=12;G.mixT=mixTime();if(G.speed<=4)sfx('pour');return;
 }
 if(i.cups<1){setSoldOut('cups');return;}
 if(i.ice<r.ice){setSoldOut('ice');return;}
 const c=G.queue.shift();
 G.pitcher--;i.cups--;i.ice-=r.ice;G.used.cups++;G.used.ice+=r.ice;
 const {sat,worst}=rateCup(c.type);
 let rev=S.price,tip=0;if(S.upg.tipjar&&sat>=80)tip=Math.round(S.price*0.15*100)/100;
 S.cash+=rev+tip;G.st.revenue+=rev;G.st.tips+=tip;G.st.served++;G.st.sat+=sat;
 G.st.byType[c.type]=G.st.byType[c.type]||{n:0,sat:0};G.st.byType[c.type].n++;G.st.byType[c.type].sat+=sat;
 S.nb[c.type]++;
 if(S.nb[c.type]===10||S.nb[c.type]===30)toast('Notebook updated: '+TYPES[c.type].name+'!');
 if(sat>=85)say(c,'Perfect!','#2e9e2e');else if(sat>=70)say(c,'Yum!','#2e9e2e');
 else{const lbl={sour:'Sour!',sweet:'Sweet!',watery:'Watery',strong:'Strong!',moreice:'+Ice!',icy:'Icy!',pricey:'Pricey'}[worst]||'Meh';say(c,lbl,sat<45?'#e53935':'#c77700');if(worst)G.st.c[worst]++;}
 addLog(TYPES[c.type].name.replace(/s$/,'')+': '+c.bub.txt+' ('+Math.round(sat)+'%)',sat>=70?'good':sat>=45?'lem':'bad');
 c.cup=true;c.state='leave';c.dir=Math.random()<.5?1:-1;
 if(G.speed<=4&&FLOATS.length<12)FLOATS.push({txt:'+'+fmt(rev+tip),x:STAND_X,y:140,col:'#6be36b',t:1});
 if(G.speed<=4)sfx('coin');
}
function moveWalker(c,d){c.x+=c.dir*c.speed*d;c.moving=true;}
function simStep(d){
 G.time+=d;
 while(G.spawns.length&&G.spawns[0]<=G.time){G.spawns.shift();spawnWalker(G.cust,wpick(locById(S.loc).mix));G.st.walkers++;}
 const patMul=S.upg.parasol?1.25:1;
 for(const c of G.cust){
  if(c.state==='walk'){
   moveWalker(c,d);
   if(!c.decided&&((c.dir>0&&c.x>=STAND_X-80)||(c.dir<0&&c.x<=STAND_X+110)))decide(c);
  }else if(c.state==='toQueue'||c.state==='queue'){
   c.wait+=d;
   const qi=G.queue.indexOf(c),sp=queueSpot(qi);
   const dx=sp.x-c.x,dy=sp.y-c.y,dist=Math.hypot(dx,dy);
   if(dist>1){const m=Math.min(dist,c.speed*1.2*d);c.x+=dx/dist*m;c.y+=dy/dist*m;c.moving=true;c.dir=dx>=0?1:-1;}
   else{c.x=sp.x;c.y=sp.y;c.moving=false;c.state='queue';c.dir=-1;}
   if(c.wait>TYPES[c.type].pat*patMul&&qi>0){
    G.queue.splice(qi,1);c.state='leave';c.dir=1;say(c,'Too slow!','#c77700');addLog(TYPES[c.type].name.replace(/s$/,'')+' left the line: too slow','bad');G.st.slow++;G.st.c.slow++;
   }
  }else if(c.state==='leave'){moveWalker(c,d);c.y+=(c.y<170?d*4:0);}
 }
 G.cust=G.cust.filter(c=>c.x>-30&&c.x<W+30);
 // serving
 const f=G.queue[0];
 if(G.time>=DAY_LEN){
  for(const c of G.queue){c.state='leave';c.dir=1;say(c,'Closed?','#888');}G.queue.length=0;
 }else if(f&&f.state==='queue'&&!G.soldOut){
  if(G.mixT>0)G.mixT-=d;
  else{G.serveT+=d;if(G.serveT>=serviceTime()||G.pitcher<=0){G.serveT=0;tryServe();}}
 }
 if(G.time>=DAY_LEN+20)endDay();
}
function tickAmbient(dt){
 AMB.t=(AMB.t||0)-dt;
 if(AMB.t<=0&&AMB.length<6){const mix=S?locById(S.loc).mix:LOCS[0].mix;spawnWalker(AMB,wpick(mix));AMB.t=rnd(1.5,4);}
 for(const c of AMB){moveWalker(c,dt*GM_PER_SEC);c.anim+=dt;if(c.bub)c.bub.t-=dt;}
 for(let i=AMB.length-1;i>=0;i--)if(AMB[i].x<-30||AMB[i].x>W+30)AMB.splice(i,1);
}
function tick(dt){
 updSky(dt);
 for(let i=FLOATS.length-1;i>=0;i--){const f=FLOATS[i];f.y-=dt*20;f.t-=dt;if(f.t<=0)FLOATS.splice(i,1);}
 if(phase==='day'&&G){
  let gm=dt*GM_PER_SEC*G.speed;
  while(gm>0&&phase==='day'){const s=Math.min(gm,0.5);simStep(s);gm-=s;}
  if(G){for(const c of G.cust){c.anim+=dt*(G.speed>2?2:1);if(c.bub)c.bub.t-=dt;}
   G.liveT-=dt;if(G.liveT<=0){G.liveT=0.25;renderLive();renderHud();}}
 }else if(phase!=='report'){tickAmbient(dt);}
}

function endDay(){
 const st=G.st,loc=locById(S.loc);
 const profit=st.revenue+st.tips-S.spent;
 const avg=st.served?st.sat/st.served:0;
 let dRep=st.served?(avg-60)/40*Math.min(6,1.5+st.served*0.08):-0.5;
 if(dRep>0)dRep*=(1-S.rep/120);
 dRep-=st.slow*0.15+st.soldLost*0.05;
 if(S.rep>50)dRep-=(S.rep-50)*0.03;
 dRep=clamp(dRep,-8,8);
 const oldStars=stars(S.rep);S.rep=clamp(S.rep+dRep,0,100);
 S.life.cups+=st.served;S.life.revenue+=st.revenue+st.tips;S.life.days++;
 if(profit>S.life.best)S.life.best=profit;
 if(st.served>0&&!S.life.locs.includes(S.loc))S.life.locs.push(S.loc);
 let repaid=0;if(S.loan>0){repaid=Math.min(S.loan,Math.round((st.revenue+st.tips)*0.25*100)/100,S.cash);S.loan=Math.round((S.loan-repaid)*100)/100;S.cash-=repaid;}
 const poured=G.pitcher;
 const spoilRate=S.upg.crate?0.03:0.10;const spoiled=Math.floor(S.inv.lemons*spoilRate);S.inv.lemons-=spoiled;
 const keep=S.upg.chest?0.9:S.upg.cooler?0.5:0;const melted=S.inv.ice-Math.floor(S.inv.ice*keep);S.inv.ice-=melted;
 const rep={day:S.day,loc:loc.name,wx:Object.assign({},S.wx),fc:Object.assign({},S.fc),st:JSON.parse(JSON.stringify(st)),profit,spent:S.spent,avg,dRep,stars:stars(S.rep),oldStars,repaid,poured,spoiled,melted,soldWhy:G.soldOut?G.soldWhy:''};
 S.lastReport=rep;S.spent=0;S.day++;
 G=null;phase='report';
 genWeather();
 sfx('day');showReport(rep);renderAll();
}

 }
 if(tab==='goals'){
  let h='<div class="ladder">'+TIERS.map((t,i)=>'<span class="'+(i<S.tier?'done':i===S.tier?'cur':'')+'">'+(i<S.tier?'✔ ':'')+t.name+'</span>').join('')+'</div>';
  const t=tierDef();h+='<div class="h">GOALS TO UNLOCK: '+TIERS[S.tier+1].name.toUpperCase()+'</div>';
  for(const g of t.goals){const v=g.v(S),pct=clamp(v/g.n,0,1);
   h+='<div class="card '+(pct>=1?'own':'')+'"><div class="row between"><span>'+(pct>=1?'✔ ':'')+g.t+'</span><span class="dim">'+(g.m?fmt0(Math.min(v,g.n)):Math.min(Math.floor(v),g.n).toLocaleString())+' / '+(g.m?fmt0(g.n):g.n.toLocaleString())+'</span></div><div class="bar"><i style="width:'+(pct*100)+'%"></i></div></div>';}
  if(TIERS[S.tier+1].future){
   h+=goalsMet()?'<div class="card own"><div class="h">KIOSK UNDER CONSTRUCTION</div>You\'ve maxed out the Wooden Cart. The Kiosk, Café and the rest of the ladder arrive in the next update. Keep playing to bank cash for it!</div>':'<p class="dim">Next: '+TIERS[S.tier+1].name+' (arrives in the next update).</p>';
  }else{
   h+='<div class="card"><div class="dim">Unlocks: '+t.unlock+'</div><div style="margin-top:8px"><button class="btn big grn" data-a="tierup" '+(goalsMet()&&S.cash>=t.next?'':'disabled')+'>UPGRADE TO '+TIERS[S.tier+1].name.toUpperCase()+' — '+fmt0(t.next)+'</button></div></div>';
  }
  h+='<p class="dim">Lifetime: '+S.life.days+' days · '+S.life.cups.toLocaleString()+' cups · '+fmt(S.life.revenue)+' sales · best day '+fmt(S.life.best)+'</p>';
  return h;
 }
 if(tab==='notebook'){
  let h='<div class="grid">';
  for(const k in TYPES){const t=TYPES[k],n=S.nb[k];
   h+='<div class="card"><div class="row between"><div class="h" style="color:'+t.col+'">'+t.name.toUpperCase()+'</div><span class="dim">served '+n+'</span></div>'+
    '<div>'+(n>=10?'🍋 '+NB_HINTS[k].taste:'<span class="dim">??? Serve '+(10-n)+' more to learn their taste.</span>')+'</div>'+
    '<div style="margin-top:4px">'+(n>=30?'💡 '+NB_HINTS[k].more:'<span class="dim">??? Serve '+Math.max(0,30-n)+' more to learn more.</span>')+'</div></div>';}
  return h+'</div><p class="dim">General rule: the hotter the day, the more ice everyone wants (about +1 cube for every 8°F above 52°F). Hot days also make people willing to pay more. Higher reputation brings more customers and lets you charge a bit more.</p>';
 }
 if(tab==='bank'){
  const cap=tierDef().loan,room=Math.max(0,cap-S.loan);
  const amts=S.tier===0?[10,25]:[50,100,200];
  let h='<div class="card"><div class="h">LEMON BANK</div><div>Borrow up to <b class="lem">'+fmt0(cap)+'</b> total. 10% fee is added when you borrow. 25% of each day\'s sales goes to repayment automatically.</div>'+
   '<div style="margin:6px 0">Owed: <b class="'+(S.loan>0?'bad':'good')+'">'+fmt(S.loan)+'</b></div><div class="row">'+
   amts.map(a=>'<button class="btn sm" data-a="loan" data-v="'+a+'" '+(a*1.1>room+0.001?'disabled':'')+'>BORROW '+fmt0(a)+'</button>').join('')+
   '<button class="btn sm alt" data-a="repay" '+(S.loan>0&&S.cash>0?'':'disabled')+'>REPAY NOW</button></div></div>';
  const stuck=cupsPossible()<1&&S.cash<4&&room<11;
  if(stuck)h+='<div class="card"><div class="h">GRANDMA\'S COOKIE JAR</div>Broke and out of stock? Grandma believes in you.<div style="margin-top:6px"><button class="btn sm grn" data-a="grandma">TAKE $5</button></div></div>';
  return h;
 }
 return '';
}
function renderLive(){
 const el=$('#live');if(!el||!G)return;const st=G.st,i=S.inv;
 const sat=st.served?Math.round(st.sat/st.served)+'%':'—';
 el.innerHTML='<div class="livegrid">'+
  '<span class="chip">🕒 '+clockStr(G.time)+'</span><span class="chip">🥤 Sold <b>'+st.served+'</b></span><span class="chip">💵 <b>'+fmt(st.revenue+st.tips)+'</b></span><span class="chip">😊 <b>'+sat+'</b></span>'+
  '<span class="chip">🍋 <b>'+i.lemons+'</b></span><span class="chip">🧂 <b>'+i.sugar+'</b></span><span class="chip">🧊 <b>'+i.ice+'</b></span><span class="chip">🥤 cups <b>'+i.cups+'</b></span>'+
  '<span class="chip">🫗 Pitcher <b>'+G.pitcher+'/12</b></span><span class="chip">👥 Line <b>'+G.queue.length+'</b></span><span class="chip">🚶 Passed <b>'+st.walkers+'</b></span><span class="chip">'+WX[S.wx.k].ic+' <b>'+S.wx.temp+'°F</b></span>'+
  '</div><div id="log" class="card" style="margin-top:8px">'+(G.log.length?G.log.join('<br>'):'<span class="dim">Customers will come and go. Watch their bubbles.</span>')+'</div>';
}
function showReport(r){
 const st=r.st,c=st.c;
 const comp=Object.keys(c).filter(k=>c[k]>0).sort((a,b)=>c[b]-c[a]);
 const top=comp[0];
 const byT=Object.entries(st.byType).map(([k,v])=>'<span style="color:'+TYPES[k].col+'">'+TYPES[k].name+' '+Math.round(v.sat/v.n)+'% ('+v.n+')</span>').join(' · ');
 let h='<div class="h" style="font-size:13px">DAY '+r.day+' REPORT</div><div class="dim">'+r.loc+' · '+WX[r.wx.k].ic+' '+WX[r.wx.k].n+' '+r.wx.temp+'°F <span style="font-size:16px">(forecast: '+WX[r.fc.k].n+' '+r.fc.temp+'°F)</span></div>';
 h+='<table style="margin:8px 0"><tr><td>Passers-by</td><td>'+st.walkers+'</td><td>Stopped</td><td>'+st.stopped+'</td></tr>'+
  '<tr><td>Cups sold</td><td class="lem">'+st.served+'</td><td>Avg satisfaction</td><td class="'+(r.avg>=70?'good':r.avg>=50?'lem':'bad')+'">'+(st.served?Math.round(r.avg)+'%':'—')+'</td></tr>'+
  '<tr><td>Sales</td><td>'+fmt(st.revenue)+'</td><td>Tips</td><td>'+fmt(st.tips)+'</td></tr>'+
  '<tr><td>Spent today</td><td>'+fmt(r.spent)+'</td><td><b>PROFIT</b></td><td class="'+(r.profit>=0?'good':'bad')+'" style="font-size:24px">'+fmt(r.profit)+'</td></tr></table>';
 h+='<div>Reputation: <b class="'+(r.dRep>=0?'good':'bad')+'">'+(r.dRep>=0?'+':'')+r.dRep.toFixed(1)+'</b> → <span class="lem">'+'★'.repeat(r.stars)+'☆'.repeat(5-r.stars)+'</span>'+(r.stars>r.oldStars?' <b class="good">STAR UP!</b>':r.stars<r.oldStars?' <b class="bad">star lost</b>':'')+'</div>';
 if(byT)h+='<div style="margin-top:4px;font-size:18px">'+byT+'</div>';
 h+='<div class="card" style="margin-top:8px"><div class="h">WHAT CUSTOMERS SAID</div>'+(comp.length?comp.map(k=>COMPLAINTS[k]+' ×'+c[k]).join(' · '):'<span class="good">No complaints. Flawless!</span>')+
  (top?'<div style="margin-top:4px">💡 <b class="lem">'+ADVICE[top]+'</b></div>':'')+'</div>';
 const night=[];if(r.poured)night.push(r.poured+' leftover cups poured out');if(r.spoiled)night.push(r.spoiled+' lemons spoiled');if(r.melted)night.push(r.melted+' ice melted');if(r.repaid)night.push(fmt(r.repaid)+' repaid to the bank');
 if(night.length)h+='<div class="dim">Overnight: '+night.join(' · ')+'.</div>';
 if(goalsMet()&&!TIERS[S.tier+1].future)h+='<div class="card own" style="margin-top:8px">★ All goals met! Open the <b>GOALS</b> tab to upgrade to the '+TIERS[S.tier+1].name+'.</div>';
 h+='<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn big grn" data-a="next">NEXT DAY ▶</button></div>';
 openModal(h);
}
function openModal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show');}
function closeModal(){$('#modal').classList.remove('show');}
function menuHtml(fromTitle){
 const canSave=phase==='prep';
 let h='<div class="row between"><div class="h" style="font-size:13px">'+(fromTitle?'LOAD GAME':'MENU')+'</div><button class="btn sm red" data-a="close">✕</button></div>';
 const slots=[['auto','AUTOSAVE'],['1','SLOT 1'],['2','SLOT 2'],['3','SLOT 3']];
 h+='<table>';
 for(const[k,l]of slots){const s=slotInfo(k);
  h+='<tr><td class="pf" style="font-size:9px">'+l+'</td><td>'+(s?'Day '+s.day+' · '+TIERS[s.tier].name+' · '+fmt(s.cash):'<span class="dim">empty</span>')+'</td><td><div class="row">'+
   (k!=='auto'&&!fromTitle?'<button class="btn sm" data-a="save" data-v="'+k+'" '+(canSave?'':'disabled')+'>SAVE</button>':'')+
   (s?'<button class="btn sm alt" data-a="load" data-v="'+k+'">LOAD</button>':'')+'</div></td></tr>';}
 h+='</table>';
 if(!canSave&&!fromTitle)h+='<p class="dim">You can save between days (during morning prep).</p>';
 h+='<div class="row" style="margin-top:10px">'+(S&&canSave?'<button class="btn sm" data-a="export">EXPORT SAVE FILE</button>':'')+'<button class="btn sm" data-a="import">IMPORT SAVE FILE</button>'+
  (fromTitle?'':'<button class="btn sm alt" data-a="howto">HOW TO PLAY</button><button class="btn sm red" data-a="title">QUIT TO TITLE</button>')+'</div>';
 h+='<p class="dim" style="font-size:16px">The game autosaves every morning. Saves live in this browser. Export a file to back up or move your empire.</p>';
 return h;
}
const HOWTO='<div class="row between"><div class="h" style="font-size:13px">HOW TO PLAY</div><button class="btn sm red" data-a="close">✕</button></div>'+
 '<p><b class="lem">Each morning</b> check the forecast, buy supplies, set your recipe and price, then <b>OPEN STAND</b>.</p>'+
 '<p><b class="lem">During the day</b> watch customers. Bubbles tell you what they think: <i>Sour!</i>, <i>+Ice!</i>, <i>$$$?!</i>, <i>Too slow!</i>. Use 2x/4x or FINISH DAY to speed up.</p>'+
 '<p><b class="lem">Each pitcher</b> = 12 cups using your lemons + sugar. Each cup also uses a cup and your ice. Running out of anything means SOLD OUT.</p>'+
 '<p><b class="lem">Customer types</b> (Kids, Joggers, Office Workers, Tourists, Seniors) each want different flavor, ice and price. Every location has a different mix. Your Notebook fills in as you serve them.</p>'+
 '<p><b class="lem">Reputation</b> (stars) rises with happy customers and brings bigger crowds willing to pay more.</p>'+
 '<p><b class="lem">Climb the ladder</b>: meet a tier\'s goals in the GOALS tab, then pay to upgrade. Cardboard Box → Wooden Cart → Kiosk → Café → Franchise → Bottling Co. → Global Brand.</p>'+
 '<p><b class="lem">No game over.</b> Broke? Visit the Bank.</p>'+
 '<div class="row" style="justify-content:flex-end"><button class="btn sm grn" data-a="close">GOT IT</button></div>';

function act(a,v){
 if(a!=='music'&&a!=='sfx')sfx('click');
 switch(a){
 case 'music':AU.musicOn=!AU.musicOn;saveAudio();renderHud();break;
 case 'sfx':AU.sfxOn=!AU.sfxOn;saveAudio();renderHud();break;
 case 'new':
  if(slotInfo('auto'))openModal('<div class="h">START A NEW EMPIRE?</div><p>Your autosave will be overwritten tomorrow morning. Manual slots are kept.</p><div class="row" style="justify-content:flex-end"><button class="btn sm" data-a="close">CANCEL</button><button class="btn sm grn" data-a="confirmNew">START FRESH</button></div>');
  else act('confirmNew');break;
 case 'confirmNew':closeModal();S=newState();resetSky();phase='prep';tab='supplies';AMB.length=0;playMusic(0);saveTo('auto');renderAll();openModal(HOWTO);break;
 case 'continue':{const s=slotInfo('auto');if(s&&validState(s))loadState(s);break;}
 case 'loadmenu':openModal(menuHtml(true));break;
 case 'howto':openModal(HOWTO);break;
 case 'menu':openModal(menuHtml(false));break;
 case 'close':closeModal();break;
 case 'save':if(saveTo(v)){toast('Saved to slot '+v+'.');openModal(menuHtml(false));}else toast('Could not save. Browser storage is blocked. Use Export.');break;
 case 'load':{const s=slotInfo(v);if(s&&validState(s)){closeModal();G=null;loadState(s);toast('Loaded.');}else toast('That save is damaged.');break;}
 case 'export':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='lemon-empire-day'+S.day+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break;}
 case 'import':$('#importFile').click();break;
 case 'title':closeModal();G=null;phase='title';S=null;resetSky();playMusic(0);renderAll();break;
 case 'tab':tab=v;renderPanel();break;
 case 'buy':{const[k,i]=v.split(':');const pk=SUP[k].packs[+i];if(S.cash>=pk[1]){S.cash=Math.round((S.cash-pk[1])*100)/100;S.spent+=pk[1];S.inv[k]+=pk[0];sfx('buy');}else sfx('err');renderAll();break;}
 case 'rec':{const[k,d]=v.split(':');const lim={L:[1,10],S:[0,10],ice:[0,6]}[k];S.recipe[k]=clamp(S.recipe[k]+(+d),lim[0],lim[1]);renderPanel();break;}
 case 'price':S.price=clamp(Math.round((S.price+(+v))*100)/100,0.05,9.95);renderPanel();break;
 case 'upg':{const u=UPG.find(x=>x.id===v);if(u&&!S.upg[v]&&S.cash>=u.cost&&u.tier<=S.tier&&(!u.req||S.upg[u.req])){S.cash-=u.cost;S.spent+=u.cost;S.upg[v]=true;sfx('level');toast(u.name+' installed!');}renderAll();break;}
 case 'loc':{const l=locById(v);if(l&&l.tier<=S.tier){S.loc=v;AMB.length=0;toast('Moved to '+l.name+'.');}renderAll();break;}
 case 'helper':S.helper=!S.helper;renderAll();break;
 case 'tierup':{const t=tierDef();if(goalsMet()&&S.cash>=t.next&&!TIERS[S.tier+1].future){S.cash-=t.next;S.spent+=t.next;S.tier++;sfx('level');playMusic(tierDef().music);
  openModal('<div class="h" style="font-size:14px">🎉 '+tierDef().name.toUpperCase()+' UNLOCKED!</div><p>'+t.unlock+'</p><p class="dim">Check the LOCATION, STAFF and UPGRADES tabs.</p><div class="row" style="justify-content:flex-end"><button class="btn sm grn" data-a="close">LET\'S GO</button></div>');}
  renderAll();break;}
 case 'loan':{const amt=+v,cap=tierDef().loan;if(S.loan+amt*1.1<=cap+0.001){S.loan=Math.round((S.loan+amt*1.1)*100)/100;S.cash+=amt;sfx('coin');}renderAll();break;}
 case 'repay':{const p=Math.min(S.loan,S.cash);S.loan=Math.round((S.loan-p)*100)/100;S.cash=Math.round((S.cash-p)*100)/100;renderAll();break;}
 case 'grandma':S.cash+=5;S.grandma++;toast('Grandma slipped you $5. Don\'t waste it.');renderAll();break;
 case 'open':startDay();break;
 case 'speed':if(G){G.speed=+v;renderPanel();}break;
 case 'next':closeModal();phase='prep';tab='supplies';saveTo('auto');renderAll();break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v);});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&phase!=='report')closeModal();});
$('#importFile').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const s=JSON.parse(rd.result);if(!validState(s))throw 0;closeModal();G=null;loadState(s);toast('Save imported. Day '+S.day+'.');}catch(err){toast('That file isn\'t a LEMON EMPIRE save.');}e.target.value='';};
 rd.readAsText(f);
});

/* ================= main loop ================= */
let last=performance.now();
function frame(now){const dt=Math.min(0.1,(now-last)/1000);last=now;try{tick(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}
resetSky();playMusic(0);renderAll();requestAnimationFrame(frame);
</script>
</body>
</html>
