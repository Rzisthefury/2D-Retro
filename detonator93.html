<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DETONATOR '93</title>
</head>
<body>
<style>
  html,body{margin:0;padding:0;background:#07080c;color:#c8d2e0;height:100%;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none;
    touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#141926 0%,#07080c 72%);}
  #stage{display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;
    box-shadow:0 0 0 2px #1d2330,0 10px 40px rgba(0,0,0,.75);}

  /* ---- touch controls, outside the screen ---- */
  #pad{position:fixed;inset:0;pointer-events:none;display:none;z-index:20;}
  #pad.on{display:block;}
  .zone{position:absolute;pointer-events:auto;}
  #zoneL{left:0;}
  #zoneR{right:0;}
  #stickBase{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
    background:rgba(120,150,200,.10);border:3px solid rgba(150,180,220,.28);
    opacity:0;transition:opacity .12s;pointer-events:none;}
  #stickBase.live{opacity:1;}
  #knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;
    background:rgba(200,220,245,.30);border:3px solid rgba(220,235,255,.55);
    box-shadow:0 4px 14px rgba(0,0,0,.5);}
  #hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    color:#46536b;font-size:13px;letter-spacing:2px;pointer-events:none;text-align:center;line-height:1.6;}
  .btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;letter-spacing:1px;color:#e8eef5;pointer-events:auto;
    background:radial-gradient(circle at 35% 30%,#4a5670,#252c3c);
    border:3px solid #6a7894;box-shadow:0 5px 0 #151a26,0 8px 18px rgba(0,0,0,.55);
    text-shadow:0 2px 0 rgba(0,0,0,.6);}
  .btn.hit{transform:translateY(4px);box-shadow:0 1px 0 #151a26;
    background:radial-gradient(circle at 35% 30%,#7d8ca8,#3a4358);}
  #bA{background:radial-gradient(circle at 35% 30%,#d98a3a,#8a4a12);border-color:#f0b464;}
  #bA.hit{background:radial-gradient(circle at 35% 30%,#ffc47a,#a85c18);}
  #bB{background:radial-gradient(circle at 35% 30%,#3f7fbf,#1d4478);border-color:#6aa8e0;}
  #bB.hit{background:radial-gradient(circle at 35% 30%,#78b8f0,#2a5a96);}
  .sbtn{position:absolute;pointer-events:auto;padding:9px 16px;border-radius:9px;
    font-size:12px;letter-spacing:2px;color:#c8d2e0;background:#242b3a;border:2px solid #48536a;
    box-shadow:0 3px 0 #151a26;}
  .sbtn.hit{transform:translateY(2px);box-shadow:0 1px 0 #151a26;background:#39445a;}
</style>
<div id="wrap">
  <div id="stage"><canvas id="screen"></canvas></div>
</div>

    <div id="hint">DRAG<br>TO MOVE</div>

  </div>

    <div class="btn" id="bB">II</div>

<script>
/* ============================================================
   DETONATOR '93  -  core constants, tables, math, stage model
   ============================================================ */
'use strict';

/* ---- geometry ------------------------------------------------ */
var T = 16;                       // logical tile size
/* The window never changes size.  The STAGE can be bigger than it,
   and then the camera scrolls - so COLS/ROWS are the current stage,
   VIEW_COLS/VIEW_ROWS are what fits on screen at once. */
var VIEW_COLS = 15, VIEW_ROWS = 13;
var COLS = 15, ROWS = 13;         // set per stage by loadStage()
var BIG_COLS = 25, BIG_ROWS = 21; // the stretched shapes
var HUD_H = 32;
var VIEW_W = VIEW_COLS * T;                 // 240
var VIEW_H = HUD_H + VIEW_ROWS * T;         // 240
var FIELD_H = VIEW_ROWS * T;                // 208

/* ---- tile ids ------------------------------------------------ */
var TL_EMPTY = 0, TL_HARD = 1, TL_SOFT = 2, TL_BREAK = 3;

/* ---- tuning (documented values from the original) ------------ */
var FIRE_MAX  = 8;   // Michael raised this from the documented 5
var BOMB_MAX  = 10;   // caps at 10 simultaneous bombs
var SPEED_MAX = 5;    // 5 speed levels
var SPEED_PX  = [0, 54, 68, 84, 102, 124];   // px/sec by level 1..5
var FUSE      = 2.5;  // seconds before a bomb blows
var BLAST_T   = 0.52; // explosion lifetime
var KICK_PX   = 120;  // kicked bomb slide speed
var STAGE_TIME = 420; // 7:00
var BIG_TIME   = 500; // 8:20 - a stretched stage needs the extra ground time
var BOSS_TIME  = 540; // 9:00
var VEST_T    = 20;   // shield duration
var VEST_STREAM = 0.15;  // while the vest is on, held-button blasts fire this often
var FREEZE_T  = 20;   // stopwatch duration
var CURSE_T   = 20;
var START_LIVES = 5;
var BOSS_GRACE  = 2.0;   // a boss holds still this long when the stage opens
var BURROW = { sink: 0.40, tunnel: 0.75, warn: 0.62, rise: 0.45 };  // telegraph beats
var TIMEOUT_SWARM = 12;   // Pontan-style rush when the clock runs out

/* ---- rng ----------------------------------------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var RND = Math.random;
function seedRng(s) { RND = mulberry32(s >>> 0); }
function rf(a, b) { return a + RND() * (b - a); }
function ri(a, b) { return Math.floor(a + RND() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(RND() * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(RND() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---- power-up ids -------------------------------------------- */
var IT = {
  FIRE: 1, BOMB: 2, SKATE: 3, SLOW: 4, REMOTE: 5, KICK: 6, LINE: 7,
  WALLPASS: 8, BOMBPASS: 9, VEST: 10, HEART: 11, LIFE: 12, CLOCK: 13, CURSE: 14,
  F_APPLE: 20, F_FLOWER: 21, F_BANANA: 22, F_APRICOT: 23, F_PINE: 24
};
var ITEM_INFO = {};
ITEM_INFO[IT.FIRE]     = { name: 'FIRE',        score: 100,  desc: 'Blast reach +1' };
ITEM_INFO[IT.BOMB]     = { name: 'BOMB',        score: 100,  desc: 'Carry one more bomb' };
ITEM_INFO[IT.SKATE]    = { name: 'SKATES',      score: 100,  desc: 'Move faster' };
ITEM_INFO[IT.SLOW]     = { name: 'LEAD BOOTS',  score: 0,    desc: 'Move slower' };
ITEM_INFO[IT.REMOTE]   = { name: 'DETONATOR',   score: 1000, desc: 'Hold II to blow bombs' };
ITEM_INFO[IT.KICK]     = { name: 'KICK',        score: 1000, desc: 'Shove bombs, II to stop' };
ITEM_INFO[IT.LINE]     = { name: 'LINE BOMB',   score: 1000, desc: 'Tap I twice for a row' };
ITEM_INFO[IT.WALLPASS] = { name: 'PHASE',       score: 1000, desc: 'Walk through brick' };
ITEM_INFO[IT.BOMBPASS] = { name: 'BOMB PASS',   score: 1000, desc: 'Walk through bombs' };
ITEM_INFO[IT.VEST]     = { name: 'VEST',        score: 1000, desc: 'Blast-proof, 20 sec' };
ITEM_INFO[IT.HEART]    = { name: 'HEART',       score: 1000, desc: 'Soaks one hit' };
ITEM_INFO[IT.LIFE]     = { name: '1-UP',        score: 0,    desc: 'Extra life' };
ITEM_INFO[IT.CLOCK]    = { name: 'STOPWATCH',   score: 500,  desc: 'Freeze foes, 20 sec' };
ITEM_INFO[IT.CURSE]    = { name: 'CURSE',       score: 0,    desc: 'Something goes wrong' };
ITEM_INFO[IT.F_APPLE]  = { name: 'APPLE',       score: 500,  desc: '' };
ITEM_INFO[IT.F_FLOWER] = { name: 'FLOWER',      score: 500,  desc: '' };
ITEM_INFO[IT.F_BANANA] = { name: 'BANANA',      score: 1000, desc: '' };
ITEM_INFO[IT.F_APRICOT]= { name: 'APRICOT',     score: 2000, desc: '' };
ITEM_INFO[IT.F_PINE]   = { name: 'PINEAPPLE',   score: 4000, desc: '' };

/* pool the generator draws from, weighted */
var ITEM_POOL = [
  [IT.FIRE, 22], [IT.BOMB, 20], [IT.SKATE, 13], [IT.KICK, 6], [IT.REMOTE, 4],
  [IT.LINE, 4], [IT.BOMBPASS, 4], [IT.WALLPASS, 3], [IT.VEST, 5], [IT.HEART, 4],
  [IT.CLOCK, 5], [IT.LIFE, 2], [IT.SLOW, 4], [IT.CURSE, 5],
  [IT.F_APPLE, 6], [IT.F_FLOWER, 6], [IT.F_BANANA, 4], [IT.F_APRICOT, 2], [IT.F_PINE, 1]
];
function rollItem() {
  var tot = 0, i;
  for (i = 0; i < ITEM_POOL.length; i++) tot += ITEM_POOL[i][1];
  var n = RND() * tot;
  for (i = 0; i < ITEM_POOL.length; i++) { n -= ITEM_POOL[i][1]; if (n <= 0) return ITEM_POOL[i][0]; }
  return IT.FIRE;
}

/* ---- curses --------------------------------------------------- */
var CURSES = [
  { id: 'reverse', name: 'REVERSED',   t: 20 },
  { id: 'nobomb',  name: 'NO BOMBS',   t: 15 },
  { id: 'autobomb',name: 'ITCHY',      t: 15 },
  { id: 'minfire', name: 'WET FUSE',   t: 20 },
  { id: 'hyper',   name: 'HYPER',      t: 15 },
  { id: 'crawl',   name: 'SLUDGE',     t: 15 },
  { id: 'shortfuse',name:'HAIR TRIGGER',t: 20 }
];

/* ---- worlds --------------------------------------------------- */
/* Seven planets, eight stages each, the eighth is the boss. */
var WORLDS = [
  { id: 0, letter: 'A', name: 'STONEPIT', theme: 'stone',
    pal: { hard1:'#8d8f9e', hard2:'#5a5c6b', hard3:'#3a3c48', soft1:'#b08a5a', soft2:'#7d5f3a', soft3:'#503b23',
           floor1:'#4a4e5e', floor2:'#424654', sky:'#22242e' },
    roster: ['grub','tumbler','chiseler'], boss: 'MAW' },
  { id: 1, letter: 'B', name: 'BLOSSOM', theme: 'garden',
    pal: { hard1:'#7fbf5a', hard2:'#4e8a38', hard3:'#2f5a22', soft1:'#c98fb0', soft2:'#945f80', soft3:'#5e3b52',
           floor1:'#3f6b4a', floor2:'#386043', sky:'#1d3324' },
    roster: ['grub','flutter','thornling','tumbler'], boss: 'HONEYCOMB' },
  { id: 2, letter: 'C', name: 'CINDER', theme: 'fire',
    pal: { hard1:'#a8564a', hard2:'#74332c', hard3:'#4a1d19', soft1:'#e0a24a', soft2:'#a06a24', soft3:'#663f12',
           floor1:'#5c2f2a', floor2:'#522925', sky:'#2a110f' },
    roster: ['ember','flutter','chiseler','lurcher'], boss: 'SLAGHEART' },
  { id: 3, letter: 'D', name: 'WITHER', theme: 'rot',
    pal: { hard1:'#8a8468', hard2:'#5c5745', hard3:'#3a372b', soft1:'#9a8f6a', soft2:'#6d6449', soft3:'#45402e',
           floor1:'#4e4c3c', floor2:'#464436', sky:'#232219' },
    roster: ['spore','lurcher','flutter','wisp'], boss: 'ROTKING' },
  { id: 4, letter: 'E', name: 'TIDEWASH', theme: 'water',
    pal: { hard1:'#5aa6c9', hard2:'#33708f', hard3:'#1d4459', soft1:'#c9b98f', soft2:'#907f5c', soft3:'#5a4d36',
           floor1:'#2f5f77', floor2:'#2a5569', sky:'#132b38' },
    roster: ['bubbler','spore','darter','wisp'], boss: 'THE CONCH' },
  { id: 5, letter: 'F', name: 'RIME', theme: 'ice',
    pal: { hard1:'#bcd9e8', hard2:'#7fa4bd', hard3:'#4e6a83', soft1:'#8fb8cf', soft2:'#5f8299', soft3:'#3b5468',
           floor1:'#5d7f96', floor2:'#547689', sky:'#20323f' },
    roster: ['frostbit','darter','bubbler','lurcher'], boss: 'THE GLACIER' },
  { id: 6, letter: 'G', name: 'CIRCUIT', theme: 'tech',
    pal: { hard1:'#9aa4b4', hard2:'#5f6878', hard3:'#3a404c', soft1:'#6ad0c0', soft2:'#3d8c80', soft3:'#25564e',
           floor1:'#3c4453', floor2:'#353d4a', sky:'#171c24' },
    roster: ['sentry','darter','frostbit','wisp','ember'], boss: 'OVERSEER' }
];

/* ---- enemy archetypes ---------------------------------------- */
/* pattern:
   wander  - random turns at junctions, never reacts to you
   bounce  - keeps a heading until blocked, then turns
   hunt    - walks toward you when your row/column lines up
   stalk   - full chase, re-decides every tile
   drift   - ignores soft blocks (walks through brick)
   ghost   - ignores every block, hard walls included
   turret  - does not move, fires along its lanes
   split   - bounces; on death leaves two smaller foes
*/
var ENEMY_DEFS = {
  grub:     { name:'GRUB',      speed: 28, pattern:'wander', score: 100,  hp:1, col:'#c66a9b', col2:'#8a3f6a' },
  tumbler:  { name:'TUMBLER',   speed: 42, pattern:'bounce', score: 200,  hp:1, col:'#d9a04a', col2:'#8a6a2a' },
  flutter:  { name:'FLUTTER',   speed: 50, pattern:'drift',  score: 400,  hp:1, col:'#9f7ad6', col2:'#5e448c' },
  chiseler: { name:'CHISELER',  speed: 46, pattern:'hunt',   score: 400,  hp:1, col:'#c8c2a8', col2:'#7d795f' },
  thornling:{ name:'THORNLING', speed: 36, pattern:'split',  score: 300,  hp:1, col:'#7fbf5a', col2:'#3f6b2c' },
  ember:    { name:'EMBER',     speed: 62, pattern:'stalk',  score: 800,  hp:1, col:'#f07a3a', col2:'#a03c14' },
  lurcher:  { name:'LURCHER',   speed: 34, pattern:'hunt',   score: 400,  hp:2, col:'#8a6f4a', col2:'#4f3d26' },
  spore:    { name:'SPORE',     speed: 30, pattern:'split',  score: 300,  hp:1, col:'#b0c060', col2:'#5f6a2c' },
  wisp:     { name:'WISP',      speed: 26, pattern:'ghost',  score: 1000, hp:1, col:'#d6e8ff', col2:'#7c9fc4' },
  bubbler:  { name:'BUBBLER',   speed: 40, pattern:'bounce', score: 200,  hp:1, col:'#6ad0e0', col2:'#2c7d8c' },
  darter:   { name:'DARTER',    speed: 72, pattern:'stalk',  score: 800,  hp:1, col:'#ffd257', col2:'#a07a10' },
  frostbit: { name:'FROSTBIT',  speed: 38, pattern:'drift',  score: 400,  hp:1, col:'#bcd9e8', col2:'#5f8299' },
  sentry:   { name:'SENTRY',    speed: 0,  pattern:'turret', score: 600,  hp:2, col:'#9aa4b4', col2:'#4a5260' },
  pontan:   { name:'PONTAN',    speed: 70, pattern:'ghost',  score: 2000, hp:1, col:'#ff5f7a', col2:'#a01f3a' }
};
ENEMY_DEFS.tumbler.col = '#d9a04a';

/* ============================================================
   STAGE MODEL
   ============================================================ */
function Stage() {
  this.tiles = [];
  this.items = [];      // item id hidden under a soft block, or 0
  this.exit = null;     // {c,r}
  this.exitFound = false;
}

function inBounds(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }

/* Spawn pocket the player always starts in, kept clear. */
var SPAWN_C = 1, SPAWN_R = 1;
function isSpawnPocket(c, r) {
  return (c === 1 && r === 1) || (c === 2 && r === 1) || (c === 1 && r === 2);
}

/* From area 4 on, stages outgrow the screen and alternate shape:
   areas 4 and 6 stretch sideways, areas 5 and 7 stretch downwards. */
function stageShape(stage) {
  if (stage >= 7) return { cols: VIEW_COLS, rows: VIEW_ROWS, big: false };   // boss arena
  if (stage < 3) return { cols: VIEW_COLS, rows: VIEW_ROWS, big: false };
  return (stage % 2 === 1)
    ? { cols: BIG_COLS, rows: VIEW_ROWS, big: true }
    : { cols: VIEW_COLS, rows: BIG_ROWS, big: true };
}
function stageIsBig(stage) { return stageShape(stage).big; }

/* Soft-block density ramps across a world. */
function softDensity(world, stage) {
  return clamp(0.46 + world * 0.018 + stage * 0.012, 0.4, 0.72);
}

function buildStage(world, stage, isBoss) {
  var st = new Stage(), c, r;
  var shape = isBoss ? { cols: VIEW_COLS, rows: VIEW_ROWS, big: false } : stageShape(stage);
  st.cols = shape.cols; st.rows = shape.rows; st.big = shape.big;
  COLS = st.cols; ROWS = st.rows;          // the rest of the build reads these
  for (r = 0; r < ROWS; r++) {
    st.tiles.push([]); st.items.push([]);
    for (c = 0; c < COLS; c++) {
      var hard = (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) ||
                 (r % 2 === 0 && c % 2 === 0);
      st.tiles[r].push(hard ? TL_HARD : TL_EMPTY);
      st.items[r].push(0);
    }
  }
  if (isBoss) return st;   // boss arenas stay open

  /* scatter soft blocks */
  var open = [];
  var d = softDensity(world, stage);
  for (r = 1; r < ROWS - 1; r++) for (c = 1; c < COLS - 1; c++) {
    if (st.tiles[r][c] !== TL_EMPTY) continue;
    if (isSpawnPocket(c, r)) continue;
    if (RND() < d) { st.tiles[r][c] = TL_SOFT; open.push({ c: c, r: r }); }
  }
  if (open.length < 8) {   /* pathological low roll - force a few */
    for (r = 3; r < ROWS - 1 && open.length < 8; r += 2)
      for (c = 3; c < COLS - 1 && open.length < 8; c += 2)
        if (st.tiles[r][c] === TL_EMPTY) { st.tiles[r][c] = TL_SOFT; open.push({ c: c, r: r }); }
  }

  /* exit + items hidden under soft blocks, never the same block */
  shuffle(open);
  var minFar = st.big ? 10 : 5;
  var far = open.filter(function (p) { return Math.abs(p.c - SPAWN_C) + Math.abs(p.r - SPAWN_R) > minFar; });
  var exitCell = far.length ? far[0] : open[0];
  st.exit = { c: exitCell.c, r: exitCell.r };

  /* 2-3 on a normal stage, 3-4 once the stage outgrows the screen */
  var nItems = st.big ? 3 + (RND() < 0.55 ? 1 : 0) : 2 + (RND() < 0.5 ? 1 : 0);
  var placed = 0;
  for (var i = 0; i < open.length && placed < nItems; i++) {
    var p = open[i];
    if (p.c === st.exit.c && p.r === st.exit.r) continue;
    st.items[p.r][p.c] = rollItem();
    placed++;
  }
  return st;
}

/* how many enemies, and of what, for a normal stage */
function stageRoster(world, stage) {
  var w = WORLDS[world], out = [];
  var area = (COLS * ROWS) / (VIEW_COLS * VIEW_ROWS);
  var n = clamp(Math.round((3 + stage * 0.8 + world * 0.5) * Math.min(1.7, area)), 3, 14);
  var pool = w.roster.slice();
  for (var i = 0; i < n; i++) {
    /* later stages lean on the harder tail of the roster */
    var maxIdx = clamp(1 + Math.floor((stage + world) / 2), 1, pool.length);
    out.push(pool[Math.floor(RND() * maxIdx)]);
  }
  if (stage >= 4 && world >= 2 && RND() < 0.5) out.push(pool[pool.length - 1]);
  return out;
}

/* ---- passability --------------------------------------------- */
/* opts: {soft:true} may pass brick, {bomb:true} may pass bombs */
function tileBlocked(st, bombs, c, r, opts) {
  if (!inBounds(c, r)) return true;
  var t = st.tiles[r][c];
  if (t === TL_HARD) return true;
  if ((t === TL_SOFT || t === TL_BREAK) && !(opts && opts.soft)) return true;
  if (!(opts && opts.bomb)) {
    for (var i = 0; i < bombs.length; i++) {
      var b = bombs[i];
      if (b.c === c && b.r === r && !b.pass) return true;
    }
  }
  return false;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { T:T, COLS:COLS, ROWS:ROWS, buildStage:buildStage, seedRng:seedRng,
    TL_EMPTY:TL_EMPTY, TL_HARD:TL_HARD, TL_SOFT:TL_SOFT, TL_BREAK:TL_BREAK,
    IT:IT, WORLDS:WORLDS, ENEMY_DEFS:ENEMY_DEFS, tileBlocked:tileBlocked,
    FIRE_MAX:FIRE_MAX, BOMB_MAX:BOMB_MAX, SPEED_MAX:SPEED_MAX, stageRoster:stageRoster };
}
/* ============================================================
   Sprite bakery.  Everything is drawn with paths into a small
   offscreen canvas, then the alpha is thresholded so the result
   is hard-edged pixel art, then a 1px ink outline is stamped
   around the silhouette.
   ============================================================ */
'use strict';

var PAD = 2;                 // ink + breathing room around a 16x16 cell
var INK = '#140f1c';
var SPR = {};                // name -> canvas

function mk(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h; return c;
}
/* hard-edge the alpha channel so upscaling stays chunky */
function crisp(cv) {
  var x = cv.getContext('2d'), d = x.getImageData(0, 0, cv.width, cv.height), p = d.data, i;
  for (i = 3; i < p.length; i += 4) p[i] = p[i] > 110 ? 255 : 0;
  x.putImageData(d, 0, 0);
}
function tintCopy(src, col) {
  var c = mk(src.width, src.height), x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
/* draw() receives a context already translated so (0,0) is the cell origin */
function baked(w, h, draw, ink) {
  var W = w + PAD * 2, H = h + PAD * 2;
  var inner = mk(W, H), ix = inner.getContext('2d');

/* ---- colour helpers ------------------------------------------ */
function hx(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function rgbs(a) { return 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')'; }
function shade(col, amt) {
  var c = hx(col), i;
  for (i = 0; i < 3; i++) c[i] = Math.max(0, Math.min(255, c[i] + amt));
  return rgbs(c);

/* ---- primitive shapes ---------------------------------------- */

/* ============================================================
   THE HERO  -  "Fuse": angular crest helmet, chevron visor,
   high collar, plated boots.  An original design.
   ============================================================ */
var HERO = { suit: '#2f7fbf', suit2: '#1d5183', helm: '#e8eef5', helm2: '#a9b8c8',
             visor: '#ffb03a', visor2: '#c96f10', boot: '#3a4250', trim: '#ffd257' };

function drawHero(x, dir, step, pal) {
  pal = pal || HERO;
  var bob = step === 1 ? -1 : 0;
  var spread = step === 0 ? 0 : (step === 2 ? 1 : 0);
  var ly = 13 + bob, win = '#1b2130';
  /* boots */
  box(x, 2 - spread, ly, 5, 3, pal.boot);
  box(x, 9 + spread, ly, 5, 3, pal.boot);
  box(x, 2 - spread, ly + 2, 5, 1, shade(pal.boot, -24));
  box(x, 9 + spread, ly + 2, 5, 1, shade(pal.boot, -24));
  /* arms */
  box(x, 0, 9 + bob, 3, 4, pal.suit2);
  box(x, 13, 9 + bob, 3, 4, pal.suit2);

  box(x, 3, 9 + bob, 10, 5, pal.suit);
  box(x, 3, 9 + bob, 10, 1, shade(pal.suit, 30));
  box(x, 3, 12 + bob, 10, 2, pal.suit2);
  box(x, 6, 12 + bob, 4, 2, pal.trim);
  /* helmet - wide dome over a narrow body, the shape that reads at 16px */
  R(x, 8, 5 + bob, 7, 5.2, pal.helm);
  box(x, 1, 5 + bob, 14, 4, pal.helm);
  box(x, 1, 8 + bob, 14, 1, pal.helm2);

  if (dir === 'down') {

    box(x, 5, 5 + bob, 6, 1, shade(pal.helm2, -34));
    box(x, 5, 7 + bob, 6, 1, shade(pal.helm2, -34));

    box(x, 6, 4 + bob, 8, 4, win);
    box(x, 9, 5 + bob, 3, 2, pal.visor);

var HERO_PALE = { suit: '#e8eef5', suit2: '#b9c4d2', helm: '#ffffff', helm2: '#e2e8f0',

/* Flash white, flatten, then pop into a ring of sparks. */

function drawBomb(x, f, remote) {

  R(x, 8, 9, r, r * 0.94, '#22242e');
  R(x, 8, 9, r - 1.4, r * 0.94 - 1.4, '#3a3e4c');
  R(x, 6, 7, 1.8, 1.4, '#8f97a8');
  R(x, 5.4, 6.6, 0.9, 0.7, '#e6ecf5');
  box(x, 7, 1, 2, 3, '#6b5436');
  box(x, 9, 0, 2, 2, '#8a6c46');
  var spark = remote ? '#6ad0ff' : (f === 1 ? '#fff2a8' : '#ff8a2a');
  R(x, 11, 0, 1.8 + (f === 1 ? 0.6 : 0), 1.8, spark);
  R(x, 11, 0, 0.8, 0.8, '#ffffff');
}

function drawBlast(x, kind, f) {
  var t = [0.5, 1, 0.86, 0.5][f];
  var w = 16 * t, o = (16 - w) / 2;
  var c1 = '#ffffff', c2 = '#fff3b0', c3 = '#ffc44a', c4 = '#ff7a2a';
  function bar(bx, by, bw, bh) {
    box(x, bx, by, bw, bh, c4);
    box(x, bx + 1, by + 1, bw - 2, bh - 2, c3);
    box(x, bx + 2, by + 2, bw - 4, bh - 4, c2);
    box(x, bx + 3, by + 3, bw - 6, bh - 6, c1);
  }
  if (kind === 'c') bar(o, o, w, w);
  else if (kind === 'h') bar(0, o, 16, w);
  else if (kind === 'v') bar(o, 0, w, 16);
  else if (kind === 'l') bar(16 - w - 2, o, w + 2, w);
  else if (kind === 'r') bar(0, o, w + 2, w);
  else if (kind === 'u') bar(o, 16 - w - 2, w, w + 2);
  else if (kind === 'd') bar(o, 0, w, w + 2);
}

  var s = S;

  s.isBoss = (stage === 7);
  seedRng(0xB0B0FACE ^ (world * 977 + stage * 131 + 7919));
  s.st = buildStage(world, stage, s.isBoss);
  COLS = s.st.cols; ROWS = s.st.rows;          // the whole sim reads these
  s.bombs = []; s.blasts = []; s.enemies = []; s.shots = []; s.floorItems = []; s.pops = [];
  s.boss = null; s.cleared = false; s.exitOpen = false; s.exitFound = false; s.swarmed = false;
  s.time = s.isBoss ? BOSS_TIME : (s.st.big ? BIG_TIME : STAGE_TIME);
  s.p.x = SPAWN_C * T + T / 2; s.p.y = SPAWN_R * T + T / 2;
  s.p.alive = true; s.p.deadT = 0; s.p.invuln = 1.2; s.p.dir = 'down';
  if (!keepPower) resetPower(s.p);

  else if (CHEAT.maxStats) grantStats(s.p);

}

function openNeighbours(c, r) {
  var n = 0, d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (var i = 0; i < 4; i++) {
    var cc = c + d[i][0], rr = r + d[i][1];
    if (inBounds(cc, rr) && S.st.tiles[rr][cc] === TL_EMPTY) n++;
  }
  return n;
}
function freeCellsFarFromSpawn(minD, minOpen) {
  var out = [], c, r;
  for (r = 1; r < ROWS - 1; r++) for (c = 1; c < COLS - 1; c++) {
    if (S.st.tiles[r][c] !== TL_EMPTY) continue;
    if (Math.abs(c - SPAWN_C) + Math.abs(r - SPAWN_R) < minD) continue;
    if (minOpen && openNeighbours(c, r) < minOpen) continue;
    out.push({ c: c, r: r });
  }
  return out;
}
function spawnEnemy(type, atC, atR) {
  var d = ENEMY_DEFS[type], cell;
  if (atC === undefined) {
    /* a foe sealed inside a brick pocket is dead weight - prefer cells
       with somewhere to walk, and only relax that if there are none */
    var opts = freeCellsFarFromSpawn(5, 2);
    if (!opts.length) opts = freeCellsFarFromSpawn(5, 1);
    if (!opts.length) opts = freeCellsFarFromSpawn(3, 1);
    if (!opts.length) opts = freeCellsFarFromSpawn(3);
    if (!opts.length) return null;
    cell = pick(opts);
  } else cell = { c: atC, r: atR };
  var e = {
    type: type, def: d, x: cell.c * T + T / 2, y: cell.r * T + T / 2,
    dir: pick(['l', 'r', 'u', 'd']), hp: d.hp, alive: true, deadT: 0,
    anim: RND() * 2, hitT: 0, frozenT: 0, fireT: rf(0.6, 2.2), small: false, speedMul: 1,
    tx: cell.c * T + T / 2, ty: cell.r * T + T / 2
  };
  S.enemies.push(e);
  return e;
}

/* ---- boss arena ---------------------------------------------- */
function buildBossArena(st, world) {
  var c, r;
  for (r = 1; r < ROWS - 1; r++) for (c = 1; c < COLS - 1; c++) {
    st.tiles[r][c] = (r % 2 === 0 && c % 2 === 0) ? TL_HARD : TL_EMPTY;
  }
  /* clear a band so the boss can roam */
  for (r = 3; r <= 9; r++) for (c = 3; c <= 11; c++) st.tiles[r][c] = TL_EMPTY;
  /* four anchor pillars */
  st.tiles[4][4] = TL_HARD; st.tiles[4][10] = TL_HARD;
  st.tiles[8][4] = TL_HARD; st.tiles[8][10] = TL_HARD;
  st.exit = null;
}

/* ============================================================
   MOVEMENT
   ============================================================ */
function passFor(ent, isPlayer) {
  if (isPlayer) return { soft: ent.wallpass || CHEAT.phase, bomb: ent.bombpass, hard: CHEAT.phase };
  var pat = ent.def.pattern;
  if (pat === 'ghost') return { soft: true, bomb: true, hard: true };
  if (pat === 'drift') return { soft: true, bomb: false };
  return { soft: false, bomb: false };
}
function cellBlocked(c, r, opts, ent) {
  if (!inBounds(c, r)) return true;
  var t = S.st.tiles[r][c];
  if (t === TL_HARD) return !(opts && opts.hard);
  if ((t === TL_SOFT || t === TL_BREAK) && !(opts && opts.soft)) return true;
  if (!(opts && opts.bomb)) {
    for (var i = 0; i < S.bombs.length; i++) {
      var b = S.bombs[i];
      if (b.c === c && b.r === r) {
        if (ent && b.passFor === ent) continue;   /* standing on your own fresh bomb */
        return true;
      }
    }
  }
  return false;
}

/* Axis move with lane snapping + corner slip, the Bomberman feel. */
function moveEnt(ent, dx, dy, px, opts, isPlayer) {
  if (!dx && !dy) return false;
  var moved = false;
  if (dx) {
    var lane = Math.floor(ent.y / T) * T + T / 2;
    var off = ent.y - lane;
    if (Math.abs(off) > 0.6) {
      var st = Math.min(Math.abs(off), px) * (off > 0 ? -1 : 1);
      ent.y += st; moved = true;
    } else {
      ent.y = lane;
      var nc = Math.floor((ent.x + dx * (T / 2 - 1) + dx * px) / T), nr = Math.floor(ent.y / T);
      if (!cellBlocked(nc, nr, opts, ent)) { ent.x += dx * px; moved = true; }
      else {
        /* slip around a corner if a lane is open one row off */
        var cc = Math.floor(ent.x / T);
        for (var d = -1; d <= 1; d += 2) {
          if (!cellBlocked(cc, nr + d, opts, ent) && !cellBlocked(cc + dx, nr + d, opts, ent)) {
            ent.y += d * px * 0.85; moved = true; break;
          }
        }
      }
    }
  } else if (dy) {
    var lane2 = Math.floor(ent.x / T) * T + T / 2;
    var off2 = ent.x - lane2;
    if (Math.abs(off2) > 0.6) {
      var st2 = Math.min(Math.abs(off2), px) * (off2 > 0 ? -1 : 1);
      ent.x += st2; moved = true;
    } else {
      ent.x = lane2;
      var nr2 = Math.floor((ent.y + dy * (T / 2 - 1) + dy * px) / T), nc2 = Math.floor(ent.x / T);
      if (!cellBlocked(nc2, nr2, opts, ent)) { ent.y += dy * px; moved = true; }
      else {
        var rr = Math.floor(ent.y / T);
        for (var d2 = -1; d2 <= 1; d2 += 2) {
          if (!cellBlocked(nc2 + d2, rr, opts, ent) && !cellBlocked(nc2 + d2, rr + dy, opts, ent)) {
            ent.x += d2 * px * 0.85; moved = true; break;
          }
        }
      }
    }
  }
  ent.x = clamp(ent.x, T / 2, (COLS - 0.5) * T);
  ent.y = clamp(ent.y, T / 2, (ROWS - 0.5) * T);
  return moved;
}

   BOMBS AND BLAST

function placeBomb(p, c, r) {
  if (p.curse === 'nobomb') return false;
  var live = 0, i;
  for (i = 0; i < S.bombs.length; i++) if (S.bombs[i].owner === p) live++;
  if (live >= p.maxBombs) return false;
  for (i = 0; i < S.bombs.length; i++) if (S.bombs[i].c === c && S.bombs[i].r === r) return false;
  if (S.st.tiles[r][c] !== TL_EMPTY) return false;
  var fuse = p.curse === 'shortfuse' ? 0.85 : FUSE;
  S.bombs.push({
    c: c, r: r, x: c * T + T / 2, y: r * T + T / 2,
    t: fuse, owner: p, fire: (p.curse === 'minfire' ? 1 : p.fire),
    remote: p.remote, passFor: p, vx: 0, vy: 0, anim: 0
  });
  sfx('place');
  return true;
}

function detonateAll(p) {
  var any = false;
  for (var i = 0; i < S.bombs.length; i++) if (S.bombs[i].owner === p) { S.bombs[i].t = 0; any = true; }
  return any;
}

function bombAt(c, r) {
  for (var i = 0; i < S.bombs.length; i++) if (S.bombs[i].c === c && S.bombs[i].r === r) return S.bombs[i];
  return null;
}

function explode(b) {
  var idx = S.bombs.indexOf(b);
  if (idx >= 0) S.bombs.splice(idx, 1);
  var cells = [{ c: b.c, r: b.r, kind: 'c' }];
  var dirs = [[1, 0, 'h', 'r'], [-1, 0, 'h', 'l'], [0, 1, 'v', 'd'], [0, -1, 'v', 'u']];
  for (var d = 0; d < 4; d++) {
    var dx = dirs[d][0], dy = dirs[d][1];
    for (var n = 1; n <= b.fire; n++) {
      var c = b.c + dx * n, r = b.r + dy * n;
      if (!inBounds(c, r)) break;
      var t = S.st.tiles[r][c];
      if (t === TL_HARD) break;
      if (t === TL_SOFT) { breakBlock(c, r); cells.push({ c: c, r: r, kind: 'c' }); break; }
      cells.push({ c: c, r: r, kind: (n === b.fire) ? dirs[d][3] : dirs[d][2] });
      var ob = bombAt(c, r);
      if (ob && ob.t > 0.02) { ob.t = 0.02; }
    }
  }
  for (var i = 0; i < cells.length; i++) {
    S.blasts.push({ c: cells[i].c, r: cells[i].r, kind: cells[i].kind, t: BLAST_T });
    hitCell(cells[i].c, cells[i].r);
  }
  if (b.stream) {
    S.shake = Math.max(S.shake, 0.06);
    S.flash = Math.max(S.flash, 0.05);
    sfx('zap');
  } else {
    S.shake = Math.max(S.shake, 0.18);
    S.flash = Math.max(S.flash, 0.12);
    sfx('boom');
  }
}

function breakBlock(c, r) {
  S.st.tiles[r][c] = TL_BREAK;
  S.pops.push({ kind: 'break', c: c, r: r, t: 0.34 });
}

/* what a blast tile does to whatever is standing on it */
function hitCell(c, r) {
  var i;
  /* revealed floor item destroyed -> the original's punishment */
  for (i = S.floorItems.length - 1; i >= 0; i--) {
    var it = S.floorItems[i];
    if (it.c === c && it.r === r) {
      S.floorItems.splice(i, 1);
      S.pops.push({ kind: 'text', x: c * T + T / 2, y: r * T, t: 1.0, s: 'BURNED!' });
      for (var k = 0; k < 4; k++) spawnPunisher();
    }
  }
  /* exit bombed -> three more foes */
  if (S.st.exit && !S.exitFound && !S.exitOpen && S.st.exit.c === c && S.st.exit.r === r &&
      S.st.tiles[r][c] === TL_EMPTY && !S.cleared) {
    if (!S.exitHitT || S.t - S.exitHitT > 1) {
      S.exitHitT = S.t;
      for (var m = 0; m < 3; m++) spawnPunisher();
      S.pops.push({ kind: 'text', x: c * T + T / 2, y: r * T, t: 1.0, s: 'AMBUSH!' });
    }
  }
}
function spawnPunisher() {

}

function blastAt(c, r) {

/* ============================================================
   ENEMY AI
   ============================================================ */
var DIRV = { l: [-1, 0], r: [1, 0], u: [0, -1], d: [0, 1] };
var DIRLIST = ['l', 'r', 'u', 'd'];
function opposite(d) { return { l: 'r', r: 'l', u: 'd', d: 'u' }[d]; }

function canStep(e, dir, opts) {
  var v = DIRV[dir];
  var c = Math.round((e.x - T / 2) / T) + v[0], r = Math.round((e.y - T / 2) / T) + v[1];
  return !cellBlocked(c, r, opts, e);
}
/* Enemies walk tile to tile toward a target centre.  Deciding only on
   arrival (rather than on a proximity test) is what keeps them from
   snapping back to the same tile every frame. */
function enemyStep(e, dt, opts) {
  var step = e.def.speed * e.speedMul * dt;
  if (e.tx === undefined) { e.tx = e.x; e.ty = e.y; }
  var dx = e.tx - e.x, dy = e.ty - e.y;
  var dist = Math.abs(dx) + Math.abs(dy);
  if (dist > step) {
    if (dx) e.x += Math.sign(dx) * Math.min(step, Math.abs(dx));
    if (dy) e.y += Math.sign(dy) * Math.min(step, Math.abs(dy));
    return;
  }
  e.x = e.tx; e.y = e.ty;
  enemyThink(e, opts);
  var v = DIRV[e.dir];
  var c = Math.round((e.x - T / 2) / T) + v[0], r = Math.round((e.y - T / 2) / T) + v[1];
  if (!cellBlocked(c, r, opts, e)) { e.tx = c * T + T / 2; e.ty = r * T + T / 2; }
  else { e.tx = e.x; e.ty = e.y; }
}

/* breadth-first step toward the player */
function bfsDir(e, opts) {
  var sc = Math.round((e.x - T / 2) / T), sr = Math.round((e.y - T / 2) / T);
  var tc = Math.round((S.p.x - T / 2) / T), tr = Math.round((S.p.y - T / 2) / T);
  if (sc === tc && sr === tr) return null;
  var seen = {}, q = [{ c: sc, r: sr, first: null, d: 0 }];
  seen[sc + ',' + sr] = 1;
  while (q.length) {
    var n = q.shift();
    if (n.d > 14) break;
    for (var i = 0; i < 4; i++) {
      var dir = DIRLIST[i], v = DIRV[dir];
      var c = n.c + v[0], r = n.r + v[1], key = c + ',' + r;
      if (seen[key]) continue;
      if (cellBlocked(c, r, opts, e)) continue;
      seen[key] = 1;
      var f = n.first || dir;
      if (c === tc && r === tr) return f;
      q.push({ c: c, r: r, first: f, d: n.d + 1 });
    }
  }
  return null;
}

function enemyThink(e, opts) {
  var pat = e.def.pattern;
  var pc = Math.round((S.p.x - T / 2) / T), pr = Math.round((S.p.y - T / 2) / T);
  var ec = Math.round((e.x - T / 2) / T), er = Math.round((e.y - T / 2) / T);
  var options = DIRLIST.filter(function (d) { return canStep(e, d, opts); });
  if (!options.length) { e.dir = opposite(e.dir); return; }

  if (pat === 'wander') {
    if (canStep(e, e.dir, opts) && RND() < 0.72) return;
    e.dir = pick(options);
  } else if (pat === 'bounce' || pat === 'drift') {
    if (canStep(e, e.dir, opts) && RND() < 0.9) return;
    var fwd = options.filter(function (d) { return d !== opposite(e.dir); });
    e.dir = fwd.length ? pick(fwd) : pick(options);
  } else if (pat === 'hunt') {
    /* walks at you when a clear lane lines up, otherwise bounces */
    var want = null, n, ok;
    if (er === pr) {
      var step = pc > ec ? 1 : -1; ok = true;
      for (n = ec + step; n !== pc + step; n += step) if (cellBlocked(n, er, opts, e)) { ok = false; break; }
      if (ok && pc !== ec) want = step > 0 ? 'r' : 'l';
    }
    if (!want && ec === pc) {
      var step2 = pr > er ? 1 : -1; ok = true;
      for (n = er + step2; n !== pr + step2; n += step2) if (cellBlocked(ec, n, opts, e)) { ok = false; break; }
      if (ok && pr !== er) want = step2 > 0 ? 'd' : 'u';
    }
    if (want && options.indexOf(want) >= 0) { e.dir = want; return; }
    if (canStep(e, e.dir, opts) && RND() < 0.85) return;
    e.dir = pick(options);
  } else if (pat === 'stalk') {
    var b = (RND() < 0.82) ? bfsDir(e, opts) : null;
    if (b && options.indexOf(b) >= 0) { e.dir = b; return; }
    if (canStep(e, e.dir, opts) && RND() < 0.7) return;
    e.dir = pick(options);
  } else if (pat === 'split') {
    if (canStep(e, e.dir, opts) && RND() < 0.85) return;
    e.dir = pick(options);
  }
}

function updateEnemy(e, dt) {
  if (!e.alive) { e.deadT -= dt; return; }
  e.anim += dt * 3.2;
  if (e.hitT > 0) e.hitT -= dt;
  if (e.frozenT > 0) { e.frozenT -= dt; return; }
  var pat = e.def.pattern;
  var opts = passFor(e, false);

  if (pat === 'turret') {
    e.fireT -= dt;
    if (e.fireT <= 0) {
      e.fireT = rf(1.6, 2.6);
      var ec = Math.round((e.x - T / 2) / T), er = Math.round((e.y - T / 2) / T);
      var pc = Math.round((S.p.x - T / 2) / T), pr = Math.round((S.p.y - T / 2) / T);
      if (ec === pc || er === pr) {
        var v = ec === pc ? [0, pr > er ? 1 : -1] : [pc > ec ? 1 : -1, 0];
        S.shots.push({ x: e.x, y: e.y, vx: v[0] * 78, vy: v[1] * 78, t: 3, col: e.def.col });
      }
    }
    return;
  }
  if (pat === 'ghost') {
    /* Aimless.  It floats through everything in a straight line and
       bounces off the edge of the stage - it never hunts you, so it
       is a hazard to read rather than a chase you cannot win. */
    if (e.gvx === undefined) {
      var a0 = RND() * Math.PI * 2;
      e.gvx = Math.cos(a0); e.gvy = Math.sin(a0); e.gT = rf(3.5, 7);
    }
    e.gT -= dt;
    if (e.gT <= 0) {
      e.gT = rf(3.5, 7);
      var a1 = RND() * Math.PI * 2;
      e.gvx = Math.cos(a1); e.gvy = Math.sin(a1);
    }
    var sp = e.def.speed * e.speedMul * dt;
    var loX = T / 2, hiX = (COLS - 0.5) * T, loY = T / 2, hiY = (ROWS - 0.5) * T;
    var nx = e.x + e.gvx * sp, ny = e.y + e.gvy * sp;
    if (nx < loX || nx > hiX) { e.gvx *= -1; nx = clamp(nx, loX, hiX); }
    if (ny < loY || ny > hiY) { e.gvy *= -1; ny = clamp(ny, loY, hiY); }
    e.x = nx; e.y = ny;
    return;
  }
  enemyStep(e, dt, opts);
}

function killEnemy(e) {
  if (!e.alive) return;
  e.hp--;
  e.hitT = 0.18;
  if (e.hp > 0) { sfx('bosshit'); return; }
  e.alive = false; e.deadT = 0.42;
  S.score += e.def.score * (e.small ? 0.5 : 1);
  S.pops.push({ kind: 'text', x: e.x, y: e.y - 6, t: 0.9, s: '' + Math.floor(e.def.score * (e.small ? 0.5 : 1)) });
  sfx('kill');
  if (e.def.pattern === 'split' && !e.small) {
    for (var i = 0; i < 2; i++) {
      var ne = spawnEnemy(e.type, Math.round((e.x - T / 2) / T), Math.round((e.y - T / 2) / T));
      if (ne) { ne.small = true; ne.speedMul = 1.45; ne.dir = i ? 'l' : 'r'; ne.def = e.def; }
    }
  }
}

/* ============================================================
   BOSS UPDATE
   ============================================================ */
function bossRect(b) {
  return { x: b.x - b.def.w / 2, y: b.y - b.def.h / 2, w: b.def.w, h: b.def.h };
}
/* A boss can be more than one body.  The Conch is two shells, and both
   have to block, hurt and take damage or the second one is scenery. */
function bossParts(b) {
  var d = b.def, out = [bossRect(b)];
  if (d.move === 'twin') out.push({ x: b.x + b.twinX - d.w / 2, y: b.y - d.h / 2, w: d.w, h: d.h });
  return out;
}
/* Underground, tunnelling or still climbing out: it cannot touch you,
   and you cannot bomb it.  Nothing hurts without being on screen first. */
function bossHarmless(b) {
  if (!b || b.dead) return true;
  if (b.grace > 0) return true;                       // inert during the opening beat
  if (b.def.move === 'burrow') return b.state !== 'idle';
  return false;
}
/* Damage has its own gate: the opening grace does not protect it,
   only being underground does. */
function bossShielded(b) {
  if (!b || b.dead) return true;
  if (b.def.move === 'burrow') return b.state !== 'idle';
  return false;
}
function bossBlastHit(b) {
  var parts = bossParts(b), i, c, rr;
  for (i = 0; i < parts.length; i++) {
    var r = parts[i];
    var c0 = Math.floor(r.x / T), c1 = Math.floor((r.x + r.w) / T);
    var r0 = Math.floor(r.y / T), r1 = Math.floor((r.y + r.h) / T);
    for (c = c0; c <= c1; c++) for (rr = r0; rr <= r1; rr++) if (blastAt(c, rr)) return true;
  }
  return false;
}
function bossTouching(b, px, py, pad) {
  var parts = bossParts(b), i;
  pad = pad || 0;
  for (i = 0; i < parts.length; i++) {
    var r = parts[i];
    if (px > r.x - pad && px < r.x + r.w + pad && py > r.y - pad && py < r.y + r.h + pad) return true;
  }
  return false;
}
function bossDamage(b) {
  if (b.hitT > 0 || bossShielded(b)) return;
  if (!bossBlastHit(b)) return;
  var d = b.def, vulnerable = true;
  if (d.weak === 'window' || d.weak === 'shield' || d.weak === 'back') vulnerable = b.exposed;
  if (vulnerable) {
    b.hp--; b.hitT = 0.9; S.shake = 0.3; sfx('bosshit');
    S.pops.push({ kind: 'text', x: b.x, y: b.y - 18, t: 0.8, s: 'HIT' });
    if (b.hp <= 0) { b.dead = true; b.deadT = 0; S.score += 10000; sfx('clear'); }
  } else { b.hitT = 0.45; sfx('bad'); }
}
function updateBoss(b, dt) {
  if (b.dead) { b.deadT += dt; return; }
  b.t += dt; b.spin += dt * 1.4;
  if (b.hitT > 0) b.hitT -= dt;

  /* opening grace: it is on screen, it can be hit, it does not act yet */
  if (b.grace > 0) {
    b.grace -= dt;
    b.exposed = true;
    bossDamage(b);
    return;
  }

  b.stateT -= dt;
  var d = b.def, lo = T * 1.5, hi = (COLS - 1.5) * T, ty = T * 1.5, by = (ROWS - 1.5) * T;

  switch (d.move) {
    /* ---------------------------------------------------------
       MAW.  It used to vanish and reappear on top of you with no
       warning at all.  Now every surfacing is announced: it sinks
       where it stands, its shadow tunnels across the floor to the
       spot it has chosen, sits there swelling for a beat, and only
       then climbs out.  Nearly two seconds of notice, all of it
       readable on the floor.
       --------------------------------------------------------- */
    case 'burrow':
      b.exposed = (b.state === 'idle');
      if (b.state === 'idle') {
        if (b.stateT <= 0) {
          b.state = 'sink'; b.stateT = BURROW.sink;
          b.sx = b.x; b.sy = b.y;
          /* Surface NEAR the player but never underneath, and never so
             close to where it sank that the tunnel is too short to read. */
          var ang, dist, tries = 0;
          do {
            ang = RND() * Math.PI * 2; dist = rf(32, 58);
            b.tx = clamp(S.p.x + Math.cos(ang) * dist, lo, hi);
            b.ty = clamp(S.p.y + Math.sin(ang) * dist, ty, by);
            tries++;
          } while (tries < 16 && (Math.hypot(b.tx - S.p.x, b.ty - S.p.y) < 26 ||
                                  Math.hypot(b.tx - b.sx, b.ty - b.sy) < 34));
          if (Math.hypot(b.tx - b.sx, b.ty - b.sy) < 34) {
            var vx2 = b.tx - b.sx, vy2 = b.ty - b.sy, L2 = Math.hypot(vx2, vy2) || 1;
            b.tx = clamp(b.sx + vx2 / L2 * 40, lo, hi);
            b.ty = clamp(b.sy + vy2 / L2 * 40, ty, by);
          }
        }
      } else if (b.state === 'sink') {
        if (b.stateT <= 0) { b.state = 'tunnel'; b.stateT = BURROW.tunnel; }
      } else if (b.state === 'tunnel') {
        var k = 1 - Math.max(0, b.stateT) / BURROW.tunnel;
        b.x = b.sx + (b.tx - b.sx) * k;
        b.y = b.sy + (b.ty - b.sy) * k;
        if (RND() < 0.35) S.pops.push({ kind: 'dust', x: b.x + rf(-6, 6), y: b.y + rf(-4, 4), t: 0.45 });
        if (b.stateT <= 0) { b.x = b.tx; b.y = b.ty; b.state = 'warn'; b.stateT = BURROW.warn; }
      } else if (b.state === 'warn') {
        b.x = b.tx; b.y = b.ty;
        if (RND() < 0.5) S.pops.push({ kind: 'dust', x: b.x + rf(-10, 10), y: b.y + rf(-6, 6), t: 0.4 });
        if (b.stateT <= 0) { b.state = 'rise'; b.stateT = BURROW.rise; S.shake = Math.max(S.shake, 0.18); }
      } else if (b.state === 'rise') {
        if (b.stateT <= 0) {
          b.state = 'idle'; b.stateT = rf(1.8, 2.6); b.exposed = true;
          S.shake = Math.max(S.shake, 0.22);
          for (var i = 0; i < 4; i++) {
            var a = b.t + i * Math.PI / 2;
            S.shots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 64, vy: Math.sin(a) * 64, t: 3, col: d.acc });
          }
        }
      }
      break;

    /* HONEYCOMB: drones no longer pop into existence on top of you -
       a ring pulses first, then they hatch on the diagonals. */
    case 'static':
      b.exposed = (Math.sin(b.spin * 1.1) > 0.1);
      if (b.spawnWarn > 0) {
        b.spawnWarn -= dt;
        if (b.spawnWarn <= 0) {
          var off = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
          for (var j = 0; j < 2; j++) {
            var o = off[Math.floor(RND() * 4)];
            var cc = clamp(Math.round((b.x - T / 2) / T) + o[0] * 2, 1, COLS - 2);
            var rr2 = clamp(Math.round((b.y - T / 2) / T) + o[1] * 2, 1, ROWS - 2);
            var e = spawnEnemy('flutter', cc, rr2);
            if (e) e.speedMul = 1.2;
          }
          b.stateT = rf(2.6, 3.6);
        }
      } else if (b.stateT <= 0) {
        b.spawnWarn = 0.7;
        S.pops.push({ kind: 'text', x: b.x, y: b.y - 26, t: 0.8, s: 'HATCHING' });
      }
      break;

    case 'chase':
      var dx = S.p.x - b.x, dy = S.p.y - b.y, L = Math.hypot(dx, dy) || 1;
      b.x += dx / L * 34 * dt; b.y += dy / L * 34 * dt;
      b.x = clamp(b.x, lo, hi); b.y = clamp(b.y, ty, by);
      if (b.stateT <= 0) {
        b.stateT = 0.6;
        S.shots.push({ x: b.x, y: b.y, vx: 0, vy: 0, t: 3.0, col: d.acc, still: true });
      }
      break;

    case 'patrol':
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < lo || b.x > hi) { b.vx *= -1; b.x = clamp(b.x, lo, hi); }
      if (b.y < ty || b.y > by) { b.vy *= -1; b.y = clamp(b.y, ty, by); }
      if (b.stateT <= 0) {
        b.stateT = rf(1.4, 2.2);
        for (var k2 = 0; k2 < 3; k2++) {
          var ang2 = Math.atan2(S.p.y - b.y, S.p.x - b.x) + (k2 - 1) * 0.5;
          S.shots.push({ x: b.x, y: b.y, vx: Math.cos(ang2) * 58, vy: Math.sin(ang2) * 58, t: 3, col: d.acc });
        }
      }
      break;

    case 'twin':
      b.x = (COLS - 1) / 2 * T + T / 2 + Math.sin(b.t * 0.7) * 46;
      b.y = ty + 30 + Math.sin(b.t * 1.3) * 16;
      if (b.stateT <= 0) {
        b.stateT = rf(1.0, 1.8);
        var a2 = Math.atan2(S.p.y - b.y, S.p.x - b.x);
        S.shots.push({ x: b.x, y: b.y, vx: Math.cos(a2) * 52, vy: Math.sin(a2) * 52, t: 4, col: d.acc, wob: true });
        S.shots.push({ x: b.x + b.twinX, y: b.y, vx: Math.cos(a2) * 52, vy: Math.sin(a2) * 52, t: 4, col: d.acc, wob: true });
      }
      break;

    /* THE GLACIER: the charge now announces itself - it rears, the
       ground rumbles, and chevrons point down the lane it will take. */
    case 'charge':
      if (b.state === 'idle') {
        b.x = clamp(b.x + Math.sin(b.t) * 22 * dt, lo, hi);
        b.y = clamp(b.y, ty, by);
        if (b.stateT <= 0) {
          b.state = 'wind'; b.stateT = 0.75;
          b.chargeDir = Math.abs(S.p.x - b.x) > Math.abs(S.p.y - b.y)
            ? [S.p.x > b.x ? 1 : -1, 0] : [0, S.p.y > b.y ? 1 : -1];
        }
      } else if (b.state === 'wind') {
        S.shake = Math.max(S.shake, 0.08);
        b.x -= b.chargeDir[0] * 14 * dt; b.y -= b.chargeDir[1] * 14 * dt;   /* rear back */
        b.x = clamp(b.x, lo, hi); b.y = clamp(b.y, ty, by);
        if (b.stateT <= 0) { b.state = 'dash'; b.stateT = 1.1; sfx('kick'); }
      } else if (b.state === 'dash') {
        b.x += b.chargeDir[0] * 170 * dt; b.y += b.chargeDir[1] * 170 * dt;
        if (b.x <= lo || b.x >= hi || b.y <= ty || b.y >= by || b.stateT <= 0) {
          b.x = clamp(b.x, lo, hi); b.y = clamp(b.y, ty, by);
          b.state = 'idle'; b.stateT = rf(1.4, 2.0);
          S.shake = 0.3; sfx('boom');
        }
      }
      b.exposed = (b.state !== 'dash');
      break;

    case 'phase':
      b.phase = b.hp > 4 ? 0 : (b.hp > 2 ? 1 : 2);
      if (b.phase === 0) {
        b.x += b.vx * dt * 1.6; if (b.x < lo || b.x > hi) { b.vx *= -1; b.x = clamp(b.x, lo, hi); }
        b.y = ty + 26 + Math.sin(b.t * 2) * 24;
      } else if (b.phase === 1) {
        var dx3 = S.p.x - b.x; b.x += Math.sign(dx3) * 40 * dt;
        b.x = clamp(b.x, lo, hi); b.y = ty + 32;
      } else {
        b.x = (COLS - 1) / 2 * T + T / 2 + Math.sin(b.t * 1.6) * 68; b.y = ty + 30;
      }
      if (b.stateT <= 0) {
        b.stateT = [1.5, 1.0, 0.7][b.phase];
        var n = [1, 3, 5][b.phase];
        for (var q = 0; q < n; q++) {
          var aa = Math.PI / 2 + (q - (n - 1) / 2) * 0.34;
          S.shots.push({ x: b.x, y: b.y + 10, vx: Math.cos(aa) * 70, vy: Math.sin(aa) * 70, t: 4, col: d.acc });
        }
      }
      break;
  }

  bossDamage(b);
}

/* ============================================================
   MAIN STEP
   ============================================================ */
function stepWorld(dt, input) {
  var s = S, p = s.p, i;
  s.t += dt; s.frame++;
  updateCam(dt, false);
  if (s.shake > 0) s.shake -= dt;
  if (s.flash > 0) s.flash -= dt;
  if (s.bannerT > 0) s.bannerT -= dt;

  /* pops */
  for (i = s.pops.length - 1; i >= 0; i--) {
    s.pops[i].t -= dt;
    if (s.pops[i].kind === 'break' && s.pops[i].t <= 0) {
      var pc = s.pops[i].c, pr = s.pops[i].r;
      s.st.tiles[pr][pc] = TL_EMPTY;
      revealUnder(pc, pr);
    }
    if (s.pops[i].t <= 0) s.pops.splice(i, 1);
  }

  /* clock */
  if (p.alive && !s.cleared) {
    if (!CHEAT.infTime) s.time -= dt;
    if (s.time <= 0) {
      s.time = 0;
      if (!s.swarmed) {
        s.swarmed = true;
        for (i = 0; i < TIMEOUT_SWARM; i++) spawnEnemy('pontan');
        s.pops.push({ kind: 'text', x: VIEW_W / 2, y: 6 * T, t: 2.2, s: 'TIME UP!' });
        sfx('bad');
      }
    } else if (s.time < 30 && Math.floor(s.time * 2) !== Math.floor((s.time + dt) * 2)) sfx('tick');
  }

  /* ---- player ------------------------------------------------ */
  if (p.alive && !CHEAT.phase) unstick(p);
  if (p.alive) {
    if (p.invuln > 0) p.invuln -= dt;
    if (p.vestT > 0) p.vestT -= dt;
    if (p.curseT > 0) { p.curseT -= dt; if (p.curseT <= 0) p.curse = null; }

    var ix = input.x, iy = input.y;
    if (p.curse === 'reverse') { ix = -ix; iy = -iy; }
    var lvl = p.speed;
    if (p.curse === 'hyper') lvl = SPEED_MAX;
    if (p.curse === 'crawl') lvl = 1;
    var px = SPEED_PX[lvl] * dt;

    if (ix || iy) {
      if (ix) p.dir = ix > 0 ? 'right' : 'left';
      else p.dir = iy > 0 ? 'down' : 'up';
      var opts = { soft: p.wallpass || CHEAT.phase, bomb: p.bombpass, hard: CHEAT.phase };
      var before = { x: p.x, y: p.y };
      var ok = moveEnt(p, ix ? Math.sign(ix) : 0, ix ? 0 : Math.sign(iy), px, opts, true);
      if (!ok && p.kick) tryKick(p, ix, iy);
      if (Math.abs(p.x - before.x) + Math.abs(p.y - before.y) > 0.01) {
        p.anim += dt * (4 + lvl);
        p.step = [0, 1, 2, 1][Math.floor(p.anim) % 4];
      }
    } else p.step = 1;

    /* leaving your own bomb's tile locks you out of it */
    for (i = 0; i < s.bombs.length; i++) {
      var b = s.bombs[i];
      if (b.passFor === p) {
        var samec = Math.floor(p.x / T) === b.c && Math.floor(p.y / T) === b.r;
        if (!samec) b.passFor = null;
      }
    }

    /* actions */
    var pc2 = Math.floor(p.x / T), pr2 = Math.floor(p.y / T);
    if (p.curse === 'autobomb') {
      p.autoBombT -= dt;
      if (p.autoBombT <= 0) { p.autoBombT = 0.7; placeBomb(p, pc2, pr2); }
    }
    /* Wearing the vest you are blast-proof, so holding the button lays
       bombs that go off the instant they land - a continuous ring of
       fire you can stand inside.  It ignores the carry limit; the only
       throttle is VEST_STREAM. */
    if (p.vestT > 0 && input.bomb && p.curse !== 'nobomb') {
      p.streamT -= dt;
      if (p.streamT <= 0) {
        p.streamT = VEST_STREAM;
        if (s.st.tiles[pr2][pc2] === TL_EMPTY && !bombAt(pc2, pr2)) {
          s.bombs.push({
            c: pc2, r: pr2, x: pc2 * T + T / 2, y: pr2 * T + T / 2,
            t: 0.05, owner: p, fire: (p.curse === 'minfire' ? 1 : p.fire),
            remote: false, passFor: p, vx: 0, vy: 0, anim: 0, stream: true
          });
          sfx('place');
        }
      }
    } else {
      p.streamT = 0;
      if (input.bombPressed) {
        if (p.line && p.lineTap > 0) { lineBomb(p, pc2, pr2); p.lineTap = 0; }
        else { placeBomb(p, pc2, pr2); p.lineTap = 0.28; }
      }
    }
    if (p.lineTap > 0) p.lineTap -= dt;
    if (input.actPressed) {
      if (p.remote) { if (detonateAll(p)) sfx('place'); }
      if (p.kick) { for (i = 0; i < s.bombs.length; i++) { s.bombs[i].vx = 0; s.bombs[i].vy = 0; } }
    }

    /* items */
    for (i = s.floorItems.length - 1; i >= 0; i--) {
      var it = s.floorItems[i];
      if (Math.abs(p.x - (it.c * T + T / 2)) < 10 && Math.abs(p.y - (it.r * T + T / 2)) < 10) {
        takeItem(p, it); s.floorItems.splice(i, 1);
      }
    }
  } else {
    p.deadT += dt;
  }

  /* ---- bombs ------------------------------------------------- */
  for (i = s.bombs.length - 1; i >= 0; i--) {
    var bb = s.bombs[i];
    bb.anim += dt * 4;
    if (bb.vx || bb.vy) {
      var nx = bb.x + bb.vx * dt, ny = bb.y + bb.vy * dt;
      var tc = Math.floor((nx + Math.sign(bb.vx) * 7) / T), tr = Math.floor((ny + Math.sign(bb.vy) * 7) / T);
      var blocked = cellBlocked(tc, tr, { soft: false, bomb: false }, null) && !(tc === bb.c && tr === bb.r);
      if (blocked) { bb.vx = 0; bb.vy = 0; bb.x = bb.c * T + T / 2; bb.y = bb.r * T + T / 2; }
      else {
        bb.x = nx; bb.y = ny;
        bb.c = Math.floor(bb.x / T); bb.r = Math.floor(bb.y / T);
        if (bb.vx) bb.y = bb.r * T + T / 2; else bb.x = bb.c * T + T / 2;
      }
    }
    if (!bb.remote || bb.t <= 0.03) bb.t -= dt;
    if (bb.t <= 0) explode(bb);
  }

  /* ---- blast ------------------------------------------------- */
  for (i = s.blasts.length - 1; i >= 0; i--) {
    s.blasts[i].t -= dt;
    if (s.blasts[i].t <= 0) s.blasts.splice(i, 1);
  }

  /* ---- shots ------------------------------------------------- */
  for (i = s.shots.length - 1; i >= 0; i--) {
    var sh = s.shots[i];
    sh.t -= dt;
    if (!sh.still) {
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      if (sh.wob) { sh.vx += Math.sin(s.t * 6 + i) * 12 * dt; }
      var scc = Math.floor(sh.x / T), src = Math.floor(sh.y / T);
      if (!inBounds(scc, src) || s.st.tiles[src][scc] === TL_HARD) sh.t = 0;
    }
    if (sh.t <= 0) { s.shots.splice(i, 1); continue; }
    if (p.alive && p.invuln <= 0 && Math.abs(sh.x - p.x) < 8 && Math.abs(sh.y - p.y) < 8) hurtPlayer();
  }

  /* ---- enemies ----------------------------------------------- */
  for (i = s.enemies.length - 1; i >= 0; i--) {
    var e = s.enemies[i];
    updateEnemy(e, dt);
    if (!e.alive && e.deadT <= 0) { s.enemies.splice(i, 1); continue; }
    if (!e.alive) continue;
    var ec = Math.floor(e.x / T), er = Math.floor(e.y / T);
    if (blastAt(ec, er)) killEnemy(e);
    else if (p.alive && p.invuln <= 0 && Math.abs(e.x - p.x) < 11 && Math.abs(e.y - p.y) < 11) hurtPlayer();
  }

  /* ---- boss -------------------------------------------------- */
  if (s.boss) {
    updateBoss(s.boss, dt);
    var bo = s.boss;
    if (!bossHarmless(bo) && p.alive && p.invuln <= 0 && bossTouching(bo, p.x, p.y, 4)) hurtPlayer();
    if (bo.dead && bo.deadT > 1.8 && !s.cleared) { s.cleared = true; s.clearT = 0; sfx('clear'); }
  }

  /* ---- player in blast --------------------------------------- */
  if (p.alive && p.invuln <= 0 && p.vestT <= 0) {
    if (blastAt(Math.floor(p.x / T), Math.floor(p.y / T))) hurtPlayer();
  }

  /* ---- exit -------------------------------------------------- */
  if (!s.isBoss && s.st.exit) {
    var liveEnemies = 0;
    for (i = 0; i < s.enemies.length; i++) if (s.enemies[i].alive) liveEnemies++;
    var ec = s.st.exit.c, er = s.st.exit.r;

    /* Kill the last foe and the exit gives itself away - even if it is
       still buried, in which case its block starts flashing. */
    if (!s.exitFound && liveEnemies === 0) {
      s.exitFound = true;

  } else {
    x.fillStyle = 'rgba(0,0,0,0.32)';
    x.beginPath(); x.ellipse(b.x, groundY, w / 2.2, 4.5, 0, 0, 6.3); x.fill();
    if (d.move === 'twin') {
      x.beginPath(); x.ellipse(b.x + b.twinX, groundY, w / 2.2, 4.5, 0, 0, 6.3); x.fill();
    }
  }
  if (vis <= 0.02) return;

  bossBufs();
  var bx = BBUF.getContext('2d');
  bx.clearRect(0, 0, BCT * 2, BCT * 2);
  if (vis < 0.999) {
    var gy = BCT + h / 2;
    bx.save(); bx.translate(0, gy); bx.scale(1, vis); bx.translate(0, -gy);
    drawBossBody(bx, b, BCT, BCT);
    bx.restore();
  } else {
    drawBossBody(bx, b, BCT, BCT);
  }

  var ix = BINK.getContext('2d');
  ix.clearRect(0, 0, BCT * 2, BCT * 2);
  ix.globalCompositeOperation = 'source-over';
  ix.drawImage(BBUF, 0, 0);
  ix.globalCompositeOperation = 'source-in';
  ix.fillStyle = INK; ix.fillRect(0, 0, BCT * 2, BCT * 2);
  ix.globalCompositeOperation = 'source-over';

  x.save();
  if (b.dead) { x.globalAlpha = Math.max(0, 1 - b.deadT / 1.8); x.translate(rf(-2, 2), rf(-2, 2)); }
  else if (b.hitT > 0.5 && Math.floor(b.t * 20) % 2) x.globalAlpha = 0.45;
  var px = Math.round(b.x - BCT), py = Math.round(b.y - BCT);
  x.drawImage(BINK, px - 1, py); x.drawImage(BINK, px + 1, py);
  x.drawImage(BINK, px, py - 1); x.drawImage(BINK, px, py + 1);
  x.drawImage(BBUF, px, py);
  x.restore();

  /* health pips, clear of the sprite and never off the top of the field */
  if (vis > 0.5) {
    var n = b.maxHp, pw = 6, tot = n * pw, x0 = Math.round(b.x - tot / 2);
    var py2 = Math.max(2, Math.round(b.y - h / 2 - 17));
    x.fillStyle = '#140f1c'; x.fillRect(x0 - 2, py2 - 2, tot + 3, 8);
    for (var q = 0; q < n; q++) {
      x.fillStyle = q < b.hp ? (b.hitT > 0.5 ? '#ffffff' : '#ff5a4a') : '#3a3040';
      x.fillRect(x0 + q * pw, py2, pw - 1, 4);
    }
  }
}

function drawBossBody(x, b, CX0, CY0) {
  var d = b.def, w = d.w, h = d.h, i;
  var col = (b.hitT > 0.5) ? '#ffffff' : d.col;
  function blk(ox, oy, bw, bh, cc) { x.fillStyle = cc; x.fillRect(Math.round(CX0 + ox), Math.round(CY0 + oy), bw, bh); }
  function ell(ox, oy, rx, ry, cc) { x.fillStyle = cc; x.beginPath(); x.ellipse(CX0 + ox, CY0 + oy, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, 6.3); x.fill(); }
  function tri(pts, cc) {
    x.fillStyle = cc; x.beginPath(); x.moveTo(CX0 + pts[0][0], CY0 + pts[0][1]);
    for (var q = 1; q < pts.length; q++) x.lineTo(CX0 + pts[q][0], CY0 + pts[q][1]);
    x.closePath(); x.fill();
  }

  switch (d.key) {
    /* MAW - a stone jaw that burrows and surfaces */
    case 'maw':
      blk(-w / 2, -h / 2 + 2, w, h - 2, d.col2);
      blk(-w / 2 + 2, -h / 2 + 4, w - 4, h - 8, col);
      blk(-w / 2 + 5, -1, w - 10, 11, '#120e16');
      for (i = 0; i < 5; i++) {
        tri([[-w / 2 + 6 + i * 5, -1], [-w / 2 + 9 + i * 5, -1], [-w / 2 + 7.5 + i * 5, 3]], '#ffffff');
        tri([[-w / 2 + 6 + i * 5, 10], [-w / 2 + 9 + i * 5, 10], [-w / 2 + 7.5 + i * 5, 6]], '#ffffff');
      }
      ell(-9, -9, 4, 3.6, '#ffffff'); ell(9, -9, 4, 3.6, '#ffffff');
      ell(-9, -9, 2, 2, '#1a1420'); ell(9, -9, 2, 2, '#1a1420');
      blk(-w / 2 - 3, -4, 4, 10, d.col2); blk(w / 2 - 1, -4, 4, 10, d.col2);
      if (b.exposed) { blk(-5, -h / 2 - 5, 10, 5, d.acc); blk(-3, -h / 2 - 3, 6, 3, '#ffe3a0'); }
      break;

    /* HONEYCOMB - petal shields orbit a hive core */
    case 'honey':
      for (i = 0; i < 6; i++) {
        var a = b.spin + i * Math.PI / 3;
        blk(Math.cos(a) * 23 - 5, Math.sin(a) * 23 - 5, 10, 10, d.acc);
        blk(Math.cos(a) * 23 - 3, Math.sin(a) * 23 - 3, 6, 6, shade(d.acc, 40));
      }
      ell(0, 0, w / 2, h / 2, d.col2);
      ell(0, 0, w / 2 - 2, h / 2 - 2, col);
      for (i = 0; i < 3; i++) { blk(-13, -9 + i * 7, 26, 3, d.col2); }
      ell(-7, -5, 3.4, 4, '#ffffff'); ell(7, -5, 3.4, 4, '#ffffff');
      ell(-7, -5, 1.8, 2.2, '#1a1420'); ell(7, -5, 1.8, 2.2, '#1a1420');
      if (b.exposed) { ell(0, 6, 6, 4.6, '#ff5a4a'); ell(0, 6, 3, 2.2, '#ffd0d0'); }
      else { blk(-8, 2, 16, 8, d.col2); }
      break;

    /* SLAGHEART - a molten core in a cracked shell */
    case 'slag':
      for (i = 0; i < 6; i++) {
        var fa = i * Math.PI / 3 + Math.sin(b.t * 4 + i) * 0.14;
        tri([[Math.cos(fa) * 20, Math.sin(fa) * 20],
             [Math.cos(fa + 0.45) * 13, Math.sin(fa + 0.45) * 13],
             [Math.cos(fa - 0.45) * 13, Math.sin(fa - 0.45) * 13]], '#ff5a2a');
      }
      ell(0, 0, w / 2, h / 2, d.col2);
      ell(0, 0, w / 2 - 3, h / 2 - 3, col);
      blk(-w / 2 + 3, -2, w - 6, 3, d.col2);
      ell(0, 3, 7, 6, '#ffd257'); ell(0, 3, 4, 3.4, '#ffffff');
      ell(-8, -6, 3.2, 2.8, '#1a1420'); ell(8, -6, 3.2, 2.8, '#1a1420');
      ell(-8, -6, 1.4, 1.2, '#ff8a3a'); ell(8, -6, 1.4, 1.2, '#ff8a3a');
      break;

    /* ROTKING - a crowned husk */
    case 'rot':
      blk(-w / 2, -h / 2 + 7, w, h - 7, d.col2);
      blk(-w / 2 + 2, -h / 2 + 9, w - 4, h - 13, col);
      blk(-w / 2 + 3, -h / 2 + 1, w - 6, 8, d.col2);
      for (i = 0; i < 5; i++) tri([[-w / 2 + 4 + i * 7, -h / 2 + 1], [-w / 2 + 10 + i * 7, -h / 2 + 1], [-w / 2 + 7 + i * 7, -h / 2 - 7]], d.acc);
      ell(-8, -2, 3.8, 3.2, '#ffd257'); ell(8, -2, 3.8, 3.2, '#ffd257');
      ell(-8, -2, 1.8, 1.8, '#1a1420'); ell(8, -2, 1.8, 1.8, '#1a1420');
      blk(-10, 6, 20, 4, '#1a1420');
      for (i = 0; i < 4; i++) blk(-9 + i * 6, 6, 2, 4, col);
      break;

    /* THE CONCH - twin shells */
    case 'conch':
      for (var side = 0; side < 2; side++) {
        var sx = side ? b.twinX : 0;
        ell(sx, 0, w / 2, h / 2, d.col2);
        ell(sx, 0, w / 2 - 2, h / 2 - 2, col);
        for (i = 0; i < 5; i++) {
          var sa = b.spin * 0.5 + i * 1.26;
          ell(sx + Math.cos(sa) * 8, Math.sin(sa) * 8, 3, 3, d.acc);
        }
        ell(sx - 5, -3, 3, 3.4, '#ffffff'); ell(sx + 5, -3, 3, 3.4, '#ffffff');
        ell(sx - 5, -3, 1.5, 1.8, '#1a1420'); ell(sx + 5, -3, 1.5, 1.8, '#1a1420');
        blk(sx - 5, 6, 10, 2, '#1a1420');
      }
      break;

    /* THE GLACIER - armoured, only the core on its back is open */
    case 'glacier':
      for (i = 0; i < 5; i++) tri([[-w / 2 + 2 + i * 8, -h / 2 + 2], [-w / 2 + 10 + i * 8, -h / 2 + 2], [-w / 2 + 6 + i * 8, -h / 2 - 9]], col);
      blk(-w / 2, -h / 2, w, h, d.col2);
      blk(-w / 2 + 2, -h / 2 + 2, w - 4, h - 4, col);
      blk(-w / 2 + 2, h / 2 - 7, w - 4, 5, d.col2);
      for (i = 0; i < 6; i++) blk(-w / 2 + 4 + i * 6, h / 2 - 6, 3, 3, '#e8f6ff');
      ell(-12, -6, 4, 3.2, '#6ad0ff'); ell(12, -6, 4, 3.2, '#6ad0ff');
      ell(-12, -6, 2, 1.8, '#1a1420'); ell(12, -6, 2, 1.8, '#1a1420');
      if (b.exposed) {
        ell(0, -1, 8, 6.5, '#2a1a20'); ell(0, -1, 6, 4.8, d.acc); ell(0, -1, 3, 2.4, '#ffd6d0');
      } else {
        blk(-9, -8, 18, 13, '#dff0fb'); blk(-7, -6, 14, 9, '#a9c8dd');
      }
      /* winding up: chevrons down the lane it is about to take */
      if (b.state === 'wind' && b.chargeDir) {
        var cdx = b.chargeDir[0], cdy = b.chargeDir[1];
        for (i = 0; i < 3; i++) {
          var off = (w / 2 + 6 + i * 9) + (Math.sin(b.t * 14) * 2);
          var ox2 = cdx * off, oy2 = cdy * off;
          var aC = '#ff5a4a';
          if (cdx) tri([[ox2, oy2 - 7], [ox2 + cdx * 7, oy2], [ox2, oy2 + 7]], aC);
          else tri([[ox2 - 7, oy2], [ox2, oy2 + cdy * 7], [ox2 + 7, oy2]], aC);
        }
      }
      break;

    /* OVERSEER - three-stage war machine */
    case 'overseer':
      blk(-w / 2 - 7, -6, 7, 14, d.col2);
      blk(w / 2, -6, 7, 14, d.col2);
      blk(-w / 2 - 6, -4, 5, 10, col);
      blk(w / 2 + 1, -4, 5, 10, col);
      blk(-w / 2, -h / 2 + 9, w, h - 11, d.col2);
      blk(-w / 2 + 2, -h / 2 + 11, w - 4, h - 15, col);
      ell(0, -h / 2 + 7, 13, 9, d.col2);
      ell(0, -h / 2 + 7, 10, 6.2, d.acc);
      ell(0, -h / 2 + 7, 4.5, 3, '#ffffff');
      for (i = 0; i < 3; i++) {
        blk(-11 + i * 8, 2, 6, 9, '#241c30');
        blk(-10 + i * 8, 3, 4, 7, b.phase <= i ? '#ff5a4a' : '#3a404c');
      }
      break;
  }
}

/* ============================================================
   HUD
   ============================================================ */
function drawHUD() {
  var s = S, x = SX, p = s.p;
  x.fillStyle = '#0d0b12'; x.fillRect(0, 0, VIEW_W, HUD_H);
  x.fillStyle = '#201c2e'; x.fillRect(0, HUD_H - 3, VIEW_W, 1);
  x.fillStyle = '#4a4260'; x.fillRect(0, HUD_H - 2, VIEW_W, 2);

  /* --- row one: clock, area, score --- */
  var mm = Math.floor(s.time / 60), ss = Math.floor(s.time % 60);
  var tcol = s.time < 30 ? (Math.floor(s.t * 4) % 2 ? '#ff5a4a' : '#ffd257') : '#e8eef5';
  text(x, 'TIME', 4, 4, '#7a839a');
  text(x, mm + ':' + (ss < 10 ? '0' : '') + ss, 33, 4, tcol);

  var label = (s.isBoss ? WORLDS[s.world].letter + '-8' : WORLDS[s.world].letter + '-' + (s.stage + 1));
  ctext(x, label + ' ' + WORLDS[s.world].name, 128, 4, '#ffd257');

  var sc = String(Math.floor(s.score)); while (sc.length < 7) sc = '0' + sc;
  text(x, sc, VIEW_W - 4 - textW(sc), 4, '#e8eef5');


  /* --- row two: lives and what you are carrying --- */
  var ry = 14;
  x.drawImage(SPR.hero_down_1, 2 - PAD, ry - PAD);
  text(x, 'x' + Math.max(0, s.lives), 21, ry + 5, '#e8eef5');

  function chip(icon, val, cap, bx) {
    x.drawImage(SPR[icon], bx - PAD, ry - PAD);
    text(x, String(val), bx + 18, ry + 5, val >= cap ? '#ffd257' : '#e8eef5');
  }
  chip('it_' + IT.FIRE, p.fire, FIRE_MAX, 42);
  chip('it_' + IT.BOMB, p.maxBombs, BOMB_MAX, 76);
  chip('it_' + IT.SKATE, p.speed, SPEED_MAX, 110);

  var fx = 146;
  function flag(on, ch, col) { if (on) { text(x, ch, fx, ry + 5, col); fx += 7; } }
  flag(cheatsActive() || s.cheated, '*', Math.floor(s.t * 3) % 2 ? '#c88fe0' : '#6a4a80');
  flag(p.remote, 'R', '#6ad0ff');
  flag(p.kick, 'K', '#ffd257');
  flag(p.line, 'L', '#ffd257');
  flag(p.wallpass, 'P', '#c98fb0');
  flag(p.bombpass, 'B', '#c98fb0');
  flag(p.heart, 'H', '#ff5a7a');
  flag(p.vestT > 0, 'V', '#6ad0ff');
  var rightEdge = VIEW_W - 4;
  if (p.curse) {
    var cn = p.curse.toUpperCase();
    var cw = textW(cn);
    text(x, cn, Math.max(fx + 4, rightEdge - cw), ry + 5, '#c88fe0');
    rightEdge -= cw + 6;
  }
  /* on a scrolling stage the last foe can be anywhere - say how many */
  if (!s.isBoss) {
    var live = 0;
    for (var q = 0; q < s.enemies.length; q++) if (s.enemies[q].alive) live++;
    var fs = 'FOE ' + live;
    var col = live === 0 ? '#7fe08a' : '#8a93a8';
    text(x, fs, Math.max(fx + 4, rightEdge - textW(fs)), ry + 5, col);
  }
}

/* ---- banner over the field ----------------------------------- */
function drawBanner() {
  var s = S, x = SX;
  if (s.bannerT > 0 && s.banner) {
    var a = Math.min(1, s.bannerT * 2);
    x.globalAlpha = a;
    x.fillStyle = 'rgba(13,11,18,0.82)';
    x.fillRect(0, VIEW_H / 2 - 16, VIEW_W, 26);
    cshadow(x, s.banner, VIEW_W / 2, VIEW_H / 2 - 8, '#ffd257', 2);
    x.globalAlpha = 1;
  }
}

/* ---- panels -------------------------------------------------- */
function panel(x, px, py, w, h) {
  x.fillStyle = '#140f1c'; x.fillRect(px, py, w, h);
  x.fillStyle = '#2f2a42'; x.fillRect(px + 1, py + 1, w - 2, h - 2);
  x.fillStyle = '#1a1626'; x.fillRect(px + 3, py + 3, w - 6, h - 6);
  x.fillStyle = '#4a4260'; x.fillRect(px + 1, py + 1, w - 2, 1);
}
/* ============================================================
   Input, screens, progression, main loop
   ============================================================ */
'use strict';

/* ---- input --------------------------------------------------- */
var KEY = {}, PREV = {}, HIT = {}, PADPREV = {};
var INP = { x: 0, y: 0, bomb: false, act: false, bombPressed: false, actPressed: false };
var TOUCH_UI = false;          // set once a coarse pointer is seen

var KMAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  bomb: ['KeyZ', 'Space', 'KeyJ', 'Numpad0'],
  act: ['KeyX', 'KeyK', 'ShiftLeft', 'ShiftRight'],
  start: ['Enter', 'NumpadEnter'], sel: ['Escape', 'Backspace']
};
function down(name) {
  var a = KMAP[name];
  for (var i = 0; i < a.length; i++) if (KEY[a[i]]) return true;
  return false;
}
/* Edge detection is latched at keydown time, not sampled per frame -
   a tap shorter than one frame must still register. */
function pressed(name) {
  var a = KMAP[name];
  for (var i = 0; i < a.length; i++) if (HIT[a[i]]) return true;
  return false;
}
function keyDown(code) { if (!KEY[code]) HIT[code] = true; KEY[code] = true; }
function padSet(code, on) {
  if (on) { if (!PADPREV[code]) HIT[code] = true; KEY[code] = true; }
  PADPREV[code] = on;
}
function pollPad() {
  if (!navigator.getGamepads) return;
  var gs = navigator.getGamepads();
  for (var i = 0; i < gs.length; i++) {
    var g = gs[i]; if (!g) continue;
    var ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    var bt = function (n) { return g.buttons[n] && g.buttons[n].pressed; };
    padSet('ArrowLeft', ax < -0.4 || bt(14));
    padSet('ArrowRight', ax > 0.4 || bt(15));
    padSet('ArrowUp', ay < -0.4 || bt(12));
    padSet('ArrowDown', ay > 0.4 || bt(13));
    padSet('KeyZ', bt(0));
    padSet('KeyX', bt(1));
    padSet('Enter', bt(9));
  }
}
function readInput() {
  var l = down('left'), r = down('right'), u = down('up'), d = down('down');
  var nx = (r ? 1 : 0) - (l ? 1 : 0), ny = (d ? 1 : 0) - (u ? 1 : 0);
  /* one axis at a time, the way a d-pad behaves */
  if (nx && ny) { if (INP.x) ny = 0; else nx = 0; }
  INP.x = nx; INP.y = ny;
  /* a tap shorter than one frame still counts - the latched edge
     covers it, the held state covers everything longer */
  var b = down('bomb'), a = down('act');
  INP.bombPressed = (b && !INP.bomb) || pressed('bomb'); INP.bomb = b;
  INP.actPressed = (a && !INP.act) || pressed('act'); INP.act = a;
}

/* ---- menu movement -------------------------------------------
   One rule, enforced in one place: a frame that moves the cursor
   never also changes a value.  A thumb drag can latch two
   directions inside a single frame (touchmove fires faster than
   the frame does), which used to move the highlight AND flip
   whatever it landed on.  Also gives every menu hold-to-repeat. */
var navT = 0, navRepeat = false, navHeld = false;
function navStep(len, idx, dt) {
  var d = down('down') ? 1 : (down('up') ? -1 : 0);
  var e = pressed('down') ? 1 : (pressed('up') ? -1 : 0);
  var mv = 0;
  if (e) { mv = e; navT = 0; navRepeat = false; navHeld = true; }
  else if (d && navHeld) {
    navT += dt;
    if (navT >= (navRepeat ? 0.10 : 0.34)) { navT = 0; navRepeat = true; mv = d; }
  } else if (!d) { navHeld = false; navT = 0; navRepeat = false; }
  if (!mv) return { idx: idx, moved: false };
  sfx('menu');
  return { idx: (idx + len + mv) % len, moved: true };
}

/* Two-axis version, for the area grid. */
function navStep2(dt) {
  var dx = down('right') ? 1 : (down('left') ? -1 : 0);
  var dy = down('down') ? 1 : (down('up') ? -1 : 0);
  var ex = pressed('right') ? 1 : (pressed('left') ? -1 : 0);
  var ey = pressed('down') ? 1 : (pressed('up') ? -1 : 0);
  var mx = 0, my = 0;
  if (ex || ey) { mx = ex; my = ey; navT = 0; navRepeat = false; navHeld = true; }
  else if ((dx || dy) && navHeld) {
    navT += dt;
    if (navT >= (navRepeat ? 0.10 : 0.34)) { navT = 0; navRepeat = true; mx = dx; my = dy; }
  } else if (!dx && !dy) { navHeld = false; navT = 0; navRepeat = false; }
  if (mx || my) sfx('menu');
  return { x: mx, y: my, moved: !!(mx || my) };
}

/* ============================================================
   AUTOSAVE
   One bitmask per world of the areas cleared.  A run with cheats on
   records nothing, so the area grid stays a record of real clears.
   ============================================================ */
var SAVE = { ver: 1, cleared: [0, 0, 0, 0, 0, 0, 0] };
function loadSave() {
  try {
    var j = localStorage.getItem('det93_save');
    if (!j) return;
    var o = JSON.parse(j);
    if (o && o.cleared && o.cleared.length === 7) {
      for (var i = 0; i < 7; i++) SAVE.cleared[i] = o.cleared[i] | 0;
    }
  } catch (e) { }
}
function writeSave() { try { localStorage.setItem('det93_save', JSON.stringify(SAVE)); } catch (e) { } }
function isCleared(w, st) { return (SAVE.cleared[w] >> st) & 1; }
function markCleared(w, st) {
  if (S && (S.cheated || cheatsActive())) return;     // cheated runs unlock nothing
  SAVE.cleared[w] |= (1 << st);
  writeSave();
}
function unlockWorld(w) { SAVE.cleared[w] |= 0; writeSave(); }
function isUnlocked(w, st) {
  if (w === 0 && st === 0) return true;
  if (isCleared(w, st)) return true;
  if (st > 0 && isCleared(w, st - 1)) return true;
  if (st === 0 && w > 0 && isCleared(w - 1, 7)) return true;
  return false;
}
function canEnter(w, st) { return isUnlocked(w, st) || cheatsActive(); }
function furthestUnlocked() {
  var best = { w: 0, s: 0 };
  for (var w = 0; w < WORLDS.length; w++) for (var st = 0; st < 8; st++) {
    if (isUnlocked(w, st)) best = { w: w, s: st };
  }
  return best;
}
function clearedCount() {
  var n = 0;
  for (var w = 0; w < WORLDS.length; w++) for (var st = 0; st < 8; st++) if (isCleared(w, st)) n++;
  return n;
}

/* ---- persistent options + save ------------------------------- */
var OPT = { music: true, sfx: true, keepItems: false, scanlines: true };
function loadOpt() {
  try {
    var j = localStorage.getItem('det93_opt');
    if (j) { var o = JSON.parse(j); for (var k in o) if (k in OPT) OPT[k] = o[k]; }
  } catch (e) { }
}
function saveOpt() { try { localStorage.setItem('det93_opt', JSON.stringify(OPT)); } catch (e) { } }
function saveBest(v) { try { localStorage.setItem('det93_best', String(v)); } catch (e) { } }
function loadBest() { try { return parseInt(localStorage.getItem('det93_best') || '0', 10) || 0; } catch (e) { return 0; } }

/* ============================================================
   CHEATS
   Reachable from the title and from pause.  Any cheat switched on
   flags the run so it cannot overwrite the honest BEST score.
   ============================================================ */
var CHEAT = {
  invincible: false, infTime: false, infLives: false,
  maxStats: false, maxPower: false,
  phase: false, revealExit: false, startWorld: 0, startArea: 0
};
function cheatsActive() {
  return CHEAT.invincible || CHEAT.infTime || CHEAT.infLives || CHEAT.maxStats ||
         CHEAT.maxPower || CHEAT.phase || CHEAT.revealExit ||
         CHEAT.startWorld > 0 || CHEAT.startArea > 0;
}

function drawCheats(dt) {
  var x = SX, list = cheatList(), i;

    var col = sel ? '#ffffff' : (it.t === 'act' ? '#8a93a8' : '#a8b2c4');
    if (sel) { x.fillStyle = '#2e2542'; x.fillRect(10, y - 2, 220, 10); }
    text(x, (sel ? '>' : ' ') + it.label, 14, y, col);
    var v = '';
    if (it.t === 'bool') v = CHEAT[it.k] ? 'ON' : 'OFF';
    else if (it.t === 'world') v = WORLDS[CHEAT.startWorld].letter + ' ' + WORLDS[CHEAT.startWorld].name;
    else if (it.t === 'area') v = String(CHEAT.startArea + 1) + (CHEAT.startArea === 7 ? ' BOSS' : '');
    if (v) {
      var vcol = (it.t !== 'bool') ? (sel ? '#ffd257' : '#c88fe0')
               : (CHEAT[it.k] ? (sel ? '#ffd257' : '#c88fe0') : '#4a5468');
      text(x, v, 226 - textW(v), y, vcol);
    }
  }
  var foot = cheatsActive() ? 'CHEATS ON - SCORE WILL NOT SAVE' : 'NO CHEATS ACTIVE';
  ctext(x, foot, VIEW_W / 2, 216, cheatsActive() ? '#c88fe0' : '#4a5468');

  /* move first; a frame that moves never also changes */
  var nav = navStep(list.length, cheatIdx, dt || 0.016);
  cheatIdx = nav.idx;
  if (pressed('sel')) { sfx('menu'); leaveCheats(false); return; }
  if (nav.moved) return;

  var it2 = list[cheatIdx];
  var dec = pressed('left'), inc = pressed('right'), go = pressed('bomb') || pressed('start');
  if (it2.t === 'bool') {
    if (dec || inc || go) { CHEAT[it2.k] = !CHEAT[it2.k]; sfx('menu'); applyLiveCheats(); }
  } else if (it2.t === 'world') {
    if (dec || inc) { CHEAT.startWorld = (CHEAT.startWorld + (inc ? 1 : WORLDS.length - 1)) % WORLDS.length; sfx('menu'); }
  } else if (it2.t === 'area') {
    if (dec || inc) { CHEAT.startArea = (CHEAT.startArea + (inc ? 1 : 7)) % 8; sfx('menu'); }
  } else if (go) {
    sfx('menu');

    else if (it2.k === '__none') { clearCheats(); applyLiveCheats(); }
    else if (it2.k === '__skip') { S.cheated = true; S.cleared = true; S.clearT = 0; leaveCheats(true); }
    else if (it2.k === '__kill') {
      S.cheated = true;
      for (i = 0; i < S.enemies.length; i++) if (S.enemies[i].alive) killEnemy(S.enemies[i]);
      if (S.boss && !S.boss.dead) { S.boss.hp = 0; S.boss.dead = true; S.boss.deadT = 0; }
      leaveCheats(true);
    } else if (it2.k === '__refill') { S.cheated = true; grantMax(S.p); leaveCheats(true); }
    else leaveCheats(false);

function openSelect() {
  var f = furthestUnlocked();

function drawSelect(dt) {

    for (st = 0; st < 8; st++) {

      var boss = (st === 7);
      x.fillStyle = '#181c26'; x.fillRect(px, py, cw - 2, ch - 2);
