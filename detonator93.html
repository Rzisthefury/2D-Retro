    x.fillRect(VIEW_W / 2 + Math.cos(a) * rr, 70 + Math.sin(a) * rr * 0.6, 2, 2);
  }
  cshadow(x, 'ALL SEVEN', VIEW_W / 2, 40, '#ffffff', 2);
  cshadow(x, 'PLANETS CLEAR', VIEW_W / 2, 58, '#ffd257', 2);
  sprC(x, 'hero_down_' + [0, 1, 2, 1][Math.floor(endT * 5) % 4], VIEW_W / 2, 110);
  ctext(x, 'FINAL SCORE', VIEW_W / 2, 140, '#8a93a8');
  ctext(x, String(S.score), VIEW_W / 2, 154, '#ffffff', 2);
  if (endT > 2) ctext(x, Math.floor(endT * 2) % 2 ? 'PRESS I' : '', VIEW_W / 2, 190, '#ffd257');
  if (endT > 2 && (pressed('bomb') || pressed('start'))) {
    if (!S.cheated && !cheatsActive() && S.score > best) { best = S.score; saveBest(best); }
    setScreen('title');
  }
}

/* ---- pause --------------------------------------------------- */
var PAUSE_MENU = ['RESUME', 'CHEATS', 'MUSIC', 'SOUND', 'QUIT TO TITLE'];
var pauseIdx = 0;
function drawPause() {
  var x = SX;
  x.fillStyle = 'rgba(13,11,18,0.80)'; x.fillRect(0, 0, VIEW_W, VIEW_H);
  cshadow(x, 'PAUSED', VIEW_W / 2, 58, '#ffd257', 2);
  var vals = ['', '', OPT.music ? 'ON' : 'OFF', OPT.sfx ? 'ON' : 'OFF', ''];
  for (var i = 0; i < PAUSE_MENU.length; i++) {
    var sel = i === pauseIdx, y = 92 + i * 15;
    if (sel) { x.fillStyle = '#2a2438'; x.fillRect(46, y - 3, 148, 12); }
    text(x, (sel ? '>' : ' ') + PAUSE_MENU[i], 52, y, sel ? '#ffffff' : '#8a93a8');
    if (vals[i]) text(x, vals[i], 168, y, sel ? '#ffd257' : '#5a6478');
  }
  ctext(x, 'PASSWORD  ' + CODES[S.world], VIEW_W / 2, 184, '#6ad0ff');
  if (cheatsActive()) ctext(x, 'CHEATS ON', VIEW_W / 2, 198, '#c88fe0');

  var pnav = navStep(PAUSE_MENU.length, pauseIdx, 0.016);
  pauseIdx = pnav.idx;
  if (!pnav.moved && (pressed('bomb') || pressed('left') || pressed('right'))) {
    sfx('menu');
    if (pauseIdx === 0) paused = false;
    else if (pauseIdx === 1) { cheatFrom = 'pause'; cheatIdx = 0; SCREEN = 'cheats'; }
    else if (pauseIdx === 2) { OPT.music = !OPT.music; musicOn = OPT.music; if (!OPT.music) stopMusic(); saveOpt(); }
    else if (pauseIdx === 3) { OPT.sfx = !OPT.sfx; sfxOn = OPT.sfx; saveOpt(); }
    else { paused = false; setScreen('title'); }
  }
}

/* ---- scanline overlay ---------------------------------------- */
function scanlines() {
  if (!OPT.scanlines) return;
  var x = SX;
  x.fillStyle = 'rgba(0,0,0,0.16)';
  for (var y = 0; y < VIEW_H; y += 2) x.fillRect(0, y, VIEW_W, 1);
}

/* ============================================================
   LOOP
   ============================================================ */
var lastT = 0, acc = 0, FROZEN = false;
function __freeze(v) { FROZEN = !!v; }
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - lastT) / 1000 || 0);
  lastT = now;
  if (FROZEN) return;

  pollPad();
  readInput();

  SX.fillStyle = '#000'; SX.fillRect(0, 0, VIEW_W, VIEW_H);

  switch (SCREEN) {
    case 'title': syncMusic('title'); drawTitle(dt); break;
    case 'password': drawPassword(); break;
    case 'options': drawOptions(); break;
    case 'controls': drawControls(); break;
    case 'select': syncMusic('title'); drawSelect(dt); break;
    case 'cheats':
      if (cheatFrom === 'pause') { drawField(); drawHUD(); }
      drawCheats(dt); break;
    case 'map': stopMusicIfNeeded(); drawMap(dt); break;
    case 'play':
      syncMusic(S.isBoss ? 'boss' : ('w' + S.world));
      if (pressed('start')) { paused = !paused; pauseIdx = 0; sfx('menu'); }
      if (paused) {
        if (pressed('sel')) { paused = false; sfx('menu'); }
        drawField(); drawHUD(); drawPause();
      } else {
        stepWorld(dt, INP);
        drawField(); drawHUD(); drawBanner();
        if (!S.p.alive) handleDeath(dt);
        if (S.cleared) SCREEN = 'clear';
      }
      break;
    case 'clear': drawClear(dt); break;
    case 'gameover': drawGameOver(dt); break;
    case 'ending': drawEnding(dt); break;
  }
  if (SCREEN !== 'play' && SCREEN !== 'clear') { }
  scanlines();
  blit();
  HIT = {};
}
function stopMusicIfNeeded() { syncMusic('title'); }

/* ============================================================
   ON-SCREEN CONTROLS
   Real DOM elements outside the game screen, so they can be as big
   as a thumb needs.  The stick is floating: press anywhere in the
   left zone and it materialises under your thumb, then you steer by
   dragging - no lifting to change direction.
   ============================================================ */
var PADEL = {};
var stickId = null, stickX = 0, stickY = 0;
var STICK_DEAD = 15, STICK_MAX = 52;
var DIRCODES = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];

function clearDirs() { for (var i = 0; i < 4; i++) KEY[DIRCODES[i]] = false; }
function setDir(code) {
  for (var i = 0; i < 4; i++) if (DIRCODES[i] !== code) KEY[DIRCODES[i]] = false;
  keyDown(code);
}

function enablePad() {
  if (TOUCH_UI) return;
  TOUCH_UI = true;
  if (PADEL.pad) PADEL.pad.classList.add('on');
  fitCanvas();
}
function layoutPad(vw, vh, cssW, cssH) {
  if (!TOUCH_UI || !PADEL.pad) return;
  var zl = PADEL.zl, zr = PADEL.zr, bw;
  if (LANDSCAPE) {
    zl.style.left = '0'; zl.style.top = '0';
    zl.style.width = PAD_SIZE + 'px'; zl.style.height = vh + 'px';
    zr.style.right = '0'; zr.style.top = '0';
    zr.style.width = PAD_SIZE + 'px'; zr.style.height = vh + 'px';
    bw = Math.round(clamp(PAD_SIZE * 0.38, 62, 100));
  } else {
    var half = Math.round(vw * 0.48);
    zl.style.left = '0'; zl.style.top = (vh - PAD_SIZE) + 'px';
    zl.style.width = half + 'px'; zl.style.height = PAD_SIZE + 'px';
    zr.style.right = '0'; zr.style.top = (vh - PAD_SIZE) + 'px';
    zr.style.width = (vw - half) + 'px'; zr.style.height = PAD_SIZE + 'px';
    bw = Math.round(clamp(vw * 0.21, 68, 116));
  }
  var zw = zr.offsetWidth, zh = zr.offsetHeight;
  var bw2 = Math.round(bw * 0.88);
  function size(el, w) {
    el.style.width = w + 'px'; el.style.height = w + 'px';
    el.style.fontSize = Math.round(w * 0.30) + 'px';
  }
  size(PADEL.a, bw); size(PADEL.b, bw2);

  var edge = Math.round(bw * 0.20), gapb = Math.round(bw * 0.16);
  var ax = zw - bw - edge;
  var ay = Math.round(zh * (LANDSCAPE ? 0.56 : 0.46));
  var bxWant = ax - bw2 - gapb, bx, by;
  if (bxWant >= 6) { bx = bxWant; by = ay - Math.round(bw * 0.42); }
  else { bx = ax + Math.round((bw - bw2) / 2); by = ay - bw2 - gapb; }   /* too narrow: stack */
  PADEL.a.style.left = ax + 'px'; PADEL.a.style.top = ay + 'px';
  PADEL.b.style.left = bx + 'px'; PADEL.b.style.top = by + 'px';

  PADEL.start.style.right = edge + 'px';
  PADEL.start.style.top = (LANDSCAPE ? 14 : 8) + 'px';
  PADEL.sel.style.top = (LANDSCAPE ? 56 : 8) + 'px';
  PADEL.sel.style.right = (LANDSCAPE ? edge : edge + 84) + 'px';

  STICK_MAX = Math.round(clamp(Math.min(zl.offsetWidth, zl.offsetHeight) * 0.28, 38, 70));
  var base = Math.round(STICK_MAX * 2.6), knob = Math.round(STICK_MAX * 1.15);
  PADEL.base.style.width = base + 'px'; PADEL.base.style.height = base + 'px';
  PADEL.base.style.margin = (-base / 2) + 'px 0 0 ' + (-base / 2) + 'px';
  PADEL.knob.style.width = knob + 'px'; PADEL.knob.style.height = knob + 'px';
  PADEL.knob.style.margin = (-knob / 2) + 'px 0 0 ' + (-knob / 2) + 'px';
}
function bindPad() {
  PADEL.pad = document.getElementById('pad');
  PADEL.zl = document.getElementById('zoneL');
  PADEL.zr = document.getElementById('zoneR');
  PADEL.base = document.getElementById('stickBase');
  PADEL.knob = document.getElementById('knob');
  PADEL.hint = document.getElementById('hint');
  PADEL.a = document.getElementById('bA');
  PADEL.b = document.getElementById('bB');
  PADEL.start = document.getElementById('bStart');
  PADEL.sel = document.getElementById('bSel');
  if (!PADEL.pad) return;

  /* ---- floating stick ---- */
  function stickMove(t) {
    var r = PADEL.zl.getBoundingClientRect();
    var dx = t.clientX - stickX, dy = t.clientY - stickY;
    var m = Math.hypot(dx, dy);
    /* drag past the rim and the origin follows, so a long pull keeps working */
    if (m > STICK_MAX) {
      stickX += dx * (1 - STICK_MAX / m);
      stickY += dy * (1 - STICK_MAX / m);
      dx = t.clientX - stickX; dy = t.clientY - stickY; m = STICK_MAX;
    }
    PADEL.base.style.left = (stickX - r.left) + 'px';
    PADEL.base.style.top = (stickY - r.top) + 'px';
    PADEL.knob.style.transform = 'translate(' + Math.round(dx) + 'px,' + Math.round(dy) + 'px)';
    if (m < STICK_DEAD) clearDirs();
    else if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
    else setDir(dy > 0 ? 'ArrowDown' : 'ArrowUp');
  }
  PADEL.zl.addEventListener('touchstart', function (e) {
    e.preventDefault(); enablePad(); wakeAudio();
    if (stickId !== null) return;
    var t = e.changedTouches[0];
    stickId = t.identifier; stickX = t.clientX; stickY = t.clientY;
    PADEL.base.classList.add('live');
    if (PADEL.hint) PADEL.hint.style.opacity = '0';
    stickMove(t);
  }, { passive: false });
  PADEL.zl.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++)
      if (e.changedTouches[i].identifier === stickId) stickMove(e.changedTouches[i]);
  }, { passive: false });
  function stickEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier !== stickId) continue;
      stickId = null; clearDirs();
      PADEL.base.classList.remove('live');
      PADEL.knob.style.transform = 'translate(0,0)';
      if (PADEL.hint) PADEL.hint.style.opacity = '1';
    }
  }
  PADEL.zl.addEventListener('touchend', stickEnd, { passive: false });
  PADEL.zl.addEventListener('touchcancel', stickEnd, { passive: false });

  /* ---- buttons ---- */
  function button(el, code) {
    if (!el) return;
    el.addEventListener('touchstart', function (e) {
      e.preventDefault(); e.stopPropagation();
      enablePad(); wakeAudio();
      el.classList.add('hit'); keyDown(code);
    }, { passive: false });
    function up(e) { e.preventDefault(); el.classList.remove('hit'); KEY[code] = false; }
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
  }
  button(PADEL.a, 'KeyZ');
  button(PADEL.b, 'KeyX');
  button(PADEL.start, 'Enter');
  button(PADEL.sel, 'Escape');

  /* a coarse pointer means a touchscreen; otherwise wait for a real touch */
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (coarse) enablePad();
  window.addEventListener('touchstart', function () { enablePad(); }, { passive: true });
}
function wakeAudio() { if (!AC) initAudio(); else resumeAudio(); }

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  var canvas = document.getElementById('screen');
  initRender(canvas);
  bakeAll();
  loadOpt();
  loadSave();
  clearCheats();                 // cheats never survive a reload
  musicOn = OPT.music; sfxOn = OPT.sfx;
  best = loadBest();
  newGame(OPT.keepItems);
  loadStage(0, 0, false);
  setScreen('title');
  bindPad();

  window.addEventListener('keydown', function (e) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space', 'Enter'].indexOf(e.code) >= 0) e.preventDefault();
    keyDown(e.code);
    if (!AC) { initAudio(); } else resumeAudio();
    if (SCREEN === 'password') {
      if (e.code === 'Backspace') typeCode('BACK');
      else if (/^Key[A-Z]$/.test(e.code)) typeCode(e.code.substr(3));
    }
  });
  window.addEventListener('keyup', function (e) { KEY[e.code] = false; });
  window.addEventListener('pointerdown', function () { if (!AC) initAudio(); else resumeAudio(); });
  window.addEventListener('blur', function () { KEY = {}; });

  requestAnimationFrame(function (t) { lastT = t; frame(t); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
